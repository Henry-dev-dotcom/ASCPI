<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1f2328;--mute:#667;--line:#e3e1d8;--acc:#0b6b5d;--accbg:#e2f1ee;--ok:#1a7f37;--okbg:#e6f4ea;--bad:#b42318;--badbg:#fdeceb}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}p.sub{color:var(--mute);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;background:var(--card);font-size:14px;user-select:none}
.chip.on{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
button{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
@media(prefers-color-scheme:dark){button.pri{color:#06201b}}
button:disabled{opacity:.5;cursor:default}
select{font:inherit;padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--acc)}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin-bottom:8px}
.q{font-size:18px;font-weight:600;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:10px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.expl{margin-top:12px;padding:12px;border-radius:10px;background:var(--accbg);font-size:15px}
.fc{min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-size:19px;padding:24px}
.fc small{display:block;color:var(--mute);font-size:13px;margin-bottom:8px}
.big{font-size:42px;font-weight:700;color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.hide{display:none}
</style></head><body><main>

 <strong>Sections</strong>

</div>

const Q = [
// ---------- 0 HEMATOLOGY ----------
[0,"Which anemia shows a low MCV, low serum iron, LOW TIBC and high ferritin?",["Iron deficiency","Anemia of chronic disease","Sideroblastic anemia","Thalassemia minor"],1,"Anemia of chronic disease: iron trapped in macrophages, so serum iron and TIBC are low and ferritin is normal/high. Iron deficiency has HIGH TIBC and low ferritin."],
[0,"Hypersegmented neutrophils (≥5 lobes) and macro-ovalocytes suggest:",["Iron deficiency","Megaloblastic anemia (B12/folate)","Aplastic anemia","Lead poisoning"],1,"Impaired DNA synthesis gives macro-ovalocytes and hypersegmented neutrophils; MCV is usually >100 fL."],
[0,"Which finding best separates thalassemia minor from iron deficiency?",["Low MCV","High RBC count with normal RDW and target cells","Low hemoglobin","Microcytosis"],1,"Thalassemia: RBC count high relative to Hgb, normal RDW, target cells, basophilic stippling, normal/high iron. Iron deficiency: low RBC count, high RDW."],
[0,"Auer rods are characteristic of:",["CLL","Acute myeloid leukemia","Hairy cell leukemia","Multiple myeloma"],1,"Auer rods = fused primary granules, seen in AML (especially APL, M3) and not in lymphoid blasts."],

[0,"The Philadelphia chromosome t(9;22) BCR-ABL is found in:",["CML","CLL","Polycythemia vera","Hodgkin lymphoma"],0,"CML: high WBC with left shift, basophilia, and a LOW leukocyte alkaline phosphatase (LAP) score."],
[0,"Leukemoid reaction vs CML: the LAP score in a leukemoid reaction is:",["Low","High","Absent","Unchanged from normal"],1,"Leukemoid reaction = HIGH LAP (toxic granulation, Döhle bodies). CML = LOW LAP."],
[0,"Smudge (basket) cells are typical of:",["CLL","AML","ITP","Aplastic anemia"],0,"CLL: mature small lymphocytes that rupture on smearing."],
[0,"Tear-drop cells (dacrocytes) are classically seen in:",["Myelofibrosis","Sickle cell disease","Spherocytosis","Iron deficiency only"],0,"Myelofibrosis (marrow fibrosis, extramedullary hematopoiesis). Also seen in thalassemia and megaloblastic anemia."],
[0,"Schistocytes with low platelets, fever and renal/neuro signs suggest:",["TTP","ITP","Hemophilia A","Iron deficiency"],0,"TTP: ADAMTS13 deficiency, microangiopathic hemolytic anemia, thrombocytopenia. Coags (PT/aPTT) are normal, unlike DIC."],
[0,"Which hemoglobin migrates farthest toward the anode on alkaline (pH 8.6) electrophoresis?",["Hgb A","Hgb F","Hgb S","Hgb Bart’s / fast Hgb H"],3,"Hgb H and Bart’s are fastest. Order from the origin on alkaline: A2/C/E/O (slowest) → S/D/G → F → A → fast Hgb H."],
[0,"On alkaline electrophoresis, Hgb S and Hgb D co-migrate. Which test separates them?",["Citrate agar pH 6.2","Sickle solubility test","Kleihauer-Betke","Heinz body stain"],0,"On acid citrate agar S separates from A, while D migrates with A. Sickle solubility is positive only for S."],
[0,"Heinz bodies are best seen with which stain?",["Wright","Supravital (new methylene blue / crystal violet)","Prussian blue","Peroxidase"],1,"Heinz bodies = denatured hemoglobin; seen in G6PD deficiency and unstable Hgb. Need supravital stain."],
[0,"Reticulocytes are best counted using:",["Wright stain","New methylene blue (supravital)","Prussian blue","Sudan black"],1,"Retics contain residual RNA seen as a reticulum with new methylene blue. Normal about 0.5-2.5% in adults."],
[0,"Corrected reticulocyte count uses:",["Retic % × (patient Hct / 45)","Retic % × (45 / patient Hct)","Retic % × MCV","Retic % ÷ RBC"],0,"Corrected retic = retic % × (patient Hct ÷ normal Hct 45). Retic index also divides by maturation time."],
[0,"Which factor is a vitamin K-dependent coagulation factor?",["V","VIII","VII","XIII"],2,"Vitamin K-dependent: II, VII, IX, X, plus proteins C and S. Factor VII has the shortest half-life, so PT rises first on warfarin."],
[0,"Prolonged PT with normal aPTT suggests deficiency of:",["Factor VII","Factor VIII","Factor IX","Factor XII"],0,"PT = extrinsic (VII) + common. aPTT = intrinsic (VIII, IX, XI, XII) + common."],

[0,"Which test monitors unfractionated heparin?",["PT/INR","aPTT","Thrombin time only","Bleeding time"],1,"UFH monitored by aPTT (or anti-Xa). Warfarin monitored by PT/INR."],

[0,"Bernard-Soulier syndrome (giant platelets, no ristocetin aggregation) is a defect of:",["GPIb","GPIIb/IIIa","Factor VIII","ADP receptor only"],0,"BSS: giant platelets, low count, no ristocetin aggregation (not corrected by normal plasma, unlike vWD). Glanzmann: GPIIb/IIIa, normal ristocetin, no aggregation with ADP/collagen."],
[0,"Normal platelet count range is about:",["50-100 ×10⁹/L","150-400 ×10⁹/L","400-600 ×10⁹/L","10-50 ×10⁹/L"],1,"150-400 ×10⁹/L. Spontaneous bleeding risk rises below 10-20 ×10⁹/L."],
[0,"Platelet satellitism / clumping giving a falsely low count is caused by:",["EDTA-dependent antibodies","Heparin","Sodium citrate","Hemolysis"],0,"EDTA pseudothrombocytopenia: recount in sodium citrate (multiply by 1.1) or check the smear."],
[0,"Which cell is increased in allergic reactions and parasitic infection?",["Neutrophils","Eosinophils","Monocytes","Basophils only"],1,"Eosinophilia: allergy, parasites, Hodgkin lymphoma, drug reactions."],
[0,"Atypical (reactive) lymphocytes are classically seen in:",["Infectious mononucleosis","Iron deficiency","Hemophilia","Polycythemia vera"],0,"EBV mono: reactive T cells; heterophile antibody positive."],
[0,"Which condition has a high Hct, high RBC mass, low EPO and JAK2 mutation?",["Polycythemia vera","Secondary polycythemia","Relative polycythemia","Thalassemia"],0,"PV: low EPO, JAK2 V617F. Secondary polycythemia has HIGH EPO (hypoxia, tumor)."],
[0,"The most common cause of microcytic anemia worldwide is:",["Iron deficiency","Thalassemia","Sideroblastic anemia","Lead poisoning"],0,"Iron deficiency: low ferritin, low iron, HIGH TIBC, low transferrin saturation."],

[0,"A peripheral smear with 'rouleaux' formation suggests:",["Elevated fibrinogen/immunoglobulins","Cold agglutinins","Iron deficiency","Spherocytosis"],0,"Rouleaux: increased fibrinogen or globulins (e.g., multiple myeloma). Cold agglutinins cause true agglutination (clumps), not stacks."],
[0,"The erythrocyte sedimentation rate is INCREASED by:",["Sickle cells","Spherocytes","Rouleaux","Microcytosis only"],2,"ESR rises with rouleaux and acute-phase proteins; sickle cells, spherocytes and acanthocytes impede stacking and lower it."],

[0,"Tartrate-resistant acid phosphatase (TRAP) positivity is typical of:",["Hairy cell leukemia","CLL","AML M3","ITP"],0,"Hairy cell leukemia: TRAP+, BRAF V600E, CD11c/CD25/CD103."],

[1,"Diagnosis of diabetes by fasting plasma glucose requires:",["≥126 mg/dL","≥100 mg/dL","≥110 mg/dL","≥140 mg/dL"],0,"FPG ≥126; 2-h OGTT ≥200; HbA1c ≥6.5%; random ≥200 with symptoms. Prediabetes FPG 100-125, A1c 5.7-6.4%."],

let store={missed:{},hist:[]};
try{const x=localStorage.getItem('ascpi');if(x)store=JSON.parse(x)}catch(e){}
function save(){try{localStorage.setItem('ascpi',JSON.stringify(store))}catch(e){}}
const $=id=>document.getElementById(id);
let sel=new Set(SECTIONS.map((_,i)=>i));
const qid=q=>q[1].slice(0,60);
function drawChips(){$('chips').innerHTML='';SECTIONS.forEach((s,i)=>{const c=document.createElement('div');c.className='chip'+(sel.has(i)?' on':'');c.textContent=s+' ('+Q.filter(q=>q[0]==i).length+')';c.onclick=()=>{sel.has(i)?sel.delete(i):sel.add(i);drawChips()};$('chips').appendChild(c)});
 $('avail').textContent=pool().length+' questions available';
 const h=store.hist.slice(-5).reverse();$('hist').innerHTML=h.length?'Recent scores: '+h.map(x=>x.score+'/'+x.total).join(' · '):'';}
function pool(){let p=Q.filter(q=>sel.has(q[0]));if($('focus')&&$('focus').value=='missed')p=p.filter(q=>store.missed[qid(q)]);return p}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
$('all').onclick=()=>{sel=new Set(SECTIONS.map((_,i)=>i));drawChips()};
$('none').onclick=()=>{sel.clear();drawChips()};
$('focus').onchange=drawChips;
function start(mode){const p=pool();if(!p.length){alert('No questions for that selection.');return}
 const n=Math.min(+$('n').value,p.length);const set=shuffle(p).slice(0,n);
 $('setup').classList.add('hide');$('play').classList.remove('hide');
 mode=='quiz'?quiz(set):cards(set)}
$('goQuiz').onclick=()=>start('quiz');$('goCards').onclick=()=>start('cards');
function home(){$('play').classList.add('hide');$('setup').classList.remove('hide');drawChips()}
function quiz(set){let i=0,score=0,wrong=[];
 function show(){const q=set[i];const idx=shuffle(q[2].map((_,k)=>k));let done=false;
  $('play').innerHTML=`<div class="meta"><span>${SECTIONS[q[0]]}</span><span>${i+1} / ${set.length}</span></div><div class="bar"><i style="width:${i/set.length*100}%"></i></div><div class="card"><p class="q"></p><div id="opts"></div><div id="ex"></div></div><div class="row"><button id="quit">Quit</button><button class="pri hide" id="next"></button></div>`;
  $('play').querySelector('.q').textContent=q[1];
  idx.forEach(k=>{const b=document.createElement('button');b.className='opt';b.textContent=q[2][k];b.onclick=()=>{if(done)return;done=true;
   const right=k==q[3];if(right){score++;delete store.missed[qid(q)]}else{wrong.push(q);store.missed[qid(q)]=1}
   [...$('opts').children].forEach((o,j)=>{o.disabled=true;if(idx[j]==q[3])o.classList.add('ok')});if(!right)b.classList.add('bad');
   $('ex').innerHTML='<div class="expl"></div>';$('ex').firstChild.textContent=(right?'Correct. ':'Not quite. ')+q[4];
   const nx=$('next');nx.classList.remove('hide');nx.textContent=i+1<set.length?'Next':'See results';nx.focus()};$('opts').appendChild(b)});
  $('next').onclick=()=>{i++;i<set.length?show():finish()};$('quit').onclick=()=>{save();home()}}
 function finish(){store.hist.push({score,total:set.length});save();
  const by={};set.forEach(q=>by[q[0]]=by[q[0]]||[0,0]);wrong.forEach(q=>by[q[0]][1]++);set.forEach(q=>by[q[0]][0]++);
  $('play').innerHTML=`<div class="card" style="text-align:center"><div class="big">${Math.round(score/set.length*100)}%</div><div>${score} of ${set.length} correct</div></div>
  <div class="card"><strong>By section</strong><table>${Object.keys(by).map(k=>`<tr><td>${SECTIONS[k]}</td><td>${by[k][0]-by[k][1]} / ${by[k][0]}</td></tr>`).join('')}</table></div>
  ${wrong.length?'<div class="card"><strong>Review what you missed</strong><div id="rev"></div></div>':''}
  <div class="row"><button class="pri" id="again">Back to start</button></div>`;
  wrong.forEach(q=>{const d=document.createElement('div');d.style.cssText='margin:12px 0;padding-top:10px;border-top:1px solid var(--line)';d.innerHTML='<b></b><div style="color:var(--ok);margin-top:4px"></div><div style="color:var(--mute);font-size:14px;margin-top:4px"></div>';
   d.children[0].textContent=q[1];d.children[1].textContent='Answer: '+q[2][q[3]];d.children[2].textContent=q[4];$('rev').appendChild(d)});
  $('again').onclick=home}
 show()}
function cards(set){let i=0,flip=false;
 function show(){const q=set[i];
  $('play').innerHTML=`<div class="meta"><span>${SECTIONS[q[0]]}</span><span>${i+1} / ${set.length}</span></div><div class="bar"><i style="width:${(i+1)/set.length*100}%"></i></div><div class="card fc" id="fc"></div><div class="row"><button id="prev">Back</button><button class="pri" id="nx">Next</button><button id="quit">Done</button></div><p class="sub">Tap the card to flip.</p>`;
  const f=$('fc');const draw=()=>{f.innerHTML='<div><small></small><span></span></div>';f.querySelector('small').textContent=flip?'Answer':'Question';f.querySelector('span').textContent=flip?q[2][q[3]]+' — '+q[4]:q[1]};draw();
  f.onclick=()=>{flip=!flip;draw()};
  $('prev').onclick=()=>{if(i>0){i--;flip=false;show()}};$('nx').onclick=()=>{if(i+1<set.length){i++;flip=false;show()}else home()};$('quit').onclick=home}
 show()}
drawChips();
</script></body></html>
