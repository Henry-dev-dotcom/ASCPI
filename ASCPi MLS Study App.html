<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASCPi MLS Study App</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#1f2328;--mute:#667;--line:#e3e1d8;--acc:#0b6b5d;--accbg:#e2f1ee;--ok:#1a7f37;--okbg:#e6f4ea;--bad:#b42318;--badbg:#fdeceb;--hl:#fff3a8;--warn:#9a5b00;--warnbg:#fff4e0}
@media(prefers-color-scheme:dark){:root{--bg:#16181a;--card:#1f2326;--ink:#e8e8e3;--mute:#9a9fa5;--line:#32373b;--acc:#4cc2ae;--accbg:#1c3430;--ok:#56d17c;--okbg:#17301f;--bad:#ff8a80;--badbg:#3a1d1b;--hl:#5a4d10;--warn:#ffc266;--warnbg:#3a2c10}}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.hw{max-width:900px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:700;color:var(--acc);margin-right:6px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;padding:7px 11px;border-radius:8px;font:inherit;color:var(--mute);cursor:pointer}
nav button.on{background:var(--accbg);color:var(--acc);font-weight:600}
main{max-width:900px;margin:0 auto;padding:18px 14px 80px}
h1{font-size:22px;margin:0 0 6px}h2{font-size:20px;margin:0 0 8px}h3{font-size:17px;margin:24px 0 6px;color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;background:var(--card);font-size:14px;user-select:none;color:var(--ink)}
.chip.on{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
button.b{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
@media(prefers-color-scheme:dark){button.pri{color:#06201b}}
select,input[type=search]{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input[type=search]{width:100%}
label.tg{display:flex;gap:6px;align-items:center;font-size:15px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:var(--acc)}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin-bottom:8px;gap:8px}
.q{font-size:18px;font-weight:600;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:10px;font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt.sel{border-color:var(--acc);background:var(--accbg)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.expl{margin-top:12px;padding:12px;border-radius:10px;background:var(--accbg);font-size:15px}
.fc{min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-size:19px;padding:24px}
.fc small{display:block;color:var(--mute);font-size:13px;margin-bottom:8px}
.big{font-size:40px;font-weight:700;color:var(--acc);line-height:1.1}
.hide{display:none}.sub{color:var(--mute)}
.notes table{border-collapse:collapse;font-size:14.5px;min-width:100%}
.notes th,.notes td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}.notes th{background:var(--accbg)}
.tw{overflow-x:auto;margin:10px 0}
.notes ul,.notes ol{padding-left:22px}.notes li{margin:3px 0}.notes li>p{margin:2px 0}.notes p{margin:8px 0}
mark{background:var(--hl);color:inherit;padding:0 2px;border-radius:3px}
.flash{animation:fl 2s}@keyframes fl{0%{background:var(--hl)}100%{background:transparent}}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}.toc a{font-size:13px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--ink);text-decoration:none}
.sr{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.sr small{color:var(--mute)}
figure.fig{margin:16px 0;padding:0}figure.fig svg{width:100%;height:auto;display:block;border-radius:10px}figure.fig figcaption{font-size:13px;color:var(--mute);margin-top:6px;text-align:center}
table.p{border-collapse:collapse;width:100%;font-size:14.5px}table.p td,table.p th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
.pb{height:10px;background:var(--line);border-radius:5px;overflow:hidden;width:110px;display:inline-block;vertical-align:middle}.pb i{display:block;height:100%;background:var(--acc)}
.done{color:var(--ok);font-weight:600}
.les{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer}
.les:hover{background:var(--accbg)}.les .n{width:26px;color:var(--mute);font-size:13px;text-align:right}.les .t{flex:1}
.les .st{width:22px;text-align:center}.pill{font-size:12px;border-radius:999px;padding:2px 8px;background:var(--accbg);color:var(--acc);white-space:nowrap}
.pill.lo{background:var(--warnbg);color:var(--warn)}
.hero{background:var(--accbg);border-color:var(--acc)}
.timer{font-variant-numeric:tabular-nums;font-weight:700}.timer.low{color:var(--bad)}
.note{font-size:14px;color:var(--mute)}
@media(max-width:560px){.logo{display:none}.les .n{display:none}}
</style></head><body>
<header><div class="hw"><span class="logo">ASCPi Study</span>
<nav id="nav"><button data-t="path">Lessons</button><button data-t="quiz">Quiz</button><button data-t="mock">Mock exam</button><button data-t="cards">Flashcards</button><button data-t="progress">Progress</button><button data-t="plan">Plan</button></nav></div></header>
<main id="main"></main>
<script>
const SECTIONS=["1. Hematology and Hemostasis (17-22%)","2. Clinical Chemistry (17-22%)","3. Microbiology (17-22%)","4. Blood Banking (17-22%)","5. Immunology and Serology (5-10%)","6. Urinalysis and Body Fluids (5-10%)","7. Laboratory Operations (5-10%)"];
const LESSONS=[{"id":"H1","sec":0,"title":"Start here: cells, formulas, normal values","html":"<p><strong>If you only remember 8 things<\/strong><\/p>\n<ol type=\"1\">\n<li><p>Low MCV (microcytic) = iron deficiency, thalassemia, chronic disease, sideroblastic, lead. High MCV (macrocytic) = B12 or folate deficiency, liver disease, alcohol.<\/p><\/li>\n<li><p>The reticulocyte count shows what the marrow is doing: high = marrow responding (bleeding, hemolysis); low = marrow not producing.<\/p><\/li>\n<li><p>Spherocytes with a positive DAT = autoimmune hemolysis. Spherocytes with a negative DAT = hereditary spherocytosis.<\/p><\/li>\n<li><p>Schistocytes (fragments) = DIC, TTP, HUS, or a mechanical heart valve.<\/p><\/li>\n<li><p>Auer rods = AML. t(15;17) = APL. t(9;22) = CML.<\/p><\/li>\n<li><p>PT checks the extrinsic pathway (factor VII) and warfarin. aPTT checks the intrinsic pathway and heparin.<\/p><\/li>\n<li><p>DIC: PT and aPTT prolonged, platelets low, fibrinogen low, D-dimer high.<\/p><\/li>\n<li><p>Coagulation tubes: light blue citrate, filled to the line (9 parts blood to 1 part citrate).<\/p><\/li>\n<\/ol>\n<figure class=\"fig\" id=\"F01\"><svg viewBox=\"0 0 760 350\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Hematopoiesis\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"350\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Where blood cells come from<\/text><line x1=\"445\" y1=\"70\" x2=\"250\" y2=\"110\" stroke=\"#777\" stroke-width=\"1.4\"/><line x1=\"445\" y1=\"70\" x2=\"640\" y2=\"110\" stroke=\"#777\" stroke-width=\"1.4\"/><line x1=\"250\" y1=\"140\" x2=\"120\" y2=\"185\" stroke=\"#777\" stroke-width=\"1.4\"/><line x1=\"250\" y1=\"140\" x2=\"379\" y2=\"185\" stroke=\"#777\" stroke-width=\"1.4\"/><line x1=\"120\" y1=\"215\" x2=\"78\" y2=\"258\" stroke=\"#777\" stroke-width=\"1.4\"/><line x1=\"120\" y1=\"215\" x2=\"162\" y2=\"258\" stroke=\"#777\" stroke-width=\"1.4\"/><line x1=\"379\" y1=\"215\" x2=\"253\" y2=\"258\" stroke=\"#777\" stroke-width=\"1.4\"/><line x1=\"379\" y1=\"215\" x2=\"337\" y2=\"258\" stroke=\"#777\" stroke-width=\"1.4\"/><line x1=\"379\" y1=\"215\" x2=\"421\" y2=\"258\" stroke=\"#777\" stroke-width=\"1.4\"/><line x1=\"379\" y1=\"215\" x2=\"505\" y2=\"258\" stroke=\"#777\" stroke-width=\"1.4\"/><line x1=\"640\" y1=\"140\" x2=\"598\" y2=\"258\" stroke=\"#777\" stroke-width=\"1.4\"/><line x1=\"640\" y1=\"140\" x2=\"682\" y2=\"258\" stroke=\"#777\" stroke-width=\"1.4\"/><rect x=\"397\" y=\"38\" width=\"96\" height=\"28\" rx=\"6\" fill=\"#e2f1ee\" stroke=\"#0b6b5d\" stroke-width=\"1.3\" /><text x=\"445\" y=\"54\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Stem cell<\/text><rect x=\"202\" y=\"108\" width=\"96\" height=\"34\" rx=\"6\" fill=\"#e2f1ee\" stroke=\"#0b6b5d\" stroke-width=\"1.3\" /><text x=\"250\" y=\"121\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Myeloid<\/text><text x=\"250\" y=\"134\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">progenitor<\/text><rect x=\"592\" y=\"108\" width=\"96\" height=\"34\" rx=\"6\" fill=\"#e2f1ee\" stroke=\"#0b6b5d\" stroke-width=\"1.3\" /><text x=\"640\" y=\"121\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Lymphoid<\/text><text x=\"640\" y=\"134\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">progenitor<\/text><rect x=\"72\" y=\"183\" width=\"96\" height=\"34\" rx=\"6\" fill=\"#e2f1ee\" stroke=\"#0b6b5d\" stroke-width=\"1.3\" /><text x=\"120\" y=\"196\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Mega/ery<\/text><text x=\"120\" y=\"209\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">progenitor<\/text><rect x=\"331\" y=\"183\" width=\"96\" height=\"34\" rx=\"6\" fill=\"#e2f1ee\" stroke=\"#0b6b5d\" stroke-width=\"1.3\" /><text x=\"379\" y=\"196\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Granulocyte/<\/text><text x=\"379\" y=\"209\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">monocyte prog.<\/text><rect x=\"39\" y=\"258\" width=\"78\" height=\"40\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"78\" y=\"274\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Red cell<\/text><text x=\"78\" y=\"314\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">anemias,<\/text><text x=\"78\" y=\"326\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">retics<\/text><rect x=\"123\" y=\"258\" width=\"78\" height=\"40\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"162\" y=\"274\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Platelet<\/text><text x=\"162\" y=\"314\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">ITP, TTP<\/text><rect x=\"214\" y=\"258\" width=\"78\" height=\"40\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"253\" y=\"274\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Neutrophil<\/text><text x=\"253\" y=\"314\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">bacterial<\/text><text x=\"253\" y=\"326\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">infection<\/text><rect x=\"298\" y=\"258\" width=\"78\" height=\"40\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"337\" y=\"274\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Eosinophil<\/text><text x=\"337\" y=\"314\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">allergy,<\/text><text x=\"337\" y=\"326\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">parasites<\/text><rect x=\"382\" y=\"258\" width=\"78\" height=\"40\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"421\" y=\"274\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Basophil<\/text><text x=\"421\" y=\"314\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">CML<\/text><rect x=\"466\" y=\"258\" width=\"78\" height=\"40\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"505\" y=\"274\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Monocyte<\/text><text x=\"505\" y=\"314\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">mono, TB<\/text><rect x=\"559\" y=\"258\" width=\"78\" height=\"40\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"598\" y=\"270\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">B cell /<\/text><text x=\"598\" y=\"283\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">plasma cell<\/text><text x=\"598\" y=\"314\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">CLL, myeloma<\/text><rect x=\"643\" y=\"258\" width=\"78\" height=\"40\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"682\" y=\"270\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">T cell /<\/text><text x=\"682\" y=\"283\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">NK<\/text><text x=\"682\" y=\"314\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">viral,<\/text><text x=\"682\" y=\"326\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">T-ALL<\/text><\/svg><figcaption>Blood cell lineages. The cell type that is raised often points to the disease.<\/figcaption><\/figure><figure class=\"fig\" id=\"F02\"><svg viewBox=\"0 0 760 350\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Maturation series\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"350\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Maturation: youngest to oldest (left to right)<\/text><text x=\"20\" y=\"52\" font-size=\"12\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Red cell series<\/text><circle cx=\"75\" cy=\"105\" r=\"27\" fill=\"#6e86c9\" stroke=\"#556\" stroke-width=\"1\" /><circle cx=\"75\" cy=\"105\" r=\"18.9\" fill=\"#9d79b8\" stroke=\"#556\" stroke-width=\"1\" /><circle cx=\"71\" cy=\"102\" r=\"2.5\" fill=\"#fff\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"80\" cy=\"109\" r=\"2.5\" fill=\"#fff\" stroke=\"none\" stroke-width=\"0\" /><text x=\"75\" y=\"146\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Pronormoblast<\/text><text x=\"75\" y=\"163\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">big nucleus,<\/text><text x=\"75\" y=\"175\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">nucleoli<\/text><circle cx=\"197\" cy=\"105\" r=\"23\" fill=\"#5f78c4\" stroke=\"#556\" stroke-width=\"1\" /><circle cx=\"197\" cy=\"105\" r=\"14.26\" fill=\"#5b3d86\" stroke=\"#334\" stroke-width=\"1\" /><text x=\"197\" y=\"142\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Basophilic<\/text><text x=\"197\" y=\"155\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">normoblast<\/text><text x=\"197\" y=\"172\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">dense nucleus,<\/text><text x=\"197\" y=\"184\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">blue cytoplasm<\/text><circle cx=\"319\" cy=\"105\" r=\"21\" fill=\"#a7a1c8\" stroke=\"#556\" stroke-width=\"1\" /><circle cx=\"319\" cy=\"105\" r=\"9.450000000000001\" fill=\"#4a3270\" stroke=\"#334\" stroke-width=\"1\" /><text x=\"319\" y=\"140\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Polychromatic<\/text><text x=\"319\" y=\"153\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">normoblast<\/text><text x=\"319\" y=\"170\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">Hgb appears<\/text><text x=\"319\" y=\"182\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">(gray-blue)<\/text><circle cx=\"441\" cy=\"105\" r=\"18\" fill=\"#e2a9ad\" stroke=\"#556\" stroke-width=\"1\" /><circle cx=\"448\" cy=\"102\" r=\"5.3999999999999995\" fill=\"#33204f\" stroke=\"#223\" stroke-width=\"1\" /><text x=\"441\" y=\"137\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Orthochromic<\/text><text x=\"441\" y=\"150\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">normoblast<\/text><text x=\"441\" y=\"167\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">nucleus small,<\/text><text x=\"441\" y=\"179\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">then extruded<\/text><circle cx=\"563\" cy=\"105\" r=\"19\" fill=\"#c9a2c9\" stroke=\"#556\" stroke-width=\"1\" /><path d=\"M555,101 q4,-5 8,0 t8,3 M554,109 q5,4 10,-1 t7,2\" fill=\"none\" stroke=\"#6a4a8a\" stroke-width=\"1\" /><text x=\"563\" y=\"138\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Reticulocyte<\/text><text x=\"563\" y=\"155\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">no nucleus,<\/text><text x=\"563\" y=\"167\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">retic stain<\/text><circle cx=\"685\" cy=\"105\" r=\"19\" fill=\"#e8a0a0\" stroke=\"#556\" stroke-width=\"1\" /><circle cx=\"685\" cy=\"105\" r=\"7.22\" fill=\"#f8dede\" stroke=\"none\" stroke-width=\"0\" /><text x=\"685\" y=\"138\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Mature RBC<\/text><text x=\"685\" y=\"155\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">central pallor<\/text><text x=\"20\" y=\"196\" font-size=\"12\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Neutrophil series<\/text><circle cx=\"75\" cy=\"245\" r=\"25\" fill=\"#e9e4ef\" stroke=\"#778\" stroke-width=\"1\" /><circle cx=\"75\" cy=\"245\" r=\"18.75\" fill=\"#8b6bb5\" stroke=\"#446\" stroke-width=\"1\" /><circle cx=\"71\" cy=\"242\" r=\"2.5\" fill=\"#fff\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"80\" cy=\"249\" r=\"2.5\" fill=\"#fff\" stroke=\"none\" stroke-width=\"0\" /><text x=\"75\" y=\"284\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Myeloblast<\/text><text x=\"75\" y=\"297\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">nucleoli,<\/text><text x=\"75\" y=\"309\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">no granules<\/text><circle cx=\"197\" cy=\"245\" r=\"24\" fill=\"#e9e4ef\" stroke=\"#778\" stroke-width=\"1\" /><circle cx=\"194\" cy=\"245\" r=\"14.399999999999999\" fill=\"#7a5aa6\" stroke=\"#446\" stroke-width=\"1\" /><circle cx=\"209.610441656458\" cy=\"245.0\" r=\"1.8\" fill=\"#a43b6b\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"204.13199043745945\" cy=\"256.76393715281097\" r=\"1.8\" fill=\"#a43b6b\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"195.29925267529907\" cy=\"255.6721525304186\" r=\"1.8\" fill=\"#a43b6b\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"187.26640295485555\" cy=\"242.91775683730913\" r=\"1.8\" fill=\"#a43b6b\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"183.8114160163927\" cy=\"232.43885262465838\" r=\"1.8\" fill=\"#a43b6b\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"186.5592262027297\" cy=\"235.68686770247083\" r=\"1.8\" fill=\"#a43b6b\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"194.2174954475137\" cy=\"249.1123459983766\" r=\"1.8\" fill=\"#a43b6b\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"203.18442006116496\" cy=\"258.04382068717644\" r=\"1.8\" fill=\"#a43b6b\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"209.24271528582128\" cy=\"252.72090694617125\" r=\"1.8\" fill=\"#a43b6b\" stroke=\"none\" stroke-width=\"0\" /><text x=\"197\" y=\"283\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Promyelocyte<\/text><text x=\"197\" y=\"296\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">primary (azurophilic)<\/text><text x=\"197\" y=\"308\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">granules<\/text><circle cx=\"319\" cy=\"245\" r=\"23\" fill=\"#e9e4ef\" stroke=\"#778\" stroke-width=\"1\" /><circle cx=\"316\" cy=\"245\" r=\"12.65\" fill=\"#6a4a96\" stroke=\"#446\" stroke-width=\"1\" /><circle cx=\"332.8\" cy=\"245.0\" r=\"1.4\" fill=\"#e8b36a\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"328.6145525889909\" cy=\"258.29710295875725\" r=\"1.4\" fill=\"#e8b36a\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"318.59704659224224\" cy=\"252.1139189311362\" r=\"1.4\" fill=\"#e8b36a\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"308.8239667255308\" cy=\"235.50882700326116\" r=\"1.4\" fill=\"#e8b36a\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"305.2235320940324\" cy=\"232.8083257510619\" r=\"1.4\" fill=\"#e8b36a\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"309.97971803208213\" cy=\"247.96865583561186\" r=\"1.4\" fill=\"#e8b36a\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"320.2074859714644\" cy=\"258.7798981661696\" r=\"1.4\" fill=\"#e8b36a\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"329.70280912344145\" cy=\"249.40355740042105\" r=\"1.4\" fill=\"#e8b36a\" stroke=\"none\" stroke-width=\"0\" /><text x=\"319\" y=\"282\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Myelocyte<\/text><text x=\"319\" y=\"295\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">specific granules<\/text><text x=\"319\" y=\"307\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">start; last to divide<\/text><circle cx=\"441\" cy=\"245\" r=\"22\" fill=\"#e9e4ef\" stroke=\"#778\" stroke-width=\"1\" /><path d=\"M433,233 q16,2 8,12 q-10,10 6,14 q-12,2 -14,-10 z\" fill=\"#6a4a96\" stroke=\"#446\" stroke-width=\"1\" /><text x=\"441\" y=\"281\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Metamyelocyte<\/text><text x=\"441\" y=\"294\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">indented nucleus<\/text><circle cx=\"563\" cy=\"245\" r=\"21\" fill=\"#e9e4ef\" stroke=\"#778\" stroke-width=\"1\" /><path d=\"M552,236 q-3,18 11,19 q14,-1 13,-18 l-6,0 q0,10 -7,10 q-7,0 -5,-11 z\" fill=\"#6a4a96\" stroke=\"#446\" stroke-width=\"1\" /><text x=\"563\" y=\"280\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Band<\/text><text x=\"563\" y=\"293\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">U-shaped nucleus<\/text><circle cx=\"685\" cy=\"245\" r=\"20\" fill=\"#e9e4ef\" stroke=\"#778\" stroke-width=\"1\" /><circle cx=\"675\" cy=\"237\" r=\"5\" fill=\"#6a4a96\" stroke=\"#446\" stroke-width=\"1\" /><circle cx=\"683\" cy=\"251\" r=\"5\" fill=\"#6a4a96\" stroke=\"#446\" stroke-width=\"1\" /><circle cx=\"692\" cy=\"239\" r=\"5\" fill=\"#6a4a96\" stroke=\"#446\" stroke-width=\"1\" /><circle cx=\"697\" cy=\"251\" r=\"5\" fill=\"#6a4a96\" stroke=\"#446\" stroke-width=\"1\" /><line x1=\"675\" y1=\"237\" x2=\"683\" y2=\"251\" stroke=\"#6a4a96\" stroke-width=\"2\"/><line x1=\"683\" y1=\"251\" x2=\"692\" y2=\"239\" stroke=\"#6a4a96\" stroke-width=\"2\"/><line x1=\"692\" y1=\"239\" x2=\"697\" y2=\"251\" stroke=\"#6a4a96\" stroke-width=\"2\"/><text x=\"685\" y=\"279\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Segmented<\/text><text x=\"685\" y=\"292\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">3-5 lobes<\/text><\/svg><figcaption>Maturation series. Cells shrink, nuclei condense, and cytoplasm turns from blue to pink as they mature.<\/figcaption><\/figure><h3 id=\"cell-maturation-youngest-to-oldest\">Cell maturation (youngest to oldest)<\/h3>\n<ul>\n<li><p><strong>Red cell:<\/strong> pronormoblast, basophilic normoblast, polychromatic normoblast, orthochromic normoblast, reticulocyte, mature RBC.<\/p><\/li>\n<li><p><strong>Neutrophil:<\/strong> myeloblast, promyelocyte, myelocyte, metamyelocyte, band, segmented neutrophil. Specific granules first appear at the myelocyte.<\/p><\/li>\n<li><p><strong>Platelet:<\/strong> megakaryoblast, promegakaryocyte, megakaryocyte, platelets.<\/p><\/li>\n<li><p><strong>Megaloblastic change<\/strong> means a large cell with a young, open nucleus and a mature cytoplasm (nuclear-cytoplasmic asynchrony).<\/p><\/li>\n<\/ul>\n<h3 id=\"formulas-worth-memorizing\">Formulas worth memorizing<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 24%\" />\n<col style=\"width: 60%\" />\n<col style=\"width: 15%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Test<\/th>\n<th>Formula<\/th>\n<th>Normal<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>MCV (fL)<\/td>\n<td>Hct x 10 / RBC (millions)<\/td>\n<td>80-100<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>MCH (pg)<\/td>\n<td>Hgb x 10 / RBC<\/td>\n<td>27-33<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>MCHC (g/dL)<\/td>\n<td>Hgb x 100 / Hct<\/td>\n<td>32-36<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Corrected WBC<\/td>\n<td>WBC x 100 / (100 + nRBC per 100 WBC)<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Reticulocyte %<\/td>\n<td>retics counted / 1000 RBC x 100<\/td>\n<td>0.5-2.5%<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Corrected retic<\/td>\n<td>retic % x (patient Hct / 45)<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Example: Hct 30%, RBC 4.0 million gives MCV = 30 x 10 / 4.0 = 75 fL (microcytic).<\/p>\n<p>Rule of three: Hgb x 3 should equal the Hct within 3 points. If it does not, suspect lipemia, cold agglutinins or abnormal cells, and recheck.<\/p>\n<h3 id=\"normal-values-approximate-adult-ranges\">Normal values (approximate adult ranges)<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 49%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Test<\/th>\n<th>Male<\/th>\n<th>Female<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Hemoglobin (g/dL)<\/td>\n<td>13.5-17.5<\/td>\n<td>12.0-16.0<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Hematocrit (%)<\/td>\n<td>41-53<\/td>\n<td>36-46<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>RBC (x 10^12/L)<\/td>\n<td>4.5-5.9<\/td>\n<td>4.0-5.2<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>WBC (x 10^9/L)<\/td>\n<td>4.5-11.0<\/td>\n<td>4.5-11.0<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Platelets (x 10^9/L)<\/td>\n<td>150-450<\/td>\n<td>150-450<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Differential: neutrophils 50-70%, lymphocytes 20-40%, monocytes 2-9%, eosinophils 1-4%, basophils 0-1%. Ranges differ a little between labs; always use the lab's own reference interval.<\/p>\n","min":4},{"id":"H2","sec":0,"title":"Anemias: causes and the red cell picture","html":"<h3 id=\"anemias\">Anemias<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 30%\" />\n<col style=\"width: 35%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Group<\/th>\n<th>Common causes<\/th>\n<th>Clues<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Microcytic, hypochromic<\/td>\n<td>Iron deficiency, thalassemia, chronic disease, sideroblastic anemia, lead poisoning<\/td>\n<td>See iron studies below; lead gives coarse basophilic stippling<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Macrocytic<\/td>\n<td>B12 or folate deficiency, liver disease, alcohol<\/td>\n<td>Oval macrocytes, hypersegmented neutrophils (5 or more lobes), high LD<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Normocytic<\/td>\n<td>Acute blood loss, hemolysis, chronic disease, aplastic anemia, kidney disease<\/td>\n<td>Use the retic count: high = loss or hemolysis, low = production problem<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Iron studies at a glance<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 40%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 19%\" />\n<col style=\"width: 20%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th>Serum iron<\/th>\n<th>TIBC<\/th>\n<th>Ferritin<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Iron deficiency<\/td>\n<td>Low<\/td>\n<td>High<\/td>\n<td>Low<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Chronic disease<\/td>\n<td>Low<\/td>\n<td>Low<\/td>\n<td>Normal or high<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Thalassemia<\/td>\n<td>Normal or high<\/td>\n<td>Normal<\/td>\n<td>Normal or high<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Sideroblastic (ring sideroblasts)<\/td>\n<td>High<\/td>\n<td>Normal or low<\/td>\n<td>High<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p>Pernicious anemia: antibodies to intrinsic factor (anti-IF), low B12.<\/p><\/li>\n<li><p>Aplastic anemia: low red cells, white cells and platelets (pancytopenia) with an empty marrow.<\/p><\/li>\n<\/ul>\n<figure class=\"fig\" id=\"F03\"><svg viewBox=\"0 0 760 500\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Red cell shapes\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"500\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Red cell shape guide<\/text><circle cx=\"76\" cy=\"75\" r=\"24\" fill=\"#e8a0a0\" stroke=\"#b45a5a\" stroke-width=\"1.2\" /><circle cx=\"76\" cy=\"75\" r=\"9.120000000000001\" fill=\"#f8dede\" stroke=\"none\" stroke-width=\"0\" /><text x=\"76\" y=\"117\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Normal<\/text><text x=\"76\" y=\"133\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">central pallor ~1/3<\/text><circle cx=\"224\" cy=\"75\" r=\"16\" fill=\"#e8a0a0\" stroke=\"#b45a5a\" stroke-width=\"1.2\" /><circle cx=\"224\" cy=\"75\" r=\"10\" fill=\"#f8dede\" stroke=\"none\" stroke-width=\"0\" /><text x=\"224\" y=\"117\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Microcytic,<\/text><text x=\"224\" y=\"130\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">hypochromic<\/text><text x=\"224\" y=\"146\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">iron deficiency,<\/text><text x=\"224\" y=\"158\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">thalassemia<\/text><ellipse cx=\"372\" cy=\"75\" rx=\"31\" ry=\"25\" fill=\"#e8a0a0\" stroke=\"#b45a5a\" stroke-width=\"1.2\" transform=\"rotate(0 372 75)\"/><ellipse cx=\"372\" cy=\"75\" rx=\"10\" ry=\"8\" fill=\"#f8dede\" stroke=\"none\" stroke-width=\"0\" transform=\"rotate(0 372 75)\"/><text x=\"372\" y=\"117\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Macro-ovalocyte<\/text><text x=\"372\" y=\"133\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">B12 / folate<\/text><circle cx=\"520\" cy=\"75\" r=\"24\" fill=\"#e8a0a0\" stroke=\"#b45a5a\" stroke-width=\"1.2\" /><circle cx=\"520\" cy=\"75\" r=\"15\" fill=\"#f8dede\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"520\" cy=\"75\" r=\"6\" fill=\"#c46a6a\" stroke=\"none\" stroke-width=\"0\" /><text x=\"520\" y=\"117\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Target cell<\/text><text x=\"520\" y=\"130\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">(codocyte)<\/text><text x=\"520\" y=\"146\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">thalassemia, liver<\/text><text x=\"520\" y=\"158\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">disease, HbC<\/text><circle cx=\"668\" cy=\"75\" r=\"19\" fill=\"#d98585\" stroke=\"#b45a5a\" stroke-width=\"1.2\" /><text x=\"668\" y=\"117\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Spherocyte<\/text><text x=\"668\" y=\"133\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">AIHA (DAT +),<\/text><text x=\"668\" y=\"145\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">hereditary sph.<\/text><path d=\"M48,226 Q76,186 104,226 Q76,206 48,226 z\" fill=\"#e8a0a0\" stroke=\"#b45a5a\" stroke-width=\"1.2\" /><text x=\"76\" y=\"262\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Sickle cell<\/text><text x=\"76\" y=\"278\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">Hgb S<\/text><path d=\"M246,220 C246,198 210,198 210,220 C210,242 234,242 246,222 L260,230 z\" fill=\"#e8a0a0\" stroke=\"#b45a5a\" stroke-width=\"1.2\" /><text x=\"224\" y=\"262\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Teardrop<\/text><text x=\"224\" y=\"275\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">(dacrocyte)<\/text><text x=\"224\" y=\"291\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">myelofibrosis,<\/text><text x=\"224\" y=\"303\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">thalassemia<\/text><polygon points=\"354,234 358,206 376,204 392,232 376,224\" fill=\"#e8a0a0\" stroke=\"#b45a5a\" stroke-width=\"1.2\"/><polygon points=\"398,202 406,210 396,212\" fill=\"#e8a0a0\" stroke=\"#b45a5a\" stroke-width=\"1.2\"/><text x=\"372\" y=\"262\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Schistocyte<\/text><text x=\"372\" y=\"278\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">DIC, TTP, HUS,<\/text><text x=\"372\" y=\"290\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">valves<\/text><polygon points=\"546.4,220.0 535.6,229.0 530.1,237.4 520.0,238.0 506.1,244.1 504.4,229.0 487.7,220.0 504.4,211.0 508.2,199.5 520.0,202.0 530.5,201.8 535.6,211.0\" fill=\"#e8a0a0\" stroke=\"#b45a5a\" stroke-width=\"1.2\"/><text x=\"520\" y=\"262\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Acanthocyte<\/text><text x=\"520\" y=\"278\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">abetalipoproteinemia,<\/text><text x=\"520\" y=\"290\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">liver disease<\/text><polygon points=\"691.0,220.0 686.4,224.9 687.9,231.5 681.4,233.4 679.5,239.9 672.9,238.4 668.0,243.0 663.1,238.4 656.5,239.9 654.6,233.4 648.1,231.5 649.6,224.9 645.0,220.0 649.6,215.1 648.1,208.5 654.6,206.6 656.5,200.1 663.1,201.6 668.0,197.0 672.9,201.6 679.5,200.1 681.4,206.6 687.9,208.5 686.4,215.1\" fill=\"#e8a0a0\" stroke=\"#b45a5a\" stroke-width=\"1.2\"/><text x=\"668\" y=\"262\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Echinocyte<\/text><text x=\"668\" y=\"275\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">(burr cell)<\/text><text x=\"668\" y=\"291\" font-size=\"10\" text-a /<\/text><text x=\"372\" y=\"435\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">globulin, myeloma<\/text><path d=\"M498,365 A22,22 0 1 1 530,384 Q522,365 498,365 z\" fill=\"#e8a0a0\" stroke=\"#b45a5a\" stroke-width=\"1.2\" /><circle cx=\"528\" cy=\"359\" r=\"5\" fill=\"#fff\" stroke=\"#b45a5a\" stroke-width=\"1\" /><text x=\"520\" y=\"407\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Bite / blister cell<\/text><text x=\"520\" y=\"423\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">G6PD (oxidant)<\/text><circle cx=\"668\" cy=\"365\" r=\"26\" fill=\"#c8a3c9\" stroke=\"#8a5a8a\" stroke-width=\"1.2\" /><text x=\"668\" y=\"407\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Polychromasia<\/text><text x=\"668\" y=\"423\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">reticulocytes,<\/text><text x=\"668\" y=\"435\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">bluish-gray, larger<\/text><ellipse cx=\"76\" cy=\"510\" rx=\"32\" ry=\"11\" fill=\"#f1cbcb\" stroke=\"#b45a5a\" stroke-width=\"1.2\" transform=\"rotate(0 76 510)\"/><ellipse cx=\"76\" cy=\"510\" rx=\"22\" ry=\"4\" fill=\"#fff\" stroke=\"none\" stroke-width=\"0\" transform=\"rotate(0 76 510)\"/><text x=\"76\" y=\"552\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Hypochromic<\/text><text x=\"76\" y=\"565\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">+ pencil cell<\/text><text x=\"76\" y=\"581\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">iron deficiency<\/text><\/svg><figcaption>Red cell shapes and what they usually mean. These are teaching sketches, not photographs.<\/figcaption><\/figure><h3 id=\"red-cell-shape-guide\">Red cell shape guide<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 45%\" />\n<col style=\"width: 54%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Cell<\/th>\n<th>Seen in<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Spherocyte (no central pallor)<\/td>\n<td>Autoimmune hemolysis, hereditary spherocytosis, burns<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Target cell (codocyte)<\/td>\n<td>Thalassemia, HbC, liver disease, iron deficiency, post-splenectomy<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Sickle cell (drepanocyte)<\/td>\n<td>Sickle cell disease<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Teardrop (dacrocyte)<\/td>\n<td>Myelofibrosis, thalassemia, marrow infiltration<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Schistocyte, helmet cell<\/td>\n<td>DIC, TTP, HUS, heart valves<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Elliptocyte, ovalocyte<\/td>\n<td>Hereditary elliptocytosis; macro-ovalocytes in megaloblastic anemia<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Stomatocyte (slit-like pallor)<\/td>\n<td>Hereditary stomatocytosis, alcoholism, Rh null<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Acanthocyte (irregular spikes)<\/td>\n<td>Liver disease, abetalipoproteinemia<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Echinocyte, burr cell (regular spikes)<\/td>\n<td>Uremia, artifact<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Bite and blister cells<\/td>\n<td>G6PD deficiency<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Rouleaux<\/td>\n<td>High protein: myeloma, inflammation<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Agglutination<\/td>\n<td>Cold agglutinins<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Polychromasia<\/td>\n<td>Reticulocytes: marrow responding<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<figure class=\"fig\" id=\"F04\"><svg viewBox=\"0 0 760 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Red cell inclusions\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"330\" rx=\"10\ 8.51691840345154\" cy=\"72.12940064069454\" r=\"1.4\" fill=\"#3b2a6b\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"356.59038184769895\" cy=\"86.86524857987922\" r=\"1.4\" fill=\"#3b2a6b\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"347.2441763336145\" cy=\"98.86850297972819\" r=\"1.4\" fill=\"#3b2a6b\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"347.55132386324493\" cy=\"90.55436802382857\" r=\"1.4\" fill=\"#3b2a6b\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"357.2793813096253\" cy=\"74.10307090051982\" r=\"1.4\" fill=\"#3b2a6b\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"369.0663487411543\" cy=\"73.61580043673919\" r=\"1.4\" fill=\"#3b2a6b\" stroke=\"none\" stroke-width=\"0\" /><text x=\"360\" y=\"127\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Basophilic stippling<\/text><text x=\"360\" y=\"141\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">ribosomes; lead,<\/text><text x=\"360\" y=\"153\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">thalassemia<\/text><circle cx=\"630\" cy=\"85\" r=\"26\" fill=\"#e8a0a0\" stroke=\"#b45a5a\" stroke-width=\"1.2\" /><circle cx=\"630\" cy=\"85\" r=\"7.8\" fill=\"#f8dede\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"645\" cy=\"79\" r=\"2\" fill=\"#3b2a6b\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"648\" cy=\"82\" r=\"2\" fill=\"#3b2a6b\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"642\" cy=\"82\" r=\"2\" fill=\"#3b2a6b\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"645\" cy=\"85\" r=\"2\" fill=\"#3b2a6b\" stroke=\"none\" stroke-width=\"0\" /><text x=\"630\" y=\"127\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Pappenheimer bodies<\/text><text x=\"630\" y=\"141\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">iron granules;<\/text><text x=\"630\" y=\"153\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">sideroblastic (Prussian blue)<\/text><circle cx=\"90\" cy=\"215\" r=\"26\" fill=\"#bcd6e3\" stroke=\"#6d93a8\" stroke-width=\"1.2\" /><circle cx=\"90\" cy=\"215\" r=\"7.8\" fill=\"#f8dede\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"76\" cy=\"223\" r=\"5\" fill=\"#2b4f78\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"100\" cy=\"227\" r=\"4\" fill=\"#2b4f78\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"102\" cy=\"203\" r=\"3.5\" fill=\"#2b4f78\" stroke=\"none\" stroke-width=\"0\" /><text x=\"90\" y=\"257\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Heinz bodies<\/text><text x=\"90\" y=\"271\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">denatured Hgb; G6PD<\/text><text x=\"90\" y=\"283\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">(supravital stain only)<\/text><circle cx=\"360\" cy=\"215\" r=\"26\" fill=\"#e8a0a0\" stroke=\"#b45a5a\" stroke-width=\"1.2\" /><circle cx=\"360\" cy=\"215\" r=\"7.8\" fill=\"#f8dede\" stroke=\"none\" stroke-width=\"0\" /><path d=\"M346,215 C346,201 360,211 360,215 C360,219 374,229 374,215\" fill=\"none\" stroke=\"#5a3d7a\" stroke-width=\"1.6\" /><text x=\"360\" y=\"257\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Cabot ring<\/text><text x=\"360\" y=\"271\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">mitotic spindle remnant;<\/text><text x=\"360\" y=\"283\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">megaloblastic, lead<\/text><circle cx=\"630\" cy=\"215\" r=\"26\" fill=\"#e8a0a0\" stroke=\"#b45a5a\" stroke-width=\"1.2\" /><circle cx=\"630\" cy=\"215\" r=\"3.9\" fill=\"#f8dede\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"634\" cy=\"215\" r=\"9\" fill=\"none\" stroke=\"#7a5aa6\" stroke-width=\"2.2\" /><circle cx=\"642\" cy=\"212\" r=\"2.2\" fill=\"#7a1f3a\" stroke=\"none\" stroke-width=\"0\" /><text x=\"630\" y=\"257\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Malaria ring<\/text><text x=\"630\" y=\"271\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">Plasmodium; thick/thin<\/text><text x=\"630\" y=\"283\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">smear<\/text><\/svg><figcaption>Red cell inclusions and what they point to.<\/figcaption><\/figure><h3 id=\"red-cell-inclusions\">Red cell inclusions<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 26%\" />\n<col style=\"width: 24%\" />\n<col style=\"width: 28%\" />\n<col style=\"width: 19%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Inclusion<\/th>\n<th>What it is<\/th>\n<th>Seen in<\/th>\n<th>Stain<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Howell-Jolly body<\/td>\n<td>DNA remnant<\/td>\n<td>Asplenia, megaloblastic<\/td>\n<td>Wright<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Basophilic stippling<\/td>\n<td>Ribosome RNA<\/td>\n<td>Lead, thalassemia<\/td>\n<td>Wright<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Pappenheimer bodies<\/td>\n<td>Iron granules<\/td>\n<td>Sideroblastic anemia<\/td>\n<td>Prussian blue<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Heinz bodies<\/td>\n<td>Denatured hemoglobin<\/td>\n<td>G6PD deficiency<\/td>\n<td>Supravital<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Cabot rings<\/td>\n<td>Spindle remnant<\/td>\n<td>Severe anemia<\/td>\n<td>Wright<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>HbH inclusions<\/td>\n<td>Beta-chain tetramers<\/td>\n<td>Alpha thalassemia<\/td>\n<td>Brilliant cresyl blue<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Reticulocytes<\/td>\n<td>RNA<\/td>\n<td>Regeneration<\/td>\n<td>New methylene blue<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n","min":4},{"id":"H3","sec":0,"title":"Hemolysis and hemoglobin disorders","html":"<h3 id=\"hemolytic-anemias-what-you-see-what-to-think\">Hemolytic anemias: what you see, what to think<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 47%\" />\n<col style=\"width: 52%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Finding on the smear or test<\/th>\n<th>Think<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Spherocytes, DAT positive<\/td>\n<td>Autoimmune hemolytic anemia (warm = IgG; cold agglutinin disease = IgM anti-I)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Spherocytes, DAT negative, high MCHC, increased osmotic fragility<\/td>\n<td>Hereditary spherocytosis<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Schistocytes, low platelets<\/td>\n<td>DIC, TTP, HUS<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Sickle cells<\/td>\n<td>Hemoglobin S; solubility test screens, electrophoresis confirms<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Target cells<\/td>\n<td>Hemoglobin C, thalassemia, liver disease, iron deficiency, after splenectomy<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Heinz bodies, bite cells<\/td>\n<td>G6PD deficiency (Heinz bodies show only with supravital stain)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Absent CD55 and CD59 on flow cytometry<\/td>\n<td>PNH<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Hemoglobin electrophoresis, alkaline pH 8.6.<\/strong> Runs from the origin toward the anode. Farthest: A, then F, then S, then C (C, E, A2 and O sit together closest to the origin). Memory trick: \"A Fast Silly Cat.\" Acid gel pH 6.2 separates C from E and S from D and G.<\/p>\n<h3 id=\"hemolysis-indicators\">Hemolysis indicators<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 37%\" />\n<col style=\"width: 62%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Test<\/th>\n<th>In hemolysis<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Haptoglobin<\/td>\n<td>Low (binds free hemoglobin)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>LD<\/td>\n<td>High<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Indirect bilirubin<\/td>\n<td>High<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Reticulocytes<\/td>\n<td>High<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Free plasma hemoglobin<\/td>\n<td>High (pink plasma)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Urine hemosiderin<\/td>\n<td>Positive in chronic intravascular hemolysis<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<figure class=\"fig\" id=\"F05\"><svg viewBox=\"0 0 760 410\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Hemoglobin electrophoresis\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"410\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Hemoglobin electrophoresis, alkaline pH 8.6<\/text><text x=\"52\" y=\"52\" font-size=\"11\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#666\">(-) cathode, origin<\/text><text x=\"580\" y=\"352\" font-size=\"11\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#666\">(+) anode<\/text><rect x=\"50\" y=\"60\" width=\"520\" height=\"300\" rx=\"4\" fill=\"#f1efe6\" stroke=\"#bbb\" stroke-width=\"1.3\" /><line x1=\"50\" y1=\"80\" x2=\"570\" y2=\"80\" stroke=\"#ddd\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/><line x1=\"50\" y1=\"100\" x2=\"570\" y2=\"100\" stroke=\"#ddd\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/><line x1=\"50\" y1=\"140\" x2=\"570\" y2=\"140\" stroke=\"#ddd\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/><line x1=\"50\" y1=\"180\" x2=\"570\" y2=\"180\" stroke=\"#ddd\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/><line x1=\"50\" y1=\"220\" x2=\"570\" y2=\"220\" stroke=\"#ddd\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/><line x1=\"50\" y1=\"270\" x2=\"570\" y2=\"270\" stroke=\"#ddd\" stroke-width=\"1\" stroke-dasharray=\"3,3\"/><text x=\"95\" y=\"378\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Normal<\/text><text x=\"95\" y=\"390\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">AA<\/text><rect x=\"73\" y=\"215\" width=\"44\" height=\"10\" rx=\"3\" fill=\"#3b2f6b\" stroke=\"none\" stroke-width=\"0\" opacity=\"0.95\"/><rect x=\"73\" y=\"95\" width=\"44\" height=\"10\" rx=\"3\" fill=\"#3b2f6b\" stroke=\"none\" stroke-width=\"0\" opacity=\"0.42\"/><text x=\"175\" y=\"378\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Sickle<\/text><text x=\"175\" y=\"390\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">trait AS<\/text><rect x=\"153\" y=\"215\" width=\"44\" height=\"10\" rx=\"3\" fill=\"#3b2f6b\" stroke=\"none\" stroke-width=\"0\" opacity=\"0.67\"/><rect x=\"153\" y=\"135\" width=\"44\" height=\"10\" rx=\"3\" fill=\"#3b2f6b\" stroke=\"none\" stroke-width=\"0\" opacity=\"0.53\"/><rect x=\"153\" y=\"95\" width=\"44\" height=\"10\" rx=\"3\" fill=\"#3b2f6b\" stroke=\"none\" stroke-width=\"0\" opacity=\"0.42\"/><text x=\"255\" y=\"378\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Sickle<\/text><text x=\"255\" y=\"390\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">disease SS<\/text><rect x=\"233\" y=\"135\" width=\"44\" height=\"10\" rx=\"3\" fill=\"#3b2f6b\" stroke=\"none\" stroke-width=\"0\" opacity=\"0.95\"/><rect x=\"233\" y=\"175\" width=\"44\" height=\"10\" rx=\"3\" fill=\"#3b2f6b\" stroke=\"none\" stroke-width=\"0\" opacity=\"0.49\"/><rect x=\"233\" y=\"95\" width=\"44\" height=\"10\" rx=\"3\" fill=\"#3b2f6b\" stroke=\"none\" stroke-width=\"0\" opacity=\"0.42\"/><text x=\"335\" y=\"378\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">SC<\/text><text x=\"335\" y=\"390\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">disease<\/text><rect x=\"313\" y=\"135\" width=\"44\" height=\"10\" rx=\"3\" fill=\"#3b2f6b\" stroke=\"none\" stroke-width=\"0\" opacity=\"0.67\"/><rect x=\"313\" y=\"95\" width=\"44\" height=\"10\" rx=\"3\" fill=\"#3b2f6b\" stroke=\"none\" stroke-width=\"0\" opacity=\"0.81\"/><text x=\"415\" y=\"378\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">β-thal<\/text><text x=\"415\" y=\"390\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">major<\/text><rect x=\"393\" y=\"175\" width=\"44\" height=\"10\" rx=\"3\" fill=\"#3b2f6b\" stroke=\"none\" stroke-width=\"0\" opacity=\"0.95\"/><rect x=\"393\" y=\"95\" width=\"44\" height=\"10\" rx=\"3\" fill=\"#3b2f6b\" stroke=\"none\" stroke-width=\"0\" opacity=\"0.46\"/><text x=\"495\" y=\"378\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Hgb H<\/text><text x=\"495\" y=\"390\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">(α-thal)<\/text><rect x=\"473\" y=\"215\" width=\"44\" height=\"10\" rx=\"3\" fill=\"#3b2f6b\" stroke=\"none\" stroke-width=\"0\" opacity=\"0.60\"/><rect x=\"473\" y=\"265\" width=\"44\" height=\"10\" rx=\"3\" fill=\"#3b2f6b\" stroke=\"none\" stroke-width=\"0\" opacity=\"0.74\"/><text x=\"580\" y=\"104\" font-size=\"11\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">A2, C, E, O<\/text><text x=\"580\" y=\"144\" font-size=\"11\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">S, D, G<\/text><text x=\"580\" y=\"184\" font-size=\"11\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">F<\/text><text x=\"580\" y=\"224\" font-size=\"11\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">A<\/text><text x=\"580\" y=\"274\" font-size=\"11\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Hgb H, Bart’s<\/text><text x=\"580\" y=\"205\" font-size=\"10\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#666\">Hgb S and D co-migrate at<\/text><text x=\"580\" y=\"217\" font-size=\"10\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#666\">pH 8.6; separate on citrate<\/text><text x=\"580\" y=\"229\" font-size=\"10\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#666\">agar (acid, pH 6.2).<\/text><\/svg><figcaption>Alkaline (pH 8.6) hemoglobin electrophoresis. Cathode (-) at the top, anode (+) at the bottom.<\/figcaption><\/figure><h3 id=\"hemoglobin-disorders\">Hemoglobin disorders<\/h3>\n<ul>\n<li><p><strong>Hemoglobin S:<\/strong> valine replaces glutamic acid at position 6 of the beta chain. Sickle trait (AS) has about 40% HbS and is usually harmless. HbC has lysine in the same position. HbSC disease is milder than SS.<\/p><\/li>\n<li><p><strong>Sickle solubility test:<\/strong> deoxygenated HbS forms a cloudy suspension. It can be falsely negative in infants under 6 months or very low hemoglobin, and does not separate trait from disease, so confirm by electrophoresis.<\/p><\/li>\n<li><p><strong>Beta thalassemia:<\/strong> trait has raised HbA2 (above 3.5%); major has little or no HbA with high HbF. <strong>Alpha thalassemia:<\/strong> 4 gene deletions = hydrops fetalis (Hb Barts); 3 = HbH disease; 1-2 = mild.<\/p><\/li>\n<li><p><strong>Mentzer index<\/strong> = MCV / RBC count. Below 13 favors thalassemia; above 13 favors iron deficiency.<\/p><\/li>\n<li><p><strong>HPFH<\/strong> (hereditary persistence of fetal hemoglobin): high HbF with normal red cell indices.<\/p><\/li>\n<li><p><strong>Kleihauer-Betke<\/strong> acid elution: HbF resists acid, so fetal cells stay pink among ghost adult cells (counts fetal-maternal bleeding).<\/p><\/li>\n<\/ul>\n","min":4},{"id":"H4","sec":0,"title":"White cells and leukemias","html":"<figure class=\"fig\" id=\"F06\"><svg viewBox=\"0 0 760 380\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"White cell morphology\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"380\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">White cell morphology<\/text><circle cx=\"70\" cy=\"95\" r=\"24\" fill=\"#f0dccf\" stroke=\"#889\" stroke-width=\"1\" /><circle cx=\"60\" cy=\"87\" r=\"7\" fill=\"#5b3d86\" stroke=\"#334\" stroke-width=\"1\" /><circle cx=\"72\" cy=\"103\" r=\"7\" fill=\"#5b3d86\" stroke=\"#334\" stroke-width=\"1\" /><circle cx=\"81\" cy=\"89\" r=\"7\" fill=\"#5b3d86\" stroke=\"#334\" stroke-width=\"1\" /><line x1=\"60\" y1=\"87\" x2=\"72\" y2=\"103\" stroke=\"#5b3d86\" stroke-width=\"3\"/><line x1=\"72\" y1=\"103\" x2=\"81\" y2=\"89\" stroke=\"#5b3d86\" stroke-width=\"3\"/><text x=\"70\" y=\"134\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Neutrophil<\/text><text x=\"70\" y=\"149\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">3-5 lobes; bacterial<\/text><circle cx=\"190\" cy=\"95\" r=\"24\" fill=\"#f0dccf\" stroke=\"#889\" stroke-width=\"1\" /><path d=\"M178,85 q-4,22 12,22 q16,0 14,-20 l-6,0 q0,12 -8,12 q-8,0 -6,-14 z\" fill=\"#5b3d86\" stroke=\"#334\" stroke-width=\"1\" /><text x=\"190\" y=\"134\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Band<\/text><text x=\"190\" y=\"149\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">U-shaped nucleus<\/text><circle cx=\"310\" cy=\"95\" r=\"25\" fill=\"#b6cde6\" stroke=\"#889\" stroke-width=\"1\" /><circle cx=\"310\" cy=\"95\" r=\"17\" fill=\"#5b3d86\" stroke=\"#334\" stroke-width=\"1\" /><text x=\"310\" y=\"135\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Lymphocyte<\/text><text x=\"310\" y=\"150\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">round nucleus,<\/text><text x=\"310\" y=\"162\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">thin blue rim<\/text><circle cx=\"430\" cy=\"95\" r=\"28\" fill=\"#c4ccd8\" stroke=\"#889\" stroke-width=\"1\" /><path d=\"M416,89 q8,-14 20,-4 q10,10 -4,18 q-8,6 -10,-4 q-6,6 -8,-2 z\" fill=\"# 0\" y=\"151\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">orange granules,<\/text><text x=\"550\" y=\"163\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">bilobed<\/text><circle cx=\"670\" cy=\"95\" r=\"25\" fill=\"#f0dccf\" stroke=\"#889\" stroke-width=\"1\" /><circle cx=\"670\" cy=\"95\" r=\"10\" fill=\"#6a5a96\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"686.0\" cy=\"95.0\" r=\"3.2\" fill=\"#2b1f55\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"683.2053698385548\" cy=\"106.47769745439237\" r=\"3.2\" fill=\"#2b1f55\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"675.7977240716268\" cy=\"110.99317764866409\" r=\"3.2\" fill=\"#2b1f55\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"666.3647664849107\" cy=\"105.80741088881841\" r=\"3.2\" fill=\"#2b1f55\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"658.2017005513401\" cy=\"94.06601370515872\" r=\"3.2\" fill=\"#2b1f55\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"654.1601200543929\" cy=\"82.89116007507315\" r=\"3.2\" fill=\"#2b1f55\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"655.6518653386537\" cy=\"79.06136625862655\" r=\"3.2\" fill=\"#2b1f55\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"662.1558268585488\" cy=\"84.89973379404287\" r=\"3.2\" fill=\"#2b1f55\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"671.3999837350311\" cy=\"96.8647872776079\" r=\"3.2\" fill=\"#2b1f55\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"680.1550860150821\" cy=\"107.69868582158645\" r=\"3.2\" fill=\"#2b1f55\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"685.3627245864059\" cy=\"110.8297319459741\" r=\"3.2\" fill=\"#2b1f55\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"685.2037214713365\" cy=\"104.35867508626819\" r=\"3.2\" fill=\"#2b1f55\" stroke=\"none\" stroke-width=\"0\" /><text x=\"670\" y=\"135\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Basophil<\/text><text x=\"670\" y=\"150\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">dark granules<\/text><text x=\"670\" y=\"162\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">cover nucleus<\/text><circle cx=\"70\" cy=\"250\" r=\"26\" fill=\"#9ab6e0\" stroke=\"#889\" stroke-width=\"1\" /><circle cx=\"70\" cy=\"250\" r=\"19\" fill=\"#a984c9\" stroke=\"#334\" stroke-width=\"1\" /><circle cx=\"66\" cy=\"247\" r=\"2.5\" fill=\"#fff\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"75\" cy=\"254\" r=\"2.5\" fill=\"#fff\" stroke=\"none\" stroke-width=\"0\" /><text x=\"70\" y=\"291\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Blast<\/text><text x=\"70\" y=\"306\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">fine chromatin,<\/text><text x=\"70\" y=\"318\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">nucleoli<\/text><circle cx=\"200\" cy=\"250\" r=\"26\" fill=\"#9ab6e0\" stroke=\"#889\" stroke-width=\"1\" /><circle cx=\"200\" cy=\"250\" r=\"19\" fill=\"#a984c9\" stroke=\"#334\" stroke-width=\"1\" /><circle cx=\"196\" cy=\"247\" r=\"2.5\" fill=\"#fff\" stroke=\"none\" stroke-width=\"0\" /><line x1=\"202\" y1=\"258\" x2=\"222\" y2=\"264\" stroke=\"#d4306a\" stroke-width=\"3\"/><text x=\"200\" y=\"291\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Blast with<\/text><text x=\"200\" y=\"304\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Auer rod<\/text><text x=\"200\" y=\"319\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">AML; red rod<\/text><text x=\"200\" y=\"331\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">(fused granules)<\/text><circle cx=\"330\" cy=\"250\" r=\"27\" fill=\"#b6cde6\" stroke=\"#889\" stroke-width=\"1\" /><ellipse cx=\"330\" cy=\"250\" rx=\"15\" ry=\"19\" fill=\"#6a4a96\" stroke=\"#334\" stroke-width=\"1\" transform=\"rotate(0 330 250)\"/><text x=\"330\" y=\"292\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Atypical<\/text><text x=\"330\" y=\"305\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">(reactive) lymph<\/text><text x=\"330\" y=\"320\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">mono, viral; scalloped<\/text><text x=\"330\" y=\"332\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">edges<\/text><circle cx=\"460\" cy=\"250\" r=\"30\" fill=\"#e9e6ef\" stroke=\"#889\" stroke-width=\"1\" /><circle cx=\"460\" cy=\"250\" r=\"22\" fill=\"#9a86c0\" stroke=\"none\" stroke-width=\"0\" /><line x1=\"482.0\" y1=\"250.0\" x2=\"489.40199733523724\" y2=\"255.96007992385182\" stroke=\"#9a86c0\" stroke-width=\"1\"/><line x1=\"471.8866507290991\" y1=\"268.5123616657737\" x2=\"470.8707326343002\" y2=\"277.96117257901676\" stroke=\"#9a86c0\" stroke-width=\"1\"/><line x1=\"450.8447695959629\" y1=\"270.004543390165\" x2=\"442.3449664823396\" y2=\"274.25489211458773\" stroke=\"#9a86c0\" stroke-width=\"1\"/><line x1=\"438.2201650747902\" y1=\"253.10464017731707\" x2=\"430.0511567261574\" y2=\"248.2487756971726\" stroke=\"#9a86c0\" stroke-width=\"1\"/><line x1=\"445.61984034100055\" y1=\"233.35034510322558\" x2=\"445.29217535977904\" y2=\"223.85272682759236\" stroke=\"#9a86c0\" stroke-width=\"1\"/><line x1=\"466.240568080191\" y1=\"228.90366595741096\" x2=\"474.0555001390113\" y2=\"223.4963603283954\" stroke=\"#9a86c0\" stroke-width=\"1\"/><line x1=\"481.123746306308\" y1=\"243.85285903962364\" x2=\"489.8962629106965\" y2=\"247.5073179154751\" stroke=\"#9a86c0\" stroke-width=\"1\"/><text x=\"460\" y=\"295\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Smudge cell<\/text><text x=\"460\" y=\"310\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">CLL; fragile<\/text><text x=\"460\" y=\"322\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">lymphocyte<\/text><circle cx=\"590\" cy=\"250\" r=\"26\" fill=\"#f0dccf\" stroke=\"#889\" stroke-width=\"1\" /><circle cx=\"590\" cy=\"250\" r=\"17\" fill=\"#3d2c6d\" stroke=\"#223\" stroke-width=\"1\" /><circle cx=\"566\" cy=\"245\" r=\"3.5\" fill=\"#5b3d86\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"612\" cy=\"242\" r=\"3.5\" fill=\"#5b3d86\" stroke=\"none\" stroke-width=\"0\" /><text x=\"590\" y=\"291\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Toxic neutrophil<\/text><text x=\"590\" y=\"306\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">Döhle bodies,<\/text><text x=\"590\" y=\"318\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">toxic granules<\/text><circle cx=\"700\" cy=\"250\" r=\"24\" fill=\"#e9e6ef\" stroke=\"#889\" stroke-width=\"1\" /><circle cx=\"700\" cy=\"250\" r=\"14\" fill=\"#6a5a96\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"709.0\" cy=\"250.0\" r=\"2.2\" fill=\"#d4306a\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"704.0823650928302\" cy=\"258.0208662405529\" r=\"2.2\" fill=\"#d4306a\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"694.7034899447019\" cy=\"257.27646763437633\" r=\"2.2\" fill=\"#d4306a\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"691.1126820708203\" cy=\"248.58028875271077\" r=\"2.2\" fill=\"#d4306a\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"697.2340041701942\" cy=\"241.43558133499437\" r=\"2.2\" fill=\"#d4306a\" stroke=\"none\" stroke-width=\"0\" /><text x=\"700\" y=\"289\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Promyelocyte<\/text><text x=\"700\" y=\"302\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">(APL)<\/text><text x=\"700\" y=\"317\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">heavy granules;<\/text><text x=\"700\" y=\"329\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">faggot cells<\/text><\/svg><figcaption>Normal white cells and the blasts you must recognize.<\/figcaption><\/figure><h3 id=\"white-cells-and-leukemias\">White cells and leukemias<\/h3>\n<ul>\n<li><p>A left shift (more bands) with toxic granulation, Dohle bodies or vacuoles points to bacterial infection.<\/p><\/li>\n<li><p>Pelger-Huet: bilobed neutrophils, normal function. Chediak-Higashi: giant granules. May-Hegglin: giant platelets with Dohle-like bodies.<\/p><\/li>\n<li><p>Reactive lymphocytes with a positive heterophile (Monospot) test = infectious mononucleosis (EBV).<\/p><\/li>\n<li><p>Leukemoid reaction has a high LAP score; CML has a low LAP score.<\/p><\/li>\n<\/ul>\n<table>\n<colgroup>\n<col style=\"width: 31%\" />\n<col style=\"width: 68%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Disease<\/th>\n<th>Key clues<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>AML<\/td>\n<td>Myeloblasts, Auer rods, MPO and Sudan black B positive<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>APL (M3)<\/td>\n<td>Hypergranular promyelocytes, DIC, t(15;17), treated with all-trans retinoic acid<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>M4 and M5<\/td>\n<td>Monocytic cells; nonspecific esterase (NSE) positive<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>M6<\/td>\n<td>Erythroleukemia; PAS positive red cell precursors<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>M7<\/td>\n<td>Megakaryoblasts; CD41 and CD61<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ALL<\/td>\n<td>Lymphoblasts, TdT positive, MPO and Sudan black negative<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>CLL<\/td>\n<td>Small mature lymphocytes, smudge cells, CD5, CD19, CD23<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Hairy cell leukemia<\/td>\n<td>TRAP positive, CD11c, CD25, CD103<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>CML<\/td>\n<td>Basophilia, low LAP, Philadelphia chromosome t(9;22), BCR-ABL<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Multiple myeloma<\/td>\n<td>Rouleaux, plasma cells, monoclonal spike, Bence Jones protein<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Memory trick for stains: MPO and Sudan black = myeloid; NSE = monocytic; TdT = lymphoblasts.<\/p>\n<p>Myeloproliferative neoplasms: polycythemia vera (JAK2, high red cell mass), essential thrombocythemia (high platelets), primary myelofibrosis (teardrop cells, dry marrow tap).<\/p>\n<h3 id=\"more-on-white-cells-and-lymphoid-disease\">More on white cells and lymphoid disease<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 27%\" />\n<col style=\"width: 72%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Finding<\/th>\n<th>Common causes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Neutrophilia<\/td>\n<td>Bacterial infection, steroids, stress<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Eosinophilia<\/td>\n<td>Allergy, parasites, drug reactions<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Basophilia<\/td>\n<td>CML and other myeloproliferative disease<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Monocytosis<\/td>\n<td>TB, recovery from infection, chronic inflammation<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Lymphocytosis<\/td>\n<td>Viral infection, pertussis; CLL in older adults<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Neutropenia<\/td>\n<td>Drugs, viral infection, marrow failure<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p><strong>Myelodysplastic syndromes (MDS):<\/strong> dysplasia in one or more cell lines, usually macrocytosis, pseudo-Pelger-Huet cells, ring sideroblasts; blasts below 20% (WHO).<\/p><\/li>\n<li><p><strong>Erythrocytosis:<\/strong> relative (low plasma volume, dehydration), absolute primary (polycythemia vera, JAK2, low EPO), absolute secondary (high EPO from hypoxia, smoking, tumors).<\/p><\/li>\n<li><p><strong>Lymphomas:<\/strong> Hodgkin has Reed-Sternberg cells (owl-eye, CD15 and CD30). Burkitt shows a \"starry sky\" with t(8;14) and MYC. Follicular lymphoma has t(14;18) and BCL2. Mantle cell has t(11;14) and cyclin D1, CD5 positive.<\/p><\/li>\n<li><p><strong>Myeloma:<\/strong> more than 10% plasma cells, monoclonal protein, \"CRAB\" (high calcium, renal failure, anemia, bone lesions). <strong>Waldenstrom:<\/strong> IgM paraprotein and thick blood (hyperviscosity).<\/p><\/li>\n<li><p><strong>Platelet disorders:<\/strong> TTP has ADAMTS13 deficiency with schistocytes and low platelets; HUS follows E. coli O157 in children with kidney failure; <strong>HIT<\/strong> (heparin-induced thrombocytopenia) shows a platelet drop 5-10 days after heparin starts, caused by antibodies to heparin-PF4, and is treated with a direct thrombin inhibitor (argatroban).<\/p><\/li>\n<\/ul>\n","min":4},{"id":"H5","sec":0,"title":"Platelets and primary hemostasis","html":"<figure class=\"fig\" id=\"F07\"><svg viewBox=\"0 0 760 310\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Platelet plug\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"310\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Primary hemostasis: the platelet plug<\/text><text x=\"130\" y=\"48\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">1. Adhesion<\/text><rect x=\"30\" y=\"170\" width=\"200\" height=\"14\" rx=\"3\" fill=\"#d9b99a\" stroke=\"#8a6a4a\" stroke-width=\"1.3\" /><text x=\"130\" y=\"203\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">damaged vessel wall (collagen)<\/text><text x=\"130\" y=\"235\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">vWF links collagen to<\/text><text x=\"130\" y=\"247\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">platelet GPIb<\/text><text x=\"130\" y=\"259\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">(ristocetin test; Bernard-Soulier)<\/text><rect x=\"50\" y=\"162\" width=\"10\" height=\"8\" rx=\"2\" fill=\"#6a8fd4\" stroke=\"#334\" stroke-width=\"1.3\" /><rect x=\"100\" y=\"162\" width=\"10\" height=\"8\" rx=\"2\" fill=\"#6a8fd4\" stroke=\"#334\" stroke-width=\"1.3\" /><rect x=\"150\" y=\"162\" width=\"10\" height=\"8\" rx=\"2\" fill=\"#6a8fd4\" stroke=\"#334\" stroke-width=\"1.3\" /><ellipse cx=\"100\" cy=\"130\" rx=\"22\" ry=\"12\" fill=\"#e9d27a\" stroke=\"#8a7a2a\" stroke-width=\"1\" transform=\"rotate(0 100 130)\"/><ellipse cx=\"170\" cy=\"130\" rx=\"22\" ry=\"12\" fill=\"#e9d27a\" stroke=\"#8a7a2a\" stroke-width=\"1\" transform=\"rotate(0 170 130)\"/><line x1=\"100\" y1=\"154\" x2=\"100\" y2=\"142\" stroke=\"#6a8fd4\" stroke-width=\"1.5\"/><line x1=\"170\" y1=\"154\" x2=\"170\" y2=\"142\" stroke=\"#6a8fd4\" stroke-width=\"1.5\"/><text x=\"100\" y=\"100\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">GPIb<\/text><text x=\"170\" y=\"100\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">GPIb<\/text><text x=\"70\" y=\"160\" font-size=\"10\" text-anchor=\"end\" font-weight=\"normal\" fill=\"#335\">vWF<\/text><text x=\"380\" y=\"48\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">2. Activation<\/text><rect x=\"280\" y=\"170\" width=\"200\" height=\"14\" rx=\"3\" fill=\"#d9b99a\" stroke=\"#8a6a4a\" stroke-width=\"1.3\" /><text x=\"380\" y=\"203\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">damaged vessel wall (collagen)<\/text><text x=\"380\" y=\"235\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">granules released:<\/text><text x=\"380\" y=\"247\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">ADP, thromboxane A2<\/text><text x=\"380\" y=\"259\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">(aspirin blocks TXA2)<\/text><ellipse cx=\"320\" cy=\"140\" rx=\"26\" ry=\"14\" fill=\"#e9d27a\" stroke=\"#8a7a2a\" stroke-width=\"1\" transform=\"rotate(0 320 140)\"/><line x1=\"306\" y1=\"128\" x2=\"299.0\" y2=\"114\" stroke=\"#8a7a2a\" stroke-width=\"1.2\"/><line x1=\"320\" y1=\"128\" x2=\"320.0\" y2=\"114\" stroke=\"#8a7a2a\" stroke-width=\"1.2\"/><line x1=\"334\" y1=\"128\" x2=\"341.0\" y2=\"114\" stroke=\"#8a7a2a\" stroke-width=\"1.2\"/><circle cx=\"311\" cy=\"142\" r=\"2.5\" fill=\"#c0392b\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"320\" cy=\"142\" r=\"2.5\" fill=\"#c0392b\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"329\" cy=\"142\" r=\"2.5\" fill=\"#c0392b\" stroke=\"none\" stroke-width=\"0\" /><ellipse cx=\"380\" cy=\"140\" rx=\"26\" ry=\"14\" fill=\"#e9d27a\" stroke=\"#8a7a2a\" stroke-width=\"1\" transform=\"rotate(0 380 140)\"/><line x1=\"366\" y1=\"128\" x2=\"359.0\" y2=\"114\" stroke=\"#8a7a2a\" stroke-width=\"1.2\"/><line x1=\"380\" y1=\"128\" x2=\"380.0\" y2=\"114\" stroke=\"#8a7a2a\" stroke-width=\"1.2\"/><line x1=\"394\" y1=\"128\" x2=\"401.0\" y2=\"114\" stroke=\"#8a7a2a\" stroke-width=\"1.2\"/><circle cx=\"371\" cy=\"142\" r=\"2.5\" fill=\"#c0392b\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"380\" cy=\"142\" r=\"2.5\" fill=\"#c0392b\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"389\" cy=\"142\" r=\"2.5\" fill=\"#c0392b\" stroke=\"none\" stroke-width=\"0\" /><ellipse cx=\"440\" cy=\"140\" rx=\"26\" ry=\"14\" fill=\"#e9d27a\" stroke=\"#8a7a2a\" stroke-width=\"1\" transform=\"rotate(0 440 140)\"/><line x1=\"426\" y1=\"128\" x2=\"419.0\" y2=\"114\" stroke=\"#8a7a2a\" stroke-width=\"1.2\"/><line x1=\"440\" y1=\"128\" x2=\"440.0\" y2=\"114\" stroke=\"#8a7a2a\" stroke-width=\"1.2\"/><line x1=\"454\" y1=\"128\" x2=\"461.0\" y2=\"114\" stroke=\"#8a7a2a\" stroke-width=\"1.2\"/><circle cx=\"431\" cy=\"142\" r=\"2.5\" fill=\"#c0392b\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"440\" cy=\"142\" r=\"2.5\" fill=\"#c0392b\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"449\" cy=\"142\" r=\"2.5\" fill=\"#c0392b\" stroke=\"none\" stroke-width=\"0\" /><text x=\"630\" y=\"48\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">3. Aggregation<\/text><rect x=\"530\" y=\"170\" width=\"200\" height=\"14\" rx=\"3\" fill=\"#d9b99a\" stroke=\"#8a6a4a\" stroke-width=\"1.3\" /><text x=\"630\" y=\"203\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">damaged vessel wall (collagen)<\/text><text x=\"630\" y=\"235\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">fibrinogen bridges<\/text><text x=\"630\" y=\"247\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">GPIIb/IIIa receptors<\/text><text x=\"630\" y=\"259\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">(Glanzmann)<\/text><ellipse cx=\"560\" cy=\"140\" rx=\"20\" ry=\"12\" fill=\"#e9d27a\" stroke=\"#8a7a2a\" stroke-width=\"1\" transform=\"rotate(0 560 140)\"/><ellipse cx=\"610\" cy=\"125\" rx=\"20\" ry=\"12\" fill=\"#e9d27a\" stroke=\"#8a7a2a\" stroke-width=\"1\" transform=\"rotate(0 610 125)\"/><ellipse cx=\"660\" cy=\"140\" rx=\"20\" ry=\"12\" fill=\"#e9d27a\" stroke=\"#8a7a2a\" stroke-width=\"1\" transform=\"rotate(0 660 140)\"/><ellipse cx=\"710\" cy=\"125\" rx=\"20\" ry=\"12\" fill=\"#e9d27a\" stroke=\"#8a7a2a\" stroke-width=\"1\" transform=\"rotate(0 710 125)\"/><ellipse cx=\"585\" cy=\"95\" rx=\"20\" ry=\"12\" fill=\"#e9d27a\" stroke=\"#8a7a2a\" stroke-width=\"1\" transform=\"rotate(0 585 95)\"/><ellipse cx=\"635\" cy=\"98\" rx=\"20\" ry=\"12\" fill=\"#e9d27a\" stroke=\"#8a7a2a\" stroke-width=\"1\" transform=\"rotate(0 635 98)\"/><ellipse cx=\"685\" cy=\"100\" rx=\"20\" ry=\"12\" fill=\"#e9d27a\" stroke=\"#8a7a2a\" stroke-width=\"1\" transform=\"rotate(0 685 100)\"/><line x1=\"560\" y1=\"140\" x2=\"610\" y2=\"125\" stroke=\"#c0392b\" stroke-width=\"1.2\" stroke-dasharray=\"3,2\"/><line x1=\"610\" y1=\"125\" x2
