,"Staphylococcus aureus","Enterococcus faecalis"],0,"Novobiocin resistance separates S. saprophyticus from other coagulase-negative staphylococci.","M2","new"],[2,"A newborn with meningitis has a beta-hemolytic gram-positive coccus, bacitracin resistant, CAMP positive and hippurate positive. Identify it.",["Streptococcus agalactiae","Streptococcus pyogenes","Enterococcus faecalis","Streptococcus pneumoniae"],0,"Group B strep: bacitracin R, CAMP +, hippurate +. Group A is bacitracin S and PYR positive.","M2","new"],[2,"A blood isolate from endocarditis is alpha-hemolytic, optochin resistant and bile insoluble. What is it?",["Viridans group Streptococcus","Streptococcus pneumoniae","Streptococcus pyogenes","Staphylococcus aureus"],0,"S. pneumoniae is optochin susceptible and bile soluble. Viridans strep cause endocarditis after dental procedures.","M2","new"],[2,"A stool isolate is a non-lactose fermenter, H2S negative, non-motile, urease negative and ferments glucose without gas. Identify it.",["Shigella species","Salmonella species","Proteus mirabilis","Escherichia coli"],0,"Shigella is non-motile and does not produce H2S. Salmonella is motile and H2S positive on most media.","M3","new"],[2,"A urine isolate swarms across blood agar and is urease positive, H2S positive and indole negative. What is it?",["Proteus mirabilis","Proteus vulgaris","Escherichia coli","Klebsiella pneumoniae"],0,"P. mirabilis is indole negative; P. vulgaris is indole positive. Both are rapid urease producers.","M3","new"],[2,"A mucoid, lactose-fermenting, non-motile isolate is indole negative, VP positive and urease positive. Which organism is most likely?",["Klebsiella pneumoniae","Escherichia coli","Enterobacter aerogenes","Salmonella"],0,"E. coli is indole positive and VP negative. Klebsiella is mucoid and non-motile.","M3","new"],[2,"A burn-wound isolate is oxidase positive, produces a blue-green pigment with a grape-like odor and grows at 42 °C. Identify it.",["Pseudomonas aeruginosa","Escherichia coli","Acinetobacter baumannii","Stenotrophomonas maltophilia"],0,"Pyocyanin and pyoverdin give the blue-green pigment. Acinetobacter is oxidase negative.","M4","new"],[2,"A gram-negative coccobacillus grows on chocolate agar but not on blood agar, and grows as satellite colonies around S. aureus. Which factors does it require?",["X and V","X only","V only","Neither"],0,"H. influenzae needs hemin (X) and NAD (V). S. aureus lyses RBCs and releases V factor, producing satellitism.","M4","new"],[2,"A gram-positive rod with a terminal round spore (tennis-racket shape) is isolated from a puncture wound. What is it?",["Clostridium tetani","Clostridium perfringens","Bacillus anthracis","Listeria monocytogenes"],0,"C. tetani produces tetanospasmin. C. perfringens is boxcar-shaped and rarely shows spores.","M5","new"],[2,"A throat culture grows gram-positive pleomorphic rods in a 'Chinese letter' arrangement and black colonies on tellurite agar. What should be done?",["Notify the clinician immediately and test for toxin production","Report as normal flora","Discard the culture","Perform bile solubility only"],0,"Corynebacterium diphtheriae. Confirm toxigenicity (Elek test or PCR); this is an urgent public health report.","M5","new"],[2,"A gram-negative anaerobic bacillus grows in 20% bile and is resistant to vancomycin, kanamycin and colistin special-potency disks. What is it?",["Bacteroides fragilis group","Fusobacterium nucleatum","Prevotella melaninogenica","Porphyromonas"],0,"B. fragilis group is bile resistant and resistant to all three special-potency disks.","M5","new"],[2,"A sputum AFB smear is positive. Colonies appear at 14 days, are buff and rough, and the isolate is niacin positive and nitrate positive. Identify it.",["Mycobacterium tuberculosis","Mycobacterium kansasii","Mycobacterium avium complex","Mycobacterium fortuitum"],0,"M. tuberculosis is a slow grower (2-8 weeks), niacin positive, nitrate positive.","M6","new"],[2,"CSF from an AIDS patient shows encapsulated budding yeast on India ink. The isolate is urease positive. Which test provides the fastest confirmation?",["Cryptococcal antigen latex agglutination","Germ tube test","Gram stain only","Acid-fast stain"],0,"Cryptococcus neoformans. The antigen test is highly sensitive on CSF and serum.","M6","new"],[2,"For malaria, which statement about blood smears is correct?",["Thick smear detects parasites; thin smear identifies the species","Thin smear is better for detection; thick for species","Only thin smears are used","Smears must be refrigerated for 24 h"],0,"A thick smear concentrates parasites for sensitivity. A thin smear shows morphology for species ID and parasitemia percentage.","M7","new"],[2,"A stool O&P shows cysts with 4 nuclei and chromatoidal bars. Which organism is suspected?",["Entamoeba histolytica","Entamoeba coli","Giardia lamblia","Endolimax nana"],0,"E. coli cysts have up to 8 nuclei. Giardia cysts are oval with 4 nuclei and axonemes, without chromatoidal bars.","M7","new"],[2,"A young adult has urethritis. Gram stain shows many WBCs and no organisms. Which is the best diagnostic test for Chlamydia trachomatis?",["Nucleic acid amplification test","Culture on blood agar","Gram stain of the culture","Bile esculin"],0,"Chlamydia is an obligate intracellular organism. NAAT is the preferred test; culture needs cell lines.","M7","new"],[2,"A Kirby-Bauer plate was inoculated with a suspension much heavier than 0.5 McFarland. What is the likely effect on the zones?",["Smaller zones, possible false resistance","Larger zones, possible false susceptibility","No change","Irregular zones that cannot be measured"],0,"Too many bacteria overwhelm the diffusing drug. Use a 0.5 McFarland standard (about 1.5 × 10⁸ CFU/mL).","M8","new"],[2,"An S. aureus isolate has a cefoxitin zone of 18 mm (resistant breakpoint ≤21 mm). How should it be reported?",["Methicillin (oxacillin) resistant; resistant to all beta-lactams except ceftaroline","Susceptible to oxacillin","Resistant to vancomycin","Report only penicillin"],0,"Cefoxitin is a surrogate for mecA/PBP2a. MRSA is resistant to penicillins, cephalosporins (except ceftaroline) and carbapenems.","M8","new"],[2,"For an Etest strip, where is the MIC read?",["Where the ellipse of inhibition intersects the strip","At the edge of the plate","At the strip tip","At the largest zone diameter in mm"],0,"The strip carries a gradient of antibiotic; the MIC is the value at the intersection.","M8","new"],[2,"Which urine collection method treats ANY growth of bacteria as significant?",["Suprapubic aspiration","Midstream clean catch","Foley catheter bag","First-morning void"],0,"Suprapubic aspirates bypass the urethra, so any organism indicates infection.","M9","new"],[2,"Coagulase-negative staphylococci grow in 1 of 4 blood culture bottles. What is the most likely interpretation?",["Skin contaminant","True bacteremia","Fungemia","Anaerobic infection"],0,"A common contaminant when found in a single bottle. Staphylococcus aureus is considered significant even in one bottle.","M9","new"],[2,"A formed stool is submitted for C. difficile toxin testing. What should the laboratory do?",["Reject the specimen and request an unformed stool","Test it as received","Concentrate it","Refrigerate for one week"],0,"Only liquid or unformed stool from symptomatic patients is acceptable; formed stool suggests colonization, not disease.","M9","new"],[2,"A child’s rapid strep antigen test is negative. What is the recommended follow-up?",["Back-up throat culture","No further testing","Blood culture","Anaerobic culture"],0,"In children, a negative rapid test should be confirmed with culture because of lower sensitivity and the risk of rheumatic fever.","M9","new"],[2,"Which temperature is correct for transporting CSF for bacterial culture?",["Room temperature, delivered immediately","Refrigerated","Frozen","On ice for 24 hours"],0,"Fastidious organisms (N. meningitidis, H. influenzae, S. pneumoniae) die when refrigerated.","M9","new"],[2,"Which specimen is unacceptable for anaerobic culture?",["Expectorated sputum","Aspirated abscess fluid","Tissue biopsy","Transtracheal aspirate"],0,"Specimens contaminated with normal flora, such as sputum, voided urine or surface swabs, are rejected for anaerobic culture.","M9","new"],[2,"A zone around an optochin disk incubated in CO2 is smaller than expected for an alpha-hemolytic coccus. Which test best confirms S. pneumoniae?",["Bile solubility","Catalase","Bacitracin","CAMP"],0,"CO2 shrinks optochin zones, so confirm with bile solubility.","M10","new"],[2,"Oxidase testing is performed with a nichrome wire loop. What problem might occur?",["False-positive reaction","False-negative reaction","Colonies die","Reagent precipitates"],0,"Iron or nichrome wire can oxidize the reagent. Use a platinum loop, wooden stick or plastic loop.","M10","new"],[2,"A tube coagulase test is negative at 4 hours for a suspected S. aureus. What should be done?",["Re-incubate and read at 24 hours","Report as coagulase negative","Repeat the Gram stain","Perform bile esculin"],0,"Some strains are slow to clot. Fibrinolysin can dissolve clots after prolonged incubation, so reading only at 24 h can also give false negatives.","M10","new"],[2,"A culture of Clostridium species from an old plate stains pink on Gram stain. What explains this?",["Cells in old cultures often decolorize and appear gram-negative","The organism is truly gram-negative","The iodine was missing","Stain mordant was too strong"],0,"Clostridium and Bacillus can stain gram-variable in older cultures. Use a fresh culture, and look for spores.","M10","new"],[2,"Which medium is used for susceptibility testing of Haemophilus influenzae?",["Haemophilus test medium (HTM)","Mueller-Hinton agar without supplement","MacConkey agar","Sabouraud agar"],0,"Fastidious organisms need supplemented media (HTM for Haemophilus; MH with 5% sheep blood for streptococci).","M10","new"],[3,"Forward typing: anti-A 4+, anti-B 0. Reverse typing: A1 cells 0, B cells 4+. What is the ABO group?",["A","B","O","AB"],0,"Patient cells have the A antigen; serum has anti-B only.","B1","new"],[3,"Forward typing shows no agglutination with anti-A or anti-B. Reverse typing shows 4+ reactions with A1 and B cells. What is the ABO group?",["O","AB","A","B"],0,"No antigens on cells; serum contains anti-A and anti-B.","B1","new"],[3,"Why is reverse typing omitted when testing cord blood?",["Newborns have not yet produced their own anti-A or anti-B","Maternal IgG blocks the test","Cord cells lack antigens","The test is too sensitive"],0,"Antibodies at birth are maternal IgG, not the infant’s own. ABO reverse typing is not valid until about 3-6 months.","B1","new"],[3,"Forward: anti-A 4+, anti-B 0. Reverse: A1 cells 2+, B cells 4+. Patient cells are negative with anti-A1 lectin. What is the likely explanation?",["A2 with anti-A1 antibody","Group O","Group B","Rouleaux"],0,"A2 individuals can make anti-A1, which reacts with A1 reverse cells. The anti-A1 lectin negative result with patient cells fits A2.","B1","new"],[3,"A group AB mother and a group O father have a child. Which blood group is possible for the child?",["A or B","O or AB","AB only","O only"],0,"Mother gives A or B, father gives O. The child is AO (group A) or BO (group B).","B1","new"],[3,"A donor unit types D negative at immediate spin but positive after AHG. How should it be labeled?",["Rh positive","Rh negative","Weak positive; discard","Rh negative with a warning"],0,"Donor units that are weak D positive are labeled Rh positive because they can immunize D-negative recipients.","B2","new"],[3,"Red cells react with anti-D, anti-C and anti-e but not with anti-c or anti-E. What is the most probable genotype?",["R1R1 (DCe/DCe)","R2R2 (DcE/DcE)","rr (dce/dce)","R0R0 (Dce/Dce)"],0,"C and e present with c and E absent means homozygous DCe.","B2","new"],[3,"Which is the most common Rh-negative genotype in people of European ancestry?",["rr (dce/dce)","r'r' (dCe/dCe)","r''r'' (dcE/dcE)","Dce/dce"],0,"Absence of D is mostly due to a gene deletion; the dce haplotype is the usual D-negative one.","B2","new"],[3,"A patient has a history of anti-Jka. The current antibody screen is negative, then a delayed hemolytic reaction occurs after Jk(a+) blood. Why was the antibody missed?",["Kidd antibody titers often fall below detectable levels","Anti-Jka is IgM only","Enzyme panels destroy Kidd antigens","Kidd antigens are not on donor cells"],0,"Kidd antibodies are notorious for causing delayed hemolytic reactions after an anamnestic response. Always honor antibody history.","B2","new"],[3,"A Black patient’s cells are negative with anti-Fya and anti-Fyb. What is the significance?",["Fy(a−b−) phenotype is common in people of African ancestry and resists Plasmodium vivax","The patient is Duffy positive","The antisera are defective","This is Bombay phenotype"],0,"Duffy-negative red cells lack the receptor for P. vivax. Anti-Fy3 can form only in Fy(a−b−) people who receive Fy-positive blood.","B2","new"],[3,"On an antibody panel, an Fy(a+b−) cell shows no reaction at AHG, while an Fy(a−b+) cell reacts. What can be concluded about anti-Fya?",["It can be ruled out, because a homozygous Fy(a+) cell was non-reactive","It cannot be ruled out","It is present","It is IgM and clinically insignificant"],0,"Antibodies showing dosage are ruled out only with homozygous antigen-positive cells. A non-reactive Fy(a+b−) cell rules out anti-Fya; the reactive Fy(a−b+) cell points to another antibody such as anti-Fyb.","B3","new"],[3,"All panel cells react at AHG, the autocontrol and DAT are negative. What is the most likely explanation?",["Alloantibody to a high-prevalence antigen","Warm autoantibody","Cold agglutinin","Rouleaux"],0,"A negative autocontrol means the patient’s own cells lack the antigen, which fits an alloantibody to a high-frequency antigen.","B3","new"],[3,"One unit of RBCs given to a 70 kg non-bleeding adult is expected to raise the hemoglobin by about:",["1 g/dL","3 g/dL","0.1 g/dL","5 g/dL"],0,"A rule of thumb: 1 unit raises Hgb by about 1 g/dL and Hct by about 3%.","B4","new"],[3,"A bleeding patient has a fibrinogen of 80 mg/dL. Which component is most appropriate?",["Cryoprecipitate","Platelets","Washed RBCs","Albumin"],0,"Cryoprecipitate is the concentrated source of fibrinogen, factor VIII, vWF and factor XIII.","B4","new"],[3,"A 40 kg patient develops hives 30 minutes into a transfusion. Temperature, blood pressure and clerical check are normal. What is the appropriate response?",["Pause, give an antihistamine, and resume if symptoms resolve","Discard the unit and transfuse another immediately","Treat as acute hemolytic reaction and send DAT","Continue with no treatment"],0,"Mild urticaria alone is a minor allergic reaction. If it resolves, the unit can usually be restarted per policy.","B5","new"],[3,"A newborn needs an exchange transfusion for HDFN caused by maternal anti-D. Which unit is most appropriate?",["Group O, D-negative, fresh, irradiated and CMV-safe","Group AB, D-positive","Any group A unit","Group O, D-positive, stored 35 days"],0,"Select RBCs compatible with both baby and maternal plasma; D-negative avoids more D exposure.","B5","new"],[3,"An ABO-mismatched stem cell transplant: recipient is group A and donor is group O. Which products are appropriate during the transition?",["Group O RBCs and group A or AB plasma","Group A RBCs and group O plasma","Group AB RBCs and group O plasma","Group A RBCs and group A plasma"],0,"Choose RBCs compatible with both recipient and donor (O) and plasma compatible with both (A or AB).","B6","new"],[3,"A blood bank refrigerator reads 7.0 °C at the 4-hour check. What should the technologist do first?",["Quarantine the units, investigate the cause and document the action","Ignore it; 7 °C is acceptable","Release all units for transfusion","Freeze the units"],0,"Storage must be 1-6 °C. Out-of-range units are quarantined until medical director review and corrective action.","B6","new"],[3,"How often must ABO and Rh typing reagents be quality controlled?",["Each day of use","Once a year","Each new patient","Once per lot only"],0,"Reagents are tested with positive and negative controls on each day of use.","B6","new"],[3,"A patient with refractory thrombocytopenia has a low 1-hour post-transfusion platelet increment and HLA antibodies. What is the best product?",["HLA-matched or crossmatch-compatible apheresis platelets","Random whole-blood-derived platelets","Cryoprecipitate","Fresh frozen plasma"],0,"HLA antibodies destroy random donor platelets. Matched or crossmatched platelets overcome this.","B6","new"],[3,"Which recipient requires irradiated cellular components?",["Hematopoietic stem cell transplant recipient","Healthy surgical patient","Patient with iron deficiency","Patient with mild ITP"],0,"Irradiation prevents donor lymphocytes from causing transfusion-associated GVHD in immunocompromised patients and in directed donations from relatives.","B6","new"],[3,"Reverse typing of a patient with multiple myeloma shows clumping in all tubes that disperses with saline replacement. What is the cause?",["Rouleaux","Cold agglutinin","Alloantibody","Bombay phenotype"],0,"Elevated proteins make cells stack. Saline replacement disperses rouleaux but not true agglutination.","B7","new"],[3,"A cord blood sample has a positive DAT but the baby shows no signs of disease. Washing the cells six times makes the DAT negative. What was the likely problem?",["Wharton’s jelly contamination","HDFN","Warm autoantibody","Anti-D"],0,"Wharton’s jelly causes false agglutination that washing removes.","B7","new"],[3,"A D-negative woman at 30 weeks has a weakly positive anti-D (titer 4). She received RhIG at 28 weeks. What is the interpretation?",["Passive anti-D from RhIG","Active immunization","Warm autoantibody","Anti-C"],0,"RhIG-derived anti-D is expected and does not indicate sensitization if given appropriately.","B7","new"],[3,"A group A patient was transfused with group O RBCs. Forward typing now shows mixed-field agglutination with anti-A. Why?",["Two populations of cells: patient’s group A and transfused group O","Cold agglutinin","Bombay phenotype","Reagent error"],0,"Mixed-field agglutination is consistent with a recent transfusion of ABO-different cells, or chimerism.","B7","new"],[3,"A cold agglutinin interferes with antibody screening at room temperature. Which technique avoids the problem?",["Prewarmed technique","Adding more anti-IgG","Enzyme treatment","Using fresh saline at 4 °C"],0,"Pre-warming serum and cells to 37 °C before mixing prevents cold-reactive antibodies from binding.","B7","new"],[4,"Flow cytometry shows CD4+ cells 300/µL and CD8+ cells 700/µL. What is the CD4:CD8 ratio, and what does it suggest?",["0.43; inverted ratio typical of HIV infection","2.3; normal","1.0; mild immunodeficiency only","3.0; autoimmune disease"],0,"300 ÷ 700 = 0.43. A normal ratio is about 2. An inverted ratio is characteristic of HIV, though other viral infections can also invert it.","I1","new"],[4,"Cytotoxic CD8+ T cells recognize antigen presented by which molecule?",["MHC class I","MHC class II","Immunoglobulin","Complement C3b"],0,"CD8 binds MHC class I (all nucleated cells). CD4 binds MHC class II on antigen-presenting cells.","I1","new"],[4,"A healthy 4-month-old has a low serum IgG. What is the best explanation?",["Maternal IgG has declined before the infant makes enough of its own","Agammaglobulinemia","Hyper-IgM syndrome","Laboratory error only"],0,"The physiologic IgG nadir occurs at 3-6 months, once maternal antibody has been catabolized.","I1","new"],[4,"Which cytokine is the main stimulus for hepatic production of C-reactive protein?",["IL-6","IL-2","IFN-gamma","IL-4"],0,"IL-6 (with IL-1 and TNF-alpha) drives acute-phase protein synthesis in the liver.","I1","new"],[4,"A child has glomerulonephritis two weeks after strep throat. Anti-streptolysin O is high, C3 is low and C4 is normal. Which pathway is mainly activated?",["Alternative pathway","Classical pathway","Lectin pathway only","None"],0,"Low C3 with normal C4 points to alternative pathway activation. Low C3 and C4 together indicate classical pathway (immune complex disease such as SLE).","I2","new"],[4,"A newborn has tetany from hypocalcemia, a congenital heart defect, and very few T cells. Which condition is suspected?",["DiGeorge syndrome","Bruton agammaglobulinemia","Chronic granulomatous disease","C1 inhibitor deficiency"],0,"Thymic and parathyroid hypoplasia produce T-cell deficiency and low calcium.","I2","new"],[4,"A patient on hydralazine develops joint pain and a positive ANA. Which antibody is most characteristic?",["Anti-histone","Anti-dsDNA","Anti-centromere","Anti-Scl-70"],0,"Anti-histone antibodies are typical of drug-induced lupus. Anti-dsDNA and anti-Sm are specific for SLE.","I3","new"],[4,"SPEP shows an IgG kappa M-protein of 1.5 g/dL. Bone marrow has 4% plasma cells. There is no anemia, hypercalcemia, renal failure or bone lesions. What is the diagnosis?",["MGUS","Multiple myeloma","Waldenström macroglobulinemia","Amyloidosis"],0,"MGUS: M-protein under 3 g/dL, plasma cells under 10%, no end-organ damage.","I3","new"],[4,"Hepatitis B serology: HBsAg negative, anti-HBs positive, anti-HBc total positive, anti-HBc IgM negative. What is the interpretation?",["Recovered from past infection","Acute infection","Vaccinated only","Chronic infection"],0,"Anti-HBc appears only after natural infection. Vaccination gives anti-HBs alone.","I4","new"],[4,"Hepatitis B serology: HBsAg negative, anti-HBs negative, anti-HBc IgM positive. What is the interpretation?",["Window period of acute infection","Immune after vaccination","Chronic carrier","No infection"],0,"HBsAg has cleared but anti-HBs has not yet appeared; anti-HBc IgM fills the gap.","I4","new"],[4,"In a competitive immunoassay, a higher analyte concentration in the patient sample produces:",["A lower signal","A higher signal","No change","An unreadable result"],0,"Patient analyte competes with labeled analyte for limited antibody sites, so the signal falls as analyte rises. In sandwich assays, signal rises with analyte.","I5","new"],[4,"A serial two-fold dilution of serum is tested. The last tube showing agglutination is 1:64. What is the titer?",["64","32","128","6.4"],0,"Titer is the reciprocal of the highest dilution with a positive reaction. A fourfold rise between paired sera is significant.","I5","new"],[4,"Which HLA locus is most important to match for kidney transplant survival?",["HLA-DR","HLA-A","HLA-C","HLA-E"],0,"The order of importance is generally DR, then B, then A.","I5","new"],[4,"In flow cytometry, which parameter reflects cell granularity or internal complexity?",["Side scatter","Forward scatter","Fluorescence compensation","Sheath pressure"],0,"Forward scatter correlates with size; side scatter with granularity. Granulocytes show high side scatter.","I5","new"],[4,"A latex cryptococcal antigen test on CSF is negative in a patient with a strongly suspected cryptococcal meningitis and a heavy yeast burden on India ink. What should be done?",["Dilute the CSF and repeat to exclude a prozone effect","Report as negative","Add more latex","Heat the CSF to 100 °C"],0,"Extremely high antigen levels can cause a false-negative (prozone) reaction; dilution corrects it.","I6","new"],[4,"A 3-year-old child with suspected infectious mononucleosis has a negative heterophile test. What is the best next step?",["EBV-specific serology (VCA IgM)","Repeat the heterophile test in 1 day","Report as ruled out","Culture throat only"],0,"Heterophile antibodies are often absent in children under 5 years. EBV-specific antibodies are more sensitive.","I6","new"],[4,"Which statement about rheumatoid factor is correct?",["It is not specific for rheumatoid arthritis; anti-CCP is more specific","It is specific and diagnostic alone","It is always IgE","It disappears in all treated patients"],0,"RF is also positive in other autoimmune diseases, chronic infections and healthy elderly people.","I6","new"],[4,"Which statement about the ANA test is true?",["A negative ANA makes SLE unlikely, but a positive ANA is not specific","A positive ANA confirms lupus","ANA is never positive in healthy people","ANA titer alone predicts disease severity"],0,"ANA is a sensitive screen (positive in nearly all SLE) but is also positive in about 5% of healthy people.","I6","new"],[4,"A 4th-generation HIV Ag/Ab screen is reactive. The differentiation assay is negative, and HIV-1 RNA NAT is positive. What is the interpretation?",["Acute HIV-1 infection","False-positive screen","HIV-2 infection","Past infection cleared"],0,"Antigen and RNA appear before antibodies. A discordant result with positive NAT indicates acute infection.","I6","new"],[5,"A urine specimen stands at room temperature for 3 hours before testing. Which change is expected?",["Increased pH","Increased glucose","Increased ketones","Increased bilirubin"],0,"Bacteria split urea into ammonia, raising pH. Glucose, ketones and bilirubin decrease; casts and cells disintegrate.","U1","new"],[5,"A urine specimen has pH 9.0, SG 1.015 and a trace of protein on the dipstick. What is the likely explanation?",["Alkaline urine can cause a false-positive protein result","True nephrotic syndrome","Bence Jones protein","Hemoglobinuria"],0,"Protein-error-of-indicators: alkaline urine gives false positives on the protein pad. Confirm with sulfosalicylic acid.","U1","new"],[5,"A urine sediment shows WBC casts and bacteria. Where is the infection most likely located?",["Kidney (pyelonephritis)","Bladder only","Urethra only","Vagina"],0,"WBC casts form in the renal tubules, so they indicate upper tract inflammation or infection.","U2","new"],[5,"Refrigerated urine develops a pink amorphous sediment that dissolves when warmed. What is it?",["Amorphous urates","Amorphous phosphates","Triple phosphate","Calcium oxalate"],0,"Amorphous urates appear in acid urine, are pink from uroerythrin, and dissolve with heat. Amorphous phosphates are white and dissolve in dilute acetic acid.","U2","new"],[5,"A child has proteinuria of 5 g/day, oval fat bodies, fatty casts, low serum albumin and edema. What is the most likely condition?",["Nephrotic syndrome","Acute glomerulonephritis","Pyelonephritis","Cystitis"],0,"Heavy proteinuria with lipiduria and hypoalbuminemia defines nephrotic syndrome. Minimal change disease is common in children.","U3","new"],[5,"A patient has hematuria, dysmorphic RBCs, RBC casts, hypertension and oliguria. What is the most likely diagnosis?",["Glomerulonephritis (nephritic syndrome)","Nephrotic syndrome","Cystitis","Renal calculi only"],0,"RBC casts are the hallmark of glomerular bleeding. Dysmorphic RBCs also indicate a glomerular source.","U3","new"],[5,"A hospitalized patient after hypotension has renal tubular epithelial cells and 'muddy brown' granular casts. What is the most likely diagnosis?",["Acute tubular necrosis","Acute pyelonephritis","Nephrotic syndrome","Cystitis"],0,"Ischemic tubular injury sheds tubular cells and produces coarse granular casts.","U3","new"],[5,"Fever, flank pain, WBC casts and bacteria in the urine suggest:",["Acute pyelonephritis","Acute glomerulonephritis","Nephrotic syndrome","Urethritis"],0,"WBC casts localize inflammation to the kidney.","U3","new"],[5,"Which urine pattern suggests prerenal azotemia rather than acute tubular necrosis?",["Urine osmolality over 500 mOsm/kg and urine sodium under 20 mmol/L","Urine osmolality near 300 mOsm/kg and urine sodium over 40","Many granular casts","Many renal tubular cells"],0,"In prerenal states the kidney still concentrates and retains sodium. ATN impairs both.","U3","new"],[5,"A patient’s urine specific gravity is fixed at 1.010 on repeated samples, with broad and waxy casts. What is suggested?",["Advanced chronic kidney disease","Diabetes insipidus","Dehydration","Normal"],0,"Isosthenuria (1.010) means the kidney can neither concentrate nor dilute. Waxy and broad casts indicate stasis in dilated, damaged tubules.","U3","new"],[5,"An undiluted CSF sample shows 45 cells in all 9 large squares of a Neubauer chamber (each 1 mm², depth 0.1 mm). What is the count?",["50 cells/µL","5 cells/µL","450 cells/µL","0.5 cells/µL"],0,"Count = cells ÷ volume counted. Volume = 9 × 0.1 µL = 0.9 µL. 45 ÷ 0.9 = 50 cells/µL.","U4","new"],[5,"Ascitic fluid albumin is 1.5 g/dL and serum albumin is 3.5 g/dL. What is the SAAG and its meaning?",["2.0 g/dL; portal hypertension such as cirrhosis","2.0 g/dL; malignancy","5.0 g/dL; infection","1.0 g/dL; normal"],0,"SAAG = serum − ascitic albumin = 2.0. A gradient of at least 1.1 g/dL indicates portal hypertension.","U4","new"],[5,"A patient with a urinary tract infection has a negative nitrite on dipstick. Which is a possible explanation?",["The organism does not reduce nitrate, such as Enterococcus","Urine was too concentrated","The test is always positive in UTI","Excess nitrite in diet"],0,"Nitrite requires gram-negative nitrate reducers and at least 4 hours in the bladder. Gram-positive cocci, Pseudomonas and low-nitrate diet give negatives.","U5","new"],[5,"The urine dipstick protein is negative, but the sulfosalicylic acid test is strongly positive. Which protein might be present?",["Bence Jones protein","Albumin","Hemoglobin","Myoglobin"],0,"The dipstick detects mainly albumin. SSA precipitates all proteins, including light chains.","U5","new"],[5,"A patient takes 2 g/day of vitamin C. Which result may be falsely negative?",["Glucose and blood on the dipstick","Specific gravity","Urine pH","Protein"],0,"Ascorbic acid is a reducing agent that interferes with peroxidase-based glucose, blood, bilirubin and nitrite pads.","U5","new"],[5,"An infant has a positive Clinitest but a negative glucose oxidase strip. Which condition should be suspected?",["Galactosemia","Diabetes mellitus","Phenylketonuria","Cystinuria"],0,"Clinitest detects any reducing sugar, including galactose. Glucose oxidase is specific for glucose.","U5","new"],[5,"In urine sediment, round bodies with budding are seen that do not dissolve with dilute acetic acid. What are they?",["Yeast","RBCs","WBCs","Oil droplets"],0,"RBCs lyse with acetic acid. Yeast are resistant and show budding.","U5","new"],[6,"A QC mean is 100 mg/dL and SD is 5. Today’s control is 112. How many SD from the mean is this, and what Westgard rule applies?",["+2.4 SD; 1-2s warning","+3.4 SD; 1-3s rejection","+1.2 SD; in control","+4.0 SD; R-4s"],0,"(112 − 100) ÷ 5 = 2.4 SD. Exceeding 2 SD triggers the 1-2s warning rule; apply other rules before accepting the run.","L1","new"],[6,"A control has mean 100 and SD 5. What is the coefficient of variation?",["5%","0.5%","20%","50%"],0,"CV = SD ÷ mean × 100 = 5%.","L1","new"],[6,"A test gives TP 90, FN 10, TN 80 and FP 20. What is the specificity?",["80%","90%","89%","75%"],0,"Specificity = TN ÷ (TN + FP) = 80 ÷ 100 = 80%. Sensitivity = 90 ÷ 100 = 90%.","L1","new"],[6,"Two consecutive control values are both 2.2 SD above the mean. Which rule is violated, and what error is suggested?",["2-2s; systematic error","1-3s; random error","R-4s; random error","10x; random error"],0,"Two consecutive results beyond 2 SD on the same side = 2-2s, indicating systematic error such as calibration drift.","L1","new"],[6,"A technologist is stuck with a needle contaminated with patient blood. What is the first step?",["Wash the site with soap and water, then report and seek evaluation","Squeeze the site and continue working","Bleach the wound","Wait until the end of shift"],0,"Wash promptly, report immediately, and begin post-exposure follow-up.","L2","new"],[6,"Which document provides hazard and first-aid information for a specific chemical?",["Safety Data Sheet (SDS)","Procedure manual","Quality plan","Package insert"],0,"Every hazardous chemical must have an SDS available to employees.","L2","new"],[6,"Culturing Mycobacterium tuberculosis for identification requires which biosafety level?",["BSL-3","BSL-1","BSL-2 on an open bench","No special containment"],0,"Handling of cultures that can aerosolize M. tuberculosis requires BSL-3 practices, including a biosafety cabinet.","L2","new"],[6,"0.5 mL of serum is added to 4.5 mL of saline. What is the dilution?",["1:10","1:9","1:5","1:4.5"],0,"Total volume 5.0 mL. Dilution = 0.5 ÷ 5.0 = 1:10.","L3","new"],[6,"How many grams of NaCl are needed to prepare 250 mL of a 10% (w/v) solution?",["25 g","2.5 g","10 g","250 g"],0,"10% w/v = 10 g per 100 mL. For 250 mL: 25 g.","L3","new"],[6,"According to the CLSI order of draw, which tube follows the light blue (citrate) tube?",["Red or gold serum tube","Lavender EDTA","Gray","Green heparin"],0,"Order: blood cultures, light blue, red/gold, green, lavender, gray.","L3","new"],[6,"A 1:2 serial dilution is carried through 5 tubes starting with the original serum in tube 1 at 1:2. What is the dilution in tube 5?",["1:32","1:10","1:16","1:64"],0,"Each tube halves the concentration: 1:2, 1:4, 1:8, 1:16, 1:32.","L3","new"],[6,"Which filter is used to check wavelength accuracy of a spectrophotometer?",["Holmium oxide","Neutral density","Interference","Cuvette"],0,"Holmium oxide and didymium filters have sharp known absorption peaks used for wavelength calibration.","L4","new"],[6,"A PCR no-template control shows amplification. What is the most likely cause?",["Amplicon or reagent contamination","True positive patient","Low annealing temperature","Too much polymerase"],0,"Contamination invalidates the run. Use separate pre- and post-PCR work areas, filter tips and UNG.","L4","new"],[6,"Which blotting technique detects RNA?",["Northern blot","Southern blot","Western blot","Eastern blot"],0,"Southern detects DNA, Northern detects RNA, Western detects proteins.","L4","new"],[6,"What is the primary purpose of an incident (occurrence) report?",["To identify system problems and improve quality, not to assign blame","To discipline staff","To replace QC","To satisfy billing"],0,"Reports document errors and near-misses for corrective and preventive action.","L5","new"],[6,"Which education domain describes a student learning the skill of performing a venipuncture?",["Psychomotor","Cognitive","Affective","Ethical"],0,"Cognitive = knowledge, affective = attitudes and values, psychomotor = physical skills.","L5","new"],[6,"Which principle of HIPAA applies when a clinician asks for patient results?",["Disclose only the minimum necessary protected health information to authorized persons","Share with anyone in the hospital","Post results publicly","Release results by telephone to anyone who asks"],0,"Access to PHI is limited to people involved in care or otherwise authorized.","L5","new"],[6,"Per-test costs are reagents $1.50, labor $0.75 and overhead $0.25. What is the cost per test?",["$2.50","$1.50","$2.25","$3.00"],0,"Add all direct and indirect costs: 1.50 + 0.75 + 0.25 = $2.50.","L5","new"],[6,"A new reagent lot gives QC out of range. What is the correct action?",["Do not report patient results; troubleshoot, recalibrate and repeat QC","Report patient results and fix later","Change the control mean to match","Discard the control and continue"],0,"Patient results cannot be released until QC is acceptable. Document the corrective action.","L6","new"],[6,"A delta check flags a patient’s hemoglobin that dropped from 14 g/dL yesterday to 6 g/dL today with no clinical explanation. What is the best action?",["Check identification and specimen integrity, repeat if needed, then notify","Report immediately without review","Delete the result","Average it with yesterday’s result"],0,"A large unexplained change suggests a mislabeled or contaminated specimen (for example drawn above an IV).","L6","new"],[6,"Which pair of identifiers is acceptable for patient identification?",["Full name and date of birth","Room number and bed","Diagnosis and physician","Name only"],0,"Use two independent identifiers, never location alone.","L6","new"],[6,"Control 1 and control 2 on the same run are both +2.1 SD from the mean. Which rule is violated?",["2-2s across levels, indicating systematic error","1-3s","R-4s","4-1s"],0,"Two controls beyond 2 SD on the same side, within a run or across runs, trigger 2-2s.","L6","new"],[6,"A reagent expired yesterday, but QC is in range. What should you do?",["Discard it and use an in-date reagent","Use it; QC passed","Use it with double controls","Use it only for STAT tests"],0,"Expired reagents must not be used for patient testing even if QC is acceptable.","L6","new"]];
const PLAN="<h1 id=\"ascpi-mls-study-plan-12-weeks\">ASCPi MLS Study Plan (12 Weeks)<\/h1>\n<p>Built from your friend’s “ASCPI EXAM” Drive folder (24 files). Assumes about 15 study hours a week and a 12-week runway. Stretch or compress the content weeks to fit your real exam date.<\/p>\n<h2 id=\"what-the-exam-looks-like\">1. What the exam looks like<\/h2>\n<p>The folder’s own content guideline and ASCP’s published outline say the MLS(ASCPi) exam is 100 multiple-choice questions in 2 hours 30 minutes, computer adaptive. There is no fixed number you must get right: you pass by scoring above the pass point (scaled score of 400 on a 100 to 999 scale). Question weights by area:<\/p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Content area<\/th>\n<th>Share of exam<\/th>\n<th>Priority<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Blood Banking<\/td>\n<td>17-22%<\/td>\n<td>High<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Chemistry<\/td>\n<td>17-22%<\/td>\n<td>High<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Hematology (incl. hemostasis)<\/td>\n<td>17-22%<\/td>\n<td>High<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Microbiology<\/td>\n<td>17-22%<\/td>\n<td>High<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Urinalysis and Body Fluids<\/td>\n<td>5-10%<\/td>\n<td>Medium<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Immunology<\/td>\n<td>5-10%<\/td>\n<td>Medium<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Laboratory Operations<\/td>\n<td>5-10%<\/td>\n<td>Medium<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The four big areas are about 70% of the exam, so they get about 70% of your time. Check mls_content_guideline.pdf in the folder against ASCP’s current website, because the files are dated 2022 to 2023.<\/p>\n<h2 id=\"what-is-in-the-folder-and-how-to-use-it\">2. What is in the folder, and how to use it<\/h2>\n<p><strong>Core review books (use all through the plan)<\/strong><\/p>\n<ul>\n<li>Clinical Laboratory Science Review: A Bottom Line Approach (Jarreau), 5th ed. Your main spine. The folder has it twice (“bottom line approach ASCP.pdf” is the same 74.8 MB size), so you only need one.<\/li>\n<li>Board of Certification Study Guide, Enhanced 6th ed. (ASCP BOC). Closest to the real exam style. Use it for questions.<\/li>\n<li>Medical Laboratory Science Review (Harr). Second-opinion summaries and questions.<\/li>\n<li>Success in Clinical Laboratory Science Complete Review (Ciulla and Lehman). Large question bank for practice.<\/li>\n<li>Quick Review Cards for MLS (Polansky). Flash-style revision, mostly for the last 3 weeks.<\/li>\n<\/ul>\n<p><strong>Subject textbooks (look things up, do not read cover to cover)<\/strong><\/p>\n<ul>\n<li>Hematology: Rodak’s Hematology; Blood Cells: A Practical Guide.<\/li>\n<li>Microbiology: Textbook of Diagnostic Microbiology (Mahon and Lehman); WHO Basic Malaria Microscopy.<\/li>\n<li>Blood Bank: Modern Blood Banking and Transfusion Practices (Harmening).<\/li>\n<li>Immunology: Clinical Immunology and Serology (Stevens and Miller).<\/li>\n<li>Urinalysis and Body Fluids: Strasinger (two copies; the “Strasinger and Di Lorenzo” file is likely the newer edition).<\/li>\n<\/ul>\n<p><strong>Exam and eligibility documents (read in Week 1 only)<\/strong><\/p>\n<p>mls_content_guideline, mls_imls_reading_list, ascp-international-procedures-book, imls_1_3_training_doc_form, the eligibility comparison and certification comparison charts, foreign-evaluation-agencies, regionally-accredited-college-university, ascp-boc-covid-19-information, BOC-Newsletter-August.<\/p>\n<p><strong>Gaps to know about<\/strong><\/p>\n<ul>\n<li>There is no dedicated Chemistry textbook. Cover Chemistry with the Bottom Line, BOC Study Guide, Harr and Ciulla.<\/li>\n<li>There is no Laboratory Operations text. Use the review books’ chapters on safety, QC, management and lab information systems.<\/li>\n<li>Several documents are from 2022. Confirm eligibility rules and fees on ASCP’s site before you apply.<\/li>\n<\/ul>\n<h2 id=\"weekly-rhythm-about-15-hours\">3. Weekly rhythm (about 15 hours)<\/h2>\n<ul>\n<li>3 sessions of 2 hours: learn the topic (Bottom Line first, textbook only when something is unclear).<\/li>\n<li>2 sessions of 1.5 hours: practice questions on that topic (BOC Study Guide, Ciulla, Harr).<\/li>\n<li>1 session of 2 hours: mixed review of earlier weeks.<\/li>\n<li>1 session of 1 hour: error log. For every missed question write the rule or fact in one line, then re-read the log every weekend.<\/li>\n<li>1 day fully off.<\/li>\n<\/ul>\n<h2 id=\"week-by-week-plan\">4. Week-by-week plan<\/h2>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Week<\/th>\n<th>Focus<\/th>\n<th>Main resources<\/th>\n<th>Weekly goal<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1<\/td>\n<td>Orientation and baseline<\/td>\n<td>Content guideline, reading list, eligibility and procedures documents; 50-question mixed baseline from Ciulla or BOC guide<\/td>\n<td>Application and eligibility sorted; know your weakest areas<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>2<\/td>\n<td>Hematology I: RBC disorders, anemias, indices, hemoglobinopathies, morphology<\/td>\n<td>Bottom Line, Rodak, Blood Cells guide<\/td>\n<td>Recognise cells and calculate indices without notes<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>3<\/td>\n<td>Hematology II: WBC disorders, leukemias, hemostasis and coagulation, malaria<\/td>\n<td>Bottom Line, Rodak, WHO Malaria microscopy<\/td>\n<td>Coagulation cascade and PT/aPTT patterns from memory<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>4<\/td>\n<td>Chemistry I: carbohydrates, proteins, enzymes, lipids, instrumentation<\/td>\n<td>Bottom Line, BOC guide, Harr<\/td>\n<td>Interpret common panels; know methods and interferences<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>5<\/td>\n<td>Chemistry II: electrolytes, acid-base, endocrine, toxicology, TDM, QC calculations<\/td>\n<td>Bottom Line, BOC guide, Ciulla<\/td>\n<td>Solve acid-base and QC (Westgard) problems<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>6<\/td>\n<td>Microbiology I: Gram-positives, Gram-negatives, culture media, biochemical ID<\/td>\n<td>Bottom Line, Mahon<\/td>\n<td>Name organism from a short ID set-up<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>7<\/td>\n<td>Microbiology II: anaerobes, mycobacteria, fungi, parasites, virology, antimicrobial susceptibility<\/td>\n<td>Bottom Line, Mahon, WHO Malaria<\/td>\n<td>Know classic organism and disease pairings<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>8<\/td>\n<td>Blood Bank I: ABO and Rh, antibody screen and ID, crossmatch<\/td>\n<td>Bottom Line, Harmening<\/td>\n<td>Work antibody panels step by step<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>9<\/td>\n<td>Blood Bank II: components, HDFN, transfusion reactions, donor requirements; then Immunology<\/td>\n<td>Harmening, Bottom Line, Stevens<\/td>\n<td>Know reaction work-ups; basic immunology and serology tests<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>10<\/td>\n<td>Urinalysis and Body Fluids, then Laboratory Operations (safety, QC, regulations, LIS, education)<\/td>\n<td>Strasinger, Bottom Line, Harr<\/td>\n<td>Identify crystals and casts; handle QC and safety questions<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>11<\/td>\n<td>Mixed practice under exam conditions: two full 100-question sets in 150 minutes, adaptive-style (no going back)<\/td>\n<td>BOC guide, Ciulla, Harr<\/td>\n<td>Review every miss; re-study the two weakest areas<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>12<\/td>\n<td>Final review and taper<\/td>\n<td>Quick Review Cards, error log, weakest-topic chapters<\/td>\n<td>Light study; sleep; confirm test centre, ID and appointment<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2 id=\"rules-that-make-the-plan-work\">5. Rules that make the plan work<\/h2>\n<ul>\n<li>Questions beat re-reading. Start questions in Week 2 and do not wait until you have “finished” a book.<\/li>\n<li>Do not chase a raw percentage target. The exam is adaptive, so use your trend across mixed practice sets instead.<\/li>\n<li>If a subject scores below your average two weeks running, borrow 3 hours from a stronger area.<\/li>\n<li>Keep the small areas (Urinalysis, Immunology, Lab Ops) in the weekly mixed review so they never go cold.<\/li>\n<li>In the final week, do not start new books.<\/li>\n<\/ul>\n<h2 id=\"to-tailor-this-plan\">6. To tailor this plan<\/h2>\n<p>Send me your exam date, how many hours you can really study each week, and any area you already know well. I will rebuild the table to match.<\/p>\n<h2 id=\"sources\">Sources<\/h2>\n<ul>\n<li>ASCP BOC MLS content guideline (mls_content_guideline.pdf, from your folder and ASCP’s website): https://www.ascp.org/content/docs/default-source/boc-pdfs/boc-us-guidelines/mls_content_guideline.pdf?sfvrsn=12<\/li>\n<li>Content percentages cross-checked with: https://open-exam-prep.com/study-guides/ascp-mls/practice-strategy-and-remediation/content-percentage-allocation<\/li>\n<\/ul>\n";
const $=(s,r=document)=>r.querySelector(s);
const SECS=SECTIONS.map(t=>t.replace(/ \(.*\)/,'').replace(/^\d+\. /,''));
const WEIGHT=SECTIONS.map(t=>(t.match(/\((.*)\)/)||[,''])[1]);
let S={read:{},stats:{},missed:{},seen:{},hist:[],mocks:[],last:null};
try{const x=localStorage.getItem('ascpi-app2');if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem('ascpi-app2',JSON.stringify(S))}catch(e){}};
const qid=q=>q[1].slice(0,60);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const main=$('#main');
const lessonById=id=>LESSONS.find(l=>l.id==id);
const lessonQs=id=>Q.filter(q=>q[5]==id);
let cleanup=null;
function go(t,arg){if(cleanup){cleanup();cleanup=null}
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t||(t=='lesson'&&b.dataset.t=='path')));
 try{history.replaceState(null,'','#'+(t=='lesson'?'path':t))}catch(e){}
 window.scrollTo(0,0);({path,lesson:()=>openLesson(arg),quiz:()=>setup('quiz'),cards:()=>setup('cards'),mock:mockSetup,progress,plan})[t]()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
const lessonPct=id=>{const s=S.stats[id];return s&&s.a?Math.round(s.c/s.a*100):null};
const secPct=si=>{let a=0,c=0;LESSONS.filter(l=>l.sec==si).forEach(l=>{const s=S.stats[l.id];if(s){a+=s.a;c+=s.c}});return a?Math.round(c/a*100):null};
function record(q,right){const st=S.stats[q[5]]||(S.stats[q[5]]={a:0,c:0});st.a++;S.seen[qid(q)]=1;if(right){st.c++;delete S.missed[qid(q)]}else S.missed[qid(q)]=1}

/* ---------- LESSON PATH ---------- */
const idx=[];
LESSONS.forEach(l=>{const d=document.createElement('div');d.innerHTML=l.html;let h3='';[...d.children].forEach((el,bi)=>{if(el.tagName=='H3')h3=el.textContent;const t=el.textContent.trim();if(t)idx.push({id:l.id,bi,h3,t})})});
function path(){
 const next=LESSONS.find(l=>!S.read[l.id]);const rd=LESSONS.filter(l=>S.read[l.id]).length;
 let h=`<div class="card hero"><div class="meta"><span>${rd} of ${LESSONS.length} lessons read</span><span>${Math.round(rd/LESSONS.length*100)}%</span></div><div class="bar"><i style="width:${rd/LESSONS.length*100}%"></i></div>`;
 h+=next?`<h2>Next up: ${esc(next.title)}</h2><p class="sub" style="margin:0 0 10px">${esc(SECS[next.sec])} · about ${next.min} min</p><button class="b pri" id="nx">Start lesson</button>`:`<h2>All lessons read</h2><p class="sub">Take a mock exam, then drill your weakest lessons on the Progress tab.</p><button class="b pri" id="nx">Mock exam</button>`;
 h+=`</div><div class="card"><strong>How to study</strong><ol style="margin:6px 0 0;padding-left:20px"><li>Go in order. Each section starts with a "Start here" lesson, then builds, then ends with exam traps.</li><li>After each lesson, do its short check. Aim for 70% or more before moving on.</li><li>Once a week, take a timed mock exam. Then drill the lessons you missed.</li></ol></div>
 <div class="card"><input type="search" id="qs" placeholder="Search all lessons (e.g. Auer, optochin, Bombay)"><div id="sres"></div></div>`;
 SECTIONS.forEach((s,si)=>{const ls=LESSONS.filter(l=>l.sec==si),r=ls.filter(l=>S.read[l.id]).length;
  h+=`<div class="card"><div class="meta" style="margin:0"><strong style="color:var(--ink);font-size:17px">${si+1}. ${esc(SECS[si])}</strong><span>exam weight ${esc(WEIGHT[si])} · ${r}/${ls.length}</span></div>`;
  ls.forEach(l=>{const p=lessonPct(l.id);h+=`<div class="les" data-id="${l.id}"><span class="n">${LESSONS.indexOf(l)+1}</span><span class="st">${S.read[l.id]?'<span class="done">✓</span>':'○'}</span><span class="t">${esc(l.title)}<br><small class="sub">${l.min} min · ${lessonQs(l.id).length} questions</small></span>${p==null?'':`<span class="pill ${p<70?'lo':''}">${p}%</span>`}</div>`});
  h+='</div>'});
 main.innerHTML=h;
 $('#nx').onclick=()=>next?go('lesson',next.id):go('mock');
 main.querySelectorAll('.les').forEach(e=>e.onclick=()=>go('lesson',e.dataset.id));
 $('#qs').oninput=e=>search(e.target.value)}
function search(v){const r=$('#sres');v=v.trim().toLowerCase();if(v.length<2){r.innerHTML='';return}
 const hits=idx.filter(x=>x.t.toLowerCase().includes(v)).slice(0,25);
 r.innerHTML=hits.length?hits.map((h,k)=>{const p=h.t.toLowerCase().indexOf(v);const s=h.t.slice(Math.max(0,p-50),p+90);return `<div class="sr" data-k="${k}"><small>${esc(lessonById(h.id).title)}${h.h3?' › '+esc(h.h3):''}</small><div>…${esc(s).replace(new RegExp(v.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>'<mark>'+m+'</mark>')}…</div></div>`}).join(''):'<p class="sub">No match.</p>';
 r.querySelectorAll('.sr').forEach(e=>e.onclick=()=>{const h=hits[+e.dataset.k];go('lesson',h.id);const el=$('#body').children[h.bi];if(el){el.scrollIntoView({block:'center'});el.classList.add('flash')}})}
function openLesson(id){const i=LESSONS.findIndex(l=>l.id==id),l=LESSONS[i];S.last=id;save();
 main.innerHTML=`<p class="sub" style="margin:0 0 6px"><a href="#" id="bk" style="color:var(--acc)">← All lessons</a> · ${esc(SECS[l.sec])} · lesson ${i+1} of ${LESSONS.length}</p>
 <div class="card notes"><h2 style="font-size:23px">${esc(l.title)}</h2><p class="sub" style="margin:0">About ${l.min} min · ${lessonQs(id).length} check questions</p><div class="toc" id="toc"></div><div id="body">${l.html}</div></div>
 <div class="card"><strong>Check yourself</strong><p class="sub" style="margin:4px 0 10px">${lessonQs(id).length} questions on this lesson. Answer without looking back.</p><div class="row"><button class="b pri" id="ck">Start check</button><button class="b" id="mr">${S.read[id]?'Marked as read ✓ (tap to undo)':'Mark as read'}</button></div></div>
 <div class="row">${i>0?'<button class="b" id="pv">← Previous lesson</button>':''}${i<LESSONS.length-1?'<button class="b" id="nl">Next lesson →</button>':''}</div>`;
 $('#body').querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='tw';t.replaceWith(w);w.appendChild(t)});
 [...$('#body').children].forEach(k=>{if(k.tagName=='H3'){const a=document.createElement('a');a.href='#';a.textContent=k.textContent.replace(/\s*\(.*$/,'').slice(0,34);a.onclick=e=>{e.preventDefault();k.scrollIntoView({behavior:'smooth',block:'start'})};$('#toc').appendChild(a)}});
 $('#bk').onclick=e=>{e.preventDefault();go('path')};
 $('#mr').onclick=()=>{S.read[id]=!S.read[id];save();openLesson(id)};
 $('#ck').onclick=()=>runQuiz(shuffle(lessonQs(id)),{lesson:id});
 if($('#pv'))$('#pv').onclick=()=>go('lesson',LESSONS[i-1].id);if($('#nl'))$('#nl').onclick=()=>go('lesson',LESSONS[i+1].id)}

/* ---------- SETUP (quiz / cards) ---------- */
let qsel=new Set(SECTIONS.map((_,i)=>i)),qlesson='';
function pool(focus,caseOnly){let p=Q.filter(q=>qlesson?q[5]==qlesson:qsel.has(q[0]));if(focus=='missed')p=p.filter(q=>S.missed[qid(q)]);if(focus=='unseen')p=p.filter(q=>!S.seen[qid(q)]);if(caseOnly)p=p.filter(q=>q[6]=='new');return p}
function setup(mode){
 main.innerHTML=`<h1>${mode=='quiz'?'Practice quiz':'Flashcards'}</h1><p class="sub">${Q.length} questions. Choose sections, or one lesson.</p><div class="card"><strong>Sections</strong><div class="chips" id="cw"></div>
 <div class="row"><button class="b" id="all">Select all</button><button class="b" id="none">Clear</button></div>
 <div class="row"><label>One lesson <select id="ls"><option value="">All lessons in chosen sections</option>${LESSONS.map(l=>`<option value="${l.id}">${esc(l.title)}</option>`).join('')}</select></label></div>
 <div class="row"><label>Count <select id="n"><option>10</option><option selected>20</option><option>40</option><option value="9999">All</option></select></label>
 <label>Focus <select id="fo"><option value="all">All</option><option value="unseen">Not seen yet</option><option value="missed">Missed before</option></select></label>
 <label class="tg"><input type="checkbox" id="co"> Case-style only</label></div>
 <p class="sub" id="av"></p><div class="row"><button class="b pri" id="go">Start</button></div></div>`;
 $('#ls').value=qlesson;
 const draw=()=>{$('#cw').innerHTML='';SECTIONS.forEach((s,i)=>{const e=document.createElement('div');e.className='chip'+(qsel.has(i)&&!qlesson?' on':'');e.textContent=SECS[i];e.onclick=()=>{qlesson='';$('#ls').value='';qsel.has(i)?qsel.delete(i):qsel.add(i);draw()};$('#cw').appendChild(e)});$('#av').textContent=pool($('#fo').value,$('#co').checked).length+' questions available'};
 $('#all').onclick=()=>{qlesson='';$('#ls').value='';qsel=new Set(SECTIONS.map((_,i)=>i));draw()};$('#none').onclick=()=>{qlesson='';$('#ls').value='';qsel.clear();draw()};
 $('#ls').onchange=e=>{qlesson=e.target.value;draw()};$('#fo').onchange=draw;$('#co').onchange=draw;draw();
 $('#go').onclick=()=>{const p=pool($('#fo').value,$('#co').checked);if(!p.length){$('#av').textContent='Nothing matches. Change the filters.';return}
  const set=shuffle(p).slice(0,Math.min(+$('#n').value,p.length));mode=='quiz'?runQuiz(set,{}):runCards(set)}}

/* ---------- QUIZ ---------- */
function runQuiz(set,opt){let i=0,score=0,wrong=[],done=false;
 const kh=e=>{if(e.target.tagName=='INPUT'||e.target.tagName=='SELECT')return;if(e.key>='1'&&e.key<='4'&&$('#o')&&$('#o').children[+e.key-1])$('#o').children[+e.key-1].click();if(e.key=='Enter'&&done)adv()};
 document.addEventListener('keydown',kh);cleanup=()=>document.removeEventListener('keydown',kh);
 const quit=()=>opt.lesson?go('lesson',opt.lesson):go('quiz');
 function show(){const q=set[i];const ord=shuffle(q[2].map((_,k)=>k));done=false;
  main.innerHTML=`<div class="meta"><span>${esc(opt.lesson?lessonById(opt.lesson).title:SECS[q[0]])}</span><span>${i+1} / ${set.length}</span></div><div class="bar"><i style="width:${i/set.length*100}%"></i></div><div class="card"><p class="q"></p><div id="o"></div><div id="ex"></div></div><div class="row"><button class="b" id="qt">Quit</button><button class="b pri hide" id="nx"></button></div>`;
  $('.q').textContent=q[1];
  ord.forEach((k,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=(j+1)+'. '+q[2][k];b.onclick=()=>pick(j);$('#o').appendChild(b)});
  function pick(j){if(done)return;done=true;const right=ord[j]==q[3];if(right)score++;else wrong.push(q);record(q,right);save();
   [...$('#o').children].forEach((o,m)=>{o.disabled=true;if(ord[m]==q[3])o.classList.add('ok')});if(!right)$('#o').children[j].classList.add('bad');
   $('#ex').innerHTML='<div class="expl"></div>';$('#ex').firstChild.textContent=(right?'Correct. ':'Not quite. ')+q[4];
   const nx=$('#nx');nx.classList.remove('hide');nx.textContent=i+1<set.length?'Next (Enter)':'Results (Enter)'}
  $('#nx').onclick=adv;$('#qt').onclick=quit}
 function adv(){i++;i<set.length?show():finish()}
 function finish(){S.hist.push({s:score,t:set.length,d:Date.now()});const pct=Math.round(score/set.length*100);
  if(opt.lesson&&pct>=70)S.read[opt.lesson]=true;save();
  const by={};set.forEach(q=>{by[q[0]]=by[q[0]]||[0,0];by[q[0]][0]++});wrong.forEach(q=>by[q[0]][1]++);
  const nxt=opt.lesson?LESSONS[LESSONS.findIndex(l=>l.id==opt.lesson)+1]:null;
  main.innerHTML=`<div class="card" style="text-align:center"><div class="big">${pct}%</div><div>${score} of ${set.length} correct</div>${opt.lesson?`<p class="${pct>=70?'done':'sub'}" style="margin:10px 0 0">${pct>=70?'Lesson marked as read. Good.':'Below 70%. Re-read the lesson, then try again.'}</p>`:''}</div>
  ${opt.lesson?'':`<div class="card"><strong>By section</strong><table class="p">${Object.keys(by).map(k=>`<tr><td>${esc(SECS[k])}</td><td>${by[k][0]-by[k][1]} / ${by[k][0]}</td></tr>`).join('')}</table></div>`}
  ${wrong.length?'<div class="card"><strong>Review what you missed</strong><div id="rv"></div></div>':''}
  <div class="row">${opt.lesson?`<button class="b" id="bl">Back to lesson</button>${nxt?'<button class="b pri" id="nl">Next lesson →</button>':''}`:'<button class="b pri" id="ag">New quiz</button>'}<button class="b" id="pg">Progress</button></div>`;
  wrong.forEach(q=>{const d=document.createElement('div');d.style.cssText='margin:12px 0;padding-top:10px;border-top:1px solid var(--line)';d.innerHTML='<b></b><div style="color:var(--ok);margin-top:4px"></div><div class="sub" style="font-size:14px;margin-top:4px"></div>';d.children[0].textContent=q[1];d.children[1].textContent='Answer: '+q[2][q[3]];d.children[2].textContent=q[4];$('#rv').appendChild(d)});
  if($('#bl'))$('#bl').onclick=()=>go('lesson',opt.lesson);if($('#nl'))$('#nl').onclick=()=>go('lesson',nxt.id);if($('#ag'))$('#ag').onclick=()=>go('quiz');$('#pg').onclick=()=>go('progress')}
 show()}
function runCards(set){let i=0,flip=false;
 function show(){const q=set[i];
  main.innerHTML=`<div class="meta"><span>${esc(SECS[q[0]])}</span><span>${i+1} / ${set.length}</span></div><div class="bar"><i style="width:${(i+1)/set.length*100}%"></i></div><div class="card fc" id="fc"></div><div class="row"><button class="b" id="pv">Back</button><button class="b" id="ag">Again later</button><button class="b pri" id="gt">Got it</button><button class="b" id="dn">Done</button></div><p class="sub">Tap the card to flip.</p>`;
  const f=$('#fc');const draw=()=>{f.innerHTML='<div><small></small><span></span></div>';f.querySelector('small').textContent=flip?'Answer':'Question';f.querySelector('span').textContent=flip?q[2][q[3]]+'. '+q[4]:q[1]};draw();
  f.onclick=()=>{flip=!flip;draw()};
  const nxt=()=>{flip=false;if(i+1<set.length){i++;show()}else go('cards')};
  $('#pv').onclick=()=>{if(i>0){i--;flip=false;show()}};
  $('#ag').onclick=()=>{S.missed[qid(q)]=1;save();nxt()};
  $('#gt').onclick=()=>{delete S.missed[qid(q)];S.seen[qid(q)]=1;save();nxt()};$('#dn').onclick=()=>go('cards')}
 show()}

/* ---------- MOCK EXAM ---------- */
function mockSetup(){
 const last=S.mocks.slice(-5).reverse();
 main.innerHTML=`<h1>Mock exam</h1><p class="sub">Built like the real test: one best answer, no skipping, no going back, no feedback until the end. Questions follow the exam blueprint.</p>
 <div class="card"><div class="row"><button class="b pri" id="m100">Full mock: 100 questions, 2 h 30 min</button></div><div class="row"><button class="b" id="m50">Half mock: 50 questions, 75 min</button><button class="b" id="m25">Quick mock: 25 questions, 38 min</button></div>
 <p class="note">The real ASCPi exam is adaptive and scored on a 100-999 scale with 400 as the pass mark. A percent score here is only a rough guide. Practice questions are original and unofficial. For official practice, use the ASCP BOC Study Guide and BOC Interactive Practice Exam.</p></div>
 <div class="card"><strong>Recent mocks</strong><p class="sub">${last.length?last.map(m=>m.s+'/'+m.t+' ('+Math.round(m.s/m.t*100)+'%)').join(' · '):'None yet.'}</p></div>`;
 $('#m100').onclick=()=>runMock(100,150);$('#m50').onclick=()=>runMock(50,75);$('#m25').onclick=()=>runMock(25,38)}
function runMock(n,mins){
 const share=[.19,.19,.19,.19,.08,.08,.08];let want=share.map(s=>Math.round(s*n));let d=n-want.reduce((a,b)=>a+b,0);want[0]+=d;
 let set=[];SECTIONS.forEach((_,si)=>{set=set.concat(shuffle(Q.filter(q=>q[0]==si)).slice(0,want[si]))});
 set=shuffle(set);let i=0,end=Date.now()+mins*60000,ans=[];
 const t=setInterval(tick,1000);cleanup=()=>clearInterval(t);
 function tick(){const el=$('#tm');if(!el){return}const left=Math.max(0,end-Date.now());const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);el.textContent=m+':'+String(s).padStart(2,'0');el.classList.toggle('low',left<300000);if(left<=0){clearInterval(t);finish()}}
 function show(){const q=set[i];const ord=shuffle(q[2].map((_,k)=>k));let pickd=null;
  main.innerHTML=`<div class="meta"><span>Question ${i+1} of ${set.length}</span><span class="timer" id="tm"></span></div><div class="bar"><i style="width:${i/set.length*100}%"></i></div><div class="card"><p class="q"></p><div id="o"></div></div><div class="row"><button class="b pri" id="nx" disabled>${i+1<set.length?'Next':'Finish exam'}</button></div><p class="note">You cannot go back. Choose the single best answer.</p>`;tick();
  $('.q').textContent=q[1];
  ord.forEach((k,j)=>{const b=document.createElement('button');b.className='opt';b.textContent=q[2][k];b.onclick=()=>{pickd=k;[...$('#o').children].forEach(o=>o.classList.remove('sel'));b.classList.add('sel');$('#nx').disabled=false};$('#o').appendChild(b)});
  $('#nx').onclick=()=>{ans.push(pickd);i++;i<set.length?show():finish()}}
 function finish(){clearInterval(t);cleanup=null;const done=ans.length;let score=0;const by={};const wrong=[];
  set.forEach((q,k)=>{by[q[0]]=by[q[0]]||[0,0];by[q[0]][1]++;const a=ans[k];if(a===undefined||a===null){wrong.push([q,null]);record(q,false)}else if(a==q[3]){score++;by[q[0]][0]++;record(q,true)}else{wrong.push([q,a]);record(q,false)}});
  S.mocks.push({s:score,t:set.length,d:Date.now()});save();const pct=Math.round(score/set.length*100);
  const weak=Object.entries(by).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1])[0];
  main.innerHTML=`<div class="card" style="text-align:center"><div class="big">${pct}%</div><div>${score} of ${set.length} correct${done<set.length?' ('+(set.length-done)+' unanswered)':''}</div></div>
  <div class="card"><strong>By section</strong><table class="p">${Object.keys(by).map(k=>`<tr><td>${esc(SECS[k])}</td><td>${by[k][0]} / ${by[k][1]}</td><td>${Math.round(by[k][0]/by[k][1]*100)}%</td></tr>`).join('')}</table><p class="note" style="margin-top:10px">Weakest section: ${esc(SECS[weak[0]])}. Open its lessons and drill the lowest ones.</p></div>
  ${wrong.length?'<div class="card"><strong>Review</strong><div id="rv"></div></div>':''}<div class="row"><button class="b pri" id="ag">Back to mock exams</button><button class="b" id="pg">Progress</button></div>`;
  wrong.forEach(([q,a])=>{const dv=document.createElement('div');dv.style.cssText='margin:12px 0;padding-top:10px;border-top:1px solid var(--line)';dv.innerHTML='<b></b><div class="sub" style="margin-top:4px"></div><div style="color:var(--ok);margin-top:4px"></div><div class="sub" style="font-size:14px;margin-top:4px"></div>';dv.children[0].textContent=q[1];dv.children[1].textContent='Your answer: '+(a==null?'(none)':q[2][a]);dv.children[2].textContent='Correct: '+q[2][q[3]];dv.children[3].textContent=q[4];$('#rv').appendChild(dv)});
  $('#ag').onclick=()=>go('mock');$('#pg').onclick=()=>go('progress')}
 show()}

/* ---------- PROGRESS ---------- */
function progress(){
 const rd=LESSONS.filter(l=>S.read[l.id]).length;let a=0,c=0;Object.values(S.stats).forEach(s=>{a+=s.a;c+=s.c});
 const seen=Object.keys(S.seen).length,miss=Object.keys(S.missed).length;
 const weak=LESSONS.filter(l=>S.stats[l.id]&&S.stats[l.id].a>=3).map(l=>[l,lessonPct(l.id)]).filter(x=>x[1]<70).sort((x,y)=>x[1]-y[1]).slice(0,6);
 main.innerHTML=`<h1>Progress</h1><div class="card"><div class="row" style="gap:26px"><div><div class="big">${rd}/${LESSONS.length}</div><div class="sub">lessons read</div></div><div><div class="big">${a?Math.round(c/a*100):0}%</div><div class="sub">accuracy (${a} answers)</div></div><div><div class="big">${seen}/${Q.length}</div><div class="sub">questions seen</div></div><div><div class="big">${miss}</div><div class="sub">to review</div></div></div></div>
 ${weak.length?`<div class="card"><strong>Weakest lessons (under 70%)</strong>${weak.map(([l,p])=>`<div class="les" data-id="${l.id}"><span class="t">${esc(l.title)}<br><small class="sub">${esc(SECS[l.sec])}</small></span><span class="pill lo">${p}%</span><button class="b" data-q="${l.id}">Drill</button></div>`).join('')}</div>`:''}
 <div class="card"><strong>By section</strong><table class="p"><tr><th>Section</th><th>Lessons read</th><th>Accuracy</th></tr>${SECTIONS.map((s,si)=>{const ls=LESSONS.filter(l=>l.sec==si),r=ls.filter(l=>S.read[l.id]).length,p=secPct(si);return `<tr><td>${esc(SECS[si])}<br><small class="sub">weight ${esc(WEIGHT[si])}</small></td><td>${r}/${ls.length}</td><td>${p==null?'–':`<span class="pb"><i style="width:${p}%"></i></span> ${p}%`}</td></tr>`}).join('')}</table></div>
 <div class="card"><strong>Practice history</strong><p class="sub" style="margin:4px 0">Quizzes: ${S.hist.length?S.hist.slice(-8).reverse().map(h=>h.s+'/'+h.t).join(' · '):'none yet'}</p><p class="sub" style="margin:4px 0">Mock exams: ${S.mocks.length?S.mocks.slice(-5).reverse().map(h=>Math.round(h.s/h.t*100)+'%').join(' · '):'none yet'}</p>
 <p class="note">Saved in this browser only. Another device starts fresh. Aim for 80% or more in every section before the exam.</p>
 <div class="row"><button class="b" id="ms">Quiz my missed questions</button><button class="b" id="rs">Reset progress</button></div></div>`;
 main.querySelectorAll('.les').forEach(e=>e.onclick=ev=>{if(ev.target.dataset.q)return;go('lesson',e.dataset.id)});
 main.querySelectorAll('button[data-q]').forEach(b=>b.onclick=()=>{qlesson=b.dataset.q;go('quiz')});
 $('#ms').onclick=()=>{qlesson='';qsel=new Set(SECTIONS.map((_,i)=>i));go('quiz');$('#fo').value='missed';$('#fo').dispatchEvent(new Event('change'))};
 let sure=false;$('#rs').onclick=e=>{if(!sure){sure=true;e.target.textContent='Tap again to erase everything';return}S={read:{},stats:{},missed:{},seen:{},hist:[],mocks:[],last:null};save();progress()}}
function plan(){main.innerHTML='<div class="card notes">'+PLAN+'</div>';main.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='tw';t.replaceWith(w);w.appendChild(t)})}
const h0=(location.hash||'').slice(1);go(['path','quiz','mock','cards','progress','plan'].includes(h0)?h0:'path');
</script></body></html>
