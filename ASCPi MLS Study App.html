 fill=\"#222\">10x / shift<\/text><line x1=\"516\" y1=\"345.0\" x2=\"725\" y2=\"345.0\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"727\" y=\"343.0\" font-size=\"7\" text-anchor=\"end\" font-weight=\"normal\" fill=\"#666\">mean<\/text><line x1=\"516\" y1=\"328.8235294117647\" x2=\"725\" y2=\"328.8235294117647\" stroke=\"#9ab\" stroke-width=\"0.9\" stroke-dasharray=\"2,3\"/><line x1=\"516\" y1=\"361.1764705882353\" x2=\"725\" y2=\"361.1764705882353\" stroke=\"#9ab\" stroke-width=\"0.9\" stroke-dasharray=\"2,3\"/><line x1=\"516\" y1=\"312.6470588235294\" x2=\"725\" y2=\"312.6470588235294\" stroke=\"#d98a00\" stroke-width=\"0.9\" stroke-dasharray=\"2,3\"/><text x=\"727\" y=\"310.6470588235294\" font-size=\"7\" text-anchor=\"end\" font-weight=\"normal\" fill=\"#666\">+2<\/text><line x1=\"516\" y1=\"377.3529411764706\" x2=\"725\" y2=\"377.3529411764706\" stroke=\"#d98a00\" stroke-width=\"0.9\" stroke-dasharray=\"2,3\"/><line x1=\"516\" y1=\"296.47058823529414\" x2=\"725\" y2=\"296.47058823529414\" stroke=\"#b42318\" stroke-width=\"0.9\" stroke-dasharray=\"2,3\"/><text x=\"727\" y=\"294.47058823529414\" font-size=\"7\" text-anchor=\"end\" font-weight=\"normal\" fill=\"#666\">+3<\/text><line x1=\"516\" y1=\"393.52941176470586\" x2=\"725\" y2=\"393.52941176470586\" stroke=\"#b42318\" stroke-width=\"0.9\" stroke-dasharray=\"2,3\"/><path d=\"M522.0,351.5 L543.9,343.4 L565.8,336.9 L587.7,338.5 L609.6,333.7 L631.4,340.1 L653.3,335.3 L675.2,336.9 L697.1,332.1 L719.0,338.5\" fill=\"none\" stroke=\"#667\" stroke-width=\"1.2\" /><circle cx=\"522.0\" cy=\"351.47058823529414\" r=\"3.2\" fill=\"#2a6f9a\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"543.8888888888889\" cy=\"343.38235294117646\" r=\"3.2\" fill=\"#b42318\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"565.7777777777778\" cy=\"336.9117647058824\" r=\"3.2\" fill=\"#b42318\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"587.6666666666666\" cy=\"338.52941176470586\" r=\"3.2\" fill=\"#b42318\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"609.5555555555555\" cy=\"333.6764705882353\" r=\"3.2\" fill=\"#b42318\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"631.4444444444445\" cy=\"340.1470588235294\" r=\"3.2\" fill=\"#b42318\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"653.3333333333334\" cy=\"335.29411764705884\" r=\"3.2\" fill=\"#b42318\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"675.2222222222222\" cy=\"336.9117647058824\" r=\"3.2\" fill=\"#b42318\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"697.1111111111111\" cy=\"332.05882352941177\" r=\"3.2\" fill=\"#b42318\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"719.0\" cy=\"338.52941176470586\" r=\"3.2\" fill=\"#b42318\" stroke=\"#fff\" stroke-width=\"0.8\" /><text x=\"620.5\" y=\"430.0\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">10 in a row on one side of the mean<\/text><text x=\"380\" y=\"458\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">Trend = gradual drift in one direction (deteriorating reagent or light source). Shift = sudden, sustained change (new lot, recalibration).<\/text><\/svg><figcaption>Levey-Jennings charts: how the Westgard rules look. Dotted lines are ±1, ±2 and ±3 SD.<\/figcaption><\/figure><h3 id=\"laboratory-statistics\">Laboratory statistics<\/h3>\n<ul>\n<li><p><strong>Mean<\/strong> = average. <strong>Median<\/strong> = middle value when sorted. <strong>Mode<\/strong> = most frequent value. In a normal (bell-shaped) distribution they are about equal.<\/p><\/li>\n<li><p><strong>95% confidence interval<\/strong> = mean +/- 1.96 SD (about 2 SD).<\/p><\/li>\n<li><p><strong>Correlation coefficient (r)<\/strong> shows how closely two methods agree (1.0 = perfect). In a method comparison regression, the <strong>slope<\/strong> shows proportional error and the <strong>intercept<\/strong> shows constant error.<\/p><\/li>\n<li><p><strong>t-test<\/strong> compares two means (accuracy); <strong>F-test<\/strong> compares two standard deviations (precision).<\/p><\/li>\n<li><p><strong>Standard curve:<\/strong> plot known concentrations against signal; read unknowns from the line.<\/p><\/li>\n<\/ul>\n","min":6},{"id":"L2","sec":6,"title":"Regulations, safety and emergencies","html":"<h3 id=\"regulations-and-organizations\">Regulations and organizations<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 34%\" />\n<col style=\"width: 65%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Organization<\/th>\n<th>Role<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>CLIA '88 (CMS)<\/td>\n<td>Federal law for all human lab testing: complexity levels, proficiency testing, personnel<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>CAP<\/td>\n<td>Accredits laboratories; inspects<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>The Joint Commission<\/td>\n<td>Accredits hospitals including their labs<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>COLA<\/td>\n<td>Accredits physician office labs<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>FDA<\/td>\n<td>Clears tests, reagents and blood products<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>OSHA<\/td>\n<td>Worker safety: bloodborne pathogens, chemical hygiene<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>CLSI<\/td>\n<td>Consensus standards and guidelines<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>AABB<\/td>\n<td>Blood bank and transfusion standards<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>CDC<\/td>\n<td>Surveillance and infection control guidance<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ISO 15189<\/td>\n<td>International standard for medical labs<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p><strong>Proficiency testing (PT):<\/strong> unknown samples from an approved provider, 3 events a year, 5 samples per event. A satisfactory score is 80% (100% for ABO and Rh). Treat PT samples like patient samples and never send them to another lab.<\/p><\/li>\n<li><p><strong>Waived tests<\/strong> (urine dipstick, glucose meters, rapid strep) need only a certificate of waiver and following the manufacturer's directions.<\/p><\/li>\n<li><p>Typical record retention (US, check your local rules): patient test and QC records 2 years; blood bank records 5 years or longer; pathology reports 10 years.<\/p><\/li>\n<\/ul>\n<figure class=\"fig\" id=\"F32\"><svg viewBox=\"0 0 760 350\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"NFPA diamond\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"350\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">NFPA 704 chemical hazard label<\/text><g transform=\"translate(190.0,129.68) rotate(45)\"><rect x=\"-40.3\" y=\"-40.3\" width=\"80.6\" height=\"80.6\" fill=\"#d7261e\" stroke=\"#222\" stroke-width=\"2\"/><\/g><text x=\"190.0\" y=\"138.68\" font-size=\"26\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#fff\">3<\/text><g transform=\"translate(149.68,170.0) rotate(45)\"><rect x=\"-40.3\" y=\"-40.3\" width=\"80.6\" height=\"80.6\" fill=\"#1f5fbf\" stroke=\"#222\" stroke-width=\"2\"/><\/g><text x=\"149.68\" y=\"179.0\" font-size=\"26\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#fff\">2<\/text><g transform=\"translate(230.32,170.0) rotate(45)\"><rect x=\"-40.3\" y=\"-40.3\" width=\"80.6\" height=\"80.6\" fill=\"#f2c400\" stroke=\"#222\" stroke-width=\"2\"/><\/g><text x=\"230.32\" y=\"179.0\" font-size=\"26\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">1<\/text><g transform=\"translate(190.0,210.32) rotate(45)\"><rect x=\"-40.3\" y=\"-40.3\" width=\"80.6\" height=\"80.6\" fill=\"#fff\" stroke=\"#222\" stroke-width=\"2\"/><\/g><text x=\"190.0\" y=\"219.32\" font-size=\"26\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">OX<\/text><rect x=\"370\" y=\"70\" width=\"370\" height=\"50\" rx=\"6\" fill=\"#fff\" stroke=\"#ddd\" stroke-width=\"1\" /><rect x=\"370\" y=\"70\" width=\"10\" height=\"50\" rx=\"3\" fill=\"#d7261e\" stroke=\"none\" stroke-width=\"0\" /><text x=\"392\" y=\"90.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Red (top): FLAMMABILITY<\/text><text x=\"392\" y=\"107.0\" font-size=\"9.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#666\">0 will not burn · 4 extremely flammable (flash point below 73 °F)<\/text><rect x=\"370\" y=\"128\" width=\"370\" height=\"50\" rx=\"6\" fill=\"#fff\" stroke=\"#ddd\" stroke-width=\"1\" /><rect x=\"370\" y=\"128\" width=\"10\" height=\"50\" rx=\"3\" fill=\"#1f5fbf\" stroke=\"none\" stroke-width=\"0\" /><text x=\"392\" y=\"148.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Blue (left): HEALTH<\/text><text x=\"392\" y=\"165.0\" font-size=\"9.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#666\">0 no hazard · 4 deadly even on brief exposure<\/text><rect x=\"370\" y=\"186\" width=\"370\" height=\"50\" rx=\"6\" fill=\"#fff\" stroke=\"#ddd\" stroke-width=\"1\" /><rect x=\"370\" y=\"186\" width=\"10\" height=\"50\" rx=\"3\" fill=\"#c9a200\" stroke=\"none\" stroke-width=\"0\" /><text x=\"392\" y=\"206.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Yellow (right): REACTIVITY / instability<\/text><text x=\"392\" y=\"223.0\" font-size=\"9.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#666\">0 stable · 4 may detonate<\/text><rect x=\"370\" y=\"244\" width=\"370\" height=\"50\" rx=\"6\" fill=\"#fff\" stroke=\"#ddd\" stroke-width=\"1\" /><rect x=\"370\" y=\"244\" width=\"10\" height=\"50\" rx=\"3\" fill=\"#444\" stroke=\"none\" stroke-width=\"0\" /><text x=\"392\" y=\"264.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">White (bottom): SPECIAL<\/text><text x=\"392\" y=\"281.0\" font-size=\"9.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#666\">OX = oxidizer, W with a bar = reacts with water, ACID, ALK, COR<\/text><text x=\"190\" y=\"305.0\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">Example shown: flammability 3, health 2,<\/text><text x=\"190\" y=\"317.5\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">reactivity 1, oxidizer<\/text><text x=\"555\" y=\"308.0\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Use the Safety Data Sheet (SDS) for full hazards and first aid.<\/text><\/svg><figcaption>NFPA 704 hazard diamond. Ratings run from 0 (none) to 4 (severe).<\/figcaption><\/figure><h3 id=\"safety\">Safety<\/h3>\n<ul>\n<li><p><strong>Standard precautions:<\/strong> gloves, gown and face protection when splashes are possible; wash hands after removing gloves; do not recap needles; sharps containers are puncture-proof and never filled more than two thirds.<\/p><\/li>\n<li><p><strong>Hand hygiene:<\/strong> use soap and water for visibly dirty hands and after contact with C. difficile; alcohol rub is fine otherwise.<\/p><\/li>\n<li><p><strong>Bloodborne pathogens (OSHA):<\/strong> hepatitis B vaccine offered free within 10 days of hire; exposure control plan reviewed every year.<\/p><\/li>\n<li><p><strong>Spills:<\/strong> wear gloves, cover with absorbent paper, apply fresh 1:10 bleach (about 0.5% hypochlorite) for at least 10 minutes, wipe, discard as biohazard.<\/p><\/li>\n<\/ul>\n<table>\n<colgroup>\n<col style=\"width: 26%\" />\n<col style=\"width: 73%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Biosafety level<\/th>\n<th>Typical agents<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>BSL-1<\/td>\n<td>No known disease risk<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>BSL-2<\/td>\n<td>Standard clinical lab: S. aureus, Salmonella, hepatitis B<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>BSL-3<\/td>\n<td>Airborne agents: M. tuberculosis cultures, Brucella, Coccidioides<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>BSL-4<\/td>\n<td>Exotic, life-threatening: Ebola<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p><strong>Chemicals:<\/strong> every chemical needs a Safety Data Sheet (SDS). NFPA diamond: blue = health, red = flammability, yellow = reactivity, white = special. Always add acid to water. Store acids and bases apart; flammables in safety cabinets. Flush eyes for 15 minutes.<\/p><\/li>\n<li><p><strong>Fire:<\/strong> RACE = rescue, alarm, contain, extinguish. PASS = pull, aim, squeeze, sweep. Class A ordinary materials, B flammable liquids, C electrical, D metals.<\/p><\/li>\n<li><p><strong>Waste:<\/strong> biohazard bags go to the autoclave (121 degrees C, 15 psi, 30 minutes or longer); sharps in rigid containers; chemical waste by hazard class.<\/p><\/li>\n<li><p><strong>Shipping:<\/strong> infectious substances need triple packaging (Category A = UN2814, Category B = UN3373).<\/p><\/li>\n<\/ul>\n<h3 id=\"emergency-procedures\">Emergency procedures<\/h3>\n<ul>\n<li><p><strong>Needlestick or cut:<\/strong> wash with soap and water at once, report immediately, and have the source patient and the worker evaluated; post-exposure treatment (for HIV) works best within hours.<\/p><\/li>\n<li><p><strong>Splash to eyes, nose or mouth:<\/strong> flush with water or an eyewash for 15 minutes, then report.<\/p><\/li>\n<li><p><strong>Chemical on skin:<\/strong> remove contaminated clothing and rinse with water for at least 15 minutes (use the safety shower for large areas).<\/p><\/li>\n<li><p><strong>Fire:<\/strong> RACE and PASS (see Safety). Know where the alarms, exits, extinguishers and eyewash are.<\/p><\/li>\n<li><p><strong>Spills:<\/strong> use the right spill kit for biological or chemical spills; mercury needs special cleanup.<\/p><\/li>\n<\/ul>\n","min":5},{"id":"L3","sec":6,"title":"Specimen collection and lab math","html":"<h3 id=\"specimen-collection-preanalytic\">Specimen collection (preanalytic)<\/h3>\n<p><strong>Order of draw (CLSI):<\/strong> 1) blood culture bottles, 2) light blue (citrate), 3) red or gold (serum), 4) green (heparin), 5) lavender (EDTA), 6) gray (fluoride).<\/p>\n<ul>\n<li><p>Identify the patient with two identifiers and label at the bedside.<\/p><\/li>\n<li><p>Tourniquet for less than 1 minute. Fist pumping raises potassium. Hemolysis raises K, LD, AST, phosphate and magnesium.<\/p><\/li>\n<li><p>Avoid arms with an IV, hematoma, mastectomy, or fistula.<\/p><\/li>\n<li><p>Capillary sticks: infant heel (2 mm or less in depth), fingertip side of the 3rd or 4th finger; wipe away the first drop; EDTA is drawn first in a capillary collection.<\/p><\/li>\n<li><p>Fasting: 8-12 hours for glucose and lipids.<\/p><\/li>\n<\/ul>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 49%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Specimen<\/th>\n<th>Handling<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Ammonia, lactate, blood gas, ACTH<\/td>\n<td>On ice<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Bilirubin<\/td>\n<td>Protect from light<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Cold agglutinins, cryoglobulins<\/td>\n<td>Keep warm at 37 degrees C<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Potassium<\/td>\n<td>Do not refrigerate before separation<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Serum or plasma<\/td>\n<td>Separate within 2 hours<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p><strong>Reject<\/strong> specimens that are unlabeled or mislabeled, the wrong tube, clotted (EDTA), too little volume, delayed, or contaminated.<\/p><\/li>\n<li><p><strong>Chain of custody<\/strong> documents each person who handles a legal specimen (for example drug testing).<\/p><\/li>\n<\/ul>\n<figure class=\"fig\" id=\"F33\"><svg viewBox=\"0 0 760 350\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Order of draw\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"350\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Order of draw (CLSI)<\/text><rect x=\"54\" y=\"70\" width=\"32\" height=\"16\" rx=\"3\" fill=\"#f2d04a\" stroke=\"#444\" stroke-width=\"1.5\" /><rect x=\"56\" y=\"86\" width=\"28\" height=\"110\" rx=\"12\" fill=\"#f4f8fb\" stroke=\"#555\" stroke-width=\"1.5\" /><rect x=\"58\" y=\"130\" width=\"24\" height=\"64\" rx=\"10\" fill=\"#f2d04a\" stroke=\"none\" stroke-width=\"0\" opacity=\"0.35\"/><circle cx=\"70\" cy=\"50\" r=\"13\" fill=\"#fff\" stroke=\"#444\" stroke-width=\"1.5\" /><text x=\"70\" y=\"55\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">1<\/text><text x=\"70\" y=\"222\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Blood culture<\/text><text x=\"70\" y=\"235\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">(yellow SPS)<\/text><text x=\"70\" y=\"250.0\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">culture bottles first<\/text><text x=\"70\" y=\"261.5\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">(sterility)<\/text><line x1=\"100\" y1=\"140\" x2=\"160\" y2=\"140\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"174\" y=\"70\" width=\"32\" height=\"16\" rx=\"3\" fill=\"#7fb8f2\" stroke=\"#444\" stroke-width=\"1.5\" /><rect x=\"176\" y=\"86\" width=\"28\" height=\"110\" rx=\"12\" fill=\"#f4f8fb\" stroke=\"#555\" stroke-width=\"1.5\" /><rect x=\"178\" y=\"130\" width=\"24\" height=\"64\" rx=\"10\" fill=\"#7fb8f2\" stroke=\"none\" stroke-width=\"0\" opacity=\"0.35\"/><circle cx=\"190\" cy=\"50\" r=\"13\" fill=\"#fff\" stroke=\"#444\" stroke-width=\"1.5\" /><text x=\"190\" y=\"55\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">2<\/text><text x=\"190\" y=\"222\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Light blue<\/text><text x=\"190\" y=\"250.0\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">sodium citrate<\/text><text x=\"190\" y=\"261.5\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">PT, aPTT, D-dimer<\/text><line x1=\"220\" y1=\"140\" x2=\"280\" y2=\"140\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"294\" y=\"70\" width=\"32\" height=\"16\" rx=\"3\" fill=\"#d9453a\" stroke=\"#444\" stroke-width=\"1.5\" /><rect x=\"296\" y=\"86\" width=\"28\" height=\"110\" rx=\"12\" fill=\"#f4f8fb\" stroke=\"#555\" stroke-width=\"1.5\" /><rect x=\"298\" y=\"130\" width=\"24\" height=\"64\" rx=\"10\" fill=\"#d9453a\" stroke=\"none\" stroke-width=\"0\" opacity=\"0.35\"/><circle cx=\"310\" cy=\"50\" r=\"13\" fill=\"#fff\" stroke=\"#444\" stroke-width=\"1.5\" /><text x=\"310\" y=\"55\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">3<\/text><text x=\"310\" y=\"222\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Red / gold<\/text><text x=\"310\" y=\"250.0\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">clot activator, gel<\/text><text x=\"310\" y=\"261.5\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">chemistry, serology<\/text><line x1=\"340\" y1=\"140\" x2=\"400\" y2=\"140\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"414\" y=\"70\" width=\"32\" height=\"16\" rx=\"3\" fill=\"#4caf6a\" stroke=\"#444\" stroke-width=\"1.5\" /><rect x=\"416\" y=\"86\" width=\"28\" height=\"110\" rx=\"12\" fill=\"#f4f8fb\" stroke=\"#555\" stroke-width=\"1.5\" /><rect x=\"418\" y=\"130\" width=\"24\" height=\"64\" rx=\"10\" fill=\"#4caf6a\" stroke=\"none\" stroke-width=\"0\" opacity=\"0.35\"/><circle cx=\"430\" cy=\"50\" r=\"13\" fill=\"#fff\" stroke=\"#444\" stroke-width=\"1.5\" /><text x=\"430\" y=\"55\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">4<\/text><text x=\"430\" y=\"222\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Green<\/text><text x=\"430\" y=\"250.0\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">heparin<\/text><text x=\"430\" y=\"261.5\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">stat chemistry<\/text><line x1=\"460\" y1=\"140\" x2=\"520\" y2=\"140\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"534\" y=\"70\" width=\"32\" height=\"16\" rx=\"3\" fill=\"#a98bd6\" stroke=\"#444\" stroke-width=\"1.5\" /><rect x=\"536\" y=\"86\" width=\"28\" height=\"110\" rx=\"12\" fill=\"#f4f8fb\" stroke=\"#555\" stroke-width=\"1.5\" /><rect x=\"538\" y=\"130\" width=\"24\" height=\"64\" rx=\"10\" fill=\"#a98bd6\" stroke=\"none\" stroke-width=\"0\" opacity=\"0.35\"/><circle cx=\"550\" cy=\"50\" r=\"13\" fill=\"#fff\" stroke=\"#444\" stroke-width=\"1.5\" /><text x=\"550\" y=\"55\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">5<\/text><text x=\"550\" y=\"222\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Lavender<\/text><text x=\"550\" y=\"250.0\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">EDTA<\/text><text x=\"550\" y=\"261.5\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">CBC, blood bank<\/text><line x1=\"580\" y1=\"140\" x2=\"640\" y2=\"140\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"654\" y=\"70\" width=\"32\" height=\"16\" rx=\"3\" fill=\"#9a9a9a\" stroke=\"#444\" stroke-width=\"1.5\" /><rect x=\"656\" y=\"86\" width=\"28\" height=\"110\" rx=\"12\" fill=\"#f4f8fb\" stroke=\"#555\" stroke-width=\"1.5\" /><rect x=\"658\" y=\"130\" width=\"24\" height=\"64\" rx=\"10\" fill=\"#9a9a9a\" stroke=\"none\" stroke-width=\"0\" opacity=\"0.35\"/><circle cx=\"670\" cy=\"50\" r=\"13\" fill=\"#fff\" stroke=\"#444\" stroke-width=\"1.5\" /><text x=\"670\" y=\"55\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">6<\/text><text x=\"670\" y=\"222\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Gray<\/text><text x=\"670\" y=\"250.0\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">fluoride/oxalate<\/text><text x=\"670\" y=\"261.5\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">glucose, lactate<\/text><text x=\"380\" y=\"300.0\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Memory: “Culture Brings Red Gold Green Lavender Gray” - citrate before serum, serum before heparin, EDTA near the end.<\/text><text x=\"380\" y=\"318\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">EDTA carried over falsely raises K and lowers Ca, ALP, Mg. Underfilled citrate tubes prolong PT and aPTT.<\/text><\/svg><figcaption>CLSI order of draw. Wrong order carries additives into the next tube.<\/figcaption><\/figure><h3 id=\"math-and-reagents\">Math and reagents<\/h3>\n<ul>\n<li><p>Dilution = sample volume / total volume. Serial dilutions multiply (1:2 then 1:5 = 1:10). C1 x V1 = C2 x V2.<\/p><\/li>\n<li><p>Percent solution (w/v) = grams per 100 mL. Molarity = moles per liter. Normality = equivalents per liter.<\/p><\/li>\n<li><p>Conversions: Celsius = (F - 32) x 5/9. Glucose mg/dL / 18 = mmol/L. Creatinine mg/dL x 88.4 = micromol/L.<\/p><\/li>\n<li><p>Temperatures: refrigerator 2-8 degrees C; freezer -20 degrees C or lower; incubator 35-37; room temperature 20-25. Record daily.<\/p><\/li>\n<li><p>Centrifuge: RCF = 1.118 x 10^-5 x radius (cm) x rpm squared. Check speed and timers regularly.<\/p><\/li>\n<li><p>Water types: Type I is the purest (reagents, trace metals); Type II for general lab use; Type III for rinsing glassware.<\/p><\/li>\n<li><p>Calibrate pH meters with at least 2 buffers.<\/p><\/li>\n<li><p>Pipettes: check accuracy and precision regularly; read the meniscus at eye level.<\/p><\/li>\n<\/ul>\n","min":4},{"id":"L4","sec":6,"title":"Instruments and molecular methods","html":"<h3 id=\"instruments-and-methods-1\">Instruments and methods<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 44%\" />\n<col style=\"width: 55%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Method<\/th>\n<th>Principle and use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Spectrophotometry and photometry<\/td>\n<td>Light absorbed by a colored solution is proportional to concentration (Beer's law)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Fluorometry<\/td>\n<td>Measures emitted light at a different wavelength; very sensitive<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Nephelometry and turbidimetry<\/td>\n<td>Light scatter or blockage by particles; proteins, immunoglobulins<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Osmometry<\/td>\n<td>Freezing point depression measures total particles<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Electrophoresis<\/td>\n<td>Charged molecules move in an electric field; proteins, hemoglobin, isoenzymes<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Chromatography (GC, HPLC, TLC)<\/td>\n<td>Separates mixtures; drugs, toxins, vitamins<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Mass spectrometry<\/td>\n<td>Ionizes molecules and sorts them by mass-to-charge ratio; drug confirmation, newborn screening<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Electrochemistry<\/td>\n<td>Ion-selective electrodes (potentiometry) for Na, K, Cl, pH; Clark electrode (amperometry) for pO2; Severinghaus electrode for pCO2; coulometry for chloride<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Flow cytometry<\/td>\n<td>Cells in a stream pass a laser; scatter and fluorescence identify cell types<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Hematology analyzers<\/td>\n<td>Impedance (Coulter) counts and sizes cells; optical scatter and dyes give the differential<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Automated microbiology<\/td>\n<td>Continuous blood culture monitors; ID and susceptibility cards; MALDI-TOF<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<figure class=\"fig\" id=\"F34\"><svg viewBox=\"0 0 760 380\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"PCR\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"380\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">PCR: three steps per cycle<\/text><rect x=\"40\" y=\"40\" width=\"220\" height=\"170\" rx=\"8\" fill=\"#fff\" stroke=\"#ccc\" stroke-width=\"1\" /><text x=\"150\" y=\"62\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">1. Denature<\/text><text x=\"150\" y=\"78\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#b42318\">94-98 °C<\/text><path d=\"M70,110 q20,-14 40,0 t40,0 t40,0 t30,0\" fill=\"none\" stroke=\"#2b6cb0\" stroke-width=\"2.5\" /><path d=\"M70,150 q20,14 40,0 t40,0 t40,0 t30,0\" fill=\"none\" stroke=\"#d4306a\" stroke-width=\"2.5\" /><text x=\"150\" y=\"196\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">↑  separated by heat<\/text><line x1=\"262\" y1=\"120\" x2=\"278\" y2=\"120\" stroke=\"#444\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"280\" y=\"40\" width=\"220\" height=\"170\" rx=\"8\" fill=\"#fff\" stroke=\"#ccc\" stroke-width=\"1\" /><text x=\"390\" y=\"62\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">2. Anneal<\/text><text x=\"390\" y=\"78\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#b42318\">50-65 °C<\/text><line x1=\"305\" y1=\"115\" x2=\"475\" y2=\"115\" stroke=\"#2b6cb0\" stroke-width=\"2.5\"/><line x1=\"305\" y1=\"150\" x2=\"475\" y2=\"150\" stroke=\"#d4306a\" stroke-width=\"2.5\"/><line x1=\"310\" y1=\"106\" x2=\"360\" y2=\"106\" stroke=\"#2a9d8f\" stroke-width=\"2.2\" marker-end=\"url(#ar)\"/><line x1=\"475\" y1=\"159\" x2=\"425\" y2=\"159\" stroke=\"#e8832a\" stroke-width=\"2.2\" marker-end=\"url(#ar)\"/><text x=\"390\" y=\"196\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">forward and reverse primers<\/text><line x1=\"502\" y1=\"120\" x2=\"518\" y2=\"120\" stroke=\"#444\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><rect x=\"520\" y=\"40\" width=\"220\" height=\"170\" rx=\"8\" fill=\"#fff\" stroke=\"#ccc\" stroke-width=\"1\" /><text x=\"630\" y=\"62\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">3. Extend<\/text><text x=\"630\" y=\"78\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#b42318\">72 °C<\/text><line x1=\"545\" y1=\"115\" x2=\"715\" y2=\"115\" stroke=\"#2b6cb0\" stroke-width=\"2.5\"/><line x1=\"545\" y1=\"150\" x2=\"715\" y2=\"150\" stroke=\"#d4306a\" stroke-width=\"2.5\"/><line x1=\"550\" y1=\"107\" x2=\"710\" y2=\"107\" stroke=\"#2a9d8f\" stroke-width=\"2.2\" marker-end=\"url(#ar)\"/><line x1=\"715\" y1=\"158\" x2=\"555\" y2=\"158\" stroke=\"#e8832a\" stroke-width=\"2.2\" marker-end=\"url(#ar)\"/><text x=\"630\" y=\"196\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">new strands (5′ → 3′)<\/text><text x=\"380\" y=\"236\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Copies after n cycles = 2ⁿ  (30 cycles ≈ 1 billion copies)<\/text><rect x=\"140\" y=\"290.4\" width=\"60\" height=\"9.6\" rx=\"3\" fill=\"#8ccac0\" stroke=\"#0b6b5d\" stroke-width=\"1\" /><text x=\"170\" y=\"316\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">cycle 0<\/text><text x=\"170\" y=\"286.4\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">1<\/text><rect x=\"260\" y=\"286.8\" width=\"60\" height=\"13.2\" rx=\"3\" fill=\"#8ccac0\" stroke=\"#0b6b5d\" stroke-width=\"1\" /><text x=\"290\" y=\"316\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">cycle 1<\/text><text x=\"290\" y=\"282.8\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">2<\/text><rect x=\"380\" y=\"279.6\" width=\"60\" height=\"20.4\" rx=\"3\" fill=\"#8ccac0\" stroke=\"#0b6b5d\" stroke-width=\"1\" /><text x=\"410\" y=\"316\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">cycle 2<\/text><text x=\"410\" y=\"275.6\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">4<\/text><rect x=\"500\" y=\"265.2\" width=\"60\" height=\"34.8\" rx=\"3\" fill=\"#8ccac0\" stroke=\"#0b6b5d\" stroke-width=\"1\" /><text x=\"530\" y=\"316\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">cycle 3<\/text><text x=\"530\" y=\"261.2\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">8<\/text><rect x=\"620\" y=\"236.4\" width=\"60\" height=\"63.6\" rx=\"3\" fill=\"#8ccac0\" stroke=\"#0b6b5d\" stroke-width=\"1\" /><text x=\"650\" y=\"316\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">cycle 4<\/text><text x=\"650\" y=\"232.4\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">16<\/text><text x=\"380\" y=\"345.0\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">RT-PCR first converts RNA to cDNA. Real-time PCR reads fluorescence each cycle. Controls: no-template, positive, internal. Keep pre- and post-PCR areas separate.<\/text><\/svg><figcaption>One PCR cycle, and why copy number doubles each time.<\/figcaption><\/figure><h3 id=\"molecular-methods\">Molecular methods<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 42%\" />\n<col style=\"width: 57%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Method<\/th>\n<th>What it does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>PCR<\/td>\n<td>Copies DNA: denature (about 95 degrees C), anneal primers (50-65), extend (72), repeated for many cycles<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>RT-PCR<\/td>\n<td>First converts RNA to DNA; used for viral RNA such as HIV and hepatitis C<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Real-time (quantitative) PCR<\/td>\n<td>Measures product each cycle; gives viral load<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>NAAT<\/td>\n<td>Nucleic acid amplification tests such as Chlamydia and gonorrhea assays<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>FISH<\/td>\n<td>Fluorescent probes find specific chromosome regions (for example BCR-ABL)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Sequencing<\/td>\n<td>Reads the DNA order; 16S for bacteria<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Southern, Northern, Western blot<\/td>\n<td>Detect DNA, RNA and protein, in that order<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Contamination (carryover) is the main risk; use separate rooms for reagent prep, sample prep and amplification, and include negative controls.<\/p>\n","min":3},{"id":"L5","sec":6,"title":"Management, ethics and education","html":"<h3 id=\"management-ethics-and-information-systems\">Management, ethics and information systems<\/h3>\n<ul>\n<li><p><strong>Quality assurance<\/strong> covers the whole testing process: preanalytic (collection), analytic (testing, QC) and postanalytic (reporting).<\/p><\/li>\n<li><p><strong>Critical values<\/strong> must be called to the responsible clinician immediately with read-back, and documented with date, time and person notified.<\/p><\/li>\n<li><p><strong>Quality tools:<\/strong> PDCA (plan, do, check, act), root-cause analysis, fishbone diagrams, Pareto charts.<\/p><\/li>\n<li><p><strong>Competency assessment:<\/strong> at 6 months and 12 months for new staff, then annually. It includes direct observation, review of results and records, and testing of known samples.<\/p><\/li>\n<li><p><strong>Procedure manuals:<\/strong> purpose, principle, specimen, reagents, procedure, calculations, reference ranges, limitations. Review annually.<\/p><\/li>\n<li><p><strong>LIS:<\/strong> manages orders and results, links to instruments, applies autoverification rules and keeps an audit trail. HIPAA requires protecting patient information.<\/p><\/li>\n<li><p><strong>Ethics:<\/strong> confidentiality, honest reporting, never falsify results, report errors, stay within scope of practice.<\/p><\/li>\n<li><p><strong>Instruments:<\/strong> keep daily, weekly and monthly maintenance logs; verify after repairs; calibration verification at least every 6 months.<\/p><\/li>\n<li><p><strong>Reagents:<\/strong> label with identity, date prepared, date opened, expiry and initials; check each new lot with QC before use; first in, first out.<\/p><\/li>\n<li><p><strong>Point-of-care testing:<\/strong> waived tests, operator training, QC, and awareness of meter limits (for example hematocrit effects on glucose).<\/p><\/li>\n<li><p><strong>Corrected reports:<\/strong> mark as corrected, keep the original, and notify the clinician.<\/p><\/li>\n<li><p><strong>Cost:<\/strong> break-even point = fixed costs / (price per test - variable cost per test).<\/p><\/li>\n<\/ul>\n<h3 id=\"management-principles\">Management principles<\/h3>\n<ul>\n<li><p>Leaders set goals, communicate, delegate and handle conflict. Common styles are autocratic, democratic and laissez-faire.<\/p><\/li>\n<li><p><strong>Budgeting:<\/strong> direct costs (reagents, supplies, labor) and indirect costs (rent, utilities). Productivity is tracked as tests per FTE (full-time equivalent).<\/p><\/li>\n<li><p><strong>Inventory:<\/strong> first in, first out; set minimum (par) levels; track expiration dates.<\/p><\/li>\n<li><p><strong>Hiring and evaluation:<\/strong> job descriptions, orientation, annual performance reviews, corrective discipline with documentation.<\/p><\/li>\n<li><p><strong>Test selection:<\/strong> compare cost, turnaround time, accuracy and clinical value when adding a test.<\/p><\/li>\n<\/ul>\n<h3 id=\"education-principles\">Education principles<\/h3>\n<ul>\n<li><p>Adults learn best when the material is relevant, practical and self-directed (andragogy).<\/p><\/li>\n<li><p>Good learning objectives are measurable. Learning has three domains: cognitive (knowledge), psychomotor (skills such as pipetting) and affective (attitudes).<\/p><\/li>\n<li><p>Teach by demonstrating, then letting the learner practice with supervision, then give prompt, specific feedback.<\/p><\/li>\n<li><p>Test learning with written questions, direct observation and competency checklists.<\/p><\/li>\n<\/ul>\n","min":3},{"id":"L6","sec":6,"title":"Lab operations exam traps","html":"<h3 id=\"exam-traps-6\">Exam traps<\/h3>\n<ul>\n<li><p>A 1-2s violation is only a warning; 1-3s and R-4s signal random error.<\/p><\/li>\n<li><p>QC failing means do not report results, not repeat until it passes.<\/p><\/li>\n<li><p>Bleach for spills is 1:10, made fresh each day.<\/p><\/li>\n<li><p>Proficiency samples are never shared or sent to another lab for confirmation.<\/p><\/li>\n<\/ul>\n","min":3}];
const Q=[[0,"Which anemia shows a low MCV, low serum iron, LOW TIBC and high ferritin?",["Iron deficiency","Anemia of chronic disease","Sideroblastic anemia","Thalassemia minor"],1,"Anemia of chronic disease: iron trapped in macrophages, so serum iron and TIBC are low and ferritin is normal/high. Iron deficiency has HIGH TIBC and low ferritin.","H2","old"],[0,"Hypersegmented neutrophils (≥5 lobes) and macro-ovalocytes suggest:",["Iron deficiency","Megaloblastic anemia (B12/folate)","Aplastic anemia","Lead poisoning"],1,"Impaired DNA synthesis gives macro-ovalocytes and hypersegmented neutrophils; MCV is usually >100 fL.","H2","old"],[0,"Which finding best separates thalassemia minor from iron deficiency?",["Low MCV","High RBC count with normal RDW and target cells","Low hemoglobin","Microcytosis"],1,"Thalassemia: RBC count high relative to Hgb, normal RDW, target cells, basophilic stippling, normal/high iron. Iron deficiency: low RBC count, high RDW.","H2","old"],[0,"Auer rods are characteristic of:",["CLL","Acute myeloid leukemia","Hairy cell leukemia","Multiple myeloma"],1,"Auer rods = fused primary granules, seen in AML (especially APL, M3) and not in lymphoid blasts.","H4","old"],[0,"Acute promyelocytic leukemia (M3) is associated with:",["t(9;22)","t(15;17) and DIC","t(8;14)","t(8;21) only"],1,"t(15;17) PML-RARA; heavy Auer rods (faggot cells), DIC; treated with all-trans retinoic acid.","H4","old"],[0,"The Philadelphia chromosome t(9;22) BCR-ABL is found in:",["CML","CLL","Polycythemia vera","Hodgkin lymphoma"],0,"CML: high WBC with left shift, basophilia, and a LOW leukocyte alkaline phosphatase (LAP) score.","H4","old"],[0,"Leukemoid reaction vs CML: the LAP score in a leukemoid reaction is:",["Low","High","Absent","Unchanged from normal"],1,"Leukemoid reaction = HIGH LAP (toxic granulation, Döhle bodies). CML = LOW LAP.","H4","old"],[0,"Smudge (basket) cells are typical of:",["CLL","AML","ITP","Aplastic anemia"],0,"CLL: mature small lymphocytes that rupture ures:",["Light scattered by antigen-antibody complexes","Absorbance","Fluorescence","Radioactivity"],0,"Turbidimetry measures light transmitted/blocked; nephelometry measures scattered light at an angle.","I5","old"],[5,"Normal urine pH range is about:",["4.5-8.0","1-3","9-11","7.5-9.5 only"],0,"Fresh first-morning urine is slightly acidic. Alkaline urine from standing (urea-splitting bacteria produce ammonia).","U1","old"],[5,"Normal urine specific gravity (random) is:",["1.003-1.030","1.000 only","1.040-1.060","0.990"],0,"Isosthenuria = 1.010 (SG of the glomerular filtrate). Glucose and protein falsely raise SG on a refractometer.","U1","old"],[5,"The reagent strip protein pad is most sensitive to:",["Albumin","Bence Jones protein","Globulins","Mucoprotein"],0,"Use sulfosalicylic acid (SSA) for all proteins; false positives with alkaline urine/quaternary ammonium.","U1","old"],[5,"Glucosuria with normal blood glucose suggests:",["Renal tubular dysfunction (low renal threshold)","Diabetes","Pancreatitis","Dehydration"],0,"Renal threshold for glucose about 160-180 mg/dL. Clinitest detects all reducing substances (galactose, lactose).","U1","old"],[5,"Ketones on a dipstick react mainly with:",["Acetoacetic acid (nitroprusside)","Beta-hydroxybutyrate","Acetone only","Lactate"],0,"Ketone pad does not detect beta-hydroxybutyrate (the predominant ketone in DKA).","U1","old"],[5,"Bilirubin in urine indicates:",["Conjugated bilirubin (obstructive/hepatic disease)","Unconjugated bilirubin","Hemolysis only","Normal"],0,"Light destroys bilirubin; urobilinogen increased in hemolysis and hepatocellular disease, absent in biliary obstruction.","U1","old"],[5,"A positive blood dipstick with no RBCs on microscopic exam suggests:",["Hemoglobinuria or myoglobinuria","Hematuria","Bacteriuria","Normal"],0,"Hemoglobinuria: plasma pink (hemolysis); myoglobinuria: plasma clear (rhabdomyolysis). Lysed RBCs in alkaline/dilute urine also react.","U1","old"],[5,"A positive leukocyte esterase and positive nitrite suggest:",["Bacterial UTI","Glomerulonephritis","Contamination only","Dehydration"],0,"Nitrite requires nitrate-reducing bacteria (Enterobacterales) and 4 h bladder incubation; gram-positive cocci are nitrite negative.","U1","old"],[5,"RBC casts are found in:",["Glomerulonephritis","Pyelonephritis","Cystitis","Normal"],0,"WBC casts: pyelonephritis/interstitial nephritis. Fatty casts: nephrotic syndrome (oval fat bodies, Maltese cross under polarized light). Waxy casts: chronic renal failure. Broad casts: renal stasis.","U2","old"],[5,"Hyaline casts are composed of:",["Tamm-Horsfall protein","Cells","Fat","Crystals"],0,"Seen in normal individuals after exercise, dehydration; best seen with reduced light/phase contrast.","U2","old"],[5,"Urine crystals that are coffin-lid shaped, found in alkaline urine:",["Triple phosphate (struvite)","Uric acid","Calcium oxalate","Cystine"],0,"Associated with urease-producing bacteria (Proteus).","U2","old"],[5,"Hexagonal crystals in acid urine suggest:",["Cystine","Cholesterol","Leucine","Tyrosine"],0,"Positive cyanide-nitroprusside test confirms cystine; cystinuria.","U2","old"],[5,"Envelope-shaped calcium oxalate crystals are seen after ingestion of:",["Ethylene glycol or vitamin C/spinach","Penicillin","Aspirin","Alcohol"],0,"Monohydrate (oval/dumbbell) in ethylene glycol poisoning.","U2","old"],[5,"Which crystals are seen in liver disease?",["Leucine and tyrosine","Uric acid","Cystine","Calcium oxalate"],0,"Leucine: spheres with concentric rings; tyrosine: fine needles in sheaves.","U2","old"],[5,"Transitional epithelial cells come from:",["Bladder/renal pelvis/ureters","Vagina","Proximal tubule","Urethra only"],0,"Renal tubular epithelial cells (RTE) are most significant clinically; squamous cells indicate contamination.","U2","old"],[5,"Oval fat bodies are:",["Lipid-containing RTE cells, Maltese cross polarized","WBCs","Bacteria","Yeast"],0,"Nephrotic syndrome: heavy proteinuria (>3.5 g/day), hypoalbuminemia, lipiduria.","U3","old"],[5,"Cerebrospinal fluid collected in 3 tubes: tube 1 is used for:",["Chemistry/serology","Hematology","Microbiology","Cytology"],0,"Tube 1: chemistry/serology (most contaminated by blood/tissue); tube 2: microbiology; tube 3: cell count/differential (least cellular contamination).","U4","old"],[5,"A CSF glucose that is LOW with high neutrophils and high protein suggests:",["Bacterial meningitis","Viral meningitis","Normal","Subarachnoid hemorrhage only"],0,"Viral: normal glucose, lymphocytosis, mildly elevated protein. Fungal/TB: low glucose, lymphocytes.","U4","old"],[5,"Xanthochromia in CSF supports:",["Subarachnoid hemorrhage (RBC breakdown)","Traumatic tap","Viral meningitis","Normal"],0,"Traumatic tap: clearing between tubes 1 to 3, no xanthochromia; clot may form.","U4","old"],[5,"To lyse RBCs before a CSF WBC count, the diluent is:",["3% acetic acid","Normal saline","Methylene blue only","Formalin"],0,"Acetic acid lyses RBCs for the WBC count; saline is used when counting RBCs. Count in a Neubauer chamber.","U4","old"],[5,"Seminal fluid analysis: normal sperm concentration (WHO 2021 lower reference) is at least about:",["16 million/mL","60 million/mL","5 million/mL","100 million/mL"],0,"Older criteria: ≥20 million/mL. Volume ≥1.4 mL, motility ≥42% total (30% progressive), morphology ≥4% normal (strict). Liquefaction within 60 minutes.","U4","old"],[5,"Synovial fluid with crystals shaped like needles, negatively birefringent (yellow when parallel to the compensator axis) is:",["Monosodium urate (gout)","Calcium pyrophosphate","Cholesterol","Cystine"],0,"Memory: MSU = negative birefringence = needle; CPPD (pseudogout) = rhomboid, positive birefringence (blue when parallel).","U4","old"],[5,"Pleural fluid is an exudate if (Light’s criteria):",["Fluid/serum protein >0.5, fluid/serum LD >0.6, or fluid LD >2/3 upper limit","Protein <3 g/dL","LD <200","Clear appearance"],0,"Transudate: CHF, cirrhosis, nephrotic syndrome (low protein). Exudate: infection, malignancy.","U4","old"],[5,"Amniotic fluid lecithin:sphingomyelin ratio of ≥2.0 indicates:",["Fetal lung maturity","Fetal distress","Neural tube defect","Hemolytic disease"],0,"Phosphatidylglycerol presence also indicates maturity; lamellar body count ≥50,000/µL.","U4","old"],[5,"A normal fecal fat quantitation on 72-h collection is less than:",["7 g/24 h","20 g/24 h","50 g/24 h","1 g/24 h"],0,"Steatorrhea indicates malabsorption; Sudan III stain for fat droplets.","U4","old"],[6,"The Levey-Jennings chart plots:",["Control values over time against mean and ±SD limits","Patient results only","Reagent lot numbers","Turnaround time"],0,"QC chart; Westgard rules assess shifts/trends.","L1","old"],[6,"Which Westgard rule indicates RANDOM error?",["1-3s and R-4s","2-2s","4-1s","10x"],0,"Systematic error: 2-2s, 4-1s, 10x. Random error: 1-3s, R-4s. 1-2s is a warning rule.","L1","old"],[6,"A 'shift' in QC data is:",["Six or more consecutive values on one side of the mean","One value >3SD","Random scatter","Control out of range once"],0,"A shift = abrupt sustained change (new reagent lot, calibration); a trend = gradual drift in one direction (deteriorating reagent, light source).","L1","old"],[6,"Sensitivity of a test is defined as:",["True positives ÷ (true positives + false negatives)","True negatives ÷ (true negatives + false positives)","TP ÷ (TP + FP)","TN ÷ (TN + FN)"],0,"Specificity = TN/(TN+FP). PPV = TP/(TP+FP). NPV = TN/(TN+FN). Screening tests need high sensitivity; confirmatory tests high specificity.","L1","old"],[6,"Accuracy refers to closeness to the:",["True value","Replicate results","Mean","Reference range"],0,"Precision = reproducibility, measured by SD and CV% (CV = SD/mean × 100). Standard deviation of QC is based on at least 20 data points.","L1","old"],[6,"Reference intervals are usually set as:",["Mean ±2 SD (95% of healthy population)","±3 SD","Mean ±1 SD","Median only"],0,"Verify manufacturer ranges with at least 20 reference specimens; establish with at least 120.","L1","old"],[6,"Which agency issues CLIA regulations?",["CMS (Centers for Medicare and Medicaid Services)","OSHA","FDA only","CDC only"],0,"CLIA'88 sets quality standards for all lab testing on human specimens. Waived, moderate (PPM), and high complexity. CAP and Joint Commission may accredit (deemed status).","L2","old"],[6,"OSHA's Bloodborne Pathogens Standard requires:",["Universal/standard precautions, hepatitis B vaccine offered free, sharps containers","Annual HIV test for staff","Double gloves","No lab coats"],0,"Exposure incident: wash site, report immediately, post-exposure evaluation. Training annually.","L2","old"],[6,"The best disinfectant for blood spills is:",["Fresh 1:10 dilution of bleach (about 0.5% sodium hypochlorite)","70% alcohol only","Soap","Water"],0,"Dilution should be made fresh daily; wear PPE; absorb, clean, then disinfect.","L2","old"],[6,"In case of a chemical splash to the eyes, flush for at least:",["15 minutes","1 minute","5 minutes","30 seconds"],0,"Use eyewash station, then seek medical help. Consult the Safety Data Sheet (SDS).","L2","old"],[6,"The NFPA diamond: red section represents:",["Flammability","Health","Reactivity","Special hazards"],0,"Blue = health, red = fire, yellow = reactivity, white = special (e.g., W = water reactive, OX = oxidizer). Ratings 0-4.","L2","old"],[6,"The RACE acronym for fire stands for:",["Rescue, Alarm, Contain, Extinguish","Run, Alert, Call, Exit","Report, Act, Close, Evacuate","Remove, Alarm, Cover, End"],0,"PASS for extinguisher: Pull, Aim, Squeeze, Sweep. Class A: ordinary combustibles; B: flammable liquids; C: electrical; D: metals.","L2","old"],[6,"Specimens for blood cultures, order of draw (CLSI): which is first?",["Blood culture bottles/sterile tube","Light blue (citrate)","Red","Lavender"],0,"Order: blood cultures → light blue (citrate) → red/gold (serum) → green (heparin) → lavender (EDTA) → gray (fluoride/oxalate).","L3","old"],[6,"Which tube additive is used for coagulation testing?",["Sodium citrate 3.2% (9:1 blood to anticoagulant)","EDTA","Heparin","Sodium fluoride"],0,"Underfilled tube gives falsely prolonged PT/aPTT. Gray top inhibits glycolysis for glucose.","L3","old"],[6,"EDTA is used for:",["CBC and blood bank testing","Chemistry","Coagulation","Blood culture"],0,"EDTA chelates calcium; contaminated chemistry results show high K, low Ca, low ALP, low Mg.","L3","old"],[6,"Which specimen error falsely increases potassium?",["Hemolysis and delayed separation","Fasting","Refrigeration of plasma","Collection in gray top only"],0,"Fist clenching, tourniquet >1 min also increases K. Also increased: LD, AST, phosphorus.","L3","old"],[6,"A critical (panic) value must be:",["Reported immediately to the responsible clinician with read-back and documentation","Reported next day","Saved for rounds","Ignored if repeated"],0,"Document who, when, value, and read-back.","L5","old"],[6,"Proficiency testing under CLIA requires labs to:",["Analyze external samples several times a year and report results","Test their own controls only","Send samples to the vendor once","Skip for waived tests"],0,"Satisfactory performance is ≥80% per analyte; failures need corrective action.","L2","old"],[6,"Calibration verification is required at least every:",["6 months","Weekly","Daily","2 years"],0,"Also after major maintenance, reagent lot changes (if QC indicates), and when controls show unusual trends.","L4","old"],[6,"A delta check compares:",["A patient result with the previous result","Controls with mean","Two analyzers","Reagent lots"],0,"Used to detect specimen mix-ups or errors.","L1","old"],[6,"Which instrument principle is used by most automated hematology analyzers for cell counting?",["Electrical impedance (Coulter) and light scatter","Spectrophotometry only","Turbidity","Nephelometry"],0,"Hemoglobin measured by cyanmethemoglobin/SLS spectrophotometry; Hct calculated (RBC × MCV).","L4","old"],[6,"The MCV is calculated as:",["Hct × 10 ÷ RBC count","Hgb × 10 ÷ RBC","Hgb ÷ Hct × 100","Hct ÷ Hgb"],0,"MCH = Hgb × 10 ÷ RBC; MCHC = Hgb ÷ Hct × 100. Normal MCV 80-100 fL.","L3","old"],[6,"PCR amplification cycles consist of:",["Denaturation, annealing, extension","Annealing, ligation, transcription","Digestion, fusion, binding","Hybridization only"],0,"Reverse transcriptase PCR converts RNA to cDNA; real-time PCR monitors amplification by fluorescence; contamination control requires separate pre/post-amplification areas.","L4","old"],[6,"Fluorescence in situ hybridization (FISH) detects:",["Specific chromosomal abnormalities with fluorescent probes","Antibodies","Enzymes","Cell size"],0,"Used for BCR-ABL, HER2, PML-RARA, etc.","L4","old"],[6,"Which type of error is a transcription (clerical) mistake?",["Pre-analytical or post-analytical error","Analytical error only","Random error","Systematic error only"],0,"Most lab errors occur in the pre-analytic phase (identification, collection, transport).","L5","old"],[6,"Quality assurance includes:",["Pre-analytic, analytic and post-analytic quality control","Analytic QC only","Billing","Only proficiency tests"],0,"Includes competency assessment, equipment maintenance, corrective action, and documentation.","L5","old"],[6,"Competency assessment of employees must be done at:",["Six months and annually after the first year for new employees (CLIA)","Every 5 years","Only at hire","Never required"],0,"Six elements: direct observation, monitoring recording/reporting, review of records, direct observation of maintenance, testing known specimens, problem solving.","L5","old"],[6,"A technologist finds a control outside ±3SD. The first step is to:",["Stop reporting patient results, troubleshoot, and repeat control","Report patient results anyway","Change the mean","Discard the QC chart"],0,"Check for reagent/calibrator problems, then rerun; document corrective action; review patient results since the last acceptable QC.","L1","old"],[6,"Which blood product storage alarm limits apply to blood bank refrigerators?",["1-6 °C with continuous recording and alarm","4-10 °C","-5 to 5 °C","10-15 °C"],0,"Thermometers must be calibrated; alarm should sound before reaching unacceptable temperature.","L2","old"],[6,"The cyanmethemoglobin method for hemoglobin measures at:",["540 nm","340 nm","620 nm","280 nm"],0,"Measures all hemoglobins except sulfhemoglobin; Drabkin reagent; standard curve.","L4","old"],[0,"An automated CBC reports Hgb 9.0 g/dL, RBC 3.0 ×10¹²/L and Hct 27%. What is the MCV?",["90 fL","30 fL","100 fL","33 fL"],0,"MCV = Hct × 10 ÷ RBC = 27 × 10 ÷ 3.0 = 90 fL (normocytic). MCH is 30 pg and MCHC about 33 g/dL.","H1","new"],[0,"A patient has Hgb 7.5 g/dL, Hct 25% and RBC 4.2 ×10¹²/L. Which description fits the indices?",["Microcytic, hypochromic","Normocytic, normochromic","Macrocytic, normochromic","Microcytic, hyperchromic"],0,"MCV = 25 × 10 ÷ 4.2 ≈ 60 fL (low). MCHC = 7.5 ÷ 25 × 100 = 30 g/dL (low). Both low = microcytic, hypochromic.","H1","new"],[0,"A patient's Hct is 30% and the reticulocyte count is 6.0%. What is the corrected reticulocyte count (normal Hct 45%)?",["4.0%","6.0%","9.0%","2.0%"],0,"Corrected retic = 6.0 × (30 ÷ 45) = 4.0%. Anemia makes the raw percent look higher than the true output.","H1","new"],[0,"Which maturation stage is the last one with a nucleus in the normal red cell series?",["Orthochromic normoblast","Polychromatic normoblast","Reticulocyte","Basophilic normoblast"],0,"The orthochromic normoblast extrudes its nucleus and becomes a reticulocyte. Hemoglobin synthesis begins at the polychromatic stage.","H1","new"],[0,"WBC is 8.0 ×10⁹/L. The differential shows 55% segmented neutrophils and 5% bands. What is the absolute neutrophil count?",["4.8 ×10⁹/L","4.4 ×10⁹/L","0.4 ×10⁹/L","5.5 ×10⁹/L"],0,"ANC = WBC × (segs + bands) = 8.0 × 0.60 = 4.8 ×10⁹/L.","H1","new"],[0,"A manual WBC count uses a 1:20 dilution. A total of 40 cells are counted in the 4 large corner squares (each 1 mm², depth 0.1 mm). What is the WBC count?",["2.0 ×10⁹/L","0.2 ×10⁹/L","8.0 ×10⁹/L","20 ×10⁹/L"],0,"WBC/µL = cells × dilution ÷ (area × depth) = 40 × 20 ÷ (4 × 0.1) = 2000/µL = 2.0 ×10⁹/L.","H1","new"],[0,"A 28-year-old woman with heavy menses has Hgb 8.0 g/dL, MCV 68 fL, RDW 19%, serum ferritin 8 ng/mL and high TIBC. What is the most likely diagnosis?",["Iron deficiency anemia","Beta-thalassemia minor","Anemia of chronic disease","Sideroblastic anemia"],0,"Low MCV, high RDW, low ferritin and high TIBC point to iron deficiency. Thalassemia minor has a normal RDW and normal/high iron.","H2","new"],[0,"A patient has macrocytic anemia with hypersegmented neutrophils. Serum homocysteine is high and methylmalonic acid (MMA) is normal. This pattern supports:",["Folate deficiency","Vitamin B12 deficiency","Iron deficiency","Aplastic anemia"],0,"Homocysteine rises in both folate and B12 deficiency. MMA rises only in B12 deficiency. High homocysteine with normal MMA = folate deficiency.","H2","new"],[0,"A bone marrow Prussian blue stain shows ringed sideroblasts. Serum iron and ferritin are high. What is the most likely diagnosis?",["Sideroblastic anemia","Iron deficiency anemia","Thalassemia minor","Megaloblastic anemia"],0,"Mitochondrial iron accumulation around the nucleus defines ringed sideroblasts. Causes: lead, isoniazid, alcohol, myelodysplasia.","H2","new"],[0,"Alkaline hemoglobin electrophoresis on a 22-year-old shows 90% Hgb S, 8% Hgb F, 2% Hgb A2 and no Hgb A. What is the most likely diagnosis?",["Sickle cell anemia (Hgb SS)","Sickle cell trait","Hgb SC disease","Beta-thalassemia major"],0,"No Hgb A and mostly S = homozygous SS. Sickle trait has more A than S. SC disease shows S and C in roughly equal amounts.","H3","new"],[0,"A newborn has hydrops fetalis. Hemoglobin electrophoresis shows mostly a fast-moving band identified as Hgb Bart’s. This indicates:",["Deletion of all four alpha-globin genes","Beta-thalassemia major","Hgb H disease","Sickle cell anemia"],0,"Hgb Bart’s = gamma tetramers. No alpha chains are made, so Hgb Bart’s dominates and is incompatible with life without intervention.","H3","new"],[0,"Which finding best supports INTRAVASCULAR hemolysis?",["Hemosiderinuria","Splenomegaly","Spherocytes on the smear","Raised reticulocyte count"],0,"Free hemoglobin in plasma is filtered by the kidney. Hemoglobinuria and hemosiderinuria, with very low haptoglobin, indicate intravascular destruction.","H3","new"],[0,"A 5-year-old has petechiae two weeks after a viral illness. Platelets are 12 ×10⁹/L, large platelets are seen, Hgb and WBC are normal. What is the most likely diagnosis?",["Immune thrombocytopenic purpura","TTP","Aplastic anemia","DIC"],0,"Isolated thrombocytopenia with large platelets and increased marrow megakaryocytes fits ITP. TTP has schistocytes and organ signs.","H5","new"],[0,"An automated platelet count is 18 ×10⁹/L, but the patient has no bleeding. The smear shows platelet clumps. What is the best next step?",["Recollect in sodium citrate and recount","Report the result as a critical value","Transfuse platelets","Repeat the count after warming the EDTA tube to 56 °C"],0,"EDTA-dependent clumping causes pseudothrombocytopenia. Recollect in citrate (and correct for dilution) or count on a fingerstick.","H5","new"],[0,"Platelet count is normal, aPTT is slightly prolonged, and PFA closure times are prolonged. Ristocetin cofactor activity is low. What is the most likely diagnosis?",["Von Willebrand disease","Hemophilia A","Glanzmann thrombasthenia","Bernard-Soulier syndrome"],0,"vWF supports platelet adhesion and carries factor VIII. Low ristocetin cofactor activity with a long closure time fits vWD.","H5","new"],[0,"A patient who took aspirin yesterday has a platelet aggregation study. Which agonist is most likely to show absent aggregation?",["Arachidonic acid","Ristocetin","Thrombin","Calcium"],0,"Aspirin irreversibly blocks cyclooxygenase, so thromboxane A2 is not made. Ristocetin-induced agglutination depends on vWF and GPIb, which aspirin leaves intact.","H5","new"],[0,"Results: PT 35 s (ref 12), aPTT 70 s (ref 30), fibrinogen 40 mg/dL, platelets 35 ×10⁹/L, D-dimer markedly high, schistocytes on smear. This pattern indicates:",["DIC","Hemophilia A","Vitamin K deficiency only","Von Willebrand disease"],0,"DIC: prolonged PT and aPTT, low platelets, low fibrinogen, high D-dimer, schistocytes.","H6","new"],[0,"A boy with joint bleeds has a prolonged aPTT that corrects on a 1:1 mix. PT is normal. Which factor is most likely deficient?",["Factor VIII","Factor VII","Factor XIII","Factor II"],0,"Isolated aPTT prolongation that corrects with mixing = intrinsic factor deficiency. Joint bleeding in a male child suggests hemophilia A (VIII) or B (IX).","H6","new"],[0,"PT is 18 s, the mean normal PT is 12 s and the ISI is 1.2. What is the INR?",["1.6","1.5","1.8","2.0"],0,"INR = (18 ÷ 12)^1.2 = 1.5^1.2 ≈ 1.63, so 1.6.","H6","new"],[0,"A prolonged aPTT does not correct after a 1:1 mix with normal plasma. The patient has had two miscarriages and a DVT. Which test best confirms the suspected cause?",["Dilute Russell viper venom time with confirmation","Factor VIII assay only","Bleeding time","Reptilase time"],0,"Failure to correct = inhibitor. Lupus anticoagulant is a thrombotic, not bleeding, inhibitor. Confirm with dRVVT or a platelet neutralization procedure.","H6","new"],[0,"An automated analyzer reports RBC 2.0 ×10¹²/L, MCV 130 fL and MCHC 40 g/dL. The smear shows RBC clumping. What should the technologist do?",["Warm the specimen to 37 °C and rerun","Report the results as is","Add more EDTA","Dilute the sample 1:2 with water"],0,"Cold agglutinins clump cells and give a falsely low RBC and high MCV and MCHC. Warming to 37 °C disperses the clumps.","H7","new"],[0,"A patient with WBC 100 ×10⁹/L has an MCHC of 38 g/dL and normal-looking red cells. What is the likely explanation?",["Falsely increased hemoglobin from turbidity of the extreme leukocytosis","True hyperchromia","Hereditary spherocytosis","Cold agglutinins"],0,"Very high WBC counts, lipemia and paraproteins cause turbidity, giving a falsely high Hgb and MCHC. Spin the plasma and replace it with saline to confirm.","H7","new"],[0,"The WBC count is 10.0 ×10⁹/L and 25 nucleated RBCs are seen per 100 WBCs. What is the corrected WBC count?",["8.0 ×10⁹/L","7.5 ×10⁹/L","12.5 ×10⁹/L","10.0 ×10⁹/L"],0,"Corrected WBC = 10.0 × 100 ÷ (100 + 25) = 8.0 ×10⁹/L. Analyzers count nRBCs as WBCs.","H7","new"],[0,"A Westergren ESR tube is left tilted at about 3 degrees. Compared with a vertical tube, the result will be:",["Falsely increased","Falsely decreased","Unchanged","Invalid and cannot be read"],0,"Tilting speeds sedimentation. Other causes of a falsely high ESR: room temperature too high, vibration. Delay over 2 hours at room temperature lowers it.","H7","new"],[0,"The thrombin time is prolonged and the reptilase time is normal. Which explanation fits?",["Heparin contamination","Hypofibrinogenemia","Dysfibrinogenemia","Factor VIII deficiency"],0,"Reptilase is not affected by heparin, but thrombin time is. Both are prolonged in fibrinogen deficiency or dysfibrinogenemia.","H8","new"],[0,"A light-blue tube was filled only halfway. What effect is expected on the PT and aPTT?",["Falsely prolonged","Falsely shortened","No effect","Only PT changes"],0,"Too much citrate relative to plasma binds more calcium added at testing, which prolongs clotting times. Fill to the line (9:1).","H8","new"],[0,"A patient has Hct 65%. Coagulation results are prolonged and inconsistent with the clinical picture. What is the most likely cause?",["Excess citrate relative to the small plasma volume","Heparin contamination","Factor VII deficiency","Vitamin K deficiency"],0,"With a very high Hct there is less plasma in a standard tube, so the citrate ratio is too high. Reduce the anticoagulant volume as the lab’s procedure directs.","H8","new"],[0,"A smear shows many spherocytes. MCHC is 37 g/dL, DAT is negative, and the patient’s father had a splenectomy. What is the most likely diagnosis?",["Hereditary spherocytosis","Warm autoimmune hemolytic anemia","Iron deficiency","Thalassemia major"],0,"DAT-negative spherocytes with raised MCHC and family history = hereditary spherocytosis. Confirm with osmotic fragility or eosin-5-maleimide binding.","H8","new"],[0,"WBC 45 ×10⁹/L with toxic granulation and Döhle bodies, no basophilia, LAP score high, patient has pneumonia. What is the diagnosis?",["Leukemoid reaction","Chronic myeloid leukemia","Acute myeloid leukemia","Chronic lymphocytic leukemia"],0,"High LAP, toxic changes and infection indicate a reactive process. CML shows basophilia and a low LAP score.","H8","new"],[0,"A 28-year-old has WBC 85 ×10⁹/L with myelocytes, basophilia and platelets of 650 ×10⁹/L. LAP score is low. Which finding is expected?",["t(9;22) BCR-ABL","t(15;17) PML-RARA","t(8;14)","JAK2 only"],0,"Chronic myeloid leukemia: left shift with basophilia, low LAP, Philadelphia chromosome.","H4","new"],[0,"A bleeding patient with DIC has a smear full of abnormal promyelocytes with many Auer rods (faggot cells). Which translocation is expected?",["t(15;17)","t(9;22)","t(8;21)","inv(16)"],0,"Acute promyelocytic leukemia: t(15;17) PML-RARA, treated with all-trans retinoic acid.","H4","new"],[1,"A glucose standard of 100 mg/dL gives an absorbance of 0.250. A patient sample gives 0.500 under the same conditions. What is the patient’s result?",["200 mg/dL","50 mg/dL","100 mg/dL","400 mg/dL"],0,"Beer’s law: concentration is proportional to absorbance. 0.500 ÷ 0.250 × 100 = 200 mg/dL.","C1","new"],[1,"A solution transmits 10% of the light. What is its absorbance?",["1.0","0.1","2.0","0.9"],0,"A = 2 − log %T = 2 − log 10 = 1.0.","C1","new"],[1,"A glucose result is above the linear range (limit 600 mg/dL). A 1:4 dilution reads 150 mg/dL. What is the reportable result?",["600 mg/dL","150 mg/dL","450 mg/dL","750 mg/dL"],0,"Multiply by the dilution factor: 150 × 4 = 600 mg/dL.","C1","new"],[1,"A lipemic sample gives a sodium of 125 mmol/L by indirect ISE. Serum osmolality is normal. What is the best explanation and action?",["Pseudohyponatremia; confirm with direct ISE","True hyponatremia; start treatment","Hemolysis; recollect","Instrument calibration failure only"],0,"Indirect ISE dilutes the sample and assumes normal water content. Lipids or protein displace water, so sodium reads falsely low. Direct ISE avoids the error.","C1","new"],[1,"Fasting glucose is 118 mg/dL and the 2-hour OGTT is 165 mg/dL. Which category applies?",["Prediabetes (impaired fasting glucose and impaired glucose tolerance)","Diabetes mellitus","Normal","Gestational diabetes"],0,"IFG is 100-125 mg/dL fasting; IGT is 140-199 mg/dL at 2 h. Diabetes needs fasting ≥126 or 2-h ≥200.","C2","new"],[1,"A whole-blood tube for glucose sits unspun at room temperature for 3 hours. What is the expected effect?",["Falsely decreased glucose","Falsely increased glucose","No change","Falsely increased potassium only"],0,"Glycolysis by cells lowers glucose about 5-7% per hour. Use a gray-top (fluoride) tube or separate the plasma promptly.","C2","new"],[1,"A child has glucose 450 mg/dL, positive urine ketones and blood pH 7.1. Which pattern is expected?",["Low bicarbonate, high anion gap","High bicarbonate, normal anion gap","Normal pH with respiratory acidosis","Low anion gap"],0,"Diabetic ketoacidosis is a high anion gap metabolic acidosis from ketoacids. Serum potassium is often high even though total body potassium is low.","C2","new"],[1,"A patient’s HbA1c is 8.0%. What is the approximate estimated average glucose?",["183 mg/dL","126 mg/dL","240 mg/dL","154 mg/dL"],0,"eAG = 28.7 × A1c − 46.7 = 28.7 × 8.0 − 46.7 ≈ 183 mg/dL.","C2","new"],[1,"A patient has glucose 38 mg/dL with high insulin and LOW C-peptide. What is the most likely cause?",["Exogenous insulin administration","Insulinoma","Sulfonylurea use","Starvation"],0,"Endogenous insulin comes with C-peptide. High insulin with low C-peptide means insulin was injected. Insulinoma and sulfonylureas give high insulin and high C-peptide.","C2","new"],[1,"Serum creatinine is 1.0 mg/dL. A 24-hour urine (1440 mL) has creatinine 100 mg/dL. Patient surface area is 1.73 m². What is the creatinine clearance?",["100 mL/min","50 mL/min","144 mL/min","1.0 mL/min"],0,"Urine volume 1440 mL ÷ 1440 min = 1 mL/min. CrCl = U × V ÷ P = 100 × 1 ÷ 1.0 = 100 mL/min. BSA is already 1.73, so no correction.","C3","new"],[1,"Serum protein electrophoresis shows low albumin, elevated alpha-2 globulin and low gamma globulin. Which condition fits?",["Nephrotic syndrome","Multiple myeloma","Cirrhosis","Acute inflammation"],0,"Albumin and IgG are lost in the urine; large alpha-2 macroglobulin stays in the blood. Cirrhosis shows beta-gamma bridging.","C3","new"],[1,"BUN is 60 mg/dL and creatinine is 1.1 mg/dL. Which cause is most likely?",["Prerenal azotemia such as dehydration","Acute tubular necrosis","Postrenal obstruction with normal flow","Muscle injury"],0,"BUN:creatinine of about 55 is well above 20, pointing to a prerenal cause (volume depletion, GI bleed, heart failure).","C3","new"],[1,"Which handling is required for a plasma ammonia specimen?",["Place on ice, separate promptly and analyze within about 20 minutes","Keep at room temperature for several hours","Freeze after 2 days","Use a fluoride tube left unspun"],0,"Red cell metabolism and amino acid breakdown raise ammonia in vitro. Use heparin or EDTA, chill, and analyze quickly. Avoid hemolysis and smoking.","C3","new"],[1,"A diabetic patient’s albumin excretion is 150 mg/24 h on two samples. What does this represent?",["Microalbuminuria, an early sign of diabetic nephropathy","Normal excretion","Nephrotic range proteinuria","Bence Jones proteinuria"],0,"Microalbuminuria is 30-300 mg/day. Standard dipsticks are not sensitive enough at this level.","C3","new"],[1,"A patient presents 5 days after chest pain. Which cardiac marker is most likely still elevated?",["Troponin I","CK-MB","Myoglobin","Total CK"],0,"Troponin stays elevated 7-14 days. CK-MB returns to normal in 48-72 h and myoglobin within about a day.","C4","new"],[1,"After a crush injury a patient has CK 25,000 U/L, high AST and LD, and a urine dipstick positive for blood with no RBCs. What is the most likely diagnosis?",["Rhabdomyolysis","Hemolytic anemia","Acute myocardial infarction","Viral hepatitis"],0,"Muscle breakdown releases CK and myoglobin. Myoglobinuria reacts on the blood pad without RBCs and plasma stays clear, unlike hemoglobinuria.","C4","new"],[1,"A patient has AST 220 U/L, ALT 90 U/L and elevated GGT. Which cause is most likely?",["Alcoholic liver disease","Viral hepatitis","Biliary obstruction only","Myocardial infarction"],0,"An AST:ALT ratio above 2 with raised GGT suggests alcohol-related injury. Viral hepatitis typically has ALT ≥ AST.","C4","new"],[1,"Blood gas: pH 7.25, pCO2 30 mmHg, HCO3 12 mmol/L. What is the interpretation?",["Metabolic acidosis with respiratory compensation","Respiratory acidosis","Metabolic alkalosis","Respiratory alkalosis"],0,"Low pH and low bicarbonate = metabolic acidosis. The low pCO2 is the lungs compensating.","C5","new"],[1,"Blood gas: pH 7.52, pCO2 28 mmHg, HCO3 22 mmol/L. What is the interpretation?",["Acute respiratory alkalosis","Metabolic alkalosis","Respiratory acidosis","Compensated metabolic acidosis"],0,"High pH with low pCO2 and near-normal bicarbonate = acute hyperventilation.","C5","new"],[1,"Blood gas: pH 7.50, pCO2 48 mmHg, HCO3 36 mmol/L in a patient with prolonged vomiting. What is the interpretation?",["Metabolic alkalosis with respiratory compensation","Respiratory alkalosis","Respiratory acidosis","Metabolic acidosis"],0,"High pH and high bicarbonate = metabolic alkalosis. The raised pCO2 is hypoventilation compensating.","C5","new"],[1,"Na 140, Cl 100, HCO3 10 mmol/L. What is the anion gap, and what does it suggest?",["30; high gap metabolic acidosis","10; normal gap","40; respiratory acidosis","20; metabolic alkalosis"],0,"AG = Na − (Cl + HCO3) = 140 − 110 = 30. A gap above about 12 suggests lactic acidosis, ketoacidosis, uremia or toxins (MUDPILES).","C5","new"],[1,"TC 240 mg/dL, HDL 40 mg/dL, TG 150 mg/dL. What is the calculated LDL (Friedewald)?",["170 mg/dL","200 mg/dL","160 mg/dL","130 mg/dL"],0,"LDL = TC − HDL − TG/5 = 240 − 40 − 30 = 170 mg/dL.","C6","new"],[1,"A fasting triglyceride result is 520 mg/dL. What is the correct way to report LDL?",["Use direct LDL measurement; Friedewald is invalid above 400 mg/dL","Use Friedewald anyway","Report LDL as zero","Divide TG by 10"],0,"Friedewald assumes VLDL-C = TG/5 and fails with TG over 400 mg/dL.","C6","new"],[1,"ALP 450 U/L, GGT 380 U/L, direct bilirubin 8 mg/dL, pale stools, bilirubin positive in urine. What is the most likely condition?",["Obstructive (post-hepatic) jaundice","Hemolytic jaundice","Gilbert syndrome","Physiologic neonatal jaundice"],0,"Conjugated bilirubin backs up and spills into the urine. Without bile pigments reaching the gut, stools are pale and urobilinogen is absent.","C6","new"],[1,"A patient has hypertension, hypokalemia, high aldosterone and low renin. What is the most likely diagnosis?",["Primary hyperaldosteronism (Conn syndrome)","Secondary hyperaldosteronism","Addison disease","Cushing disease"],0,"Primary aldosterone excess suppresses renin. Secondary hyperaldosteronism has high renin.","C7","new"],[1,"Calcium is 12.5 mg/dL, PTH is suppressed and PTH-related peptide is elevated. What is the most likely cause?",["Malignancy-associated hypercalcemia","Primary hyperparathyroidism","Vitamin D deficiency","Hypoparathyroidism"],0,"In primary hyperparathyroidism PTH is high. Low PTH with high calcium points to a non-parathyroid cause such as PTHrP-secreting tumors.","C7","new"],[1,"A digoxin level is requested. When should the sample be collected?",["At least 6-8 hours after the last dose","30 minutes after the dose","Immediately after the dose","Any time; timing does not matter"],0,"Digoxin needs time to distribute out of plasma. Early samples read falsely high.","C8","new"],[1,"A lithium level is unexpectedly high in a patient on a low dose. The sample was drawn into a green-top tube. What is the likely cause?",["Contamination from lithium heparin","Hemolysis","Dilution with saline","Instrument drift"],0,"Lithium heparin adds lithium to the sample. Use sodium heparin or a plain serum tube for lithium testing.","C8","new"],[1,"A patient has tinnitus, fever and hyperventilation. Blood gas shows respiratory alkalosis and later metabolic acidosis. Which drug is the most likely cause?",["Salicylate","Acetaminophen","Digoxin","Lithium"],0,"Salicylate stimulates the respiratory center, then uncouples oxidative phosphorylation, causing a high anion gap acidosis.","C8","new"],[1,"A patient has a high anion gap acidosis, osmolal gap of 40 mOsm/kg and envelope-shaped crystals in urine. Which toxin is most likely?",["Ethylene glycol","Isopropanol","Acetaminophen","Carbon monoxide"],0,"Ethylene glycol: high osmolal gap early, high anion gap later, calcium oxalate crystals in urine, renal injury.","C8","new"],[1,"A smoker found unconscious has a normal pulse-oximeter reading but is cherry-red and dizzy. Which test confirms the cause?",["Co-oximetry for carboxyhemoglobin","Blood lactate only","Troponin","Methemoglobin by pulse oximetry"],0,"Standard pulse oximeters read COHb as oxyhemoglobin and give falsely normal values. Co-oximetry measures each hemoglobin species.","C8","new"],[1,"A potassium result of 6.8 mmol/L is reported on a grossly hemolyzed sample from an asymptomatic patient with a normal ECG. What is the best action?",["Recollect and rerun; do not report as valid","Report the result as critical","Treat with insulin and glucose","Report with no comment"],0,"Hemolysis releases intracellular potassium and gives spurious results. Recollect a properly drawn sample.","C9","new"],[1,"Glucose is 800 mg/dL and measured sodium is 125 mmol/L. What is the corrected sodium (add 1.6 mmol/L per 100 mg/dL glucose above 100)?",["About 136 mmol/L","About 125 mmol/L","About 150 mmol/L","About 114 mmol/L"],0,"Correction = 125 + 1.6 × (700 ÷ 100) = 125 + 11.2 ≈ 136 mmol/L. Hyperglycemia pulls water into the blood and dilutes sodium.","C9","new"],[1,"A patient taking high-dose biotin supplements has a low TSH and a high free T4 that do not fit the clinical picture. What is the most likely explanation?",["Biotin interference in the streptavidin-based immunoassay","True Graves disease","Hemolysis","Heterophile antibody only"],0,"Biotin interferes with streptavidin-biotin assays: sandwich assays (TSH) read falsely low, competitive assays (free T4) read falsely high.","C9","new"],[1,"A patient with a very large tumor has a serum hCG that reads unexpectedly low, but the clinical picture suggests a very high level. What is the best next step?",["Dilute the sample and repeat to check for the high-dose hook effect","Report the low result","Recalibrate immediately","Use a fluoride tube"],0,"Extreme antigen excess saturates both antibodies in sandwich assays and gives a falsely low reading. Dilution restores the correct value.","C9","new"],[1,"Which pattern suggests contamination of a serum sample with K2EDTA?",["High potassium, low calcium and low ALP","Low potassium, high calcium","High sodium, high glucose","Low potassium, low sodium"],0,"EDTA adds potassium and chelates calcium, magnesium and zinc (ALP needs zinc/magnesium). Typical cause: wrong order of draw.","C9","new"],[2,"Which sputum Gram stain result indicates an acceptable lower respiratory specimen?",[">25 neutrophils and <10 squamous epithelial cells per low-power field","<10 neutrophils and >25 squamous epithelial cells per low-power field","Only squamous epithelial cells","Many yeast and no WBCs"],0,"Squamous cells mean saliva contamination. Reject specimens with many squamous cells and few neutrophils.","M1","new"],[2,"A CSF Gram stain shows gram-negative diplococci inside neutrophils. Which medium and condition are most appropriate for culture?",["Chocolate agar at 35 °C in CO2","MacConkey agar in air","Sabouraud agar at 30 °C","Anaerobic CDC agar only"],0,"Suggests Neisseria meningitidis, a fastidious organism that needs enriched chocolate agar and CO2. Process immediately and do not refrigerate CSF.","M1","new"],[2,"Gram-positive cocci appear pink on a smear. Which technical error would cause this?",["Over-decolorization","Under-decolorization","Too little crystal violet","Too thick iodine"],0,"Prolonged alcohol/acetone washes crystal violet out of gram-positive cells. Old cultures also stain gram-negative. Under-decolorization makes gram-negatives look gram-positive.","M1","new"],[2,"After overnight incubation on MacConkey agar, a colony is colorless. What does this indicate?",["It does not ferment lactose","It ferments lactose","It cannot grow on bile salts","It is a gram-positive organism"],0,"MacConkey selects for gram-negative rods and differentiates by lactose fermentation. Pink colonies ferment lactose; colorless ones do not (Salmonella, Shigella, Proteus, Pseudomonas).","M1","new"],[2,"A catalase test is performed on colonies picked from a blood agar plate. Which error can occur?",["False positive from carried-over red blood cells","False negative from the hydrogen peroxide being too fresh","No error possible","Always correct on blood agar"],0,"RBCs contain catalase and give bubbling. Avoid picking agar or use a platinum wire or wooden stick on non-blood medium.","M1","new"],[2,"A urine culture is inoculated with a 0.001 mL calibrated loop and grows 45 colonies. What is the count?",["45,000 CFU/mL","4,500 CFU/mL","450 CFU/mL","450,000 CFU/mL"],0,"CFU/mL = colonies ÷ volume = 45 ÷ 0.001 = 45,000.","M1","new"],[2,"A urine isolate from a young woman is gram-positive cocci in clusters, catalase positive, coagulase negative and novobiocin resistant. What is it?",["Staphylococcus saprophyticus","Staphylococcus epidermidis"
