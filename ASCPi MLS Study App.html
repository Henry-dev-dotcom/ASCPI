ight=\"bold\" fill=\"#222\">Chains<\/text><text x=\"228\" y=\"222\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">Streptococcus, Enterococcus (+)<\/text><rect x=\"312\" y=\"127\" width=\"136\" height=\"112\" rx=\"8\" fill=\"#fff\" stroke=\"#ddd\" stroke-width=\"1\" /><ellipse cx=\"366\" cy=\"165\" rx=\"5\" ry=\"8\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" transform=\"rotate(0 366 165)\"/><ellipse cx=\"375\" cy=\"165\" rx=\"5\" ry=\"8\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" transform=\"rotate(0 375 165)\"/><ellipse cx=\"386\" cy=\"181\" rx=\"5\" ry=\"8\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" transform=\"rotate(0 386 181)\"/><ellipse cx=\"395\" cy=\"181\" rx=\"5\" ry=\"8\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" transform=\"rotate(0 395 181)\"/><text x=\"380\" y=\"207\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Lancet pairs<\/text><text x=\"380\" y=\"222\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">S. pneumoniae (+)<\/text><rect x=\"464\" y=\"127\" width=\"136\" height=\"112\" rx=\"8\" fill=\"#fff\" stroke=\"#ddd\" stroke-width=\"1\" /><path d=\"M513,150 q7,-8 14,0 q-3,8 -7,6 q-4,-1 -7,-6\" fill=\"#e0607e\" stroke=\"#222\" stroke-width=\"0.8\" /><path d=\"M513,166 q7,-8 14,0 q-3,8 -7,6 q-4,-1 -7,-6\" fill=\"#e0607e\" stroke=\"#222\" stroke-width=\"0.8\" /><path d=\"M537,156 q7,-8 14,0 q-3,8 -7,6 q-4,-1 -7,-6\" fill=\"#e0607e\" stroke=\"#222\" stroke-width=\"0.8\" /><path d=\"M537,172 q7,-8 14,0 q-3,8 -7,6 q-4,-1 -7,-6\" fill=\"#e0607e\" stroke=\"#222\" stroke-width=\"0.8\" /><text x=\"532\" y=\"207\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Kidney-bean<\/text><text x=\"532\" y=\"220\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">diplococci<\/text><text x=\"532\" y=\"235\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">Neisseria, Moraxella (−)<\/text><rect x=\"616\" y=\"127\" width=\"136\" height=\"112\" rx=\"8\" fill=\"#fff\" stroke=\"#ddd\" stroke-width=\"1\" /><rect x=\"660\" y=\"155\" width=\"6\" height=\"20\" rx=\"2\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" /><rect x=\"669\" y=\"158\" width=\"6\" height=\"20\" rx=\"2\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" /><rect x=\"678\" y=\"155\" width=\"6\" height=\"20\" rx=\"2\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" /><rect x=\"687\" y=\"158\" width=\"6\" height=\"20\" rx=\"2\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" /><rect x=\"696\" y=\"155\" width=\"6\" height=\"20\" rx=\"2\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" /><text x=\"684\" y=\"207\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Palisades,<\/text><text x=\"684\" y=\"220\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Chinese letters<\/text><text x=\"684\" y=\"235\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">Corynebacterium (+)<\/text><rect x=\"8\" y=\"267\" width=\"136\" height=\"112\" rx=\"8\" fill=\"#fff\" stroke=\"#ddd\" stroke-width=\"1\" /><rect x=\"46\" y=\"296\" width=\"26\" height=\"18\" rx=\"3\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" /><rect x=\"74\" y=\"296\" width=\"26\" height=\"18\" rx=\"3\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" /><ellipse cx=\"59\" cy=\"305\" rx=\"4\" ry=\"3\" fill=\"#fff\" stroke=\"none\" stroke-width=\"0\" transform=\"rotate(0 59 305)\"/><text x=\"76\" y=\"347\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Large boxcar rods<\/text><text x=\"76\" y=\"360\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">± spores<\/text><text x=\"76\" y=\"375\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">Clostridium, Bacillus (+)<\/text><rect x=\"160\" y=\"267\" width=\"136\" height=\"112\" rx=\"8\" fill=\"#fff\" stroke=\"#ddd\" stroke-width=\"1\" /><rect x=\"204\" y=\"293\" width=\"14\" height=\"6\" rx=\"3\" fill=\"#e0607e\" stroke=\"#222\" stroke-width=\"0.8\" /><rect x=\"222\" y=\"293\" width=\"14\" height=\"6\" rx=\"3\" fill=\"#e0607e\" stroke=\"#222\" stroke-width=\"0.8\" /><rect x=\"240\" y=\"293\" width=\"14\" height=\"6\" rx=\"3\" fill=\"#e0607e\" stroke=\"#222\" stroke-width=\"0.8\" /><rect x=\"204\" y=\"309\" width=\"14\" height=\"6\" rx=\"3\" fill=\"#e0607e\" stroke=\"#222\" stroke-width=\"0.8\" /><rect x=\"222\" y=\"309\" width=\"14\" height=\"6\" rx=\"3\" fill=\"#e0607e\" stroke=\"#222\" stroke-width=\"0.8\" /><rect x=\"240\" y=\"309\" width=\"14\" height=\"6\" rx=\"3\" fill=\"#e0607e\" stroke=\"#222\" stroke-width=\"0.8\" /><text x=\"228\" y=\"347\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Short rods<\/text><text x=\"228\" y=\"362\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">Enterobacterales, Pseudomonas (−)<\/text><rect x=\"312\" y=\"267\" width=\"136\" height=\"112\" rx=\"8\" fill=\"#fff\" stroke=\"#ddd\" stroke-width=\"1\" /><ellipse cx=\"360\" cy=\"295\" rx=\"7\" ry=\"5\" fill=\"#e0607e\" stroke=\"#222\" stroke-width=\"0.8\" transform=\"rotate(0 360 295)\"/><ellipse cx=\"380\" cy=\"295\" rx=\"7\" ry=\"5\" fill=\"#e0607e\" stroke=\"#222\" stroke-width=\"0.8\" transform=\"rotate(0 380 295)\"/><ellipse cx=\"400\" cy=\"295\" rx=\"7\" ry=\"5\" fill=\"#e0607e\" stroke=\"#222\" stroke-width=\"0.8\" transform=\"rotate(0 400 295)\"/><ellipse cx=\"360\" cy=\"313\" rx=\"7\" ry=\"5\" fill=\"#e0607e\" stroke=\"#222\" stroke-width=\"0.8\" transform=\"rotate(0 360 313)\"/><ellipse cx=\"380\" cy=\"313\" rx=\"7\" ry=\"5\" fill=\"#e0607e\" stroke=\"#222\" stroke-width=\"0.8\" transform=\"rotate(0 380 313)\"/><ellipse cx=\"400\" cy=\"313\" rx=\"7\" ry=\"5\" fill=\"#e0607e\" stroke=\"#222\" stroke-width=\"0.8\" transform=\"rotate(0 400 313)\"/><text x=\"380\" y=\"347\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Coccobacilli<\/text><text x=\"380\" y=\"362\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">Haemophilus, Acinetobacter (−)<\/text><rect x=\"464\" y=\"267\" width=\"136\" height=\"112\" rx=\"8\" fill=\"#fff\" stroke=\"#ddd\" stroke-width=\"1\" /><path d=\"M506,295 q5,-9 12,0\" fill=\"#e0607e\" stroke=\"#e0607e\" stroke-width=\"2.4\" /><path d=\"M524,307 q5,-9 12,0\" fill=\"#e0607e\" stroke=\"#e0607e\" stroke-width=\"2.4\" /><path d=\"M542,295 q5,-9 12,0\" fill=\"#e0607e\" stroke=\"#e0607e\" stroke-width=\"2.4\" /><text x=\"532\" y=\"347\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Curved / comma<\/text><text x=\"532\" y=\"362\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">Vibrio, Campylobacter (−)<\/text><rect x=\"616\" y=\"267\" width=\"136\" height=\"112\" rx=\"8\" fill=\"#fff\" stroke=\"#ddd\" stroke-width=\"1\" /><ellipse cx=\"676\" cy=\"305\" rx=\"10\" ry=\"8\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" transform=\"rotate(0 676 305)\"/><ellipse cx=\"694\" cy=\"299\" rx=\"5\" ry=\"4\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" transform=\"rotate(0 694 299)\"/><ellipse cx=\"678\" cy=\"321\" rx=\"8\" ry=\"6\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" transform=\"rotate(0 678 321)\"/><text x=\"684\" y=\"347\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Yeast (budding)<\/text><text x=\"684\" y=\"362\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">Candida (+)<\/text><text x=\"380\" y=\"452\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">Purple = Gram-positive.  Pink/red = Gram-negative.  Over-decolorizing makes gram-positives look pink; old cultures stain gram-variable.<\/text><\/svg><figcaption>Gram stain steps and the shapes you must recognize on a smear.<\/figcaption><\/figure><h3 id=\"stains\">Stains<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 47%\" />\n<col style=\"width: 52%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Stain<\/th>\n<th>Use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Gram<\/td>\n<td>Routine; purple = positive, pink = negative<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Acid-fast (Ziehl-Neelsen hot, Kinyoun cold)<\/td>\n<td>Mycobacteria, Nocardia (weakly), Cryptosporidium, Cyclospora<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Auramine-rhodamine<\/td>\n<td>Fluorescent acid-fast screen<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>India ink<\/td>\n<td>Cryptococcus capsule in CSF<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>KOH, calcofluor white<\/td>\n<td>Fungal elements<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Lactophenol cotton blue<\/td>\n<td>Fungal structures<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"culture-media\">Culture media<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 47%\" />\n<col style=\"width: 52%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Medium<\/th>\n<th>What it is for<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Blood agar<\/td>\n<td>General growth; shows hemolysis (alpha = green partial, beta = clear complete, gamma = none)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Chocolate agar<\/td>\n<td>Haemophilus and Neisseria (need X and V factors)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>MacConkey<\/td>\n<td>Gram-negative rods; lactose fermenters pink<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>EMB<\/td>\n<td>Gram-negative rods; E. coli has a green metallic sheen<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Hektoen, XLD, SS<\/td>\n<td>Salmonella and Shigella; H2S gives black colonies<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>CIN<\/td>\n<td>Yersinia enterocolitica (bull's-eye colony)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Thayer-Martin, Martin-Lewis<\/td>\n<td>Neisseria gonorrhoeae<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Campy-BAP at 42 degrees C, microaerophilic<\/td>\n<td>Campylobacter jejuni<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>TCBS<\/td>\n<td>Vibrio (V. cholerae yellow, V. parahaemolyticus green)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Mannitol salt<\/td>\n<td>S. aureus (yellow, mannitol positive)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Bile esculin<\/td>\n<td>Enterococcus and group D strep (black)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Regan-Lowe, Bordet-Gengou<\/td>\n<td>Bordetella pertussis<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Loeffler, Tinsdale<\/td>\n<td>Corynebacterium diphtheriae<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Lowenstein-Jensen, Middlebrook<\/td>\n<td>Mycobacteria<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Sabouraud dextrose<\/td>\n<td>Fungi<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>BCYE<\/td>\n<td>Legionella (needs cysteine and iron)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"basic-identification-tests\">Basic identification tests<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 28%\" />\n<col style=\"width: 71%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Test<\/th>\n<th>Principle and meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Catalase<\/td>\n<td>Bubbles with hydrogen peroxide: Staph (positive), Strep (negative)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Oxidase<\/td>\n<td>Cytochrome oxidase; purple color: Pseudomonas, Neisseria, Vibrio, Campylobacter<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Coagulase<\/td>\n<td>Clots plasma: S. aureus<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>PYR<\/td>\n<td>Group A strep and Enterococcus positive<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Urease<\/td>\n<td>Proteus, H. pylori, Cryptococcus, Brucella<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Indole<\/td>\n<td>Tryptophanase; red ring: E. coli, Proteus vulgaris<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Bile solubility<\/td>\n<td>S. pneumoniae dissolves in bile<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>DNase<\/td>\n<td>S. aureus, Serratia, Moraxella<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Hippurate<\/td>\n<td>Group B strep, Campylobacter jejuni<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Nitrate reduction<\/td>\n<td>Most Enterobacterales positive<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"giemsa-acridine-orange-and-other-stains\">Giemsa, acridine orange and other stains<\/h3>\n<ul>\n<li><p><strong>Giemsa:<\/strong> blood parasites, Chlamydia inclusions, intracellular Histoplasma.<\/p><\/li>\n<li><p><strong>Acridine orange:<\/strong> fluorescent stain that finds bacteria and fungi when the Gram stain is hard to read.<\/p><\/li>\n<li><p><strong>Modified acid-fast (weak acid, 1% H2SO4):<\/strong> Nocardia, Cryptosporidium, Cyclospora, Isospora.<\/p><\/li>\n<li><p><strong>Trichrome:<\/strong> intestinal protozoa in stool.<\/p><\/li>\n<\/ul>\n","min":5},{"id":"M2","sec":2,"title":"Gram-positive cocci","html":"<figure class=\"fig\" id=\"F16\"><svg viewBox=\"0 0 760 290\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Hemolysis\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"290\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Hemolysis patterns on blood agar<\/text><circle cx=\"130\" cy=\"110\" r=\"68\" fill=\"#b3302a\" stroke=\"#7a1f1a\" stroke-width=\"2\" /><circle cx=\"130\" cy=\"110\" r=\"30\" fill=\"#a9b36b\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"121.0\" cy=\"104.6\" r=\"3\" fill=\"#fff6d6\" stroke=\"#a89a5a\" stroke-width=\"0.7\" /><circle cx=\"137.2\" cy=\"101.0\" r=\"3\" fill=\"#fff6d6\" stroke=\"#a89a5a\" stroke-width=\"0.7\" /><circle cx=\"130.0\" cy=\"117.2\" r=\"3\" fill=\"#fff6d6\" stroke=\"#a89a5a\" stroke-width=\"0.7\" /><circle cx=\"119.2\" cy=\"119.0\" r=\"3\" fill=\"#fff6d6\" stroke=\"#a89a5a\" stroke-width=\"0.7\" /><circle cx=\"140.8\" cy=\"115.4\" r=\"3\" fill=\"#fff6d6\" stroke=\"#a89a5a\" stroke-width=\"0.7\" /><text x=\"130\" y=\"198\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Alpha (α)<\/text><text x=\"130\" y=\"213\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">partial: green zone<\/text><text x=\"130\" y=\"230\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">S. pneumoniae,<\/text><text x=\"130\" y=\"242\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">viridans strep<\/text><circle cx=\"380\" cy=\"110\" r=\"68\" fill=\"#b3302a\" stroke=\"#7a1f1a\" stroke-width=\"2\" /><circle cx=\"380\" cy=\"110\" r=\"30\" fill=\"#fbe9e0\" stroke=\"none\" stroke-width=\"0\" /><circle cx=\"371.0\" cy=\"104.6\" r=\"3\" fill=\"#fff6d6\" stroke=\"#a89a5a\" stroke-width=\"0.7\" /><circle cx=\"387.2\" cy=\"101.0\" r=\"3\" fill=\"#fff6d6\" stroke=\"#a89a5a\" stroke-width=\"0.7\" /><circle cx=\"380.0\" cy=\"117.2\" r=\"3\" fill=\"#fff6d6\" stroke=\"#a89a5a\" stroke-width=\"0.7\" /><circle cx=\"369.2\" cy=\"119.0\" r=\"3\" fill=\"#fff6d6\" stroke=\"#a89a5a\" stroke-width=\"0.7\" /><circle cx=\"390.8\" cy=\"115.4\" r=\"3\" fill=\"#fff6d6\" stroke=\"#a89a5a\" stroke-width=\"0.7\" /><text x=\"380\" y=\"198\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Beta (β)<\/text><text x=\"380\" y=\"213\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">complete: clear zone<\/text><text x=\"380\" y=\"230\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">S. pyogenes (group A),<\/text><text x=\"380\" y=\"242\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">S. agalactiae (group B), S. aureus<\/text><circle cx=\"630\" cy=\"110\" r=\"68\" fill=\"#b3302a\" stroke=\"#7a1f1a\" stroke-width=\"2\" /><circle cx=\"621.0\" cy=\"104.6\" r=\"3\" fill=\"#fff6d6\" stroke=\"#a89a5a\" stroke-width=\"0.7\" /><circle cx=\"637.2\" cy=\"101.0\" r=\"3\" fill=\"#fff6d6\" stroke=\"#a89a5a\" stroke-width=\"0.7\" /><circle cx=\"630.0\" cy=\"117.2\" r=\"3\" fill=\"#fff6d6\" stroke=\"#a89a5a\" stroke-width=\"0.7\" /><circle cx=\"619.2\" cy=\"119.0\" r=\"3\" fill=\"#fff6d6\" stroke=\"#a89a5a\" stroke-width=\"0.7\" /><circle cx=\"640.8\" cy=\"115.4\" r=\"3\" fill=\"#fff6d6\" stroke=\"#a89a5a\" stroke-width=\"0.7\" /><text x=\"630\" y=\"198\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Gamma (γ)<\/text><text x=\"630\" y=\"213\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">none: no change<\/text><text x=\"630\" y=\"230\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">Enterococcus (often),<\/text><text x=\"630\" y=\"242\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">S. bovis<\/text><\/svg><figcaption>Hemolysis on 5% sheep blood agar.<\/figcaption><\/figure><figure class=\"fig\" id=\"F17\"><svg viewBox=\"0 0 760 490\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"GPC flowchart\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"490\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Gram-positive cocci: identification path<\/text><rect x=\"300\" y=\"36\" width=\"160\" height=\"32\" rx=\"6\" fill=\"#e8dff3\" stroke=\"#6a3fa0\" stroke-width=\"1.3\" /><text x=\"380.0\" y=\"56.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Gram-positive cocci<\/text><rect x=\"110\" y=\"95\" width=\"160\" height=\"32\" rx=\"6\" fill=\"#fff3c4\" stroke=\"#a88a00\" stroke-width=\"1.3\" /><text x=\"190.0\" y=\"108.16666666666667\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Catalase POSITIVE<\/text><text x=\"190.0\" y=\"121.16666666666667\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">(Staphylococcus)<\/text><rect x=\"490\" y=\"95\" width=\"170\" height=\"32\" rx=\"6\" fill=\"#fff3c4\" stroke=\"#a88a00\" stroke-width=\"1.3\" /><text x=\"575.0\" y=\"108.16666666666667\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Catalase NEGATIVE<\/text><text x=\"575.0\" y=\"121.16666666666667\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">(Streptococcus, Enterococcus)<\/text><line x1=\"360\" y1=\"68\" x2=\"190\" y2=\"95\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"400\" y1=\"68\" x2=\"560\" y2=\"95\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"20\" y=\"170\" width=\"150\" height=\"40\" rx=\"6\" fill=\"#fdeceb\" stroke=\"#b42318\" stroke-width=\"1.3\" /><text x=\"95.0\" y=\"187.16666666666666\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Coagulase +<\/text><text x=\"95.0\" y=\"200.16666666666666\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">S. aureus<\/text><rect x=\"190\" y=\"170\" width=\"120\" height=\"40\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"250.0\" y=\"187.16666666666666\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Coagulase −<\/text><text x=\"250.0\" y=\"200.16666666666666\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">(CoNS)<\/text><line x1=\"150\" y1=\"127\" x2=\"95\" y2=\"170\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"230\" y1=\"127\" x2=\"250\" y2=\"170\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"150\" y=\"240\" width=\"120\" height=\"44\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"210.0\" y=\"259.1666666666667\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">Novobiocin S<\/text><text x=\"210.0\" y=\"272.1666666666667\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">S. epidermidis<\/text><rect x=\"282\" y=\"240\" width=\"132\" height=\"44\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"348.0\" y=\"259.1666666666667\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">Novobiocin R<\/text><text x=\"348.0\" y=\"272.1666666666667\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">S. saprophyticus<\/text><line x1=\"240\" y1=\"210\" x2=\"215\" y2=\"240\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"270\" y1=\"210\" x2=\"340\" y2=\"240\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"435\" y=\"170\" width=\"90\" height=\"40\" rx=\"6\" fill=\"#f5d6c8\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"480.0\" y=\"193.33333333333334\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Beta-hemolytic<\/text><rect x=\"535\" y=\"170\" width=\"90\" height=\"40\" rx=\"6\" fill=\"#d9e0a8\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"580.0\" y=\"193.33333333333334\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Alpha-hemolytic<\/text><rect x=\"635\" y=\"170\" width=\"90\" height=\"40\" rx=\"6\" fill=\"#e8e8e8\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"680.0\" y=\"193.33333333333334\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Gamma / variable<\/text><line x1=\"530\" y1=\"127\" x2=\"480\" y2=\"170\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"560\" y1=\"127\" x2=\"580\" y2=\"170\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"590\" y1=\"127\" x2=\"680\" y2=\"170\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"426\" y=\"250\" width=\"124\" height=\"64\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"488.0\" y=\"267.9166666666667\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">Bacitracin S, PYR+<\/text><text x=\"488.0\" y=\"279.4166666666667\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">= GAS (S. pyogenes)<\/text><text x=\"488.0\" y=\"290.9166666666667\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">Bacitracin R, CAMP+,<\/text><text x=\"488.0\" y=\"302.4166666666667\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">hippurate+ = GBS<\/text><line x1=\"480\" y1=\"210\" x2=\"488\" y2=\"250\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"558\" y=\"250\" width=\"104\" height=\"64\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"610.0\" y=\"267.9166666666667\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">Optochin S,<\/text><text x=\"610.0\" y=\"279.4166666666667\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">bile soluble =<\/text><text x=\"610.0\" y=\"290.9166666666667\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">S. pneumoniae<\/text><text x=\"610.0\" y=\"302.4166666666667\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">Optochin R = viridans<\/text><line x1=\"580\" y1=\"210\" x2=\"610\" y2=\"250\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"670\" y=\"230\" width=\"84\" height=\"86\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"712.0\" y=\"248.5\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">Bile esculin +<\/text><text x=\"712.0\" y=\"259.5\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">6.5% NaCl +<\/text><text x=\"712.0\" y=\"270.5\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">= Enterococcus<\/text><text x=\"712.0\" y=\"281.5\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\"><\/text><text x=\"712.0\" y=\"292.5\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">NaCl − =<\/text><text x=\"712.0\" y=\"303.5\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">S. bovis<\/text><line x1=\"690\" y1=\"210\" x2=\"712\" y2=\"230\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"20\" y=\"340\" width=\"720\" height=\"100\" rx=\"8\" fill=\"#f1efe6\" stroke=\"#ccc\" stroke-width=\"1\" /><text x=\"34\" y=\"362\" font-size=\"12\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Key points<\/text><text x=\"34\" y=\"382.0\" font-size=\"10.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">• S. aureus: coagulase +, mannitol fermenter, beta-hemolytic, MRSA = cefoxitin zone ≤21 mm.<\/text><text x=\"34\" y=\"400.0\" font-size=\"10.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">• GAS is PYR+ and bacitracin sensitive; GBS is CAMP+ and hippurate+ (neonatal sepsis, meningitis).<\/text><text x=\"34\" y=\"418.0\" font-size=\"10.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">• S. pneumoniae: lancet diplococci, optochin S, bile soluble, quellung +.  Viridans: endocarditis after dental work.<\/text><text x=\"34\" y=\"436.0\" font-size=\"10.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">• Enterococcus and S. bovis are both bile esculin +; only Enterococcus grows in 6.5% NaCl.<\/text><\/svg><figcaption>Identification path for Gram-positive cocci. Memorize the decision at each step.<\/figcaption><\/figure><h3 id=\"gram-positive-cocci\">Gram-positive cocci<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 35%\" />\n<col style=\"width: 64%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Organism<\/th>\n<th>Key tests and facts<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>S. aureus<\/td>\n<td>Catalase +, coagulase +, mannitol +; MRSA carries mecA<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>S. epidermidis<\/td>\n<td>Coagulase negative, novobiocin sensitive; skin contaminant, device infections<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>S. saprophyticus<\/td>\n<td>Coagulase negative, novobiocin resistant; urinary infections in young women<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>S. pyogenes (group A)<\/td>\n<td>Beta-hemolytic, bacitracin sensitive, PYR +; strep throat, rheumatic fever<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>S. agalactiae (group B)<\/td>\n<td>Beta-hemolytic, CAMP +, hippurate +; newborn sepsis and meningitis<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>S. pneumoniae<\/td>\n<td>Alpha-hemolytic, optochin sensitive, bile soluble, lancet-shaped diplococci<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Viridans streptococci<\/td>\n<td>Alpha-hemolytic, optochin resistant; endocarditis<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Enterococcus<\/td>\n<td>Bile esculin +, grows in 6.5% NaCl, PYR +; vancomycin resistance = VRE<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>S. bovis group<\/td>\n<td>Bile esculin +, no growth in 6.5% NaCl; colon cancer link<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n","min":3},{"id":"M3","sec":2,"title":"Enterobacterales","html":"<figure class=\"fig\" id=\"F18\"><svg viewBox=\"0 0 760 440\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Enterobacterales\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"440\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Enterobacterales: quick identification<\/text><rect x=\"250\" y=\"36\" width=\"260\" height=\"36\" rx=\"6\" fill=\"#fdeceb\" stroke=\"#b42318\" stroke-width=\"1.3\" /><text x=\"380.0\" y=\"51.166666666666664\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Gram-negative rod, oxidase NEGATIVE,<\/text><text x=\"380.0\" y=\"64.16666666666666\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">ferments glucose<\/text><rect x=\"70\" y=\"110\" width=\"220\" height=\"36\" rx=\"6\" fill=\"#f8dede\" stroke=\"#b45a5a\" stroke-width=\"1.3\" /><text x=\"180.0\" y=\"125.16666666666667\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Lactose FERMENTER<\/text><text x=\"180.0\" y=\"138.16666666666669\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">(pink on MacConkey)<\/text><rect x=\"470\" y=\"110\" width=\"220\" height=\"36\" rx=\"6\" fill=\"#e8e8e8\" stroke=\"#777\" stroke-width=\"1.3\" /><text x=\"580.0\" y=\"125.16666666666667\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Lactose NON-fermenter<\/text><text x=\"580.0\" y=\"138.16666666666669\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">(colorless on MacConkey)<\/text><line x1=\"340\" y1=\"72\" x2=\"180\" y2=\"110\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"420\" y1=\"72\" x2=\"580\" y2=\"110\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"30\" y=\"175\" width=\"300\" height=\"48\" rx=\"6\" fill=\"#fff\" stroke=\"#b45a5a\" stroke-width=\"1.3\" /><text x=\"42\" y=\"194\" font-size=\"12\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#8a2a2a\">E. coli<\/text><text x=\"42\" y=\"209.0\" font-size=\"9.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">indole +, MR +, VP −, citrate −; O157 sorbitol −<\/text><rect x=\"30\" y=\"230\" width=\"300\" height=\"48\" rx=\"6\" fill=\"#fff\" stroke=\"#b45a5a\" stroke-width=\"1.3\" /><text x=\"42\" y=\"249\" font-size=\"12\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#8a2a2a\">Klebsiella<\/text><text x=\"42\" y=\"264.0\" font-size=\"9.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">mucoid, non-motile, indole −, VP +, urease +<\/text><rect x=\"30\" y=\"285\" width=\"300\" height=\"48\" rx=\"6\" fill=\"#fff\" stroke=\"#b45a5a\" stroke-width=\"1.3\" /><text x=\"42\" y=\"304\" font-size=\"12\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#8a2a2a\">Enterobacter<\/text><text x=\"42\" y=\"319.0\" font-size=\"9.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">motile, VP +, citrate +, indole −<\/text><rect x=\"30\" y=\"340\" width=\"300\" height=\"48\" rx=\"6\" fill=\"#fff\" stroke=\"#b45a5a\" stroke-width=\"1.3\" /><text x=\"42\" y=\"359\" font-size=\"12\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#8a2a2a\">Citrobacter<\/text><text x=\"42\" y=\"374.0\" font-size=\"9.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">H2S +, citrate +, indole variable<\/text><line x1=\"180\" y1=\"146\" x2=\"180\" y2=\"175\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"430\" y=\"175\" width=\"300\" height=\"42\" rx=\"6\" fill=\"#fff\" stroke=\"#777\" stroke-width=\"1.3\" /><text x=\"442\" y=\"192\" font-size=\"12\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#444\">Salmonella<\/text><text x=\"442\" y=\"207\" font-size=\"9\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">H2S +, motile, urease −; black centers on XLD/Hektoen<\/text><rect x=\"430\" y=\"222\" width=\"300\" height=\"42\" rx=\"6\" fill=\"#fff\" stroke=\"#777\" stroke-width=\"1.3\" /><text x=\"442\" y=\"239\" font-size=\"12\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#444\">Shigella<\/text><text x=\"442\" y=\"254\" font-size=\"9\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">H2S −, NON-motile, urease −; colorless on XLD<\/text><rect x=\"430\" y=\"269\" width=\"300\" height=\"42\" rx=\"6\" fill=\"#fff\" stroke=\"#777\" stroke-width=\"1.3\" /><text x=\"442\" y=\"286\" font-size=\"12\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#444\">Proteus<\/text><text x=\"442\" y=\"301\" font-size=\"9\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">swarms; urease +, H2S +; P. mirabilis indole −<\/text><rect x=\"430\" y=\"316\" width=\"300\" height=\"42\" rx=\"6\" fill=\"#fff\" stroke=\"#777\" stroke-width=\"1.3\" /><text x=\"442\" y=\"333\" font-size=\"12\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#444\">Yersinia<\/text><text x=\"442\" y=\"348\" font-size=\"9\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">urease +, grows at 25 °C; bipolar “safety pin”<\/text><rect x=\"430\" y=\"363\" width=\"300\" height=\"42\" rx=\"6\" fill=\"#fff\" stroke=\"#777\" stroke-width=\"1.3\" /><text x=\"442\" y=\"380\" font-size=\"12\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#444\">Serratia / Morganella<\/text><text x=\"442\" y=\"395\" font-size=\"9\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">Serratia: DNase +, red; Morganella: urease +<\/text><line x1=\"580\" y1=\"146\" x2=\"580\" y2=\"175\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><text x=\"380\" y=\"415\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">Oxidase-positive gram-negative rods are NOT Enterobacterales: Pseudomonas, Vibrio, Aeromonas, Campylobacter, Neisseria.<\/text><\/svg><figcaption>Enterobacterales: separate by lactose, then use the quick tests.<\/figcaption><\/figure><h3 id=\"enterobacterales-oxidase-negative-glucose-fermenters\">Enterobacterales (oxidase negative, glucose fermenters)<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 23%\" />\n<col style=\"width: 76%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Organism<\/th>\n<th>Quick clues<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>E. coli<\/td>\n<td>Lactose +, indole +, citrate negative; most common urinary pathogen. O157:H7 is sorbitol negative on SMAC (hemolytic uremic syndrome)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Klebsiella<\/td>\n<td>Mucoid, lactose +, nonmotile, indole negative (K. pneumoniae)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Enterobacter<\/td>\n<td>Lactose +, motile, citrate +, VP +<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Salmonella<\/td>\n<td>Lactose negative, H2S +, motile<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Shigella<\/td>\n<td>Lactose negative, nonmotile, no H2S, no gas<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Proteus<\/td>\n<td>Swarming, urease +, H2S +, PAD +<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Serratia<\/td>\n<td>Red pigment, DNase +, gelatinase +<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Citrobacter<\/td>\n<td>H2S +, citrate +, lactose variable<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Yersinia<\/td>\n<td>Y. pestis bipolar \"safety pin\" (plague); Y. enterocolitica grows in the cold, urease +<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>TSI tube:<\/strong> A/A = ferments glucose plus lactose or sucrose; K/A = glucose only; K/K = non-fermenter. Black = H2S; cracks or bubbles = gas.<\/p>\n<p><strong>IMViC (E. coli pattern ++--):<\/strong> indole +, methyl red +, VP negative, citrate negative. Klebsiella and Enterobacter are the opposite (--++).<\/p>\n<h3 id=\"e.-coli-types-that-cause-diarrhea\">E. coli types that cause diarrhea<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 35%\" />\n<col style=\"width: 64%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Type<\/th>\n<th>Key points<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>ETEC<\/td>\n<td>Traveler's diarrhea; heat-labile and heat-stable toxins<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>EPEC<\/td>\n<td>Infant diarrhea<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>EIEC<\/td>\n<td>Invades like Shigella; slow lactose fermenter<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>EHEC (STEC, O157:H7)<\/td>\n<td>Shiga toxin; bloody diarrhea without fever; hemolytic uremic syndrome; sorbitol negative<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>EAEC<\/td>\n<td>Persistent diarrhea<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n","min":3},{"id":"M4","sec":2,"title":"Non-fermenters, Gram-negative rods and cocci","html":"<h3 id=\"non-fermenters-and-other-gram-negative-rods\">Non-fermenters and other Gram-negative rods<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 40%\" />\n<col style=\"width: 59%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Organism<\/th>\n<th>Key facts<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Pseudomonas aeruginosa<\/td>\n<td>Oxidase +, blue-green pigment (pyocyanin), grape-like odor, grows at 42 degrees C; burns and cystic fibrosis<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Stenotrophomonas maltophilia<\/td>\n<td>Oxidase negative, maltose +, resistant to carbapenems<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Acinetobacter<\/td>\n<td>Oxidase negative, nonmotile, multidrug resistant<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Haemophilus influenzae<\/td>\n<td>Needs X and V; satellites around S. aureus<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Legionella<\/td>\n<td>BCYE agar, faint on Gram stain, urine antigen test<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Bordetella pertussis<\/td>\n<td>Regan-Lowe; nasopharyngeal swab (Dacron or calcium alginate)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Campylobacter jejuni<\/td>\n<td>Curved \"gull-wing\", oxidase +, grows at 42 degrees C<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Helicobacter pylori<\/td>\n<td>Urease +; urea breath test<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Vibrio cholerae<\/td>\n<td>Oxidase +, yellow on TCBS, rice-water stools<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Brucella, Francisella<\/td>\n<td>Small coccobacilli; high lab-acquired infection risk, work in a biosafety cabinet<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"gram-negative-cocci\">Gram-negative cocci<\/h3>\n<ul>\n<li><p><strong>N. gonorrhoeae:<\/strong> ferments glucose only, oxidase +, intracellular diplococci.<\/p><\/li>\n<li><p><strong>N. meningitidis:<\/strong> ferments glucose and maltose, capsule, meningitis.<\/p><\/li>\n<li><p><strong>Moraxella catarrhalis:<\/strong> DNase +, butyrate esterase +.<\/p><\/li>\n<\/ul>\n","min":3},{"id":"M5","sec":2,"title":"Anaerobes and other Gram-positive rods","html":"<h3 id=\"anaerobes-and-other-gram-positive-rods\">Anaerobes and other Gram-positive rods<\/h3>\n<ul>\n<li><p><strong>Bacteroides fragilis:<\/strong> bile resistant; resistant to kanamycin, vancomycin and colistin. Gram-negative anaerobes are naturally resistant to aminoglycosides.<\/p><\/li>\n<li><p><strong>Clostridium perfringens:<\/strong> double zone of hemolysis, lecithinase +, stormy fermentation, gas gangrene.<\/p><\/li>\n<li><p><strong>C. difficile:<\/strong> toxin A and B (PCR for the toxin gene); antibiotic-associated colitis.<\/p><\/li>\n<li><p><strong>C. botulinum<\/strong> (neurotoxin) and <strong>C. tetani<\/strong> (drumstick spores).<\/p><\/li>\n<li><p><strong>Listeria:<\/strong> tumbling motility at 25 degrees C, beta-hemolytic, grows at 4 degrees C.<\/p><\/li>\n<li><p><strong>Corynebacterium diphtheriae:<\/strong> club-shaped, Elek test for toxin.<\/p><\/li>\n<li><p><strong>Bacillus anthracis:<\/strong> nonmotile, nonhemolytic, \"medusa head\" colonies. <strong>B. cereus:<\/strong> motile, beta-hemolytic, food poisoning.<\/p><\/li>\n<li><p><strong>Nocardia:<\/strong> branching and weakly acid-fast. <strong>Actinomyces:<\/strong> sulfur granules.<\/p><\/li>\n<\/ul>\n","min":3},{"id":"M6","sec":2,"title":"Mycobacteria and fungi","html":"<h3 id=\"mycobacteria\">Mycobacteria<\/h3>\n<ul>\n<li><p><strong>M. tuberculosis:<\/strong> slow grower, niacin +, nitrate +, cording. Runyon groups: I photochromogens, II scotochromogens, III nonphotochromogens, IV rapid growers.<\/p><\/li>\n<li><p><strong>M. kansasii:<\/strong> photochromogen. <strong>M. marinum:<\/strong> photochromogen, water exposure, grows at 30 degrees C. <strong>M. avium complex:<\/strong> nonphotochromogen, HIV patients. <strong>M. leprae:<\/strong> cannot be grown in culture.<\/p><\/li>\n<li><p>Specimens are digested and decontaminated (NALC-NaOH) before culture.<\/p><\/li>\n<\/ul>\n<h3 id=\"fungi\">Fungi<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 47%\" />\n<col style=\"width: 52%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Group<\/th>\n<th>Examples and clues<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Dermatophytes<\/td>\n<td>Trichophyton (skin, hair, nails), Microsporum (skin, hair), Epidermophyton (skin, nails)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Dimorphic fungi (mold at 25 degrees C, yeast at 37)<\/td>\n<td>Histoplasma (tuberculate macroconidia), Blastomyces (broad-based budding), Coccidioides (arthroconidia, highly infectious), Sporothrix<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Yeasts<\/td>\n<td>Candida albicans: germ tube +. Cryptococcus: India ink capsule, urease +, antigen test<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Molds<\/td>\n<td>Aspergillus: septate hyphae with acute-angle branching. Mucor and Rhizopus: broad ribbon-like hyphae without septa, seen in diabetics<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n","min":3},{"id":"M7","sec":2,"title":"Parasites, viruses and other organisms","html":"<h3 id=\"parasites\">Parasites<\/h3>\n<ul>\n<li><p><strong>Specimens:<\/strong> stool for ova and parasites, trichrome stain for protozoa, concentration by formalin-ethyl acetate. Pinworm (Enterobius) by Scotch tape test.<\/p><\/li>\n<li><p><strong>Protozoa:<\/strong> Entamoeba histolytica (trophozoite with ingested RBCs), Giardia (pear-shaped, \"falling leaf\"), Cryptosporidium and Cyclospora (acid-fast oocysts), Trichomonas (jerky motility).<\/p><\/li>\n<\/ul>\n<table>\n<colgroup>\n<col style=\"width: 27%\" />\n<col style=\"width: 72%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Malaria species<\/th>\n<th>Clues<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>P. falciparum<\/td>\n<td>Multiple rings in one cell, banana-shaped gametocytes; most dangerous<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>P. vivax<\/td>\n<td>Enlarged red cells, Schuffner dots, ameboid forms<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>P. ovale<\/td>\n<td>Oval, fringed red cells<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>P. malariae<\/td>\n<td>Band forms, rosette schizonts, 72-hour cycle<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>P. knowlesi<\/td>\n<td>Band forms, 24-hour cycle<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p><strong>Others in blood:<\/strong> Babesia (Maltese cross), Trypanosoma, Leishmania (amastigotes in macrophages), microfilariae.<\/p><\/li>\n<li><p><strong>Worm eggs:<\/strong> Ascaris (mammillated coat), Trichuris (barrel with polar plugs), hookworm (thin shell), Enterobius (flat on one side), Diphyllobothrium (operculated; B12 deficiency), Schistosoma (lateral spine = mansoni, terminal spine = haematobium, small lateral knob = japonicum).<\/p><\/li>\n<\/ul>\n<h3 id=\"other-organisms\">Other organisms<\/h3>\n<ul>\n<li><p>Herpes simplex shows multinucleated giant cells; CMV shows \"owl-eye\" inclusions; respiratory viruses are now mostly detected by molecular tests.<\/p><\/li>\n<li><p>Chlamydia trachomatis is an obligate intracellular organism found by NAAT. Mycoplasma has no cell wall (cold agglutinins). Treponema is seen by darkfield microscopy.<\/p><\/li>\n<\/ul>\n<h3 id=\"viruses-to-know\">Viruses to know<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 35%\" />\n<col style=\"width: 64%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Virus<\/th>\n<th>Key points<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Herpes simplex<\/td>\n<td>Multinucleated giant cells; PCR is the best test<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Varicella-zoster<\/td>\n<td>Chickenpox and shingles<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>CMV<\/td>\n<td>\"Owl-eye\" inclusions; dangerous in transplant recipients and newborns<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>EBV<\/td>\n<td>Mononucleosis; Burkitt lymphoma<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Adenovirus<\/td>\n<td>Conjunctivitis, respiratory and gut infections<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>RSV<\/td>\n<td>Bronchiolitis in infants; syncytia in culture<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Influenza<\/td>\n<td>Seasonal; rapid antigen tests and PCR<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Rabies<\/td>\n<td>Negri bodies in brain tissue<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Parvovirus B19<\/td>\n<td>Fifth disease; aplastic crisis in hemolytic anemia<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Norovirus and rotavirus<\/td>\n<td>Common viral gastroenteritis<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n","min":3},{"id":"M8","sec":2,"title":"Susceptibility testing and modern methods","html":"<figure class=\"fig\" id=\"F19\"><svg viewBox=\"0 0 760 340\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Susceptibility\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"340\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Susceptibility testing: disk diffusion and MIC<\/text><circle cx=\"150\" cy=\"170\" r=\"105\" fill=\"#f6e9c8\" stroke=\"#8a7a4a\" stroke-width=\"2\" /><circle cx=\"105\" cy=\"125\" r=\"28\" fill=\"#fffdf2\" stroke=\"#b9ab7a\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/><circle cx=\"105\" cy=\"125\" r=\"5\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1\" /><circle cx=\"195\" cy=\"130\" r=\"18\" fill=\"#fffdf2\" stroke=\"#b9ab7a\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/><circle cx=\"195\" cy=\"130\" r=\"5\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1\" /><circle cx=\"110\" cy=\"212\" r=\"34\" fill=\"#fffdf2\" stroke=\"#b9ab7a\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/><circle cx=\"110\" cy=\"212\" r=\"5\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1\" /><circle cx=\"198\" cy=\"215\" r=\"10\" fill=\"#fffdf2\" stroke=\"#b9ab7a\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/><circle cx=\"198\" cy=\"215\" r=\"5\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1\" /><text x=\"150\" y=\"296\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Mueller-Hinton agar plate<\/text><text x=\"150\" y=\"311\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">Measure each clear zone (mm);<\/text><text x=\"150\" y=\"323\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">compare with breakpoints: S / I / R<\/text><text x=\"150\" y=\"32\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\"><\/text><text x=\"500\" y=\"52\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Broth microdilution / macrodilution (µg/mL)<\/text><rect x=\"330\" y=\"70\" width=\"34\" height=\"120\" rx=\"8\" fill=\"#e8d49a\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"347\" y=\"208\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">0.25<\/text><rect x=\"382\" y=\"70\" width=\"34\" height=\"120\" rx=\"8\" fill=\"#e8d49a\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"399\" y=\"208\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">0.5<\/text><rect x=\"434\" y=\"70\" width=\"34\" height=\"120\" rx=\"8\" fill=\"#e8d49a\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"451\" y=\"208\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">1<\/text><rect x=\"486\" y=\"70\" width=\"34\" height=\"120\" rx=\"8\" fill=\"#e8d49a\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"503\" y=\"208\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">2<\/text><rect x=\"538\" y=\"70\" width=\"34\" height=\"120\" rx=\"8\" fill=\"#f3fbff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"555\" y=\"208\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">4<\/text><rect x=\"590\" y=\"70\" width=\"34\" height=\"120\" rx=\"8\" fill=\"#f3fbff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"607\" y=\"208\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">8<\/text><rect x=\"642\" y=\"70\" width=\"34\" height=\"120\" rx=\"8\" fill=\"#f3fbff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"659\" y=\"208\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">16<\/text><rect x=\"694\" y=\"70\" width=\"34\" height=\"120\" rx=\"8\" fill=\"#f3fbff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"711\" y=\"208\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">32<\/text><path d=\"M362,230 L362,250 L526,250 L526,230\" fill=\"none\" stroke=\"#b42318\" stroke-width=\"1.5\" /><text x=\"520\" y=\"268\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#b42318\">MIC = lowest concentration with NO visible growth = 4 µg/mL here<\/text><text x=\"520\" y=\"290\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">Cloudy = growth. Clear = inhibited. MBC kills 99.9%.<\/text><text x=\"520\" y=\"310\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">0.5 McFarland (1.5 × 10⁸ CFU/mL) · 35 °C · 16-18 h<\/text><\/svg><figcaption>Disk diffusion (Kirby-Bauer) and broth dilution MIC.<\/figcaption><\/figure><h3 id=\"susceptibility-testing\">Susceptibility testing<\/h3>\n<ul>\n<li><p><strong>Kirby-Bauer disk diffusion:<\/strong> Mueller-Hinton agar, 0.5 McFarland standard, 4 mm depth, 35 degrees C for 16-18 hours; measure the zone and read it against CLSI breakpoints.<\/p><\/li>\n<li><p><strong>MIC:<\/strong> the lowest concentration that stops visible growth (broth dilution).<\/p><\/li>\n<li><p><strong>QC strains:<\/strong> E. coli ATCC 25922, S. aureus ATCC 25923 (disk) or 29213 (MIC), P. aeruginosa ATCC 27853, E. faecalis ATCC 29212.<\/p><\/li>\n<\/ul>\n<table>\n<colgroup>\n<col style=\"width: 46%\" />\n<col style=\"width: 53%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Resistance<\/th>\n<th>Mechanism or test<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>MRSA<\/td>\n<td>mecA gene (PBP2a); oxacillin or cefoxitin resistant<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>VRE<\/td>\n<td>vanA or vanB genes<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>ESBL<\/td>\n<td>Resists third-generation cephalosporins; clavulanate synergy confirms<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Carbapenemase (KPC, NDM, OXA-48)<\/td>\n<td>Modified carbapenem inactivation or molecular tests<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Inducible clindamycin resistance<\/td>\n<td>D-test (erythromycin flattens the clindamycin zone)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Beta-lactamase<\/td>\n<td>Nitrocefin (cefinase) test<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"natural-resistance-to-remember\">Natural resistance to remember<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 36%\" />\n<col style=\"width: 63%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Organism<\/th>\n<th>Intrinsically resistant to<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Klebsiella<\/td>\n<td>Ampicillin<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pseudomonas aeruginosa<\/td>\n<td>Many drugs: ampicillin, first-generation cephalosporins, trimethoprim-sulfamethoxazole<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Enterococcus<\/td>\n<td>Cephalosporins, low-level aminoglycosides<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Stenotrophomonas<\/td>\n<td>Carbapenems<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Anaerobes<\/td>\n<td>Aminoglycosides<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Gram-negative rods<\/td>\n<td>Vancomycin<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"modern-identification-methods\">Modern identification methods<\/h3>\n<ul>\n<li><p><strong>MALDI-TOF mass spectrometry:<\/strong> matches a protein profile of a colony; fast and accurate for most bacteria and yeasts.<\/p><\/li>\n<li><p><strong>Multiplex PCR panels:<\/strong> detect many pathogens and resistance genes directly from blood culture bottles, stool, spinal fluid, or respiratory samples.<\/p><\/li>\n<li><p><strong>16S rRNA sequencing:<\/strong> identifies organisms that cannot be named by routine methods.<\/p><\/li>\n<li><p><strong>Automated systems<\/strong> (Vitek, Phoenix, MicroScan) identify and test susceptibility. <strong>Continuous-monitoring blood culture systems<\/strong> (BACTEC, BacT/Alert) detect growth by CO2 production.<\/p><\/li>\n<\/ul>\n<h3 id=\"select-agents-and-bsl-3-organisms\">Select agents and BSL-3 organisms<\/h3>\n<p>Sentinel labs do only a rule-out, work in a biosafety cabinet, avoid sniffing plates, notify public health, and refer to the Laboratory Response Network (LRN).<\/p>\n<table>\n<colgroup>\n<col style=\"width: 46%\" />\n<col style=\"width: 53%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Agent<\/th>\n<th>Clues<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Bacillus anthracis<\/td>\n<td>Large Gram-positive rod, nonhemolytic, \"medusa head\" colonies, nonmotile<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Yersinia pestis<\/td>\n<td>Bipolar \"safety pin\" rod, grows slowly, plague<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Francisella tularensis<\/td>\n<td>Tiny Gram-negative coccobacillus, needs cysteine (chocolate agar), very infectious<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Brucella<\/td>\n<td>Tiny coccobacillus, slow growth, urease positive, unpasteurized dairy<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Burkholderia pseudomallei and mallei<\/td>\n<td>Oxidase positive, can be misidentified by automated systems<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Clostridium botulinum<\/td>\n<td>Neurotoxin<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n","min":3},{"id":"M9","sec":2,"title":"Specimens and pathogens by body site","html":"<h3 id=\"specimen-rules\">Specimen rules<\/h3>\n<ul>\n<li><p>Blood cultures: two sets, skin cleaned with chlorhexidine; a single positive bottle with skin organisms is usually a contaminant.<\/p><\/li>\n<li><p>CSF: process immediately, never refrigerate.<\/p><\/li>\n<li><p>Urine: clean catch; 100,000 CFU/mL is the traditional infection threshold.<\/p><\/li>\n<li><p>Sputum quality: more than 25 white cells and fewer than 10 squamous epithelial cells per low-power field.<\/p><\/li>\n<li><p>Possible bioterror agents (anthrax, plague, tularemia, brucellosis): do rule-out only in the sentinel lab and notify public health.<\/p><\/li>\n<\/ul>\n<h3 id=\"common-pathogens-by-body-site\">Common pathogens by body site<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 32%\" />\n<col style=\"width: 67%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Site<\/th>\n<th>Usual pathogens<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Blood<\/td>\n<td>S. aureus, E. coli, Klebsiella, streptococci, enterococci, Candida; coagulase-negative staph is usually a contaminant<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Urine<\/td>\n<td>E. coli (most common), S. saprophyticus, Klebsiella, Proteus, Enterococcus, Pseudomonas, Candida<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Upper respiratory<\/td>\n<td>S. pyogenes, C. diphtheriae, Bordetella pertussis, N. meningitidis carriage<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Lower respiratory<\/td>\n<td>S. pneumoniae, H. influenzae, Moraxella, Klebsiella, Legionella, Mycoplasma, M. tuberculosis, Pneumocystis, Pseudomonas in cystic fibrosis<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Stool<\/td>\n<td>Salmonella, Shigella, Campylobacter, E. coli pathotypes, Yersinia, Vibrio, C. difficile<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Genital tract<\/td>\n<td>N. gonorrhoeae, C. trachomatis, T. pallidum, Gardnerella, Trichomonas, Candida, HSV, H. ducreyi<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Skin and soft tissue<\/td>\n<td>S. aureus, S. pyogenes, Pseudomonas (hot tubs), Pasteurella (animal bites), Vibrio vulnificus (seawater)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Bone<\/td>\n<td>S. aureus; Salmonella in sickle cell disease<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Meningitis by age<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 21%\" />\n<col style=\"width: 78%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Age<\/th>\n<th>Usual bacteria<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Newborn<\/td>\n<td>Group B strep, E. coli, Listeria<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Child<\/td>\n<td>S. pneumoniae, N. meningitidis, H. influenzae<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Adult<\/td>\n<td>S. pneumoniae, N. meningitidis<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Older adult<\/td>\n<td>S. pneumoniae, Listeria, Gram-negative rods<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"vaginitis\">Vaginitis<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 42%\" />\n<col style=\"width: 57%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Cause<\/th>\n<th>Findings<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Bacterial vaginosis (Gardnerella)<\/td>\n<td>pH above 4.5, positive \"whiff\" (fishy) test, clue cells, few white cells<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Candida<\/td>\n<td>Normal pH, budding yeast and pseudohyphae on KOH<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Trichomonas<\/td>\n<td>pH above 4.5, motile flagellates on wet mount, white cells<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"collection-rejection-and-reporting\">Collection, rejection and reporting<\/h3>\n<ul>\n<li><p>Reject specimens that are unlabeled, leaking, in the wrong container, too old, or contaminated (for example 24-hour sputum, Foley tip, swab from a surface ulcer).<\/p><\/li>\n<li><p>Use anaerobic transport for anaerobe cultures; do not refrigerate gonorrhea or CSF specimens; stool needs prompt testing or the right preservative; boric acid preserves urine for delayed transport.<\/p><\/li>\n<li><p><strong>Call as a critical value:<\/strong> positive blood culture, positive CSF Gram stain or culture, suspected select agent.<\/p><\/li>\n<li><p><strong>Reportable to public health<\/strong> (varies by state): TB, Salmonella, Shigella, measles, syphilis, gonorrhea, Chlamydia, hepatitis, anthrax, plague, tularemia, brucellosis.<\/p><\/li>\n<li><p>Corrected reports are marked clearly, the original is kept, and the clinician is told.<\/p><\/li>\n<li><p><strong>Screening cultures:<\/strong> MRSA (nasal swab; mecA PCR or chromogenic agar), VRE (rectal swab, bile esculin vancomycin plate), ESBL and CRE (rectal swab, selective agar or PCR) are collected for infection control.<\/p><\/li>\n<\/ul>\n","min":4},{"id":"M10","sec":2,"title":"Microbiology exam traps","html":"<h3 id=\"exam-traps-2\">Exam traps<\/h3>\n<ul>\n<li><p>Strep pneumoniae is alpha-hemolytic but is told apart from viridans strep by optochin and bile solubility.<\/p><\/li>\n<li><p>Salmonella and Shigella are both lactose negative; Shigella is nonmotile with no H2S.<\/p><\/li>\n<li><p>Acid-fast stains also pick up Nocardia (weakly) and Cryptosporidium.<\/p><\/li>\n<li><p>A thick malaria smear finds parasites; only the thin smear gives the species.<\/p><\/li>\n<\/ul>\n","min":3},{"id":"B1","sec":3,"title":"Start here: ABO system and its genetics","html":"<p><strong>If you only remember 8 things<\/strong><\/p>\n<ol type=\"1\">\n<li><p>Type O red cells are the universal donor; group AB plasma is the universal donor plasma. Forward and reverse ABO typing must agree.<\/p><\/li>\n<li><p>Anti-A and anti-B are IgM and react at room temperature. Rh, Kell, Kidd and Duffy antibodies are IgG and react at 37 degrees C or AHG.<\/p><\/li>\n<li><p>After A and B, the D antigen is the most immunogenic.<\/p><\/li>\n<li><p>DAT = coating on red cells inside the patient. IAT = looking for antibody in serum. A negative AHG test needs check cells to be valid.<\/p><\/li>\n<li><p>Kidd antibodies cause delayed hemolytic reactions and fade quickly. Duffy antibodies are destroyed by enzymes.<\/p><\/li>\n<li><p>Suspect a transfusion reaction: stop the transfusion, keep the IV open, check the paperwork, send a post-transfusion sample.<\/p><\/li>\n<li><p>RhIG (300 micrograms) within 72 hours for an Rh-negative mother with an Rh-positive baby; the Kleihauer-Betke test counts fetal cells.<\/p><\/li>\n<li><p>Shelf lives: red cells 42 days (AS-1), platelets 5 days at room temperature with agitation, plasma 1 year frozen.<\/p><\/li>\n<\/ol>\n<figure class=\"fig\" id=\"F20\"><svg viewBox=\"0 0 760 500\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"ABO groups\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"500\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">ABO groups: antigens, antibodies and test reactions<\/text><text x=\"105\" y=\"50\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Group A<\/text><circle cx=\"105\" cy=\"105\" r=\"34\" fill=\"#e8a0a0\" stroke=\"#b45a5a\" stroke-width=\"1.5\" /><circle cx=\"105\" cy=\"105\" r=\"12\" fill=\"#f8dede\" stroke=\"none\" stroke-width=\"0\" /><line x1=\"139.0\" y1=\"105.0\" x2=\"149.0\" y2=\"105.0\" stroke=\"#777\" stroke-width=\"1.2\"/><polygon points=\"149.0,100.0 144.0,109.0 154.0,109.0\" fill=\"#d4306a\" stroke=\"#7a1f3a\" stroke-width=\"0.8\"/><line x1=\"132.5065778087482\" y1=\"124.98469857794409\" x2=\"140.5967477524977\" y2=\"130.8625511008688\" stroke=\"#777\" stroke-width=\"1.2\"/><polygon points=\"140.5967477524977,125.86255110086881 135.5967477524977,134.8625511008688 145.5967477524977,134.8625511008688\" fill=\"#d4306a\" stroke=\"#7a1f3a\" stroke-width=\"0.8\"/><line x1=\"115.50657780874822\" y1=\"137.33592155403522\" x2=\"118.59674775249769\" y2=\"146.84648671698676\" stroke=\"#777\" stroke-width=\"1.2\"/><polygon points=\"118.59674775249769,141.84648671698676 113.59674775249769,150.84648671698676 123.59674775249769,150.84648671698676\" fill=\"#d4306a\" stroke=\"#7a1f3a\" stroke-width=\"0.8\"/><line x1=\"94.4934221912518\" y1=\"137.33592155403522\" x2=\"91.40325224750232\" y2=\"146.84648671698676\" stroke=\"#777\" stroke-width=\"1.2\"/><polygon points=\"91.40325224750232,141.84648671698676 86.40325224750232,150.84648671698676 96.40325224750232,150.84648671698676\" fill=\"#d4306a\" stroke=\"#7a1f3a\" stroke-width=\"0.8\"/><line x1=\"77.4934221912518\" y1=\"124.98469857794409\" x2=\"69.40325224750231\" y2=\"130.8625511008688\" stroke=\"#777\" stroke-width=\"1.2\"/><polygon points=\"69.40325224750231,125.86255110086881 64.40325224750231,134.8625511008688 74.40325224750231,134.8625511008688\" fill=\"#d4306a\" stroke=\"#7a1f3a\" stroke-width=\"0.8\"/><line x1=\"71.0\" y1=\"105.0\" x2=\"61.0\" y2=\"105.0\" stroke=\"#777\" stroke-width=\"1.2\"/><polygon points=\"61.0,100.0 56.0,109.0 66.0,109.0\" fill=\"#d4306a\" stroke=\"#7a1f3a\" stroke-width=\"0.8\"/><line x1=\"77.49342219125178\" y1=\"85.01530142205591\" x2=\"69.40325224750231\" y2=\"79.13744889913119\" stroke=\"#777\" stroke-width=\"1.2\"/><polygon points=\"69.40325224750231,74.13744889913119 64.40325224750231,83.13744889913119 74.40325224750231,83.13744889913119\" fill=\"#d4306a\" stroke=\"#7a1f3a\" stroke-width=\"0.8\"/><line x1=\"94.49342219125178\" y1=\"72.66407844596478\" x2=\"91.40325224750231\" y2=\"63.15351328301325\" stroke=\"#777\" stroke-width=\"1.2\"/><polygon points=\"91.40325224750231,58.15351328301325 86.40325224750231,67.15351328301324 96.40325224750231,67.15351328301324\" fill=\"#d4306a\" stroke=\"#7a1f3a\" stroke-width=\"0.8\"/><line x1=\"115.5065778087482\" y1=\"72.66407844596478\" x2=\"118.59674775249768\" y2=\"63.15351328301324\" stroke=\"#777\" stroke-width=\"1.2\"/><polygon points=\"118.59674775249768,58.15351328301324 113.59674775249768,67.15351328301324 123.59674775249768,67.1535132830 nchor=\"start\" font-weight=\"normal\" fill=\"#222\">anti-B<\/text><text x=\"260\" y=\"351.0\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">0<\/text><text x=\"380\" y=\"351.0\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#b42318\">+<\/text><text x=\"500\" y=\"351.0\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#b42318\">+<\/text><text x=\"620\" y=\"351.0\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">0<\/text><rect x=\"30\" y=\"358\" width=\"700\" height=\"20\" rx=\"0\" fill=\"#f1efe6\" stroke=\"#ccc\" stroke-width=\"1\" /><text x=\"36\" y=\"372.0\" font-size=\"10.5\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Reverse (plasma + reagent cells)<\/text><rect x=\"30\" y=\"378\" width=\"700\" height=\"22\" rx=\"0\" fill=\"#fff\" stroke=\"#ddd\" stroke-width=\"1\" /><text x=\"36\" y=\"393\" font-size=\"11\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">A1 cells<\/text><text x=\"260\" y=\"393.0\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">0<\/text><text x=\"380\" y=\"393.0\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#b42318\">+<\/text><text x=\"500\" y=\"393.0\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">0<\/text><text x=\"620\" y=\"393.0\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#b42318\">+<\/text><rect x=\"30\" y=\"400\" width=\"700\" height=\"22\" rx=\"0\" fill=\"#fff\" stroke=\"#ddd\" stroke-width=\"1\" /><text x=\"36\" y=\"415\" font-size=\"11\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">B cells<\/text><text x=\"260\" y=\"415.0\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#b42318\">+<\/text><text x=\"380\" y=\"415.0\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">0<\/text><text x=\"500\" y=\"415.0\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">0<\/text><text x=\"620\" y=\"415.0\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#b42318\">+<\/text><rect x=\"30\" y=\"422\" width=\"700\" height=\"22\" rx=\"0\" fill=\"#fff\" stroke=\"#ddd\" stroke-width=\"1\" /><text x=\"36\" y=\"437\" font-size=\"11\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">Donate RBCs to<\/text><text x=\"260\" y=\"437.0\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">A, AB<\/text><text x=\"380\" y=\"437.0\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">B, AB<\/text><text x=\"500\" y=\"437.0\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">AB<\/text><text x=\"620\" y=\"437.0\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">all<\/text><rect x=\"30\" y=\"444\" width=\"700\" height=\"22\" rx=\"0\" fill=\"#fff\" stroke=\"#ddd\" stroke-width=\"1\" /><text x=\"36\" y=\"459\" font-size=\"11\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">Receive RBCs from<\/text><text x=\"260\" y=\"459.0\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">A, O<\/text><text x=\"380\" y=\"459.0\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">B, O<\/text><text x=\"500\" y=\"459.0\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">all<\/text><text x=\"620\" y=\"459.0\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">O<\/text><text x=\"380\" y=\"484\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">+ = agglutination.  Forward and reverse must agree. Newborns: forward only (their own antibodies are not yet made).<\/text><\/svg><figcaption>ABO antigens on red cells, antibodies in plasma, and what each typing reaction looks like.<\/figcaption><\/figure><h3 id=\"abo-system\">ABO system<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 37%\" />\n<col style=\"width: 41%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Blood type<\/th>\n<th>Antigens on red cells<\/th>\n<th>Antibodies in serum<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>A<\/td>\n<td>A<\/td>\n<td>Anti-B<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>B<\/td>\n<td>B<\/td>\n<td>Anti-A<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>AB<\/td>\n<td>A and B<\/td>\n<td>None<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>O<\/td>\n<td>None (only H)<\/td>\n<td>Anti-A, anti-B, anti-A,B<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p><strong>Forward type<\/strong> = patient red cells with anti-A and anti-B. <strong>Reverse type<\/strong> = patient serum with A1 and B cells.<\/p><\/li>\n<li><p>Bombay phenotype (hh): no H, so no A or B. It types as O, but the serum contains anti-H and reacts with all group O cells. Only Bombay blood is compatible.<\/p><\/li>\n<li><p>Newborns and elderly people may have weak or missing ABO antibodies.<\/p><\/li>\n<\/ul>\n<p><strong>Common ABO discrepancies<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 22%\" />\n<col style=\"width: 48%\" />\n<col style=\"width: 29%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Cause<\/th>\n<th>Clue<\/th>\n<th>Fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Weak antibodies<\/td>\n<td>Missing reverse reaction (newborn, elderly)<\/td>\n<td>Incubate longer or at 4 degrees C<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Subgroup of A (A2 with anti-A1)<\/td>\n<td>Extra reverse reaction with A1 cells<\/td>\n<td>Test with anti-A1 lectin<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Cold autoantibody<\/td>\n<td>Extra reaction at room temperature<\/td>\n<td>Prewarm or use saline at 37 degrees C<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Rouleaux<\/td>\n<td>Stacked cells in forward and reverse<\/td>\n<td>Saline replacement<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Acquired B antigen<\/td>\n<td>Weak B on A patients (colon cancer, infection)<\/td>\n<td>Acidified anti-B<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Mixed-field<\/td>\n<td>Two cell populations (recent transfusion, transplant)<\/td>\n<td>Review history<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"genetics-of-abo\">Genetics of ABO<\/h3>\n<ul>\n<li><p>A and B are codominant over O. Parents AO and BO can have any of the four types. Parents AB and O can only have A or B children. O parents can only have O children.<\/p><\/li>\n<li><p>Rh-negative (dd) parents can only have Rh-negative children; D-positive parents may be DD or Dd.<\/p><\/li>\n<\/ul>\n","min":5},{"id":"B2","sec":3,"title":"Rh and other blood groups","html":"<h3 id=\"rh-system\">Rh system<\/h3>\n<ul>\n<li><p>Rh-negative means no D antigen. Rh antibodies are IgG, do not bind complement, and cause extravascular hemolysis and HDFN.<\/p><\/li>\n<li><p><strong>Weak D<\/strong> is tested with AHG for donors, who are labeled Rh positive if weak D is found. Patients with weak D are usually treated as Rh positive.<\/p><\/li>\n<li><p>Common haplotypes (Fisher-Race): R0 = Dce, R1 = DCe, R2 = DcE, Rz = DCE, r = dce, r' = dCe, r'' = dcE, ry = dCE.<\/p><\/li>\n<li><p>Rh null cells lack all Rh antigens (stomatocytes, chronic hemolysis).<\/p><\/li>\n<li><p><strong>Enzymes (ficin, papain):<\/strong> enhance Rh, Kidd, Lewis, I and P1; destroy Duffy, M, N, S (variable) and Xga.<\/p><\/li>\n<\/ul>\n<h3 id=\"other-blood-groups\">Other blood groups<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 11%\" />\n<col style=\"width: 36%\" />\n<col style=\"width: 52%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>System<\/th>\n<th>Antibody<\/th>\n<th>Key points<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Kell<\/td>\n<td>IgG<\/td>\n<td>Second most immunogenic after D; antigens destroyed by DTT and AET<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Duffy<\/td>\n<td>IgG<\/td>\n<td>Destroyed by enzymes; Fy(a-b-) resists P. vivax malaria<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Kidd<\/td>\n<td>IgG, binds complement<\/td>\n<td>Delayed hemolytic reactions; titer falls quickly, so it can be missed<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>MNS<\/td>\n<td>M and N usually IgM, S and s IgG<\/td>\n<td>Show dosage<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Lewis<\/td>\n<td>IgM<\/td>\n<td>Adsorbed from plasma; does not cause HDFN; changes in pregnancy<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>P1<\/td>\n<td>IgM<\/td>\n<td>Hydatid cyst fluid neutralizes anti-P1<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>I / i<\/td>\n<td>IgM cold autoantibodies<\/td>\n<td>Anti-I in cold agglutinin disease and Mycoplasma; anti-i in mononucleosis<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p><strong>Dosage:<\/strong> antibodies react more strongly with cells from homozygous people (e.g. Jk(a+b-) versus Jk(a+b+)). It occurs in Rh, Kidd, Duffy and MNS.<\/p><\/li>\n<li><p><strong>Finding compatible donors:<\/strong> multiply the frequency of antigen-negative blood for each antibody. If 91% of donors are K negative and 34% are Fya negative, then 0.91 x 0.34 = about 31% of units will be compatible.<\/p><\/li>\n<\/ul>\n<h3 id=\"high--and-low-prevalence-antigens\">High- and low-prevalence antigens<\/h3>\n<ul>\n<li><p>An antibody to a high-prevalence antigen (anti-k, anti-Kpb, anti-Jsb, anti-Vel) reacts with almost all panel cells but not the autocontrol; compatible blood is rare and may need the rare donor registry.<\/p><\/li>\n<li><p>An antibody to a low-prevalence antigen (anti-Kpa, anti-Wra) gives a single odd reaction, but nearly all donor units are compatible.<\/p><\/li>\n<\/ul>\n","min":3},{"id":"B3","sec":3,"title":"Antibody detection and compatibility testing","html":"<figure class=\"fig\" id=\"F21\"><svg viewBox=\"0 0 760 490\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"AHG tests\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><pat
