" x2=\"153.1\" y2=\"344.8\" stroke=\"#2b6cb0\" stroke-width=\"2.4\"/><line x1=\"133\" y1=\"329\" x2=\"133\" y2=\"339.8\" stroke=\"#2b6cb0\" stroke-width=\"2.4\"/><line x1=\"133\" y1=\"339.8\" x2=\"124.9\" y2=\"348.8\" stroke=\"#2b6cb0\" stroke-width=\"2.4\"/><line x1=\"133\" y1=\"339.8\" x2=\"141.1\" y2=\"348.8\" stroke=\"#2b6cb0\" stroke-width=\"2.4\"/><text x=\"115\" y=\"395\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">1. Patient serum +<\/text><text x=\"115\" y=\"407\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">reagent RBCs<\/text><line x1=\"202\" y1=\"315\" x2=\"210\" y2=\"315\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"210\" y=\"265\" width=\"170\" height=\"160\" rx=\"8\" fill=\"#fff\" stroke=\"#ddd\" stroke-width=\"1\" /><circle cx=\"295\" cy=\"315\" r=\"22\" fill=\"#e8a0a0\" stroke=\"#b45a5a\" stroke-width=\"1.3\" /><circle cx=\"295\" cy=\"315\" r=\"8.8\" fill=\"#f8dede\" stroke=\"none\" stroke-width=\"0\" /><line x1=\"316.01740276076333\" y1=\"321.50144454654946\" x2=\"322.70475818464257\" y2=\"323.57008599317885\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><line x1=\"299.87828524177405\" y1=\"336.45232698566497\" x2=\"301.4304669096112\" y2=\"343.27806739019474\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><line x1=\"278.8608824810107\" y1=\"329.9508824391155\" x2=\"273.7257087249686\" y2=\"334.7079813970159\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><line x1=\"273.98259723923667\" y1=\"308.49855545345054\" x2=\"267.29524181535743\" y2=\"306.42991400682115\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><line x1=\"290.12171475822595\" y1=\"293.54767301433503\" x2=\"288.56953309038875\" y2=\"286.72193260980526\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><line x1=\"311.1391175189893\" y1=\"300.0491175608845\" x2=\"316.2742912750314\" y2=\"295.2920186029841\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><text x=\"295\" y=\"395\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">2. Incubate 37 °C: antibody<\/text><text x=\"295\" y=\"407\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">coats the cells (sensitization)<\/text><line x1=\"382\" y1=\"315\" x2=\"390\" y2=\"315\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"390\" y=\"265\" width=\"170\" height=\"160\" rx=\"8\" fill=\"#fff\" stroke=\"#ddd\" stroke-width=\"1\" /><circle cx=\"475\" cy=\"315\" r=\"22\" fill=\"#e8a0a0\" stroke=\"#b45a5a\" stroke-width=\"1.3\" /><circle cx=\"475\" cy=\"315\" r=\"8.8\" fill=\"#f8dede\" stroke=\"none\" stroke-width=\"0\" /><line x1=\"496.01740276076333\" y1=\"321.50144454654946\" x2=\"502.70475818464257\" y2=\"323.57008599317885\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><line x1=\"479.87828524177405\" y1=\"336.45232698566497\" x2=\"481.4304669096112\" y2=\"343.27806739019474\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><line x1=\"458.8608824810107\" y1=\"329.9508824391155\" x2=\"453.7257087249686\" y2=\"334.7079813970159\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><line x1=\"453.98259723923667\" y1=\"308.49855545345054\" x2=\"447.29524181535743\" y2=\"306.42991400682115\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><line x1=\"470.12171475822595\" y1=\"293.54767301433503\" x2=\"468.56953309038875\" y2=\"286.72193260980526\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><line x1=\"491.1391175189893\" y1=\"300.0491175608845\" x2=\"496.2742912750314\" y2=\"295.2920186029841\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><path d=\"M467,279 l8,-10 l8,10\" fill=\"none\" stroke=\"#e8832a\" stroke-width=\"3\" /><text x=\"475\" y=\"395\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">3. Wash, then add AHG<\/text><line x1=\"562\" y1=\"315\" x2=\"570\" y2=\"315\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"570\" y=\"265\" width=\"170\" height=\"160\" rx=\"8\" fill=\"#fff\" stroke=\"#ddd\" stroke-width=\"1\" /><circle cx=\"621\" cy=\"307\" r=\"16\" fill=\"#e8a0a0\" stroke=\"#b45a5a\" stroke-width=\"1.3\" /><circle cx=\"621\" cy=\"307\" r=\"6.4\" fill=\"#f8dede\" stroke=\"none\" stroke-width=\"0\" /><line x1=\"636.2853838260097\" y1=\"311.72832330658144\" x2=\"642.972739249889\" y2=\"313.79696475321083\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><line x1=\"624.5478438121993\" y1=\"322.60169235321086\" x2=\"626.1000254800365\" y2=\"329.42743275774063\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><line x1=\"609.2624599861896\" y1=\"317.8733690466295\" x2=\"604.1272862301475\" y2=\"322.63046800452986\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><line x1=\"605.7146161739903\" y1=\"302.27167669341856\" x2=\"599.027260750111\" y2=\"300.20303524678917\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><line x1=\"617.4521561878007\" y1=\"291.39830764678914\" x2=\"615.8999745199635\" y2=\"284.57256724225937\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><line x1=\"632.7375400138104\" y1=\"296.1266309533705\" x2=\"637.8727137698525\" y2=\"291.36953199547014\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><circle cx=\"655\" cy=\"321\" r=\"16\" fill=\"#e8a0a0\" stroke=\"#b45a5a\" stroke-width=\"1.3\" /><circle cx=\"655\" cy=\"321\" r=\"6.4\" fill=\"#f8dede\" stroke=\"none\" stroke-width=\"0\" /><line x1=\"670.2853838260097\" y1=\"325.72832330658144\" x2=\"676.972739249889\" y2=\"327.79696475321083\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><line x1=\"658.5478438121993\" y1=\"336.60169235321086\" x2=\"660.1000254800365\" y2=\"343.42743275774063\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><line x1=\"643.2624599861896\" y1=\"331.8733690466295\" x2=\"638.1272862301475\" y2=\"336.63046800452986\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><line x1=\"639.7146161739903\" y1=\"316.27167669341856\" x2=\"633.027260750111\" y2=\"314.20303524678917\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><line x1=\"651.4521561878007\" y1=\"305.39830764678914\" x2=\"649.8999745199635\" y2=\"298.57256724225937\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><line x1=\"666.7375400138104\" y1=\"310.1266309533705\" x2=\"671.8727137698525\" y2=\"305.36953199547014\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><circle cx=\"689\" cy=\"309\" r=\"16\" fill=\"#e8a0a0\" stroke=\"#b45a5a\" stroke-width=\"1.3\" /><circle cx=\"689\" cy=\"309\" r=\"6.4\" fill=\"#f8dede\" stroke=\"none\" stroke-width=\"0\" /><line x1=\"704.2853838260097\" y1=\"313.72832330658144\" x2=\"710.972739249889\" y2=\"315.79696475321083\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><line x1=\"692.5478438121993\" y1=\"324.60169235321086\" x2=\"694.1000254800365\" y2=\"331.42743275774063\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><line x1=\"677.2624599861896\" y1=\"319.8733690466295\" x2=\"672.1272862301475\" y2=\"324.63046800452986\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><line x1=\"673.7146161739903\" y1=\"304.27167669341856\" x2=\"667.027260750111\" y2=\"302.20303524678917\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><line x1=\"685.4521561878007\" y1=\"293.39830764678914\" x2=\"683.8999745199635\" y2=\"286.57256724225937\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><line x1=\"700.7375400138104\" y1=\"298.1266309533705\" x2=\"705.8727137698525\" y2=\"293.36953199547014\" stroke=\"#2b6cb0\" stroke-width=\"2.6\"/><path d=\"M632,293.6 l6,-8 l6,8\" fill=\"none\" stroke=\"#e8832a\" stroke-width=\"3\" /><path d=\"M666,300.4 l6,-8 l6,8\" fill=\"none\" stroke=\"#e8832a\" stroke-width=\"3\" /><text x=\"655\" y=\"395\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">4. Positive: agglutination<\/text><text x=\"380\" y=\"462\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">Negative test: add IgG-coated “check cells”. If they do not agglutinate, the test is invalid (AHG neutralized or poor washing).<\/text><\/svg><figcaption>Direct and indirect antiglobulin tests. Both end with AHG bridging IgG-coated red cells.<\/figcaption><\/figure><h3 id=\"antiglobulin-coombs-testing\">Antiglobulin (Coombs) testing<\/h3>\n<ul>\n<li><p><strong>DAT<\/strong> detects in-vivo sensitization: HDFN, hemolytic transfusion reaction, autoimmune hemolytic anemia, drug-induced hemolysis.<\/p><\/li>\n<li><p><strong>IAT<\/strong> detects in-vitro sensitization: antibody screen, antibody identification, AHG crossmatch.<\/p><\/li>\n<li><p>Polyspecific AHG contains anti-IgG and anti-C3d. <strong>Check cells<\/strong> (IgG-coated) are added to every negative AHG test; if they do not agglutinate, the test is invalid.<\/p><\/li>\n<li><p>False negatives: poor washing (free serum neutralizes AHG), delayed reading, forgetting AHG. False positives: overcentrifugation, contaminated reagents.<\/p><\/li>\n<li><p>Enhancement media: LISS, PEG, albumin.<\/p><\/li>\n<\/ul>\n<h3 id=\"antibody-screen-and-identification\">Antibody screen and identification<\/h3>\n<ul>\n<li><p>The screen uses 2 or 3 group O cells with known antigens. Compare the <strong>autocontrol<\/strong> with the panel to tell alloantibody from autoantibody.<\/p><\/li>\n<li><p><strong>Panel rules:<\/strong> rule out an antibody using cells that lack the antigen (best with homozygous cells); rule in with reactive cells. The <strong>rule of three<\/strong> needs 3 positive and 3 negative cells for 95% confidence.<\/p><\/li>\n<li><p><strong>Warm autoantibody (IgG):<\/strong> panel and autocontrol all positive. <strong>Cold autoantibody (IgM):<\/strong> reacts at room temperature; prewarm.<\/p><\/li>\n<li><p>Useful treatments: DTT destroys IgM and Kell; chloroquine removes IgG from cells; elution removes antibody from red cells (used in HDFN, delayed reactions and AIHA).<\/p><\/li>\n<\/ul>\n<h3 id=\"crossmatch-and-pretransfusion-testing\">Crossmatch and pretransfusion testing<\/h3>\n<ul>\n<li><p>Pretransfusion testing: ABO and Rh, antibody screen, crossmatch. A sample must be recent (within 3 days) if the patient was transfused or pregnant in the last 3 months.<\/p><\/li>\n<li><p><strong>Immediate-spin crossmatch<\/strong> (ABO check only) is allowed when the screen is negative and there is no antibody history. Use a full AHG crossmatch if the screen is positive or there is a history of antibodies. Electronic crossmatch needs a validated system and two ABO types on record.<\/p><\/li>\n<li><p><strong>Emergency release:<\/strong> group O red cells (Rh negative for women of childbearing age), with a physician's signed statement.<\/p><\/li>\n<li><p><strong>RhIG:<\/strong> 300 micrograms covers 30 mL of fetal whole blood (15 mL of fetal red cells). Screen with a rosette test; count with Kleihauer-Betke or flow cytometry.<\/p><\/li>\n<\/ul>\n<p><strong>RhIG dose calculation:<\/strong> KB fetal cell % x 50 = mL of fetal whole blood. Divide by 30 to get vials. If the decimal is 0.5 or more, round up; if less than 0.5, round down; then add one extra vial.<\/p>\n<h3 id=\"technique-tips\">Technique tips<\/h3>\n<ul>\n<li><p>Grading: 4+ (one solid clump) down to 1+, W+ (weak), 0 (negative). Hemolysis counts as positive.<\/p><\/li>\n<li><p>Undercentrifugation lowers sensitivity; overcentrifugation can cause false positives.<\/p><\/li>\n<li><p>Drug-induced hemolysis: penicillin (drug coats the cell), methyldopa (autoantibody), quinidine (immune complex).<\/p><\/li>\n<li><p>Wharton's jelly contamination of cord blood causes false clumping; wash the cells at least 6 times.<\/p><\/li>\n<li><p>HLA: class I (A, B, C) on all nucleated cells and platelets; class II (DR, DQ, DP) on B cells and antigen-presenting cells. Platelet refractoriness is often HLA antibodies, so use HLA-matched platelets.<\/p><\/li>\n<\/ul>\n<h3 id=\"special-serologic-techniques\">Special serologic techniques<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 47%\" />\n<col style=\"width: 52%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Technique<\/th>\n<th>Purpose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Titration<\/td>\n<td>Measures antibody strength (anti-D in pregnancy; a titer of 16 or more is significant)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Adsorption<\/td>\n<td>Removes autoantibody (with the patient's own or other cells) to find hidden alloantibodies<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Elution<\/td>\n<td>Frees antibody from red cells for identification (acid, heat, ether)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Neutralization<\/td>\n<td>Soluble antigen blocks antibody: Lewis substance in saliva, hydatid cyst fluid for anti-P1<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Lectins<\/td>\n<td>Dolichos biflorus is anti-A1; Ulex europaeus is anti-H<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Thiol reagents (DTT, 2-ME)<\/td>\n<td>Destroy IgM and Kell antigens<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Chloroquine<\/td>\n<td>Removes IgG from red cells so antigens can be typed on DAT-positive cells<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>EDTA-glycine acid<\/td>\n<td>Strips IgG from red cells (also destroys Kell antigens)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Solid phase and column (gel) agglutination<\/td>\n<td>Automated, standardized, graded reactions<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Molecular (genotyping)<\/td>\n<td>Finds red cell antigens in recently transfused or DAT-positive patients<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Cytotoxicity and platelet testing<\/td>\n<td>HLA typing, platelet crossmatching<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n","min":6},{"id":"B4","sec":3,"title":"Components, donors and transfusion","html":"<h3 id=\"blood-components\">Blood components<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 19%\" />\n<col style=\"width: 22%\" />\n<col style=\"width: 13%\" />\n<col style=\"width: 44%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Component<\/th>\n<th>Storage<\/th>\n<th>Shelf life<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Red cells (AS-1)<\/td>\n<td>1-6 degrees C<\/td>\n<td>42 days<\/td>\n<td>One unit raises Hgb about 1 g/dL, Hct about 3%<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Whole blood (CPDA-1)<\/td>\n<td>1-6 degrees C<\/td>\n<td>35 days<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Frozen red cells<\/td>\n<td>At or below -65 degrees C<\/td>\n<td>10 years<\/td>\n<td>After thawing, 24 hours<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Platelets<\/td>\n<td>20-24 degrees C, agitated<\/td>\n<td>5 days (7 with bacterial testing)<\/td>\n<td>Random unit raises count 5,000-10,000; apheresis 30,000-60,000<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Fresh frozen plasma<\/td>\n<td>At or below -18 degrees C<\/td>\n<td>1 year<\/td>\n<td>Thawed: 24 hours at 1-6 degrees C; all clotting factors<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Cryoprecipitate<\/td>\n<td>At or below -18 degrees C<\/td>\n<td>1 year<\/td>\n<td>Thawed single unit within 6 hours; pooled within 4 hours; fibrinogen, VIII, vWF, XIII<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Granulocytes<\/td>\n<td>20-24 degrees C<\/td>\n<td>24 hours<\/td>\n<td>Irradiate; give quickly<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Washed red cells<\/td>\n<td>1-6 degrees C<\/td>\n<td>24 hours<\/td>\n<td>IgA-deficient patients, severe allergic reactions<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p><strong>Leukoreduced<\/strong> (fewer than 5 x 10^6 white cells): prevents febrile reactions, CMV transmission and HLA alloimmunization.<\/p><\/li>\n<li><p><strong>Irradiated<\/strong> (at least 25 Gy): prevents transfusion-associated graft-versus-host disease. Used for fetuses, immunocompromised patients, relative-directed donations and HLA-matched products.<\/p><\/li>\n<li><p>Stored red cells lose 2,3-DPG (oxygen curve shifts left) and gain potassium.<\/p><\/li>\n<li><p>Cryoprecipitate treats low fibrinogen, factor XIII deficiency and DIC.<\/p><\/li>\n<\/ul>\n<h3 id=\"donor-requirements\">Donor requirements<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 35%\" />\n<col style=\"width: 64%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Item<\/th>\n<th>Rule<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Hemoglobin<\/td>\n<td>At least 12.5 g/dL (or hematocrit 38%)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Weight<\/td>\n<td>At least 110 lb<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Temperature<\/td>\n<td>99.5 F or lower<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pulse<\/td>\n<td>50-100<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Blood pressure<\/td>\n<td>No higher than 180/100<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Whole blood interval<\/td>\n<td>56 days<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Platelet apheresis<\/td>\n<td>Every 7 days, up to 24 a year<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Double red cell<\/td>\n<td>Every 16 weeks<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Autologous donor<\/td>\n<td>Hgb at least 11 g/dL<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p><strong>Required tests:<\/strong> ABO and Rh, antibody screen, HIV-1/2 (antibody and NAT), HCV (antibody and NAT), HBsAg and anti-HBc, HTLV-I/II, West Nile NAT, syphilis, Chagas (first donation).<\/p><\/li>\n<li><p><strong>Deferrals:<\/strong> malaria (3 months after travel, 3 years after living in an endemic area), pregnancy (6 weeks after delivery), HIV risk, hepatitis.<\/p><\/li>\n<li><p>Collection: 450 mL (plus or minus 10%) in 63 mL anticoagulant; clean the arm with chlorhexidine or iodine; divert the first 30-40 mL.<\/p><\/li>\n<\/ul>\n<h3 id=\"component-quality-control-approximate-aabb-standards\">Component quality control (approximate AABB standards)<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 35%\" />\n<col style=\"width: 64%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Component<\/th>\n<th>What is checked<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Red cells<\/td>\n<td>Hematocrit not above 80%; leukoreduced units below 5 x 10^6 white cells<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Platelets (random unit)<\/td>\n<td>At least 5.5 x 10^10 platelets; pH at least 6.2 at the end of storage<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Platelets (apheresis)<\/td>\n<td>At least 3.0 x 10^11 platelets<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Cryoprecipitate<\/td>\n<td>At least 80 IU factor VIII and 150 mg fibrinogen per unit<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Irradiation<\/td>\n<td>25 Gy to the center, 15 Gy minimum anywhere<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Storage<\/td>\n<td>Refrigerator 1-6 degrees C with alarm and continuous record; platelet agitators checked<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"plasma-derivatives-and-apheresis\">Plasma derivatives and apheresis<\/h3>\n<ul>\n<li><p><strong>Fractionation products:<\/strong> albumin, IVIG, Rh immune globulin, hepatitis B and tetanus immune globulin, factor VIII and IX concentrates. They are pooled and virus-inactivated.<\/p><\/li>\n<li><p><strong>Therapeutic apheresis:<\/strong> plasma exchange (TTP, Guillain-Barre, myasthenia gravis, hyperviscosity), red cell exchange (sickle cell disease), leukapheresis (very high white count), photopheresis.<\/p><\/li>\n<li><p><strong>Extracorporeal circulation<\/strong> (heart-lung bypass, dialysis) uses heparin; cell salvage and autologous donation reduce the need for donor blood. This is part of patient blood management.<\/p><\/li>\n<li><p><strong>Donor reactions:<\/strong> vasovagal fainting is the most common (lie down, cool cloth, fluids); apheresis donors may get citrate reactions (tingling lips, treat with calcium or slow the return).<\/p><\/li>\n<\/ul>\n<h3 id=\"when-to-transfuse-typical-adult-guidance\">When to transfuse (typical adult guidance)<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 32%\" />\n<col style=\"width: 67%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Product<\/th>\n<th>Common indication<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Red cells<\/td>\n<td>Hemoglobin below about 7 g/dL (below 8 for heart disease or orthopedic surgery), or symptoms of poor oxygen delivery<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Platelets<\/td>\n<td>Prophylaxis if count is below 10,000 per microliter; below 50,000 with active bleeding or before surgery<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Fresh frozen plasma<\/td>\n<td>Multiple factor deficiencies, warfarin reversal with bleeding, TTP (as exchange)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Cryoprecipitate<\/td>\n<td>Fibrinogen below 100-150 mg/dL, factor XIII deficiency<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Granulocytes<\/td>\n<td>Severe neutropenia with infection not responding to antibiotics<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Massive bleeding<\/td>\n<td>Balanced transfusion of red cells, plasma and platelets (about 1:1:1)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Giving blood safely:<\/strong> use only 0.9% saline in the same line (no drugs, no dextrose, no Ringer's lactate), a standard filter (170-260 micron), start slowly for the first 15 minutes while watching the patient, record vital signs, and finish the unit within 4 hours. Use a blood warmer for massive transfusion or cold agglutinin patients.<\/p>\n","min":6},{"id":"B5","sec":3,"title":"Reactions, HDFN and immune hemolysis","html":"<figure class=\"fig\" id=\"F22\"><svg viewBox=\"0 0 760 510\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Transfusion reaction\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"510\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Suspected transfusion reaction: workup<\/text><rect x=\"120\" y=\"40\" width=\"520\" height=\"38\" rx=\"6\" fill=\"#fdeceb\" stroke=\"#b42318\" stroke-width=\"1.3\" /><text x=\"380.0\" y=\"62.666666666666664\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">1. STOP the transfusion. Keep the IV line open with saline.<\/text><line x1=\"380\" y1=\"78\" x2=\"380\" y2=\"88\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"120\" y=\"88\" width=\"520\" height=\"38\" rx=\"6\" fill=\"#fff3c4\" stroke=\"#a88a00\" stroke-width=\"1.3\" /><text x=\"380.0\" y=\"110.66666666666667\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">2. Clerical check at the bedside: patient ID, unit label, ABO/Rh, order.<\/text><line x1=\"380\" y1=\"126\" x2=\"380\" y2=\"136\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"120\" y=\"136\" width=\"520\" height=\"38\" rx=\"6\" fill=\"#fff3c4\" stroke=\"#a88a00\" stroke-width=\"1.3\" /><text x=\"380.0\" y=\"158.66666666666666\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">3. Notify physician and blood bank. Return bag, tubing and a fresh post-reaction sample.<\/text><line x1=\"380\" y1=\"174\" x2=\"380\" y2=\"184\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"120\" y=\"184\" width=\"520\" height=\"38\" rx=\"6\" fill=\"#e4eefb\" stroke=\"#1f4f99\" stroke-width=\"1.3\" /><text x=\"380.0\" y=\"206.66666666666666\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">4. Blood bank: inspect plasma for hemolysis, repeat ABO/Rh, DAT, recheck crossmatch.<\/text><rect x=\"30\" y=\"245\" width=\"700\" height=\"27\" rx=\"0\" fill=\"#e2f1ee\" stroke=\"#ddd\" stroke-width=\"1\" /><text x=\"35\" y=\"262.0\" font-size=\"10.5\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Type<\/text><text x=\"180\" y=\"262.0\" font-size=\"9.5\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Typical signs<\/text><text x=\"425\" y=\"262.0\" font-size=\"9.5\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Cause / key test<\/text><rect x=\"30\" y=\"272\" width=\"700\" height=\"27\" rx=\"0\" fill=\"#fff\" stroke=\"#ddd\" stroke-width=\"1\" /><text x=\"35\" y=\"289.0\" font-size=\"10.5\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Acute hemolytic<\/text><text x=\"180\" y=\"289.0\" font-size=\"9.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">fever, chills, pain, red urine, DIC, hypotension<\/text><text x=\"425\" y=\"289.0\" font-size=\"9.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">ABO incompatibility (clerical error); pink plasma, DAT +<\/text><rect x=\"30\" y=\"299\" width=\"700\" height=\"27\" rx=\"0\" fill=\"#f7f6f2\" stroke=\"#ddd\" stroke-width=\"1\" /><text x=\"35\" y=\"316.0\" font-size=\"10.5\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Delayed hemolytic<\/text><text x=\"180\" y=\"316.0\" font-size=\"9.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">fever, falling Hgb, jaundice at 3-14 days<\/text><text x=\"425\" y=\"316.0\" font-size=\"9.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">anamnestic Kidd/Rh/Duffy antibody; DAT + (mixed field)<\/text><rect x=\"30\" y=\"326\" width=\"700\" height=\"27\" rx=\"0\" fill=\"#fff\" stroke=\"#ddd\" stroke-width=\"1\" /><text x=\"35\" y=\"343.0\" font-size=\"10.5\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Febrile non-hemolytic<\/text><text x=\"180\" y=\"343.0\" font-size=\"9.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">temp rise ≥1 °C, chills only<\/text><text x=\"425\" y=\"343.0\" font-size=\"9.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">cytokines / anti-WBC; leukoreduce; rule out hemolysis<\/text><rect x=\"30\" y=\"353\" width=\"700\" height=\"27\" rx=\"0\" fill=\"#f7f6f2\" stroke=\"#ddd\" stroke-width=\"1\" /><text x=\"35\" y=\"370.0\" font-size=\"10.5\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Allergic (urticarial)<\/text><text x=\"180\" y=\"370.0\" font-size=\"9.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">hives, itching<\/text><text x=\"425\" y=\"370.0\" font-size=\"9.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">plasma proteins; pause, antihistamine, resume if clear<\/text><rect x=\"30\" y=\"380\" width=\"700\" height=\"27\" rx=\"0\" fill=\"#fff\" stroke=\"#ddd\" stroke-width=\"1\" /><text x=\"35\" y=\"397.0\" font-size=\"10.5\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Anaphylactic<\/text><text x=\"180\" y=\"397.0\" font-size=\"9.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">hypotension, wheeze, no fever<\/text><text x=\"425\" y=\"397.0\" font-size=\"9.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">anti-IgA in IgA-deficient patient; washed products<\/text><rect x=\"30\" y=\"407\" width=\"700\" height=\"27\" rx=\"0\" fill=\"#f7f6f2\" stroke=\"#ddd\" stroke-width=\"1\" /><text x=\"35\" y=\"424.0\" font-size=\"10.5\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">TRALI<\/text><text x=\"180\" y=\"424.0\" font-size=\"9.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">dyspnea within 6 h, bilateral infiltrates, normal heart<\/text><text x=\"425\" y=\"424.0\" font-size=\"9.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">donor anti-HLA/HNA antibodies; not volume overload<\/text><rect x=\"30\" y=\"434\" width=\"700\" height=\"27\" rx=\"0\" fill=\"#fff\" stroke=\"#ddd\" stroke-width=\"1\" /><text x=\"35\" y=\"451.0\" font-size=\"10.5\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">TACO<\/text><text x=\"180\" y=\"451.0\" font-size=\"9.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">dyspnea, hypertension, high BNP<\/text><text x=\"425\" y=\"451.0\" font-size=\"9.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">circulatory overload; slow rate, diuretic<\/text><rect x=\"30\" y=\"461\" width=\"700\" height=\"27\" rx=\"0\" fill=\"#f7f6f2\" stroke=\"#ddd\" stroke-width=\"1\" /><text x=\"35\" y=\"478.0\" font-size=\"10.5\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Septic<\/text><text x=\"180\" y=\"478.0\" font-size=\"9.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">high fever, shock, rigors<\/text><text x=\"425\" y=\"478.0\" font-size=\"9.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">bacterial contamination (platelets); culture bag and patient<\/text><\/svg><figcaption>What to do if a transfusion reaction is suspected, and how to sort the cause.<\/figcaption><\/figure><h3 id=\"transfusion-reactions\">Transfusion reactions<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 29%\" />\n<col style=\"width: 17%\" />\n<col style=\"width: 52%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Reaction<\/th>\n<th>When<\/th>\n<th>Cause and clues<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Acute hemolytic<\/td>\n<td>During or within 24 hours<\/td>\n<td>ABO incompatibility, usually a clerical error. Fever, back pain, red plasma, red urine, positive DAT, DIC<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Delayed hemolytic<\/td>\n<td>3-14 days<\/td>\n<td>Memory antibody (Kidd, Rh, Duffy, Kell). New antibody on screen, positive DAT, mild jaundice<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Febrile nonhemolytic<\/td>\n<td>During or up to 4 hours after<\/td>\n<td>Cytokines from white cells. Temperature rise of 1 degree C or more; diagnosis of exclusion<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Allergic (hives)<\/td>\n<td>During or within 4 hours<\/td>\n<td>Antihistamine; transfusion may continue<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Anaphylactic<\/td>\n<td>Within minutes<\/td>\n<td>IgA-deficient patient with anti-IgA; use washed or IgA-deficient products<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>TRALI<\/td>\n<td>Within 6 hours<\/td>\n<td>Donor antibodies to recipient white cells; lung edema, normal heart pressures<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>TACO<\/td>\n<td>Within 6 hours<\/td>\n<td>Circulatory overload; high BNP, high blood pressure; slow rate and diuretics<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Graft-versus-host<\/td>\n<td>4-30 days<\/td>\n<td>Donor lymphocytes attack; fever, rash, diarrhea, pancytopenia; irradiation prevents it<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Septic<\/td>\n<td>During or within hours<\/td>\n<td>Bacteria in the unit (platelets most often); Gram stain and culture the bag<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Post-transfusion purpura<\/td>\n<td>5-10 days<\/td>\n<td>Anti-HPA-1a; sudden low platelets<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Workup order for a suspected hemolytic reaction:<\/strong> stop the transfusion, keep the IV open with saline, check the labels and paperwork, notify the physician and blood bank, collect a post-transfusion sample, look at the plasma for pink color, repeat ABO and Rh, and run a DAT.<\/p>\n<h3 id=\"hemolytic-disease-of-the-fetus-and-newborn-hdfn\">Hemolytic disease of the fetus and newborn (HDFN)<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 27%\" />\n<col style=\"width: 51%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th><\/th>\n<th>ABO HDFN<\/th>\n<th>Rh HDFN<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Mother and baby<\/td>\n<td>Mother O, baby A or B<\/td>\n<td>Mother Rh negative with anti-D, baby Rh positive<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Severity<\/td>\n<td>Usually mild<\/td>\n<td>Can be severe<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>DAT on baby<\/td>\n<td>Weak or negative<\/td>\n<td>Positive<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Smear<\/td>\n<td>Spherocytes<\/td>\n<td>Many nucleated red cells<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Prevention<\/td>\n<td>None<\/td>\n<td>RhIG<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p>Exchange transfusion blood should be fresh (less than 7 days), group O, antigen-negative, CMV-safe and irradiated, and compatible with the mother's serum.<\/p><\/li>\n<li><p>Cord blood tests: ABO and Rh, DAT. If the mother is Rh negative, test the baby for weak D.<\/p><\/li>\n<\/ul>\n<h3 id=\"rh-immune-globulin-timing\">Rh immune globulin timing<\/h3>\n<ul>\n<li><p>Give RhIG to Rh-negative women at about 28 weeks of pregnancy and within 72 hours of delivery of an Rh-positive baby. Also give after miscarriage, abortion, ectopic pregnancy, amniocentesis, abdominal trauma.<\/p><\/li>\n<li><p>RhIG is not given if the mother already has anti-D from sensitization, or if she is Rh positive (including weak D).<\/p><\/li>\n<\/ul>\n<h3 id=\"immune-hemolytic-anemias\">Immune hemolytic anemias<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 22%\" />\n<col style=\"width: 24%\" />\n<col style=\"width: 52%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Type<\/th>\n<th>Antibody<\/th>\n<th>Key points<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Warm autoimmune<\/td>\n<td>IgG, panreactive<\/td>\n<td>Spherocytes, DAT positive for IgG (with or without C3); lupus, CLL<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Cold agglutinin disease<\/td>\n<td>IgM anti-I<\/td>\n<td>Red cells clump in the cold; DAT positive for C3 only; Mycoplasma, mononucleosis (anti-i)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Paroxysmal cold hemoglobinuria<\/td>\n<td>IgG anti-P, biphasic<\/td>\n<td>Donath-Landsteiner test; children after viral infection<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Drug-induced<\/td>\n<td>Varies<\/td>\n<td>Penicillin (drug on cell), methyldopa (autoantibody), quinidine (immune complex)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n","min":5},{"id":"B6","sec":3,"title":"Transplantation and quality assurance","html":"<h3 id=\"transplantation-and-blood\">Transplantation and blood<\/h3>\n<ul>\n<li><p>Solid organs need ABO compatibility; kidney, heart and liver also use HLA crossmatching to detect preformed antibodies.<\/p><\/li>\n<li><p>Stem cell (HPC) transplant: <strong>major mismatch<\/strong> (recipient has antibodies to donor cells) can cause delayed hemolysis or pure red cell aplasia; <strong>minor mismatch<\/strong> (donor plasma antibodies against recipient cells) can cause hemolysis from passenger lymphocytes. Products are irradiated; the transfusion service selects group O red cells and AB plasma or platelets during the switch.<\/p><\/li>\n<\/ul>\n<h3 id=\"quality-assurance-in-the-blood-bank\">Quality assurance in the blood bank<\/h3>\n<ul>\n<li><p>Test reagent red cells, antisera and AHG with positive and negative controls on each day of use. Refrigerators and freezers are checked and recorded daily with alarms.<\/p><\/li>\n<li><p>Keep the patient's sample and the donor segments for at least 7 days after transfusion. Records of donors, patients and transfusions are kept for the required period (often 5 years or longer).<\/p><\/li>\n<\/ul>\n","min":3},{"id":"B7","sec":3,"title":"Blood banking exam traps","html":"<h3 id=\"exam-traps-3\">Exam traps<\/h3>\n<ul>\n<li><p>Lewis and P1 antibodies are IgM and do not cause HDFN; Rh antibodies do.<\/p><\/li>\n<li><p>Ficin and papain destroy Duffy but enhance Rh and Kidd.<\/p><\/li>\n<li><p>A negative AHG test without a positive check-cell result is invalid.<\/p><\/li>\n<li><p>Group O is universal for red cells; group AB is universal for plasma.<\/p><\/li>\n<\/ul>\n","min":3},{"id":"I1","sec":4,"title":"Start here: immune system, antibodies, cells","html":"<p><strong>If you only remember 8 things<\/strong><\/p>\n<ol type=\"1\">\n<li><p>IgM appears first and is the best complement fixer; IgG is the most abundant and crosses the placenta; IgA protects mucosal surfaces; IgE causes allergy.<\/p><\/li>\n<li><p>T cells carry CD3; helper T cells CD4 (the HIV target); cytotoxic T cells CD8; B cells CD19 and CD20; NK cells CD16 and CD56.<\/p><\/li>\n<li><p>Complement: C1q starts the classical pathway; C5b-9 is the membrane attack complex; C3b is the opsonin; C5a attracts white cells.<\/p><\/li>\n<li><p>Hypersensitivity memory trick <strong>ACID<\/strong>: Anaphylactic (I), Cytotoxic (II), Immune complex (III), Delayed (IV).<\/p><\/li>\n<li><p>ANA is the screen for lupus; anti-dsDNA and anti-Smith are specific for SLE.<\/p><\/li>\n<li><p>Hepatitis B: HBsAg appears first; anti-HBs means immunity; anti-HBc IgM marks acute infection and the window period.<\/p><\/li>\n<li><p>Syphilis: RPR or VDRL screens (nontreponemal); FTA-ABS or TP-PA confirms (treponemal). The prozone effect can cause a false negative.<\/p><\/li>\n<li><p>Sensitivity = true positives / (true positives + false negatives). Specificity = true negatives / (true negatives + false positives).<\/p><\/li>\n<\/ol>\n<h3 id=\"innate-and-adaptive-immunity\">Innate and adaptive immunity<\/h3>\n<ul>\n<li><p><strong>Innate (immediate, non-specific):<\/strong> neutrophils, macrophages, NK cells, complement, skin barriers. Phagocytosis is helped by opsonins (IgG, C3b). The NBT test checks the neutrophil respiratory burst.<\/p><\/li>\n<li><p><strong>Adaptive (slower, specific, with memory):<\/strong> T and B lymphocytes.<\/p><\/li>\n<li><p><strong>Antigen terms:<\/strong> an epitope is the part of an antigen an antibody binds; a hapten is a small molecule that triggers a response only when attached to a carrier (as in penicillin allergy).<\/p><\/li>\n<li><p><strong>Acute phase proteins:<\/strong> CRP rises within 4-6 hours and peaks at 36-50 hours (high-sensitivity CRP estimates heart disease risk); ferritin, fibrinogen and haptoglobin also rise. Albumin falls.<\/p><\/li>\n<\/ul>\n<figure class=\"fig\" id=\"F23\"><svg viewBox=\"0 0 760 390\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Antibody structure\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"390\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Immunoglobulin structure and classes<\/text><path d=\"M140,280 V190\" fill=\"none\" stroke=\"#2b6cb0\" stroke-width=\"9\" /><path d=\"M140,190 L80,105\" fill=\"none\" stroke=\"#2b6cb0\" stroke-width=\"9\" /><path d=\"M140,190 L200,105\" fill=\"none\" stroke=\"#2b6cb0\" stroke-width=\"9\" /><path d=\"M134,280 V190\" fill=\"none\" stroke=\"#6aa0e0\" stroke-width=\"4\" /><path d=\"M146,280 V190\" fill=\"none\" stroke=\"#6aa0e0\" stroke-width=\"4\" /><path d=\"M90,120 L68,95\" fill=\"none\" stroke=\"#e07a2a\" stroke-width=\"7\" /><path d=\"M190,120 L212,95\" fill=\"none\" stroke=\"#e07a2a\" stroke-width=\"7\" /><text x=\"45\" y=\"98\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Antigen-<\/text><text x=\"45\" y=\"110\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">binding site<\/text><text x=\"235\" y=\"102\" font-size=\"10\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#9a5b00\">V (variable)<\/text><text x=\"68\" y=\"170\" font-size=\"12\" text-anchor=\"end\" font-weight=\"bold\" fill=\"#222\">Fab<\/text><text x=\"162\" y=\"250\" font-size=\"10\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Fc (complement,<\/text><text x=\"162\" y=\"262\" font-size=\"10\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">phagocyte binding)<\/text><text x=\"150\" y=\"188\" font-size=\"9\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#666\">hinge<\/text><text x=\"122\" y=\"220\" font-size=\"11\" text-anchor=\"end\" font-weight=\"bold\" fill=\"#2b6cb0\">H<\/text><text x=\"206\" y=\"145\" font-size=\"11\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#6aa0e0\">L<\/text><text x=\"140\" y=\"330\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">Two heavy + two light chains joined<\/text><text x=\"140\" y=\"342\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">by disulfide bonds<\/text><text x=\"140\" y=\"70\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">IgG monomer<\/text><rect x=\"300\" y=\"60\" width=\"440\" height=\"52\" rx=\"8\" fill=\"#fff\" stroke=\"#ccc\" stroke-width=\"1\" /><rect x=\"300\" y=\"60\" width=\"52\" height=\"52\" rx=\"8\" fill=\"#e2f1ee\" stroke=\"#ccc\" stroke-width=\"1\" /><text x=\"326\" y=\"91\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#0b6b5d\">IgG<\/text><text x=\"362\" y=\"80\" font-size=\"10\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">75% of serum Ig. Crosses the placenta. Secondary response. 4 <\/text><text x=\"362\" y=\"92\" font-size=\"10\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">subclasses. Fixes complement. <\/text><rect x=\"300\" y=\"120\" width=\"440\" height=\"52\" rx=\"8\" fill=\"#fff\" stroke=\"#ccc\" stroke-width=\"1\" /><rect x=\"300\" y=\"120\" width=\"52\" height=\"52\" rx=\"8\" fill=\"#e2f1ee\" stroke=\"#ccc\" stroke-width=\"1\" /><text x=\"326\" y=\"151\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#0b6b5d\">IgM<\/text><text x=\"362\" y=\"140\" font-size=\"10\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">Pentamer + J chain. First made and largest. Best complement <\/text><text x=\"362\" y=\"152\" font-size=\"10\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">activator. Does not cross placenta; high in newborn = fetal <\/text><text x=\"362\" y=\"164\" font-size=\"10\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">infection. <\/text><rect x=\"300\" y=\"180\" width=\"440\" height=\"52\" rx=\"8\" fill=\"#fff\" stroke=\"#ccc\" stroke-width=\"1\" /><rect x=\"300\" y=\"180\" width=\"52\" height=\"52\" rx=\"8\" fill=\"#e2f1ee\" stroke=\"#ccc\" stroke-width=\"1\" /><text x=\"326\" y=\"211\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#0b6b5d\">IgA<\/text><text x=\"362\" y=\"200\" font-size=\"10\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">Dimer + secretory component. Tears, saliva, milk, gut and <\/text><text x=\"362\" y=\"212\" font-size=\"10\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">respiratory secretions. <\/text><rect x=\"300\" y=\"240\" width=\"440\" height=\"52\" rx=\"8\" fill=\"#fff\" stroke=\"#ccc\" stroke-width=\"1\" /><rect x=\"300\" y=\"240\" width=\"52\" height=\"52\" rx=\"8\" fill=\"#e2f1ee\" stroke=\"#ccc\" stroke-width=\"1\" /><text x=\"326\" y=\"271\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#0b6b5d\">IgE<\/text><text x=\"362\" y=\"260\" font-size=\"10\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">Allergy and parasites. Binds mast cells and basophils. Low in <\/text><text x=\"362\" y=\"272\" font-size=\"10\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">serum. <\/text><rect x=\"300\" y=\"300\" width=\"440\" height=\"52\" rx=\"8\" fill=\"#fff\" stroke=\"#ccc\" stroke-width=\"1\" /><rect x=\"300\" y=\"300\" width=\"52\" height=\"52\" rx=\"8\" fill=\"#e2f1ee\" stroke=\"#ccc\" stroke-width=\"1\" /><text x=\"326\" y=\"331\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#0b6b5d\">IgD<\/text><text x=\"362\" y=\"320\" font-size=\"10\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">B-cell surface receptor. Tiny serum amount. <\/text><\/svg><figcaption>Antibody structure and the five classes.<\/figcaption><\/figure><h3 id=\"immunoglobulins\">Immunoglobulins<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 85%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Class<\/th>\n<th>Key facts<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>IgG<\/td>\n<td>About 75% of serum antibody; crosses the placenta; main secondary (memory) response; IgG1 and IgG3 fix complement best<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>IgM<\/td>\n<td>First antibody made; pentamer; best agglutinator and complement fixer; does not cross the placenta; high in newborn infection<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>IgA<\/td>\n<td>Secretory form is a dimer with a J chain and secretory piece; found in saliva, tears and milk<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>IgE<\/td>\n<td>Allergy and parasites; binds mast cells and basophils; lowest concentration<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>IgD<\/td>\n<td>B cell surface receptor<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p>Structure: 2 heavy and 2 light chains. Fab binds antigen; Fc binds complement and Fc receptors. Papain gives 2 Fab and 1 Fc; pepsin gives F(ab')2.<\/p><\/li>\n<li><p>Primary response: slow, mostly IgM, low level. Secondary response: fast, mostly IgG, higher and longer.<\/p><\/li>\n<\/ul>\n<h3 id=\"immune-cells-and-markers\">Immune cells and markers<\/h3>\n<ul>\n<li><p><strong>T cells:<\/strong> CD3. Helper = CD4 (HLA class II). Cytotoxic = CD8 (HLA class I). Regulatory T cells = CD4, CD25, FOXP3.<\/p><\/li>\n<li><p><strong>B cells:<\/strong> CD19, CD20, CD21; become plasma cells.<\/p><\/li>\n<li><p><strong>NK cells:<\/strong> CD16, CD56; kill without prior exposure.<\/p><\/li>\n<li><p><strong>Flow cytometry:<\/strong> forward scatter = size; side scatter = granularity. CD4 count follows HIV; CD34 counts stem cells.<\/p><\/li>\n<li><p><strong>MHC:<\/strong> class I (A, B, C) on all nucleated cells; class II (DR, DP, DQ) on antigen-presenting cells.<\/p><\/li>\n<\/ul>\n<h3 id=\"cytokines\">Cytokines<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 29%\" />\n<col style=\"width: 70%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Cytokine<\/th>\n<th>Main role<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>IL-1, TNF-alpha<\/td>\n<td>Fever and inflammation<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>IL-2<\/td>\n<td>Growth of T cells<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>IL-4, IL-5<\/td>\n<td>B cell and eosinophil growth, allergy<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>IL-6<\/td>\n<td>Acute phase response, CRP production<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>IL-8<\/td>\n<td>Attracts neutrophils<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Interferon-gamma<\/td>\n<td>Activates macrophages; basis of the TB blood test<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Cytokines are measured by ELISA, multiplex bead assays or flow cytometry.<\/p>\n","min":6},{"id":"I2","sec":4,"title":"Complement, hypersensitivity, immunodeficiency","html":"<figure class=\"fig\" id=\"F24\"><svg viewBox=\"0 0 760 450\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Complement\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"450\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Complement activation<\/text><rect x=\"10\" y=\"40\" width=\"200\" height=\"62\" rx=\"6\" fill=\"#e4eefb\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"110.0\" y=\"62.0\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">CLASSICAL<\/text><text x=\"110.0\" y=\"74.5\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">antigen-antibody (IgM, IgG)<\/text><text x=\"110.0\" y=\"87.0\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">C1q, C1r, C1s → C4, C2<\/text><rect x=\"250\" y=\"40\" width=\"200\" height=\"62\" rx=\"6\" fill=\"#e6f4ea\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"350.0\" y=\"62.0\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">LECTIN<\/text><text x=\"350.0\" y=\"74.5\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">mannose-binding lectin<\/text><text x=\"350.0\" y=\"87.0\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">binds microbial sugars → C4, C2<\/text><rect x=\"490\" y=\"40\" width=\"200\" height=\"62\" rx=\"6\" fill=\"#fff3c4\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"590.0\" y=\"62.0\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">ALTERNATIVE<\/text><text x=\"590.0\" y=\"74.5\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">spontaneous C3 hydrolysis,<\/text><text x=\"590.0\" y=\"87.0\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">LPS; factors B, D, properdin<\/text><line x1=\"110\" y1=\"102\" x2=\"130\" y2=\"134\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"85\" y=\"134\" width=\"90\" height=\"26\" rx=\"6\" fill=\"#f4e6f6\" stroke=\"#9a6aa6\" stroke-width=\"1.3\" /><text x=\"130.0\" y=\"150.66666666666666\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">C4b2a<\/text><line x1=\"130\" y1=\"160\" x2=\"370\" y2=\"200\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"350\" y1=\"102\" x2=\"370\" y2=\"134\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"325\" y=\"134\" width=\"90\" height=\"26\" rx=\"6\" fill=\"#f4e6f6\" stroke=\"#9a6aa6\" stroke-width=\"1.3\" /><text x=\"370.0\" y=\"150.66666666666666\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">C4b2a<\/text><line x1=\"370\" y1=\"160\" x2=\"370\" y2=\"200\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"590\" y1=\"102\" x2=\"610\" y2=\"134\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"565\" y=\"134\" width=\"90\" height=\"26\" rx=\"6\" fill=\"#f4e6f6\" stroke=\"#9a6aa6\" stroke-width=\"1.3\" /><text x=\"610.0\" y=\"150.66666666666666\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">C3bBb<\/text><line x1=\"610\" y1=\"160\" x2=\"370\" y2=\"200\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><text x=\"370\" y=\"176\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">C3 convertases<\/text><rect x=\"280\" y=\"200\" width=\"180\" height=\"34\" rx=\"6\" fill=\"#fdeadb\" stroke=\"#e0a470\" stroke-width=\"1.3\" /><text x=\"370.0\" y=\"221.33333333333334\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">C3 → C3a + C3b<\/text><line x1=\"370\" y1=\"234\" x2=\"370\" y2=\"262\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"280\" y=\"262\" width=\"180\" height=\"30\" rx=\"6\" fill=\"#f4e6f6\" stroke=\"#9a6aa6\" stroke-width=\"1.3\" /><text x=\"370.0\" y=\"281.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">C5 convertase<\/text><line x1=\"370\" y1=\"292\" x2=\"370\" y2=\"318\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"280\" y=\"318\" width=\"180\" height=\"34\" rx=\"6\" fill=\"#fdeadb\" stroke=\"#e0a470\" stroke-width=\"1.3\" /><text x=\"370.0\" y=\"339.3333333333333\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">C5 → C5a + C5b<\/text><line x1=\"370\" y1=\"352\" x2=\"370\" y2=\"376\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"230\" y=\"376\" width=\"280\" height=\"40\" rx=\"6\" fill=\"#fdeceb\" stroke=\"#b42318\" stroke-width=\"1.3\" /><text x=\"370.0\" y=\"393.1666666666667\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">C5b + C6, C7, C8, C9 = MAC (C5b-9)<\/text><text x=\"370.0\" y=\"406.1666666666667\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">cell lysis (kills Neisseria)<\/text><rect x=\"20\" y=\"200\" width=\"230\" height=\"92\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"135.0\" y=\"230.75\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">C3b = opsonin<\/text><text x=\"135.0\" y=\"243.25\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">(coats microbes for<\/text><text x=\"135.0\" y=\"255.75\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">phagocytosis)<\/text><text x=\"135.0\" y=\"268.25\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">also binds immune complexes<\/text><line x1=\"280\" y1=\"217\" x2=\"250\" y2=\"217\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"510\" y=\"200\" width=\"230\" height=\"92\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"625.0\" y=\"230.75\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">C3a and C5a =<\/text><text x=\"625.0\" y=\"243.25\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">anaphylatoxins<\/text><text x=\"625.0\" y=\"255.75\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">(mast-cell degranulation,<\/text><text x=\"625.0\" y=\"268.25\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">vasodilation); C5a: chemotaxis<\/text><line x1=\"460\" y1=\"217\" x2=\"510\" y2=\"217\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"20\" y=\"330\" width=\"200\" height=\"86\" rx=\"6\" fill=\"#fff7e0\" stroke=\"#ccb\" stroke-width=\"1.3\" /><text x=\"120.0\" y=\"358.3333333333333\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">Low C3 and C4:<\/text><text x=\"120.0\" y=\"370.3333333333333\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">immune complex disease<\/text><text x=\"120.0\" y=\"382.3333333333333\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">(SLE). Low C3, normal C4:<\/text><text x=\"120.0\" y=\"394.3333333333333\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">alternative pathway<\/text><rect x=\"540\" y=\"330\" width=\"200\" height=\"86\" rx=\"6\" fill=\"#fff7e0\" stroke=\"#ccb\" stroke-width=\"1.3\" /><text x=\"640.0\" y=\"358.3333333333333\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">C1 inhibitor deficiency =<\/text><text x=\"640.0\" y=\"370.3333333333333\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">hereditary angioedema (low C4)<\/text><text x=\"640.0\" y=\"382.3333333333333\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">C5-C9 deficiency =<\/text><text x=\"640.0\" y=\"394.3333333333333\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">recurrent Neisseria<\/text><\/svg><figcaption>The three complement pathways meet at C3.<\/figcaption><\/figure><h3 id=\"complement\">Complement<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 14%\" />\n<col style=\"width: 36%\" />\n<col style=\"width: 48%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Pathway<\/th>\n<th>Trigger<\/th>\n<th>Key steps<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Classical<\/td>\n<td>Antibody bound to antigen (IgM, IgG)<\/td>\n<td>C1q, then C4, C2, C3; convertase C4b2a<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Alternative<\/td>\n<td>Microbial surfaces<\/td>\n<td>Factors B and D, properdin; convertase C3bBb<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Lectin<\/td>\n<td>Mannose-binding lectin<\/td>\n<td>Joins at C4 and C2<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p>All pathways finish with the membrane attack complex, C5b-9.<\/p><\/li>\n<li><p>C3a, C4a and C5a are anaphylatoxins. C5a is a strong chemotaxin. C3b is the opsonin.<\/p><\/li>\n<li><p>Low C4 with C1 inhibitor deficiency = hereditary angioedema. Low C3 and C4 = immune complex disease (SLE, post-strep glomerulonephritis). Low C3 only = alternative pathway. Missing C5-C9 = repeated Neisseria infections.<\/p><\/li>\n<li><p>CH50 tests the whole classical pathway. Serum must be fresh or frozen; heating at 56 degrees C for 30 minutes destroys complement.<\/p><\/li>\n<\/ul>\n<h3 id=\"hypersensitivity-acid\">Hypersensitivity (ACID)<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 26%\" />\n<col style=\"width: 27%\" />\n<col style=\"width: 45%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Type<\/th>\n<th>Mechanism<\/th>\n<th>Examples<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>I (Anaphylactic)<\/td>\n<td>IgE on mast cells, immediate<\/td>\n<td>Allergy, asthma, anaphylaxis; total IgE and specific IgE tests<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>II (Cytotoxic)<\/td>\n<td>Antibody against cells, complement<\/td>\n<td>Transfusion reactions, HDFN, autoimmune hemolytic anemia, Goodpasture, myasthenia gravis<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>III (Immune complex)<\/td>\n<td>Antigen-antibody complexes deposit in tissue<\/td>\n<td>SLE, serum sickness, Arthus reaction, glomerulonephritis<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>IV (Delayed)<\/td>\n<td>T cells, 48-72 hours, no antibody<\/td>\n<td>TB skin test, contact dermatitis, graft rejection<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"immunodeficiency\">Immunodeficiency<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 41%\" />\n<col style=\"width: 58%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Disorder<\/th>\n<th>Clue<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>DiGeorge<\/td>\n<td>No thymus, low T cells<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Bruton agammaglobulinemia<\/td>\n<td>X-linked, no B cells, low immunoglobulins<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>SCID<\/td>\n<td>Both T and B cells missing<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Selective IgA deficiency<\/td>\n<td>Most common; risk of anaphylaxis from IgA-containing blood<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Chronic granulomatous disease<\/td>\n<td>NBT test negative (no respiratory burst)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Wiskott-Aldrich<\/td>\n<td>Eczema, low platelets, infections<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>HIV<\/td>\n<td>CD4 depletion<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>HIV testing:<\/strong> screen with a 4th-generation antigen/antibody test, then confirm with an HIV-1/HIV-2 differentiation immunoassay and NAT; viral load by RT-PCR. Western blot is no longer the first confirmation step.<\/p>\n","min":3},{"id":"I3","sec":4,"title":"Autoimmune disease and gammopathies","html":"<h3 id=\"autoimmune-disease-markers\">Autoimmune disease markers<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 42%\" />\n<col style=\"width: 57%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Disease<\/th>\n<th>Key markers<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>SLE<\/td>\n<td>ANA (screen), anti-dsDNA and anti-Smith (specific), low C3 and C4<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Drug-induced lupus<\/td>\n<td>Anti-histone<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Sjogren<\/td>\n<td>Anti-SSA (Ro), anti-SSB (La)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Diffuse scleroderma<\/td>\n<td>Anti-Scl-70<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>CREST<\/td>\n<td>Anti-centromere<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Mixed connective tissue disease<\/td>\n<td>Anti-U1 RNP<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Rheumatoid arthritis<\/td>\n<td>RF; anti-CCP is more specific<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Celiac disease<\/td>\n<td>Anti-tissue transglutaminase IgA, anti-endomysial IgA<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Primary biliary cholangitis<\/td>\n<td>Anti-mitochondrial<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Autoimmune hepatitis<\/td>\n<td>Anti-smooth muscle, ANA<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Pernicious anemia<\/td>\n<td>Anti-intrinsic factor, anti-parietal cell<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Myasthenia gravis<\/td>\n<td>Anti-acetylcholine receptor<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Goodpasture<\/td>\n<td>Anti-glomerular basement membrane<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>GPA (Wegener)<\/td>\n<td>c-ANCA (PR3)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Microscopic polyangiitis<\/td>\n<td>p-ANCA (MPO)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Graves disease<\/td>\n<td>TSH receptor antibodies<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Hashimoto thyroiditis<\/td>\n<td>Anti-TPO, anti-thyroglobulin<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Type 1 diabetes<\/td>\n<td>Anti-GAD, anti-islet cell<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>ANA patterns:<\/strong> homogeneous (dsDNA, histone); speckled (Sm, RNP, SSA, SSB); nucleolar (scleroderma); centromere (CREST); rim or peripheral (dsDNA, very specific for SLE).<\/p>\n<h3 id=\"thyroid-antibodies-ana-and-rheumatoid-factor\">Thyroid antibodies, ANA and rheumatoid factor<\/h3>\n<ul>\n<li><p>Thyroid: anti-TPO and anti-thyroglobulin (Hashimoto); TSH receptor antibodies (Graves).<\/p><\/li>\n<li><p><strong>Rheumatoid factor (RF):<\/strong> IgM against the Fc part of IgG; also positive in other diseases and some healthy older adults; anti-CCP is more specific for rheumatoid arthritis.<\/p><\/li>\n<li><p><strong>ANA:<\/strong> screened by indirect immunofluorescence on HEp-2 cells; positive at a titer of 1:40 or 1:80 or higher depending on the lab, then reflexed to specific antibody tests.<\/p><\/li>\n<\/ul>\n<h3 id=\"monoclonal-gammopathies\">Monoclonal gammopathies<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 42%\" />\n<col style=\"width: 57%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Condition<\/th>\n<th>Key points<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>MGUS<\/td>\n<td>Small monoclonal protein, under 10% plasma cells, no organ damage<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Multiple myeloma<\/td>\n<td>Over 10% plasma cells, M-protein, bone lesions, kidney damage, high calcium<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Waldenstrom macroglobulinemia<\/td>\n<td>IgM paraprotein, thick blood (hyperviscosity)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Cryoglobulinemia<\/td>\n<td>Proteins that precipitate in the cold; keep the sample at 37 degrees C<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Amyloidosis<\/td>\n<td>Light-chain protein deposits<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Serum protein electrophoresis finds the spike; immunofixation identifies the heavy and light chain type.<\/p>\n","min":3},{"id":"I4","sec":4,"title":"Infectious disease serology","html":"<figure class=\"fig\" id=\"F25\"><svg viewBox=\"0 0 760 370\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"HBV serology\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"370\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Hepatitis B serology: acute infection that resolves<\/text><line x1=\"70\" y1=\"280\" x2=\"720\" y2=\"280\" stroke=\"#444\" stroke-width=\"1.5\"/><line x1=\"70\" y1=\"280\" x2=\"70\" y2=\"60\" stroke=\"#444\" stroke-width=\"1.5\"/><text x=\"70.0\" y=\"296\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">0<\/text><line x1=\"70.0\" y1=\"280\" x2=\"70.0\" y2=\"284\" stroke=\"#444\" stroke-width=\"1\"/><text x=\"120.0\" y=\"296\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">4<\/text><line x1=\"120.0\" y1=\"280\" x2=\"120.0\" y2=\"284\" stroke=\"#444\" stroke-width=\"1\"/><text x=\"170.0\" y=\"296\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">8<\/text><line x1=\"170.0\" y1=\"280\" x2=\"170.0\" y2=\"284\" stroke=\"#444\" stroke-width=\"1\"/><text x=\"220.0\" y=\"296\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">12<\/text><line x1=\"220.0\" y1=\"280\" x2=\"220.0\" y2=\"284\" stroke=\"#444\" stroke-width=\"1\"/><text x=\"270.0\" y=\"296\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">16<\/text><line x1=\"270.0\" y1=\"280\" x2=\"270.0\" y2=\"284\" stroke=\"#444\" stroke-width=\"1\"/><text x=\"320.0\" y=\"296\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">20<\/text><line x1=\"320.0\" y1=\"280\" x2=\"320.0\" y2=\"284\" stroke=\"#444\" stroke-width=\"1\"/><text x=\"370.0\" y=\"296\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">24<\/text><line x1=\"370.0\" y1=\"280\" x2=\"370.0\" y2=\"284\" stroke=\"#444\" stroke-width=\"1\"/><text x=\"420.0\" y=\"296\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">28<\/text><line x1=\"420.0\" y1=\"280\" x2=\"420.0\" y2=\"284\" stroke=\"#444\" stroke-width=\"1\"/><text x=\"470.0\" y=\"296\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">32<\/text><line x1=\"470.0\" y1=\"280\" x2=\"470.0\" y2=\"284\" stroke=\"#444\" stroke-width=\"1\"/><text x=\"720.0\" y=\"296\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">52<\/text><line x1=\"720.0\" y1=\"280\" x2=\"720.0\" y2=\"284\" stroke=\"#444\" stroke-width=\"1\"/><text x=\"395.0\" y=\"314\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">weeks after exposure<\/text><text x=\"30\" y=\"170\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\" transform=\"rotate(-90 30 170)\">titer<\/text><rect x=\"320.0\" y=\"60\" width=\"125.0\" height=\"220\" rx=\"0\" fill=\"#fff3c4\" stroke=\"none\" stroke-width=\"0\" opacity=\"0.7\"/><text x=\"382.5\" y=\"74\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#9a5b00\">window period<\/text><path d=\"M70.0,280 C95.0,280 95.0,280 120.0,280 C145.0,280 145.0,170 170.0,170 C195.0,170 195.0,100 220.0,100 C245.0,100 245.0,130 270.0,130 C307.5,130 307.5,230 345.0,230 C370.0,230 370.0,280 395.0,280 C557.5,280 557.5,280 720.0,280\" fill=\"none\" stroke=\"#b42318\" stroke-width=\"3\" /><path d=\"M70.0,280 C101.25,280 101.25,280 132.5,280 C157.5,280 157.5,200 182.5,200 C213.75,200 213.75,120 245.0,120 C295.0,120 295.0,150 345.0,150 C395.0,150 395.0,220 445.0,220 C482.5,220 482.5,280 520.0,280 C620.0,280 620.0,280 720.0,280\" fill=\"none\" stroke=\"#d98a00\" stroke-width=\"3\" /><path d=\"M70.0,280 C220.0,280 220.0,280 370.0,280 C407.5,280 407.5,200 445.0,200 C507.5,200 507.5,150 570.0,150 C645.0,150 645.0,130 720.0,130\" fill=\"none\" stroke=\"#1a7f37\" stroke-width=\"3\" /><path d=\"M70.0,280 C107.5,280 107.5,280 145.0,280 C170.0,280 170.0,170 195.0,170 C245.0,170 245.0,100 295.0,100 C370.0,100 370.0,90 445.0,90 C582.5,90 582.5,85 720.0,85\" fill=\"none\" stroke=\"#6a3fa0\" stroke-width=\"2\" stroke-dasharray=\"6,3\"/><text x=\"189.0\" y=\"95\" font-size=\"11\" text-anchor=\"end\" font-weight=\"bold\" fill=\"#b42318\">HBsAg<\/text><text x=\"482.5\" y=\"205\" font-size=\"11\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#9a5b00\">anti-HBc IgM<\/text><text x=\"645.0\" y=\"120\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#1a7f37\">anti-HBs<\/text><text x=\"445.0\" y=\"80\" font-size=\"10\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#6a3fa0\">anti-HBc total (IgM then IgG)<\/text><text x=\"380\" y=\"328.0\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">HBsAg present &gt;6 months = chronic infection.  Anti-HBs alone = vaccinated.  Anti-HBs + anti-HBc IgG = recovered.<\/text><text x=\"380\" y=\"346\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">In the window period only anti-HBc IgM is positive.<\/text><\/svg><figcaption>Typical hepatitis B markers in acute infection that resolves.<\/figcaption><\/figure><h3 id=\"infectious-disease-serology\">Infectious disease serology<\/h3>\n<p><strong>Hepatitis B markers<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 26%\" />\n<col style=\"width: 73%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Marker<\/th>\n<th>What it means<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>HBsAg<\/td>\n<td>Infection (acute or chronic); first marker to appear<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Anti-HBs<\/td>\n<td>Immunity from vaccine or recovery<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Anti-HBc IgM<\/td>\n<td>Acute infection, including the window period<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Anti-HBc total<\/td>\n<td>Past or present infection<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>HBeAg<\/td>\n<td>High infectivity<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p>Vaccinated person: anti-HBs only.<\/p><\/li>\n<li><p>Hepatitis A: anti-HAV IgM = acute; IgG = past or vaccinated. Hepatitis C: antibody screen, then HCV RNA. Hepatitis D needs hepatitis B to infect.<\/p><\/li>\n<li><p><strong>EBV:<\/strong> the Monospot (heterophile) antibodies are IgM and are absorbed by beef cells but not guinea pig kidney. EBV VCA IgM = acute; EBNA = past infection.<\/p><\/li>\n<li><p><strong>Syphilis:<\/strong> nontreponemal tests (RPR, VDRL) detect reagin and are used for screening and to follow treatment; biologic false positives occur in SLE, pregnancy, mononucleosis, IV drug use. Treponemal tests (FTA-ABS, TP-PA, EIA) confirm and stay positive for life. VDRL is the only one accepted on CSF. Prozone effect: very high antibody gives a false negative until the serum is diluted.<\/p><\/li>\n<li><p><strong>Rubella:<\/strong> IgG = immunity; IgM = acute. TORCH = toxoplasmosis, other, rubella, CMV, herpes.<\/p><\/li>\n<li><p><strong>Strep antibodies:<\/strong> ASO and anti-DNase B, for rheumatic fever and glomerulonephritis.<\/p><\/li>\n<li><p><strong>Lyme disease:<\/strong> two-tier testing (EIA then Western blot or second EIA).<\/p><\/li>\n<li><p><strong>Fungal:<\/strong> cryptococcal antigen, histoplasma antigen, Aspergillus galactomannan.<\/p><\/li>\n<\/ul>\n<h3 id=\"more-viral-serology\">More viral serology<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 37%\" />\n<col style=\"width: 62%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Virus<\/th>\n<th>Key points<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>HIV<\/td>\n<td>Earliest: HIV RNA, then p24 antigen, then antibodies (4th-generation tests find antigen and antibody)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>CMV<\/td>\n<td>IgM = recent infection; IgG alone = past; high avidity IgG = infection over 3 months old<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Measles, mumps, rubella<\/td>\n<td>IgM = acute; IgG = immunity<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Parvovirus B19<\/td>\n<td>IgM indicates recent infection<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>West Nile virus<\/td>\n<td>IgM in serum or CSF; NAT in blood donors<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"stages-of-syphilis-and-lyme-disease\">Stages of syphilis and Lyme disease<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 13%\" />\n<col style=\"width: 27%\" />\n<col style=\"width: 59%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Disease<\/th>\n<th>Stage<\/th>\n<th>What happens<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Syphilis<\/td>\n<td>Primary<\/td>\n<td>Painless chancre; nontreponemal tests may still be negative<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Syphilis<\/td>\n<td>Secondary<\/td>\n<td>Rash (including palms and soles), condylomata lata; tests strongly positive<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Syphilis<\/td>\n<td>Latent<\/td>\n<td>No symptoms; positive tests<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Syphilis<\/td>\n<td>Tertiary<\/td>\n<td>Gummas, heart and brain damage<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Lyme<\/td>\n<td>Early localized<\/td>\n<td>Erythema migrans rash, tick bite<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Lyme<\/td>\n<td>Early disseminated<\/td>\n<td>Heart block, facial palsy, meningitis; antibodies positive<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Lyme<\/td>\n<td>Late<\/td>\n<td>Arthritis, nerve problems<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"tuberculosis-testing\">Tuberculosis testing<\/h3>\n<ul>\n<li><p><strong>PPD (tuberculin skin test):<\/strong> a delayed (type IV) reaction read at 48-72 hours; measure the hardened area, not the redness. Positive at 5 mm or more in high-risk people (HIV, close contacts), 10 mm or more in moderate-risk people, and 15 mm or more in low-risk people.<\/p><\/li>\n<li><p><strong>Interferon-gamma release assays<\/strong> (QuantiFERON, T-SPOT): blood tests that are not affected by BCG vaccination and need only one visit.<\/p><\/li>\n<\/ul>\n","min":4},{"id":"I5","sec":4,"title":"Serologic techniques and transplantation","html":"<figure class=\"fig\" id=\"F26\"><svg viewBox=\"0 0 760 350\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"ELISA formats\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"350\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">ELISA formats<\/text><text x=\"100\" y=\"48\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Indirect (antibody test)<\/text><path d=\"M50,80 v70 q0,22 50,22 q50,0 50,-22 v-70\" fill=\"none\" stroke=\"#555\" stroke-width=\"2\" /><circle cx=\"65\" cy=\"168\" r=\"4\" fill=\"#c0392b\" stroke=\"#7a1f1a\" stroke-width=\"0.8\" /><line x1=\"65\" y1=\"160\" x2=\"65\" y2=\"169.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><line x1=\"65\" y1=\"169.6\" x2=\"57.8\" y2=\"177.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><line x1=\"65\" y1=\"169.6\" x2=\"72.2\" y2=\"177.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><line x1=\"65\" y1=\"143\" x2=\"65\" y2=\"152.6\" stroke=\"#e07a2a\" stroke-width=\"2\"/><line x1=\"65\" y1=\"152.6\" x2=\"57.8\" y2=\"160.6\" stroke=\"#e07a2a\" stroke-width=\"2\"/><line x1=\"65\" y1=\"152.6\" x2=\"72.2\" y2=\"160.6\" stroke=\"#e07a2a\" stroke-width=\"2\"/><polygon points=\"65,113 71,119 65,125 59,119\" fill=\"#2a9d8f\" stroke=\"#0b4d44\" stroke-width=\"0.8\"/><circle cx=\"88\" cy=\"168\" r=\"4\" fill=\"#c0392b\" stroke=\"#7a1f1a\" stroke-width=\"0.8\" /><line x1=\"88\" y1=\"160\" x2=\"88\" y2=\"169.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><line x1=\"88\" y1=\"169.6\" x2=\"80.8\" y2
