9\" fill=\"#2a9d8f\" stroke=\"#0b4d44\" stroke-width=\"0.8\"/><text x=\"100\" y=\"205\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">1. antigen coated on well<\/text><text x=\"100\" y=\"217\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">2. patient antibody binds<\/text><text x=\"100\" y=\"229\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">3. enzyme anti-human IgG binds<\/text><text x=\"100\" y=\"241\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">4. substrate → color<\/text><rect x=\"15\" y=\"280\" width=\"170\" height=\"28\" rx=\"6\" fill=\"#fff7e0\" stroke=\"#ccb\" stroke-width=\"1\" /><text x=\"100\" y=\"298.0\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Color ∝ patient antibody<\/text><text x=\"380\" y=\"48\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Sandwich (antigen test)<\/text><path d=\"M330,80 v70 q0,22 50,22 q50,0 50,-22 v-70\" fill=\"none\" stroke=\"#555\" stroke-width=\"2\" /><line x1=\"345\" y1=\"170\" x2=\"345\" y2=\"179.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><line x1=\"345\" y1=\"179.6\" x2=\"337.8\" y2=\"187.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><line x1=\"345\" y1=\"179.6\" x2=\"352.2\" y2=\"187.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><circle cx=\"345\" cy=\"142\" r=\"4\" fill=\"#c0392b\" stroke=\"#7a1f1a\" stroke-width=\"0.8\" /><line x1=\"345\" y1=\"138\" x2=\"345\" y2=\"147.6\" stroke=\"#e07a2a\" stroke-width=\"2\"/><line x1=\"345\" y1=\"147.6\" x2=\"337.8\" y2=\"155.6\" stroke=\"#e07a2a\" stroke-width=\"2\"/><line x1=\"345\" y1=\"147.6\" x2=\"352.2\" y2=\"155.6\" stroke=\"#e07a2a\" stroke-width=\"2\"/><polygon points=\"345,102 351,108 345,114 339,108\" fill=\"#2a9d8f\" stroke=\"#0b4d44\" stroke-width=\"0.8\"/><line x1=\"368\" y1=\"170\" x2=\"368\" y2=\"179.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><line x1=\"368\" y1=\"179.6\" x2=\"360.8\" y2=\"187.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><line x1=\"368\" y1=\"179.6\" x2=\"375.2\" y2=\"187.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><circle cx=\"368\" cy=\"142\" r=\"4\" fill=\"#c0392b\" stroke=\"#7a1f1a\" stroke-width=\"0.8\" /><line x1=\"368\" y1=\"138\" x2=\"368\" y2=\"147.6\" stroke=\"#e07a2a\" stroke-width=\"2\"/><line x1=\"368\" y1=\"147.6\" x2=\"360.8\" y2=\"155.6\" stroke=\"#e07a2a\" stroke-width=\"2\"/><line x1=\"368\" y1=\"147.6\" x2=\"375.2\" y2=\"155.6\" stroke=\"#e07a2a\" stroke-width=\"2\"/><polygon points=\"368,102 374,108 368,114 362,108\" fill=\"#2a9d8f\" stroke=\"#0b4d44\" stroke-width=\"0.8\"/><line x1=\"392\" y1=\"170\" x2=\"392\" y2=\"179.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><line x1=\"392\" y1=\"179.6\" x2=\"384.8\" y2=\"187.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><line x1=\"392\" y1=\"179.6\" x2=\"399.2\" y2=\"187.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><circle cx=\"392\" cy=\"142\" r=\"4\" fill=\"#c0392b\" stroke=\"#7a1f1a\" stroke-width=\"0.8\" /><line x1=\"392\" y1=\"138\" x2=\"392\" y2=\"147.6\" stroke=\"#e07a2a\" stroke-width=\"2\"/><line x1=\"392\" y1=\"147.6\" x2=\"384.8\" y2=\"155.6\" stroke=\"#e07a2a\" stroke-width=\"2\"/><line x1=\"392\" y1=\"147.6\" x2=\"399.2\" y2=\"155.6\" stroke=\"#e07a2a\" stroke-width=\"2\"/><polygon points=\"392,102 398,108 392,114 386,108\" fill=\"#2a9d8f\" stroke=\"#0b4d44\" stroke-width=\"0.8\"/><line x1=\"415\" y1=\"170\" x2=\"415\" y2=\"179.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><line x1=\"415\" y1=\"179.6\" x2=\"407.8\" y2=\"187.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><line x1=\"415\" y1=\"179.6\" x2=\"422.2\" y2=\"187.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><circle cx=\"415\" cy=\"142\" r=\"4\" fill=\"#c0392b\" stroke=\"#7a1f1a\" stroke-width=\"0.8\" /><line x1=\"415\" y1=\"138\" x2=\"415\" y2=\"147.6\" stroke=\"#e07a2a\" stroke-width=\"2\"/><line x1=\"415\" y1=\"147.6\" x2=\"407.8\" y2=\"155.6\" stroke=\"#e07a2a\" stroke-width=\"2\"/><line x1=\"415\" y1=\"147.6\" x2=\"422.2\" y2=\"155.6\" stroke=\"#e07a2a\" stroke-width=\"2\"/><polygon points=\"415,102 421,108 415,114 409,108\" fill=\"#2a9d8f\" stroke=\"#0b4d44\" stroke-width=\"0.8\"/><text x=\"380\" y=\"205\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">1. capture antibody coated<\/text><text x=\"380\" y=\"217\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">2. patient antigen binds<\/text><text x=\"380\" y=\"229\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">3. enzyme detection antibody<\/text><text x=\"380\" y=\"241\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">4. substrate → color<\/text><rect x=\"295\" y=\"280\" width=\"170\" height=\"28\" rx=\"6\" fill=\"#fff7e0\" stroke=\"#ccb\" stroke-width=\"1\" /><text x=\"380\" y=\"298.0\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Color ∝ antigen<\/text><text x=\"660\" y=\"48\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Competitive<\/text><path d=\"M610,80 v70 q0,22 50,22 q50,0 50,-22 v-70\" fill=\"none\" stroke=\"#555\" stroke-width=\"2\" /><line x1=\"625\" y1=\"170\" x2=\"625\" y2=\"179.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><line x1=\"625\" y1=\"179.6\" x2=\"617.8\" y2=\"187.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><line x1=\"625\" y1=\"179.6\" x2=\"632.2\" y2=\"187.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><line x1=\"648\" y1=\"170\" x2=\"648\" y2=\"179.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><line x1=\"648\" y1=\"179.6\" x2=\"640.8\" y2=\"187.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><line x1=\"648\" y1=\"179.6\" x2=\"655.2\" y2=\"187.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><line x1=\"672\" y1=\"170\" x2=\"672\" y2=\"179.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><line x1=\"672\" y1=\"179.6\" x2=\"664.8\" y2=\"187.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><line x1=\"672\" y1=\"179.6\" x2=\"679.2\" y2=\"187.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><line x1=\"695\" y1=\"170\" x2=\"695\" y2=\"179.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><line x1=\"695\" y1=\"179.6\" x2=\"687.8\" y2=\"187.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><line x1=\"695\" y1=\"179.6\" x2=\"702.2\" y2=\"187.6\" stroke=\"#2b6cb0\" stroke-width=\"2\"/><circle cx=\"625\" cy=\"146\" r=\"4\" fill=\"#c0392b\" stroke=\"#7a1f1a\" stroke-width=\"0.8\" /><circle cx=\"672\" cy=\"146\" r=\"4\" fill=\"#c0392b\" stroke=\"#7a1f1a\" stroke-width=\"0.8\" /><polygon points=\"648,140 654,146 648,152 642,146\" fill=\"#2a9d8f\" stroke=\"#0b4d44\" stroke-width=\"0.8\"/><polygon points=\"695,140 701,146 695,152 689,146\" fill=\"#2a9d8f\" stroke=\"#0b4d44\" stroke-width=\"0.8\"/><text x=\"660\" y=\"205\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">1. antibody coated on well<\/text><text x=\"660\" y=\"217\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">2. patient + labeled antigen compete<\/text><text x=\"660\" y=\"229\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">3. less labeled antigen binds<\/text><text x=\"660\" y=\"241\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">4. substrate → color<\/text><rect x=\"575\" y=\"280\" width=\"170\" height=\"28\" rx=\"6\" fill=\"#fff7e0\" stroke=\"#ccb\" stroke-width=\"1\" /><text x=\"660\" y=\"298.0\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Color ∝ 1 / patient antigen<\/text><text x=\"380\" y=\"325.0\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">Wash between steps. Enzyme (HRP or alkaline phosphatase) turns substrate into a colored product read by a plate reader.<\/text><\/svg><figcaption>Three common ELISA formats and how the signal behaves.<\/figcaption><\/figure><h3 id=\"serologic-techniques\">Serologic techniques<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 32%\" />\n<col style=\"width: 67%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Technique<\/th>\n<th>Principle<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Precipitation<\/td>\n<td>Antibody and antigen form a lattice at equivalence; Ouchterlony shows identity; radial immunodiffusion measures IgG, IgM, IgA<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Agglutination<\/td>\n<td>Visible clumping; prozone = too much antibody; postzone = too much antigen<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>ELISA<\/td>\n<td>Enzyme-labeled antibody. Sandwich for antigens, indirect for antibody. Competitive assays give a lower signal with more analyte<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Western blot<\/td>\n<td>Proteins separated by size, transferred to a membrane, detected with labeled antibody<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Immunofluorescence<\/td>\n<td>Direct (labeled antibody on antigen) or indirect (labeled anti-IgG); used for ANA<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Nephelometry<\/td>\n<td>Light scatter measures proteins and immunoglobulins<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Immunofixation<\/td>\n<td>Identifies monoclonal proteins<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p>Positive predictive value goes up when disease prevalence goes up.<\/p><\/li>\n<li><p>Monoclonal antibodies are made by hybridoma technology.<\/p><\/li>\n<\/ul>\n<h3 id=\"transplantation\">Transplantation<\/h3>\n<ul>\n<li><p>HLA matching: A, B and DR matter most. A crossmatch finds preformed antibodies that would cause hyperacute rejection.<\/p><\/li>\n<li><p>Acute rejection is T-cell mediated (days to weeks); chronic rejection takes months to years.<\/p><\/li>\n<li><p>Graft-versus-host disease: donor lymphocytes attack an immunocompromised host.<\/p><\/li>\n<\/ul>\n","min":3},{"id":"I6","sec":4,"title":"Immunology exam traps","html":"<h3 id=\"exam-traps-4\">Exam traps<\/h3>\n<ul>\n<li><p>IgM, not IgG, is the first antibody and the best complement activator.<\/p><\/li>\n<li><p>Type IV hypersensitivity involves T cells, not antibody.<\/p><\/li>\n<li><p>Treponemal tests stay positive for life; nontreponemal tests fall with treatment.<\/p><\/li>\n<li><p>Anti-dsDNA is specific for SLE; ANA alone is a sensitive screen but not specific.<\/p><\/li>\n<\/ul>\n","min":3},{"id":"U1","sec":5,"title":"Start here: urine specimen, physical and chemical exam","html":"<p><strong>If you only remember 8 things<\/strong><\/p>\n<ol type=\"1\">\n<li><p>Test urine within 2 hours or refrigerate. Left standing, pH rises, glucose and ketones fall, and cells and casts break down.<\/p><\/li>\n<li><p>A positive dipstick blood with no red cells under the microscope = hemoglobin or myoglobin.<\/p><\/li>\n<li><p>Nitrite and leukocyte esterase together suggest a bacterial urinary infection.<\/p><\/li>\n<li><p>The dipstick is most sensitive to albumin; sulfosalicylic acid (SSA) detects all proteins, including Bence Jones.<\/p><\/li>\n<li><p>Casts: RBC cast = glomerulonephritis; WBC cast = pyelonephritis; fatty cast = nephrotic syndrome; waxy cast = chronic kidney failure.<\/p><\/li>\n<li><p>Acid urine crystals: uric acid, calcium oxalate, cystine. Alkaline urine crystals: triple phosphate (coffin lid), ammonium biurate, amorphous phosphate.<\/p><\/li>\n<li><p>CSF tubes: tube 1 chemistry, tube 2 microbiology, tube 3 cell count. Never refrigerate CSF for culture.<\/p><\/li>\n<li><p>Gout crystals are needle-shaped with strong negative birefringence; pseudogout crystals are rhomboid with weak positive birefringence.<\/p><\/li>\n<\/ol>\n<h3 id=\"specimen-handling\">Specimen handling<\/h3>\n<ul>\n<li><p>First morning: most concentrated, best for protein, nitrite and pregnancy tests. Midstream clean catch: culture. Timed 24-hour: discard the first void, collect everything after, include the last void at the end.<\/p><\/li>\n<li><p>Unpreserved urine changes: bacteria multiply, pH rises (urea splitting makes ammonia), urobilinogen turns to urobilin, glucose and ketones fall, cells and casts dissolve.<\/p><\/li>\n<li><p>Preservatives: boric acid, thymol, formalin (cells and casts), sodium fluoride.<\/p><\/li>\n<\/ul>\n<h3 id=\"physical-examination\">Physical examination<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 47%\" />\n<col style=\"width: 52%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Finding<\/th>\n<th>Usual cause<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Dark yellow, foam yellow when shaken<\/td>\n<td>Bilirubin<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Red and cloudy<\/td>\n<td>Red cells<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Red and clear<\/td>\n<td>Hemoglobin, myoglobin, porphyrins, beets<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Brown or black<\/td>\n<td>Melanin, old blood, homogentisic acid (darkens on standing)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Port wine<\/td>\n<td>Porphyrins<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Blue-green<\/td>\n<td>Pseudomonas, methylene blue<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Milky<\/td>\n<td>Fat (chyle), pus, amorphous phosphates<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Cloudy<\/td>\n<td>Cells, bacteria, mucus, amorphous urates (pink, acid) or phosphates (white, alkaline)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p><strong>Specific gravity:<\/strong> refractometer measures dissolved solids directly; dipstick reads ionic strength; osmolality is the best true measure. Normal 1.003-1.035. A fixed value near 1.010 (isosthenuria) suggests severe kidney damage.<\/p><\/li>\n<li><p><strong>Odor:<\/strong> fruity = ketones; maple syrup = maple syrup urine disease; mousy = phenylketonuria; ammonia = old specimen or infection.<\/p><\/li>\n<\/ul>\n<h3 id=\"chemical-examination-dipstick\">Chemical examination (dipstick)<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 24%\" />\n<col style=\"width: 23%\" />\n<col style=\"width: 52%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Test<\/th>\n<th>Principle<\/th>\n<th>Key points<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Glucose<\/td>\n<td>Glucose oxidase<\/td>\n<td>Positive in diabetes or when the renal threshold (about 160-180 mg/dL) is exceeded; vitamin C gives a false negative; Clinitest detects other reducing sugars<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Ketones<\/td>\n<td>Nitroprusside<\/td>\n<td>Acetoacetate and acetone, not beta-hydroxybutyrate<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Protein<\/td>\n<td>Protein error of indicators<\/td>\n<td>Albumin most; false positive in alkaline urine; misses Bence Jones<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Blood<\/td>\n<td>Pseudoperoxidase<\/td>\n<td>Red cells, hemoglobin, myoglobin; vitamin C false negative<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Bilirubin<\/td>\n<td>Diazo<\/td>\n<td>Conjugated bilirubin only; light destroys it<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Urobilinogen<\/td>\n<td>Ehrlich<\/td>\n<td>High in hemolysis and liver disease; absent in complete blockage<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Nitrite<\/td>\n<td>Greiss<\/td>\n<td>Gram-negative bacteria; needs about 4 hours in the bladder; false negative with vitamin C<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Leukocyte esterase<\/td>\n<td>Esterase from neutrophils<\/td>\n<td>Pyuria; does not detect lymphocytes<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>pH<\/td>\n<td>Methyl red and bromthymol blue<\/td>\n<td>Range 4.5-8.0<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p><strong>Hemoglobin vs myoglobin:<\/strong> both give a positive blood pad without red cells. Hemoglobinuria comes with pink plasma; myoglobinuria has clear plasma (muscle injury, rhabdomyolysis).<\/p><\/li>\n<li><p>Ascorbic acid interferes with glucose, blood, bilirubin, nitrite and leukocyte esterase.<\/p><\/li>\n<\/ul>\n<h3 id=\"confirmatory-urine-tests\">Confirmatory urine tests<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 39%\" />\n<col style=\"width: 60%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Test<\/th>\n<th>Confirms<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Sulfosalicylic acid (SSA)<\/td>\n<td>Total protein, including globulins and Bence Jones<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Clinitest (copper reduction)<\/td>\n<td>Reducing sugars such as galactose, lactose, fructose<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Ictotest (tablet)<\/td>\n<td>Bilirubin<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Acetest (tablet)<\/td>\n<td>Ketones<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Ferric chloride<\/td>\n<td>Phenylketonuria (green), other metabolites<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Hoesch or Watson-Schwartz<\/td>\n<td>Porphobilinogen<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Cyanide-nitroprusside<\/td>\n<td>Cystine<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n","min":5},{"id":"U2","sec":5,"title":"Urine microscopy: cells, casts, crystals","html":"<figure class=\"fig\" id=\"F27\"><svg viewBox=\"0 0 760 420\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Casts\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"420\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Urinary casts<\/text><rect x=\"50.0\" y=\"97.0\" width=\"100\" height=\"26\" rx=\"10.4\" fill=\"#f3f7f8\" stroke=\"#aab9bf\" stroke-width=\"1.3\" /><text x=\"100\" y=\"150\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Hyaline<\/text><text x=\"100\" y=\"164.0\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">normal, exercise,<\/text><text x=\"100\" y=\"175.5\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">dehydration<\/text><rect x=\"235.0\" y=\"96.0\" width=\"100\" height=\"28\" rx=\"11.2\" fill=\"#f6dcd0\" stroke=\"#b36a55\" stroke-width=\"1.3\" /><circle cx=\"251\" cy=\"106\" r=\"6\  text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">hexagon; acid;<\/text><text x=\"90\" y=\"476\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">cyanide-nitroprusside +<\/text><polygon points=\"206,408 252,408 256,428 212,428\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.2\"/><line x1=\"244\" y1=\"408\" x2=\"244\" y2=\"414\" stroke=\"#555\" stroke-width=\"1\"/><text x=\"230\" y=\"452.0\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Cholesterol<\/text><text x=\"230\" y=\"465\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">notched plate;<\/text><text x=\"230\" y=\"476\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">nephrotic<\/text><circle cx=\"370\" cy=\"418\" r=\"14\" fill=\"#e3c78f\" stroke=\"#8a6a2a\" stroke-width=\"1.2\" /><line x1=\"384.0\" y1=\"418.0\" x2=\"375.0\" y2=\"418.0\" stroke=\"#8a6a2a\" stroke-width=\"0.8\"/><line x1=\"379.75389393086033\" y1=\"428.04298527259334\" x2=\"373.4835335467358\" y2=\"421.5867804544976\" stroke=\"#8a6a2a\" stroke-width=\"0.8\"/><line x1=\"369.59120668778195\" y1=\"431.99403044258105\" x2=\"369.85400238849354\" y2=\"422.99786801520753\" stroke=\"#8a6a2a\" stroke-width=\"0.8\"/><line x1=\"359.67648798242254\" y1=\"427.4564845277161\" x2=\"366.31303142229376\" y2=\"421.37731590275575\" stroke=\"#8a6a2a\" stroke-width=\"0.8\"/><line x1=\"356.02387313887345\" y1=\"417.18276199201387\" x2=\"365.00852612102625\" y2=\"417.7081292828621\" stroke=\"#8a6a2a\" stroke-width=\"0.8\"/><line x1=\"360.84898930790945\" y1=\"407.404765065689\" x2=\"366.73178189568193\" y2=\"414.21598752346034\" stroke=\"#8a6a2a\" stroke-width=\"0.8\"/><line x1=\"371.22498576815224\" y1=\"404.05369547629823\" x2=\"370.4374949171972\" y2=\"413.0191769558208\" stroke=\"#8a6a2a\" stroke-width=\"0.8\"/><line x1=\"380.85792229914347\" y1=\"409.1622670697875\" x2=\"373.87782939255123\" y2=\"414.8436668106384\" stroke=\"#8a6a2a\" stroke-width=\"0.8\"/><text x=\"370\" y=\"452.0\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Leucine<\/text><text x=\"370\" y=\"465\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">spheres with<\/text><text x=\"370\" y=\"476\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">radial striations<\/text><line x1=\"496\" y1=\"404\" x2=\"512.0\" y2=\"432\" stroke=\"#6a5a3a\" stroke-width=\"1.3\"/><line x1=\"499\" y1=\"404\" x2=\"514.2\" y2=\"432\" stroke=\"#6a5a3a\" stroke-width=\"1.3\"/><line x1=\"502\" y1=\"404\" x2=\"516.4\" y2=\"432\" stroke=\"#6a5a3a\" stroke-width=\"1.3\"/><line x1=\"505\" y1=\"404\" x2=\"518.6\" y2=\"432\" stroke=\"#6a5a3a\" stroke-width=\"1.3\"/><line x1=\"508\" y1=\"404\" x2=\"520.8\" y2=\"432\" stroke=\"#6a5a3a\" stroke-width=\"1.3\"/><line x1=\"511\" y1=\"404\" x2=\"523.0\" y2=\"432\" stroke=\"#6a5a3a\" stroke-width=\"1.3\"/><line x1=\"514\" y1=\"404\" x2=\"525.2\" y2=\"432\" stroke=\"#6a5a3a\" stroke-width=\"1.3\"/><line x1=\"517\" y1=\"404\" x2=\"527.4\" y2=\"432\" stroke=\"#6a5a3a\" stroke-width=\"1.3\"/><line x1=\"520\" y1=\"404\" x2=\"529.6\" y2=\"432\" stroke=\"#6a5a3a\" stroke-width=\"1.3\"/><line x1=\"523\" y1=\"404\" x2=\"531.8\" y2=\"432\" stroke=\"#6a5a3a\" stroke-width=\"1.3\"/><text x=\"510\" y=\"452.0\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Tyrosine<\/text><text x=\"510\" y=\"465\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">fine needle<\/text><text x=\"510\" y=\"476\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">sheaves; liver disease<\/text><line x1=\"640\" y1=\"404\" x2=\"648\" y2=\"432\" stroke=\"#b08a4a\" stroke-width=\"1.4\"/><line x1=\"645\" y1=\"404\" x2=\"653\" y2=\"432\" stroke=\"#b08a4a\" stroke-width=\"1.4\"/><line x1=\"650\" y1=\"404\" x2=\"658\" y2=\"432\" stroke=\"#b08a4a\" stroke-width=\"1.4\"/><line x1=\"655\" y1=\"404\" x2=\"663\" y2=\"432\" stroke=\"#b08a4a\" stroke-width=\"1.4\"/><line x1=\"660\" y1=\"404\" x2=\"668\" y2=\"432\" stroke=\"#b08a4a\" stroke-width=\"1.4\"/><line x1=\"665\" y1=\"404\" x2=\"673\" y2=\"432\" stroke=\"#b08a4a\" stroke-width=\"1.4\"/><text x=\"650\" y=\"452.0\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Ampicillin / sulfa<\/text><text x=\"650\" y=\"465\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">needles, sheaves;<\/text><text x=\"650\" y=\"476\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">drug history<\/text><text x=\"380\" y=\"508\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Clinically significant: cystine, leucine, tyrosine, cholesterol, sulfa and drug crystals. Others are usually normal.<\/text><\/svg><figcaption>Urine crystals by pH, and the abnormal ones to know.<\/figcaption><\/figure><h3 id=\"crystals\">Crystals<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 12%\" />\n<col style=\"width: 35%\" />\n<col style=\"width: 52%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Urine pH<\/th>\n<th>Crystal<\/th>\n<th>Look and meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Acid<\/td>\n<td>Uric acid<\/td>\n<td>Yellow-brown rhombic or rosette; polarizes<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Acid<\/td>\n<td>Calcium oxalate<\/td>\n<td>\"Envelope\" shape; dumbbell form; ethylene glycol poisoning<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Acid<\/td>\n<td>Cystine<\/td>\n<td>Colorless hexagons; cystinuria; cyanide-nitroprusside test<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Acid<\/td>\n<td>Leucine and tyrosine<\/td>\n<td>Spheres and fine needles; liver disease<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Acid<\/td>\n<td>Cholesterol<\/td>\n<td>Notched plates<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Acid<\/td>\n<td>Sulfonamide, bilirubin<\/td>\n<td>Sheaves, needles<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Alkaline<\/td>\n<td>Triple phosphate (struvite)<\/td>\n<td>\"Coffin lid\"; urea-splitting bacteria (Proteus)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Alkaline<\/td>\n<td>Ammonium biurate<\/td>\n<td>Yellow-brown \"thorny apple\"<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Alkaline<\/td>\n<td>Calcium phosphate, carbonate<\/td>\n<td>Prisms, plates, dumbbells (carbonate fizzes with acid)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Alkaline<\/td>\n<td>Amorphous phosphate<\/td>\n<td>White precipitate<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p>Other findings: yeast (buds, no rim, may mimic red cells), Trichomonas (jerky motility), sperm, mucus, Schistosoma haematobium eggs.<\/p><\/li>\n<\/ul>\n","min":4},{"id":"U3","sec":5,"title":"Kidney disease patterns","html":"<h3 id=\"kidney-disease-patterns\">Kidney disease patterns<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 40%\" />\n<col style=\"width: 59%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Syndrome<\/th>\n<th>Urine findings<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Nephrotic<\/td>\n<td>Protein above 3.5 g/day, oval fat bodies, fatty and waxy casts, low albumin, high lipids<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Nephritic (glomerulonephritis)<\/td>\n<td>Blood, red cell casts, mild protein, high blood pressure<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Pyelonephritis<\/td>\n<td>White cell casts, bacteria<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Cystitis<\/td>\n<td>White cells and bacteria, no casts<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Acute tubular necrosis<\/td>\n<td>Tubular cells and granular casts<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p>Creatinine clearance (mL/min) = (urine creatinine x urine volume per minute / plasma creatinine) x (1.73 / body surface area). Normal about 90-120.<\/p><\/li>\n<li><p>Inherited metabolic disorders in urine: phenylketonuria (ferric chloride turns green), alkaptonuria (black on standing), maple syrup urine disease, cystinuria, porphyria (Ehrlich, Watson-Schwartz).<\/p><\/li>\n<li><p>Urine pregnancy test (hCG): first-morning urine is most concentrated; a very high hCG can cause a false negative (hook effect).<\/p><\/li>\n<li><p>Drug testing: immunoassay screen with GC/MS confirmation; check temperature (90-100 F within 4 minutes), specific gravity, creatinine and pH; chain of custody required.<\/p><\/li>\n<\/ul>\n<h3 id=\"kidney-physiology-in-brief\">Kidney physiology in brief<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 42%\" />\n<col style=\"width: 57%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Part of the nephron<\/th>\n<th>What it does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Glomerulus<\/td>\n<td>Filters plasma (about 125 mL/min); keeps large proteins and cells in the blood<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Proximal tubule<\/td>\n<td>Reabsorbs about two thirds of filtrate: glucose, amino acids, sodium, water<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Loop of Henle<\/td>\n<td>Builds the concentration gradient (countercurrent mechanism)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Distal tubule and collecting duct<\/td>\n<td>Fine control: ADH makes urine concentrated, aldosterone saves sodium and loses potassium<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p><strong>Renal threshold:<\/strong> the blood level above which a substance spills into urine (glucose about 160-180 mg/dL).<\/p><\/li>\n<li><p><strong>Diabetes insipidus:<\/strong> lots of very dilute urine (low specific gravity) from too little ADH or kidney resistance to it.<\/p><\/li>\n<li><p><strong>Concentration test:<\/strong> a kidney that cannot concentrate urine after water restriction points to tubular damage.<\/p><\/li>\n<li><p><strong>Orthostatic proteinuria:<\/strong> protein in daytime urine but not in the first morning sample; usually harmless in young people.<\/p><\/li>\n<li><p>Kidney stones, urinary tract infection, renal tubular acidosis, Fanconi syndrome and diabetic kidney disease are the common disease states.<\/p><\/li>\n<\/ul>\n","min":3},{"id":"U4","sec":5,"title":"CSF and other body fluids","html":"<figure class=\"fig\" id=\"F29\"><svg viewBox=\"0 0 760 390\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Hemocytometer\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"390\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Hemocytometer counting areas<\/text><rect x=\"60\" y=\"60\" width=\"270\" height=\"270\" rx=\"0\" fill=\"#fff\" stroke=\"#444\" stroke-width=\"2\" /><line x1=\"150.0\" y1=\"60\" x2=\"150.0\" y2=\"330\" stroke=\"#444\" stroke-width=\"1.2\"/><line x1=\"60\" y1=\"150.0\" x2=\"330\" y2=\"150.0\" stroke=\"#444\" stroke-width=\"1.2\"/><line x1=\"240.0\" y1=\"60\" x2=\"240.0\" y2=\"330\" stroke=\"#444\" stroke-width=\"1.2\"/><line x1=\"60\" y1=\"240.0\" x2=\"330\" y2=\"240.0\" stroke=\"#444\" stroke-width=\"1.2\"/><rect x=\"60.0\" y=\"60.0\" width=\"90.0\" height=\"90.0\" rx=\"0\" fill=\"#e4eefb\" stroke=\"#444\" stroke-width=\"1.2\" opacity=\"0.8\"/><text x=\"105.0\" y=\"109.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#1f4f99\">WBC<\/text><rect x=\"240.0\" y=\"60.0\" width=\"90.0\" height=\"90.0\" rx=\"0\" fill=\"#e4eefb\" stroke=\"#444\" stroke-width=\"1.2\" opacity=\"0.8\"/><text x=\"285.0\" y=\"109.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#1f4f99\">WBC<\/text><rect x=\"60.0\" y=\"240.0\" width=\"90.0\" height=\"90.0\" rx=\"0\" fill=\"#e4eefb\" stroke=\"#444\" stroke-width=\"1.2\" opacity=\"0.8\"/><text x=\"105.0\" y=\"289.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#1f4f99\">WBC<\/text><rect x=\"240.0\" y=\"240.0\" width=\"90.0\" height=\"90.0\" rx=\"0\" fill=\"#e4eefb\" stroke=\"#444\" stroke-width=\"1.2\" opacity=\"0.8\"/><text x=\"285.0\" y=\"289.0\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#1f4f99\">WBC<\/text><text x=\"195.0\" y=\"109.0\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\"><\/text><text x=\"105.0\" y=\"199.0\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\"><\/text><text x=\"285.0\" y=\"199.0\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\"><\/text><text x=\"195.0\" y=\"289.0\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\"><\/text><rect x=\"150.0\" y=\"150.0\" width=\"90.0\" height=\"90.0\" rx=\"0\" fill=\"#fdeceb\" stroke=\"#444\" stroke-width=\"1.2\" opacity=\"0.9\"/><line x1=\"168.0\" y1=\"150.0\" x2=\"168.0\" y2=\"240.0\" stroke=\"#b45a5a\" stroke-width=\"0.8\"/><line x1=\"150.0\" y1=\"168.0\" x2=\"240.0\" y2=\"168.0\" stroke=\"#b45a5a\" stroke-width=\"0.8\"/><line x1=\"186.0\" y1=\"150.0\" x2=\"186.0\" y2=\"240.0\" stroke=\"#b45a5a\" stroke-width=\"0.8\"/><line x1=\"150.0\" y1=\"186.0\" x2=\"240.0\" y2=\"186.0\" stroke=\"#b45a5a\" stroke-width=\"0.8\"/><line x1=\"204.0\" y1=\"150.0\" x2=\"204.0\" y2=\"240.0\" stroke=\"#b45a5a\" stroke-width=\"0.8\"/><line x1=\"150.0\" y1=\"204.0\" x2=\"240.0\" y2=\"204.0\" stroke=\"#b45a5a\" stroke-width=\"0.8\"/><line x1=\"222.0\" y1=\"150.0\" x2=\"222.0\" y2=\"240.0\" stroke=\"#b45a5a\" stroke-width=\"0.8\"/><line x1=\"150.0\" y1=\"222.0\" x2=\"240.0\" y2=\"222.0\" stroke=\"#b45a5a\" stroke-width=\"0.8\"/><rect x=\"150.0\" y=\"150.0\" width=\"18.0\" height=\"18.0\" rx=\"0\" fill=\"#f5b5b0\" stroke=\"#b45a5a\" stroke-width=\"1\" /><rect x=\"222.0\" y=\"150.0\" width=\"18.0\" height=\"18.0\" rx=\"0\" fill=\"#f5b5b0\" stroke=\"#b45a5a\" stroke-width=\"1\" /><rect x=\"150.0\" y=\"222.0\" width=\"18.0\" height=\"18.0\" rx=\"0\" fill=\"#f5b5b0\" stroke=\"#b45a5a\" stroke-width=\"1\" /><rect x=\"222.0\" y=\"222.0\" width=\"18.0\" height=\"18.0\" rx=\"0\" fill=\"#f5b5b0\" stroke=\"#b45a5a\" stroke-width=\"1\" /><rect x=\"186.0\" y=\"186.0\" width=\"18.0\" height=\"18.0\" rx=\"0\" fill=\"#f5b5b0\" stroke=\"#b45a5a\" stroke-width=\"1\" /><text x=\"195.0\" y=\"198.0\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#7a1f1a\">RBC<\/text><text x=\"195.0\" y=\"352.0\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">Large square = 1 mm × 1 mm; depth 0.1 mm → 0.1 µL per large square<\/text><rect x=\"370\" y=\"60\" width=\"370\" height=\"290\" rx=\"8\" fill=\"#f1efe6\" stroke=\"#ccc\" stroke-width=\"1\" /><text x=\"386\" y=\"86\" font-size=\"11\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">How to count<\/text><text x=\"386\" y=\"104\" font-size=\"11\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">WBC: the 4 corner large squares (4 mm²).<\/text><text x=\"386\" y=\"122\" font-size=\"11\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">RBC: 5 small squares in the center square.<\/text><text x=\"386\" y=\"140\" font-size=\"11\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">Platelets: center square RBC field.<\/text><text x=\"386\" y=\"158\" font-size=\"11\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\"><\/text><text x=\"386\" y=\"176\" font-size=\"11\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Cells/µL = cells counted × dilution<\/text><text x=\"386\" y=\"194\" font-size=\"11\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">                 ─────────────────────<\/text><text x=\"386\" y=\"212\" font-size=\"11\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">                 area (mm²) × depth (0.1 mm)<\/text><text x=\"386\" y=\"230\" font-size=\"11\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\"><\/text><text x=\"386\" y=\"248\" font-size=\"11\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">Example: 45 cells in 9 large squares,<\/text><text x=\"386\" y=\"266\" font-size=\"11\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">undiluted CSF: 9 × 0.1 = 0.9 µL<\/text><text x=\"386\" y=\"284\" font-size=\"11\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">45 ÷ 0.9 = 50 cells/µL<\/text><text x=\"386\" y=\"302\" font-size=\"11\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\"><\/text><text x=\"386\" y=\"320\" font-size=\"11\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">Dilute CSF with 3% acetic acid to lyse RBCs<\/text><text x=\"386\" y=\"338\" font-size=\"11\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">for the WBC count; use saline to count RBCs.<\/text><\/svg><figcaption>Neubauer hemocytometer and the counting formula.<\/figcaption><\/figure><h3 id=\"cerebrospinal-fluid-csf\">Cerebrospinal fluid (CSF)<\/h3>\n<ul>\n<li><p>Three tubes: 1 = chemistry and serology; 2 = microbiology; 3 = cell count (least likely to have blood from the puncture).<\/p><\/li>\n<li><p>Normal: clear, colorless; white cells 0-5 per microliter in adults; glucose about 60-70% of plasma glucose; protein 15-45 mg/dL.<\/p><\/li>\n<li><p><strong>Traumatic tap:<\/strong> blood clears from tube 1 to tube 3, supernatant is clear, clots may form. <strong>Bleeding into the brain space:<\/strong> equal blood in all tubes and a yellow supernatant (xanthochromia).<\/p><\/li>\n<\/ul>\n<table>\n<colgroup>\n<col style=\"width: 26%\" />\n<col style=\"width: 19%\" />\n<col style=\"width: 24%\" />\n<col style=\"width: 18%\" />\n<col style=\"width: 11%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Cause<\/th>\n<th>Appearance<\/th>\n<th>Cells<\/th>\n<th>Protein<\/th>\n<th>Glucose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Bacterial meningitis<\/td>\n<td>Cloudy<\/td>\n<td>Neutrophils<\/td>\n<td>High<\/td>\n<td>Low<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Viral meningitis<\/td>\n<td>Clear<\/td>\n<td>Lymphocytes<\/td>\n<td>Normal or mild increase<\/td>\n<td>Normal<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Fungal or tuberculous<\/td>\n<td>Clear or cloudy<\/td>\n<td>Lymphocytes, monocytes<\/td>\n<td>High<\/td>\n<td>Low<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p>Cell counts: dilute with saline for red cells; use acetic acid-methylene blue to lyse red cells for white cell counts. Cytospin slides give the differential.<\/p><\/li>\n<li><p>Other tests: India ink (Cryptococcus), Gram stain and culture, VDRL (neurosyphilis), oligoclonal bands (multiple sclerosis).<\/p><\/li>\n<\/ul>\n<h3 id=\"other-body-fluids\">Other body fluids<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 46%\" />\n<col style=\"width: 53%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Fluid<\/th>\n<th>Key facts<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Serous (pleural, pericardial, peritoneal)<\/td>\n<td><strong>Exudate<\/strong> (infection, cancer) if any one: fluid/serum protein above 0.5, fluid/serum LD above 0.6, or fluid LD above two thirds of the serum upper limit. Otherwise transudate (heart failure, cirrhosis, nephrotic)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Synovial<\/td>\n<td>Normal: clear, viscous, white cells below 200 per microliter. Septic: very high white cells, low glucose, positive culture<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Peritoneal<\/td>\n<td>SAAG at or above 1.1 g/dL = portal hypertension (cirrhosis). More than 250 neutrophils per microliter = spontaneous bacterial peritonitis<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Amniotic<\/td>\n<td>L/S ratio of 2.0 or more = fetal lung maturity; alpha-fetoprotein high in neural tube defects; protect from light<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Semen<\/td>\n<td>Typical lower limits (WHO 2010): volume 1.5 mL, count 15 million/mL, motility 40%, normal forms 4%. Liquefies in 30-60 minutes; examine within 1 hour. After vasectomy: no sperm<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Feces<\/td>\n<td>Occult blood (guaiac), fecal fat (Sudan III), fecal white cells<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Joint crystals<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 22%\" />\n<col style=\"width: 13%\" />\n<col style=\"width: 48%\" />\n<col style=\"width: 15%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Crystal<\/th>\n<th>Shape<\/th>\n<th>Birefringence<\/th>\n<th>Disease<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Monosodium urate<\/td>\n<td>Needle<\/td>\n<td>Strong negative (yellow when parallel to the compensator axis)<\/td>\n<td>Gout<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Calcium pyrophosphate<\/td>\n<td>Rhomboid<\/td>\n<td>Weak positive (blue when parallel)<\/td>\n<td>Pseudogout<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Hemocytometer counting:<\/strong> cells per microliter = (cells counted x dilution factor) / (area counted in mm squared x depth 0.1 mm). Count both chambers and compare.<\/p>\n<h3 id=\"more-about-body-fluids\">More about body fluids<\/h3>\n<ul>\n<li><p><strong>Serous fluids:<\/strong> lymphocytes suggest tuberculosis or cancer; a low pH (below 7.2) points to a pus-filled infection (empyema); cloudy-white fluid from a leaking lymph duct is <strong>chylous<\/strong> (triglycerides above 110 mg/dL), while <strong>pseudochylous<\/strong> fluid is rich in cholesterol.<\/p><\/li>\n<li><p><strong>Synovial fluid groups:<\/strong> noninflammatory (osteoarthritis), inflammatory (rheumatoid arthritis, gout), septic (bacterial infection), hemorrhagic (trauma, hemophilia). Viscous fluid is treated with hyaluronidase before counting.<\/p><\/li>\n<li><p><strong>CSF IgG index<\/strong> and oligoclonal bands help diagnose multiple sclerosis.<\/p><\/li>\n<li><p><strong>Feces:<\/strong> the immunochemical test (FIT) detects human globin and is more specific than the guaiac test, which can react to red meat or vitamin C. Qualitative fecal fat (Sudan III) screens for steatorrhea; elastase tests the pancreas.<\/p><\/li>\n<li><p><strong>Semen extras:<\/strong> fructose is made by the seminal vesicles (absent in blocked ducts); vitality is checked with eosin-nigrosin stain; normal strict morphology is 4% or more; antisperm antibodies cause clumping.<\/p><\/li>\n<\/ul>\n","min":5},{"id":"U5","sec":5,"title":"Urinalysis exam traps","html":"<h3 id=\"exam-traps-5\">Exam traps<\/h3>\n<ul>\n<li><p>Nitrite can be negative with a real infection (Enterococcus, short bladder time, vitamin C).<\/p><\/li>\n<li><p>Dipstick protein misses Bence Jones protein and globulins.<\/p><\/li>\n<li><p>A traumatic CSF tap clears; true hemorrhage does not.<\/p><\/li>\n<li><p>Yeast and red cells look alike; yeast buds and does not dissolve in acetic acid.<\/p><\/li>\n<\/ul>\n","min":3},{"id":"L1","sec":6,"title":"Start here: QC and laboratory statistics","html":"<p><strong>If you only remember 8 things<\/strong><\/p>\n<ol type=\"1\">\n<li><p>Accuracy = closeness to the true value (bias). Precision = repeatability (SD, CV).<\/p><\/li>\n<li><p>A shift = 6 or more points on one side of the mean (systematic error). A trend = 6 or more points steadily moving in one direction.<\/p><\/li>\n<li><p>Westgard: 1-2s is a warning; 1-3s and R-4s mean random error; 2-2s, 4-1s and 10x mean systematic error. When QC fails, do not report patient results.<\/p><\/li>\n<li><p>CLIA sets the federal law; CAP and The Joint Commission accredit; OSHA covers worker safety; CLSI writes standards.<\/p><\/li>\n<li><p>Standard precautions: treat all blood and body fluids as infectious; never recap needles.<\/p><\/li>\n<li><p>Disinfect blood spills with a fresh 1:10 bleach dilution.<\/p><\/li>\n<li><p>Order of draw: blood culture, light blue, red or gold, green, lavender, gray.<\/p><\/li>\n<li><p>Most laboratory errors happen before the test (preanalytic): wrong tube, mislabeling, poor collection.<\/p><\/li>\n<\/ol>\n<figure class=\"fig\" id=\"F30\"><svg viewBox=\"0 0 760 350\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Normal distribution\" font-family=\"Arial,Helvetica,sans-serif " font-weight=\"bold\" fill=\"#0b4d44\">99.7%<\/text><text x=\"580.0\" y=\"232\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#0b4d44\">±3 SD<\/text><text x=\"380\" y=\"298.0\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Reference interval = mean ± 2 SD (central 95%).  QC: &gt;2 SD = warning (1-2s), &gt;3 SD = reject (1-3s).  CV% = SD ÷ mean × 100.<\/text><\/svg><figcaption>The normal distribution: where QC limits and reference ranges come from.<\/figcaption><\/figure><figure class=\"fig\" id=\"F35\"><svg viewBox=\"0 0 760 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Accuracy precision\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"270\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Accuracy versus precision<\/text><circle cx=\"100\" cy=\"105\" r=\"58\" fill=\"#fff\" stroke=\"#556\" stroke-width=\"1\" /><circle cx=\"100\" cy=\"105\" r=\"42\" fill=\"#e2f1ee\" stroke=\"#556\" stroke-width=\"1\" /><circle cx=\"100\" cy=\"105\" r=\"26\" fill=\"#b6dbd4\" stroke=\"#556\" stroke-width=\"1\" /><circle cx=\"100\" cy=\"105\" r=\"10\" fill=\"#e0605a\" stroke=\"#556\" stroke-width=\"1\" /><circle cx=\"101.22901694889703\" cy=\"107.4178698926073\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"102.95193565565697\" cy=\"109.4245028377705\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"102.39898574739931\" cy=\"109.22324996665417\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"95.29005228283614\" cy=\"104.65622654378106\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"104.43356716998314\" cy=\"106.48974553136924\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"104.00900491750623\" cy=\"101.13205964653145\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"99.69069047782163\" cy=\"102.4657283261983\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"100.43760859235931\" cy=\"105.73941187928101\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><text x=\"100\" y=\"183.0\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Accurate and precise<\/text><text x=\"100\" y=\"198\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">good method<\/text><circle cx=\"287\" cy=\"105\" r=\"58\" fill=\"#fff\" stroke=\"#556\" stroke-width=\"1\" /><circle cx=\"287\" cy=\"105\" r=\"42\" fill=\"#e2f1ee\" stroke=\"#556\" stroke-width=\"1\" /><circle cx=\"287\" cy=\"105\" r=\"26\" fill=\"#b6dbd4\" stroke=\"#556\" stroke-width=\"1\" /><circle cx=\"287\" cy=\"105\" r=\"10\" fill=\"#e0605a\" stroke=\"#556\" stroke-width=\"1\" /><circle cx=\"323.9334008376166\" cy=\"130.21954042319726\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"320.85034627930946\" cy=\"124.61621482944658\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"316.0045171488507\" cy=\"128.62818562883768\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"320.7025425706444\" cy=\"129.59730635097893\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"319.7316037207384\" cy=\"129.7013983593799\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"318.7269808567197\" cy=\"130.01915483162603\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"323.2982483262202\" cy=\"126.14006441165303\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"321.38305219555275\" cy=\"128.82051741288677\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><text x=\"287\" y=\"183.0\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Precise, not accurate<\/text><text x=\"287\" y=\"198\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">SYSTEMATIC error<\/text><text x=\"287\" y=\"210\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">(calibration, reagent): shift<\/text><circle cx=\"474\" cy=\"105\" r=\"58\" fill=\"#fff\" stroke=\"#556\" stroke-width=\"1\" /><circle cx=\"474\" cy=\"105\" r=\"42\" fill=\"#e2f1ee\" stroke=\"#556\" stroke-width=\"1\" /><circle cx=\"474\" cy=\"105\" r=\"26\" fill=\"#b6dbd4\" stroke=\"#556\" stroke-width=\"1\" /><circle cx=\"474\" cy=\"105\" r=\"10\" fill=\"#e0605a\" stroke=\"#556\" stroke-width=\"1\" /><circle cx=\"464.83930377132447\" cy=\"86.84415704407411\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"481.8485925980724\" cy=\"82.76668690671222\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"475.8658642239478\" cy=\"98.01582367945446\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"451.01594408828475\" cy=\"105.38665812584985\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"449.9497742389832\" cy=\"101.54957555044406\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"451.63248202588017\" cy=\"83.71707669388098\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"470.0749978354107\" cy=\"121.99631048294597\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"454.4377019797816\" cy=\"90.60842615956476\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><text x=\"474\" y=\"183.0\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Accurate, not precise<\/text><text x=\"474\" y=\"198\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">RANDOM error<\/text><text x=\"474\" y=\"210\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">(pipetting, bubbles): scatter<\/text><circle cx=\"661\" cy=\"105\" r=\"58\" fill=\"#fff\" stroke=\"#556\" stroke-width=\"1\" /><circle cx=\"661\" cy=\"105\" r=\"42\" fill=\"#e2f1ee\" stroke=\"#556\" stroke-width=\"1\" /><circle cx=\"661\" cy=\"105\" r=\"26\" fill=\"#b6dbd4\" stroke=\"#556\" stroke-width=\"1\" /><circle cx=\"661\" cy=\"105\" r=\"10\" fill=\"#e0605a\" stroke=\"#556\" stroke-width=\"1\" /><circle cx=\"680.7887046878145\" cy=\"151.0393418633879\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"675.5692067298447\" cy=\"137.65047998932363\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"673.4296339386391\" cy=\"113.86693121631242\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"720.9546840364541\" cy=\"111.88867685822346\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"702.3771586237496\" cy=\"124.87495566416463\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"692.5628864191834\" cy=\"126.73910008223724\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"678.9960037966194\" cy=\"144.18710622891453\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><circle cx=\"673.6574124189107\" cy=\"113.17751389346468\" r=\"3.2\" fill=\"#222\" stroke=\"#fff\" stroke-width=\"0.8\" /><text x=\"661\" y=\"183.0\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Neither<\/text><text x=\"661\" y=\"198\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">both errors<\/text><text x=\"380\" y=\"245.0\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Accuracy = closeness to the true value (bias).  Precision = reproducibility (SD, CV).<\/text><\/svg><figcaption>Accuracy and precision. Systematic error shifts the mean; random error widens the scatter.<\/figcaption><\/figure><h3 id=\"quality-control-statistics\">Quality control statistics<\/h3>\n<ul>\n<li><p><strong>Mean<\/strong> = sum / n. <strong>Standard deviation (SD)<\/strong> shows spread. <strong>Coefficient of variation (CV%)<\/strong> = (SD / mean) x 100.<\/p><\/li>\n<li><p>Within 1 SD = 68% of values; within 2 SD = 95%; within 3 SD = 99.7%.<\/p><\/li>\n<li><p>Run at least 2 levels of control each day. Plot on a <strong>Levey-Jennings chart<\/strong>.<\/p><\/li>\n<li><p>Reference ranges usually cover the middle 95% of healthy people (mean +/- 2 SD), so about 5% of healthy people fall outside.<\/p><\/li>\n<\/ul>\n<table>\n<colgroup>\n<col style=\"width: 24%\" />\n<col style=\"width: 30%\" />\n<col style=\"width: 44%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Pattern on the chart<\/th>\n<th>What it means<\/th>\n<th>Common causes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Shift<\/td>\n<td>Systematic error<\/td>\n<td>New reagent lot, calibration change, maintenance<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Trend<\/td>\n<td>Systematic error, gradual<\/td>\n<td>Aging reagent, light source, temperature drift<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Scatter<\/td>\n<td>Random error<\/td>\n<td>Pipetting, bubbles, mixing<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<colgroup>\n<col style=\"width: 18%\" />\n<col style=\"width: 48%\" />\n<col style=\"width: 32%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Westgard rule<\/th>\n<th>Meaning<\/th>\n<th>Action<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>1-2s<\/td>\n<td>One control beyond 2 SD<\/td>\n<td>Warning only<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>1-3s<\/td>\n<td>One control beyond 3 SD<\/td>\n<td>Reject (random error)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>2-2s<\/td>\n<td>Two controls beyond the same 2 SD<\/td>\n<td>Reject (systematic error)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>R-4s<\/td>\n<td>One above +2 SD and one below -2 SD<\/td>\n<td>Reject (random error)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>4-1s<\/td>\n<td>Four in a row beyond 1 SD on one side<\/td>\n<td>Reject (systematic error)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>10x<\/td>\n<td>Ten in a row on one side of the mean<\/td>\n<td>Reject (systematic error)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p><strong>When QC fails:<\/strong> stop, do not report patient results, troubleshoot, repeat the control, recalibrate if needed, and recheck patient samples run since the last good QC.<\/p><\/li>\n<li><p>New control lots are run alongside the old lot to set a mean (at least 20 data points).<\/p><\/li>\n<li><p>Method verification: precision, accuracy, reportable range, reference interval. Delta checks compare today's result with the last one to catch mix-ups.<\/p><\/li>\n<li><p>Sensitivity, specificity and predictive values are defined in the Immunology section.<\/p><\/li>\n<\/ul>\n<figure class=\"fig\" id=\"F31\"><svg viewBox=\"0 0 760 480\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Levey-Jennings\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"480\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Levey-Jennings patterns and Westgard rules<\/text><rect x=\"24\" y=\"40\" width=\"225\" height=\"190\" rx=\"8\" fill=\"#fff\" stroke=\"#ddd\" stroke-width=\"1\" /><text x=\"136.5\" y=\"56\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">1-2s: warning<\/text><line x1=\"32\" y1=\"135.0\" x2=\"241\" y2=\"135.0\" stroke=\"#555\" stroke-width=\"1.2\"/><text x=\"243\" y=\"133.0\" font-size=\
