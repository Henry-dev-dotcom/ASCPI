=\"660\" y2=\"140\" stroke=\"#c0392b\" stroke-width=\"1.2\" stroke-dasharray=\"3,2\"/><line x1=\"660\" y1=\"140\" x2=\"710\" y2=\"125\" stroke=\"#c0392b\" stroke-width=\"1.2\" stroke-dasharray=\"3,2\"/><line x1=\"610\" y1=\"125\" x2=\"585\" y2=\"95\" stroke=\"#c0392b\" stroke-width=\"1.2\" stroke-dasharray=\"3,2\"/><line x1=\"610\" y1=\"125\" x2=\"635\" y2=\"98\" stroke=\"#c0392b\" stroke-width=\"1.2\" stroke-dasharray=\"3,2\"/><line x1=\"660\" y1=\"140\" x2=\"635\" y2=\"98\" stroke=\"#c0392b\" stroke-width=\"1.2\" stroke-dasharray=\"3,2\"/><line x1=\"635\" y1=\"98\" x2=\"685\" y2=\"100\" stroke=\"#c0392b\" stroke-width=\"1.2\" stroke-dasharray=\"3,2\"/><line x1=\"710\" y1=\"125\" x2=\"685\" y2=\"100\" stroke=\"#c0392b\" stroke-width=\"1.2\" stroke-dasharray=\"3,2\"/><\/svg><figcaption>Primary hemostasis in three steps: adhesion, activation, aggregation.<\/figcaption><\/figure><h3 id=\"platelets-primary-hemostasis\">Platelets (primary hemostasis)<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 32%\" />\n<col style=\"width: 22%\" />\n<col style=\"width: 44%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Disorder<\/th>\n<th>Cause<\/th>\n<th>Key tests<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Bernard-Soulier<\/td>\n<td>Missing GPIb; giant platelets<\/td>\n<td>Fails ristocetin, not corrected by normal plasma<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Glanzmann thrombasthenia<\/td>\n<td>Missing GPIIb/IIIa<\/td>\n<td>Normal ristocetin; fails ADP and collagen<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>von Willebrand disease<\/td>\n<td>Low or defective vWF<\/td>\n<td>Long bleeding time, low ristocetin cofactor, aPTT may be long<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ITP<\/td>\n<td>Antibodies destroy platelets<\/td>\n<td>Low count, large platelets, megakaryocytes present<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Normal platelet count is about 150-450 x 10^9/L. A falsely low count from EDTA clumping or satellitism is rechecked with a citrate tube and a smear.<\/p>\n","min":3},{"id":"H6","sec":0,"title":"Coagulation and its tests","html":"<figure class=\"fig\" id=\"F08\"><svg viewBox=\"0 0 760 520\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Coagulation cascade\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"520\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Coagulation cascade and the tests that check it<\/text><rect x=\"20\" y=\"40\" width=\"330\" height=\"130\" rx=\"8\" fill=\"#e4eefb\" stroke=\"#7aa0d4\" stroke-width=\"1\" /><text x=\"185\" y=\"56\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#1f4f99\">Intrinsic pathway (aPTT, heparin)<\/text><rect x=\"410\" y=\"40\" width=\"330\" height=\"130\" rx=\"8\" fill=\"#fdeadb\" stroke=\"#e0a470\" stroke-width=\"1\" /><text x=\"575\" y=\"56\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#99521f\">Extrinsic pathway (PT, warfarin)<\/text><rect x=\"40\" y=\"72\" width=\"64\" height=\"28\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"72.0\" y=\"90.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">XII<\/text><rect x=\"130\" y=\"72\" width=\"64\" height=\"28\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"162.0\" y=\"90.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">XI<\/text><rect x=\"220\" y=\"72\" width=\"64\" height=\"28\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"252.0\" y=\"90.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">IX*<\/text><rect x=\"260\" y=\"122\" width=\"64\" height=\"28\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"292.0\" y=\"140.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">VIII<\/text><line x1=\"104\" y1=\"86\" x2=\"130\" y2=\"86\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"194\" y1=\"86\" x2=\"220\" y2=\"86\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"252\" y1=\"100\" x2=\"252\" y2=\"122\" stroke=\"#444\" stroke-width=\"1.2\" stroke-dasharray=\"3,2\" marker-end=\"url(#ar)\"/><text x=\"70\" y=\"120\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">contact<\/text><text x=\"70\" y=\"131\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">(kaolin, silica)<\/text><text x=\"300\" y=\"114\" font-size=\"9\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#666\">cofactor<\/text><rect x=\"430\" y=\"72\" width=\"76\" height=\"28\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"468.0\" y=\"83.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Tissue<\/text><text x=\"468.0\" y=\"97.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">factor<\/text><rect x=\"560\" y=\"72\" width=\"64\" height=\"28\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"592.0\" y=\"90.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">VII*<\/text><rect x=\"660\" y=\"72\" width=\"60\" height=\"28\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"690.0\" y=\"90.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">VIIa<\/text><line x1=\"506\" y1=\"86\" x2=\"560\" y2=\"86\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"624\" y1=\"86\" x2=\"660\" y2=\"86\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"250\" y=\"205\" width=\"260\" height=\"44\" rx=\"8\" fill=\"#f4e6f6\" stroke=\"#9a6aa6\" stroke-width=\"1.3\" /><text x=\"380\" y=\"222\" font-size=\"14\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">X*  →  Xa<\/text><text x=\"380\" y=\"240\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">with V and calcium (prothrombinase)<\/text><line x1=\"252\" y1=\"152\" x2=\"330\" y2=\"205\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"540\" y1=\"100\" x2=\"440\" y2=\"205\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><text x=\"380\" y=\"276\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#6a2a77\">Common pathway (checked by both PT and aPTT)<\/text><rect x=\"300\" y=\"290\" width=\"120\" height=\"28\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"360.0\" y=\"308.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">II* (prothrombin)<\/text><rect x=\"330\" y=\"340\" width=\"100\" height=\"28\" rx=\"6\" fill=\"#ffe6e6\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"380.0\" y=\"358.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">IIa  thrombin<\/text><line x1=\"360\" y1=\"254\" x2=\"360\" y2=\"290\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"380\" y1=\"318\" x2=\"380\" y2=\"340\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"150\" y=\"395\" width=\"120\" height=\"28\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"210.0\" y=\"413.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Fibrinogen (I)<\/text><rect x=\"330\" y=\"395\" width=\"110\" height=\"28\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"385.0\" y=\"413.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Fibrin (soluble)<\/text><rect x=\"510\" y=\"395\" width=\"120\" height=\"28\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"570.0\" y=\"406.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Cross-linked<\/text><text x=\"570.0\" y=\"420.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">fibrin clot<\/text><line x1=\"270\" y1=\"409\" x2=\"330\" y2=\"409\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"440\" y1=\"409\" x2=\"510\" y2=\"409\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"380\" y1=\"368\" x2=\"330\" y2=\"395\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"470\" y=\"330\" width=\"110\" height=\"28\" rx=\"6\" fill=\"#fff6d6\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"525.0\" y=\"348.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">XIII → XIIIa<\/text><line x1=\"525\" y1=\"358\" x2=\"570\" y2=\"395\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><text x=\"570\" y=\"330\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\"><\/text><rect x=\"20\" y=\"445\" width=\"720\" height=\"40\" rx=\"6\" fill=\"#f1efe6\" stroke=\"#ccc\" stroke-width=\"1\" /><text x=\"380\" y=\"462\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">* vitamin K-dependent: II, VII, IX, X (and proteins C, S)<\/text><text x=\"380\" y=\"477\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">Thrombin time tests fibrinogen to fibrin. Factor VII has the shortest half-life, so the PT rises first on warfarin.<\/text><\/svg><figcaption>Coagulation cascade. aPTT tests the intrinsic and common pathways; PT tests the extrinsic and common pathways.<\/figcaption><\/figure><h3 id=\"coagulation-secondary-hemostasis\">Coagulation (secondary hemostasis)<\/h3>\n<ul>\n<li><p><strong>Intrinsic (aPTT):<\/strong> XII, XI, IX, VIII. <strong>Extrinsic (PT):<\/strong> VII. <strong>Common:<\/strong> X, V, II, fibrinogen.<\/p><\/li>\n<li><p>Heparin is monitored with aPTT (or anti-Xa). Warfarin is monitored with PT/INR; it lowers II, VII, IX, X and proteins C and S.<\/p><\/li>\n<\/ul>\n<table>\n<colgroup>\n<col style=\"width: 36%\" />\n<col style=\"width: 63%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Pattern<\/th>\n<th>Think<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>PT long, aPTT normal<\/td>\n<td>Factor VII deficiency, early warfarin, early liver disease<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>aPTT long, PT normal<\/td>\n<td>Hemophilia A (VIII) or B (IX), factors XI and XII, heparin, vWD, lupus anticoagulant<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Both long<\/td>\n<td>Common pathway (X, V, II, fibrinogen), DIC, severe liver disease, high-dose warfarin or heparin<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Both normal but bleeding<\/td>\n<td>Factor XIII deficiency (clot solubility test), platelet function disorder, vWD<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p><strong>Mixing study:<\/strong> a prolonged time that corrects with normal plasma = factor deficiency. No correction = an inhibitor (lupus anticoagulant, factor inhibitor).<\/p><\/li>\n<li><p><strong>Lupus anticoagulant:<\/strong> long aPTT, no correction on mixing, corrected by extra phospholipid; confirm with dRVVT.<\/p><\/li>\n<li><p><strong>Thrombin time:<\/strong> long with heparin and low or abnormal fibrinogen. Reptilase time stays normal with heparin.<\/p><\/li>\n<li><p><strong>DIC:<\/strong> long PT and aPTT, low fibrinogen, low platelets, high D-dimer and FDPs, schistocytes.<\/p><\/li>\n<li><p><strong>Primary fibrinolysis:<\/strong> high FDPs but normal D-dimer and normal platelets. D-dimer is specific for breakdown of cross-linked fibrin.<\/p><\/li>\n<li><p><strong>Specimen:<\/strong> 3.2% sodium citrate, full draw; PT is stable up to 24 hours at room temperature; aPTT within 4 hours, and within 1 hour (centrifuged) for heparin patients. A hematocrit above 55% needs less citrate.<\/p><\/li>\n<\/ul>\n<h3 id=\"more-hemostasis-tests\">More hemostasis tests<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 39%\" />\n<col style=\"width: 60%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Test<\/th>\n<th>What it shows<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>PFA-100 closure time<\/td>\n<td>Screens platelet function and vWD; long with aspirin, vWD, platelet defects<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Platelet aggregation<\/td>\n<td>Bernard-Soulier: absent ristocetin response. Glanzmann: absent response to ADP, collagen and epinephrine but normal ristocetin. vWD: ristocetin low. Aspirin: weak epinephrine, collagen and arachidonic acid response<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Fibrinogen (Clauss)<\/td>\n<td>Low in DIC, liver disease<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Factor assays<\/td>\n<td>Patient plasma mixed with factor-deficient plasma; results as percent activity<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Bethesda assay<\/td>\n<td>Measures factor inhibitors (Bethesda units)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Anti-Xa<\/td>\n<td>Monitors LMWH and heparin<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Thromboelastography (TEG)<\/td>\n<td>Whole-blood clot strength and lysis<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Heparin neutralization<\/td>\n<td>Protamine, polybrene or reptilase removes heparin effect<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Hypercoagulable states:<\/strong> factor V Leiden (APC resistance; the most common inherited cause), prothrombin G20210A, protein C, protein S and antithrombin deficiency, antiphospholipid antibodies (lupus anticoagulant, anticardiolipin), high homocysteine. Protein C and S are vitamin K dependent and fall on warfarin, so do not interpret them while on warfarin. Antithrombin deficiency causes heparin resistance.<\/p>\n","min":4},{"id":"H7","sec":0,"title":"CBC problems and other tests","html":"<h3 id=\"cbc-problems-and-fixes\">CBC problems and fixes<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 35%\" />\n<col style=\"width: 38%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Problem<\/th>\n<th>Effect<\/th>\n<th>Fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Cold agglutinins<\/td>\n<td>High MCV and MCHC, low RBC<\/td>\n<td>Warm the sample to 37 degrees C and rerun<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Lipemia, high WBC or icterus<\/td>\n<td>Falsely high Hgb<\/td>\n<td>Plasma blank or saline replacement<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Platelet clumping<\/td>\n<td>Falsely low platelets (and sometimes high WBC)<\/td>\n<td>Recollect in citrate, check the smear<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Microclots<\/td>\n<td>Low counts<\/td>\n<td>Recollect<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"other-hematology-tests\">Other hematology tests<\/h3>\n<ul>\n<li><p><strong>ESR (Westergren):<\/strong> rises with inflammation and rouleaux; falls with sickle cells and polycythemia. A tilted tube, vibration, or old specimen change the result.<\/p><\/li>\n<li><p><strong>G6PD screen:<\/strong> fluorescent spot test; can be falsely normal right after a hemolytic crisis because old, deficient cells are gone.<\/p><\/li>\n<li><p><strong>Osmotic fragility:<\/strong> increased in hereditary spherocytosis.<\/p><\/li>\n<li><p><strong>Flow cytometry markers:<\/strong> T cells CD3, CD4, CD8; B cells CD19, CD20; myeloid CD13, CD33, CD117; monocytes CD14, CD64; stem cells CD34; megakaryocytes CD41, CD61; PNH loss of CD55 and CD59; CLL CD5, CD23.<\/p><\/li>\n<li><p><strong>Molecular:<\/strong> BCR-ABL1 (CML), JAK2 V617F (polycythemia vera, ET, myelofibrosis), PML-RARA (APL).<\/p><\/li>\n<li><p><strong>Automated counters:<\/strong> impedance (Coulter principle) counts and sizes cells by electrical pulses; histograms and flags alert to abnormal cells; RDW measures size variation; MPV measures platelet size.<\/p><\/li>\n<\/ul>\n","min":3},{"id":"H8","sec":0,"title":"Hematology exam traps","html":"<h3 id=\"exam-traps\">Exam traps<\/h3>\n<ul>\n<li><p>Target cells are seen in thalassemia and liver disease, not only in HbC.<\/p><\/li>\n<li><p>Heinz bodies do not show on Wright stain.<\/p><\/li>\n<li><p>A positive DAT separates autoimmune hemolysis from hereditary spherocytosis.<\/p><\/li>\n<li><p>A prolonged aPTT in a patient on heparin is expected; do not call it a factor deficiency without checking.<\/p><\/li>\n<\/ul>\n","min":3},{"id":"C1","sec":1,"title":"Start here: instruments, methods, calculations","html":"<p><strong>If you only remember 8 things<\/strong><\/p>\n<ol type=\"1\">\n<li><p>Beer-Lambert law: absorbance is directly proportional to concentration.<\/p><\/li>\n<li><p>Glucose falls in unspun blood (glycolysis), so use a gray-top fluoride tube or separate the serum within 1 hour.<\/p><\/li>\n<li><p>Diabetes: fasting glucose 126 mg/dL or more, 2-hour OGTT 200 or more, HbA1c 6.5% or more.<\/p><\/li>\n<li><p>Troponin is the most specific marker for heart muscle damage.<\/p><\/li>\n<li><p>ALT = liver; AST = liver, heart and muscle; ALP and GGT = bile duct problems; lipase = pancreas.<\/p><\/li>\n<li><p>Anion gap = Na - (Cl + HCO3); normal about 8-16.<\/p><\/li>\n<li><p>High direct (conjugated) bilirubin = blockage; high indirect bilirubin = hemolysis or Gilbert.<\/p><\/li>\n<li><p>High TSH with low free T4 = primary hypothyroidism.<\/p><\/li>\n<\/ol>\n<figure class=\"fig\" id=\"F09\"><svg viewBox=\"0 0 760 310\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Spectrophotometer\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"310\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Spectrophotometer: light path and Beer’s law<\/text><rect x=\"30\" y=\"60\" width=\"110\" height=\"60\" rx=\"6\" fill=\"#fff3c4\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"85.0\" y=\"87.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Light<\/text><text x=\"85.0\" y=\"101.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">source<\/text><rect x=\"160\" y=\"60\" width=\"110\" height=\"60\" rx=\"6\" fill=\"#e4eefb\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"215.0\" y=\"87.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Monochromator<\/text><text x=\"215.0\" y=\"101.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">(selects λ)<\/text><rect x=\"300\" y=\"60\" width=\"110\" height=\"60\" rx=\"6\" fill=\"#e2f1ee\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"355.0\" y=\"87.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Cuvette<\/text><text x=\"355.0\" y=\"101.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">(sample)<\/text><rect x=\"440\" y=\"60\" width=\"110\" height=\"60\" rx=\"6\" fill=\"#fdeadb\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"495.0\" y=\"87.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Detector<\/text><text x=\"495.0\" y=\"101.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">(photocell)<\/text><rect x=\"580\" y=\"60\" width=\"110\" height=\"60\" rx=\"6\" fill=\"#f4e6f6\" stroke=\"#555\" stroke-width=\"1.3\" /><text x=\"635.0\" y=\"87.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Readout<\/text><text x=\"635.0\" y=\"101.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">(A or %T)<\/text><line x1=\"140\" y1=\"90\" x2=\"160\" y2=\"90\" stroke=\"#444\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"270\" y1=\"90\" x2=\"290\" y2=\"90\" stroke=\"#444\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"410\" y1=\"90\" x2=\"430\" y2=\"90\" stroke=\"#444\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><line x1=\"550\" y1=\"90\" x2=\"570\" y2=\"90\" stroke=\"#444\" stroke-width=\"2\" marker-end=\"url(#ar)\"/><path d=\"M30,160 h700\" fill=\"none\" stroke=\"none\" stroke-width=\"1.5\" /><text x=\"95\" y=\"142\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">I₀<\/text><text x=\"355\" y=\"142\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">I (transmitted)<\/text><rect x=\"60\" y=\"170\" width=\"640\" height=\"110\" rx=\"8\" fill=\"#f1efe6\" stroke=\"#ccc\" stroke-width=\"1\" /><text x=\"80\" y=\"194\" font-size=\"12\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Beer’s law:  A = a × b × c   (absorbance is directly proportional to concentration)<\/text><text x=\"80\" y=\"216\" font-size=\"12\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">A = 2 − log(%T)       %T = 100 × I/I₀       10% T → A = 1.0       1% T → A = 2.0<\/text><text x=\"80\" y=\"238\" font-size=\"12\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">Unknown = (A unknown ÷ A standard) × concentration of standard<\/text><text x=\"80\" y=\"260\" font-size=\"11\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#666\">Blank sets A = 0. Stray light and dirty cuvettes cause error. Check wavelength with a holmium oxide filter.<\/text><\/svg><figcaption>Light path of a spectrophotometer, and the Beer-Lambert relationships you may be asked to calculate.<\/figcaption><\/figure><h3 id=\"instruments-and-methods\">Instruments and methods<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 28%\" />\n<col style=\"width: 24%\" />\n<col style=\"width: 47%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Method<\/th>\n<th>What it measures<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Spectrophotometry<\/td>\n<td>Absorbance of light<\/td>\n<td>A = 2 - log %T; stray light and dirty cuvettes cause errors<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Ion-selective electrode (ISE)<\/td>\n<td>Na, K, Cl<\/td>\n<td>Indirect ISE reads falsely low Na with lipemia or high protein (pseudohyponatremia)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Flame photometry<\/td>\n<td>Na, K<\/td>\n<td>Older method<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Atomic absorption<\/td>\n<td>Metals (lead, zinc, Ca, Mg)<\/td>\n<td><\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Fluorometry<\/td>\n<td>Very small amounts<\/td>\n<td>More sensitive than absorbance<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Nephelometry<\/td>\n<td>Light scatter<\/td>\n<td>Immunoglobulins and proteins<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Osmometry<\/td>\n<td>Freezing point drop<\/td>\n<td>Osmolality<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Gas chromatography / mass spectrometry<\/td>\n<td>Drugs and toxins<\/td>\n<td>Gold standard to confirm drug screens<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Electrophoresis (pH 8.6)<\/td>\n<td>Protein fractions<\/td>\n<td>Albumin, alpha-1, alpha-2, beta, gamma, from anode to cathode<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"standard-curves-and-calibration\">Standard curves and calibration<\/h3>\n<ul>\n<li><p>A standard curve plots absorbance against known concentrations; a straight line shows Beer's law is obeyed. Read the patient's concentration from the line.<\/p><\/li>\n<li><p>A reagent blank sets zero. Results above the highest standard are diluted and rerun, then multiplied by the dilution factor.<\/p><\/li>\n<\/ul>\n<h3 id=\"quick-calculations\">Quick calculations<\/h3>\n<ul>\n<li><p>Dilution factor = total volume / sample volume; multiply the result by the factor.<\/p><\/li>\n<li><p>Molarity = grams per liter / molecular weight. Percent solution (w/v) = grams per 100 mL.<\/p><\/li>\n<li><p>Glucose mg/dL / 18 = mmol/L. Cholesterol mg/dL x 0.0259 = mmol/L.<\/p><\/li>\n<\/ul>\n","min":4},{"id":"C2","sec":1,"title":"Glucose and diabetes","html":"<figure class=\"fig\" id=\"F10\"><svg viewBox=\"0 0 820 420\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"OGTT\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"820\" height=\"420\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">75 g oral glucose tolerance test<\/text><line x1=\"90\" y1=\"330\" x2=\"640\" y2=\"330\" stroke=\"#444\" stroke-width=\"1.5\"/><line x1=\"90\" y1=\"330\" x2=\"90\" y2=\"60\" stroke=\"#444\" stroke-width=\"1.5\"/><line x1=\"86\" y1=\"330.0\" x2=\"90\" y2=\"330.0\" stroke=\"#444\" stroke-width=\"1.5\"/><text x=\"82\" y=\"334.0\" font-size=\"10\" text-anchor=\"end\" font-weight=\"normal\" fill=\"#222\">0<\/text><line x1=\"86\" y1=\"240.0\" x2=\"90\" y2=\"240.0\" stroke=\"#444\" stroke-width=\"1.5\"/><text x=\"82\" y=\"244.0\" font-size=\"10\" text-anchor=\"end\" font-weight=\"normal\" fill=\"#222\">100<\/text><line x1=\"90\" y1=\"240.0\" x2=\"640\" y2=\"240.0\" stroke=\"#e5e0d2\" stroke-width=\"1\"/><line x1=\"86\" y1=\"150.0\" x2=\"90\" y2=\"150.0\" stroke=\"#444\" stroke-width=\"1.5\"/><text x=\"82\" y=\"154.0\" font-size=\"10\" text-anchor=\"end\" font-weight=\"normal\" fill=\"#222\">200<\/text><line x1=\"90\" y1=\"150.0\" x2=\"640\" y2=\"150.0\" stroke=\"#e5e0d2\" stroke-width=\"1\"/><line x1=\"86\" y1=\"60.0\" x2=\"90\" y2=\"60.0\" stroke=\"#444\" stroke-width=\"1.5\"/><text x=\"82\" y=\"64.0\" font-size=\"10\" text-anchor=\"end\" font-weight=\"normal\" fill=\"#222\">300<\/text><line x1=\"90\" y1=\"60.0\" x2=\"640\" y2=\"60.0\" stroke=\"#e5e0d2\" stroke-width=\"1\"/><text x=\"90.0\" y=\"346\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">0<\/text><text x=\"227.5\" y=\"346\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">30<\/text><text x=\"365.0\" y=\"346\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">60<\/text><text x=\"502.5\" y=\"346\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">90<\/text><text x=\"640.0\" y=\"346\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">120<\/text><text x=\"365\" y=\"364\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">minutes after glucose load<\/text><text x=\"30\" y=\"195\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\" transform=\"rotate(-90 30 195)\">plasma glucose (mg/dL)<\/text><line x1=\"90\" y1=\"150.0\" x2=\"640\" y2=\"150.0\" stroke=\"#b42318\" stroke-width=\"1.3\" stroke-dasharray=\"6,4\"/><text x=\"646\" y=\"154.0\" font-size=\"10\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#b42318\">200 = diabetes at 2 h<\/text><line x1=\"90\" y1=\"204.0\" x2=\"640\" y2=\"204.0\" stroke=\"#d98a00\" stroke-width=\"1.3\" stroke-dasharray=\"6,4\"/><text x=\"646\" y=\"208.0\" font-size=\"10\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#9a5b00\">140 = IGT starts<\/text><path d=\"M90.0,249.0 C158.75,249.0 158.75,195.0 227.5,195.0 C296.25,195.0 296.25,204.0 365.0,204.0 C433.75,204.0 433.75,226.5 502.5,226.5 C571.25,226.5 571.25,240.0 640.0,240.0\" fill=\"none\" stroke=\"#1a7f37\" stroke-width=\"2.5\" /><path d=\"M90.0,231.0 C158.75,231.0 158.75,168.0 227.5,168.0 C296.25,168.0 296.25,159.0 365.0,159.0 C433.75,159.0 433.75,172.5 502.5,172.5 C571.25,172.5 571.25,181.5 640.0,181.5\" fill=\"none\" stroke=\"#d98a00\" stroke-width=\"2.5\" /><path d=\"M90.0,204.0 C158.75,204.0 158.75,123.0 227.5,123.0 C296.25,123.0 296.25,78.0 365.0,78.0 C433.75,78.0 433.75,91.5 502.5,91.5 C571.25,91.5 571.25,105.0 640.0,105.0\" fill=\"none\" stroke=\"#b42318\" stroke-width=\"2.5\" /><text x=\"620\" y=\"223.0\" font-size=\"11\" text-anchor=\"end\" font-weight=\"bold\" fill=\"#1a7f37\">Normal<\/text><text x=\"620\" y=\"147.5\" font-size=\"11\" text-anchor=\"end\" font-weight=\"bold\" fill=\"#9a5b00\">Impaired tolerance<\/text><text x=\"580\" y=\"72.5\" font-size=\"11\" text-anchor=\"end\" font-weight=\"bold\" fill=\"#b42318\">Diabetes<\/text><rect x=\"90\" y=\"372\" width=\"560\" height=\"30\" rx=\"6\" fill=\"#f1efe6\" stroke=\"#ccc\" stroke-width=\"1\" /><text x=\"370\" y=\"391.0\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">Fasting: normal &lt;100, prediabetes 100-125, diabetes ≥126.  HbA1c: prediabetes 5.7-6.4%, diabetes ≥6.5%.<\/text><\/svg><figcaption>Oral glucose tolerance test patterns and diagnostic cut-offs (mg/dL).<\/figcaption><\/figure><h3 id=\"glucose-and-diabetes\">Glucose and diabetes<\/h3>\n<ul>\n<li><p>Hexokinase is the reference method; glucose oxidase is specific for glucose.<\/p><\/li>\n<li><p>HbA1c shows the last 2-3 months; fructosamine shows 2-3 weeks. A1c reads falsely low in hemolytic anemia and can be altered by hemoglobin variants.<\/p><\/li>\n<li><p>Low glucose with high insulin and high C-peptide = insulinoma. High insulin with low C-peptide = injected insulin.<\/p><\/li>\n<li><p>Urine ketones: nitroprusside detects acetoacetate and acetone, not beta-hydroxybutyrate.<\/p><\/li>\n<\/ul>\n<h3 id=\"glucose-tolerance-and-diabetes-categories\">Glucose tolerance and diabetes categories<\/h3>\n<ul>\n<li><p>Prediabetes: fasting glucose 100-125 mg/dL (impaired fasting glucose), 2-hour OGTT 140-199 (impaired tolerance), or HbA1c 5.7-6.4%.<\/p><\/li>\n<li><p>OGTT uses a 75 g glucose load after 3 days of normal carbohydrate intake and a fast of 8-12 hours.<\/p><\/li>\n<li><p>Gestational diabetes (ADA one-step 75 g test): positive if any one value is at or above fasting 92, 1 hour 180, or 2 hours 153 mg/dL. The two-step method starts with a 50 g non-fasting 1-hour screen.<\/p><\/li>\n<li><p>Urine albumin-to-creatinine ratio of 30-300 mg/g (microalbuminuria) is the earliest sign of diabetic kidney disease.<\/p><\/li>\n<\/ul>\n","min":3},{"id":"C3","sec":1,"title":"Proteins, nitrogen compounds and kidney tests","html":"<h3 id=\"proteins-and-nitrogen-compounds\">Proteins and nitrogen compounds<\/h3>\n<ul>\n<li><p>Total protein: biuret. Albumin: dye binding (bromcresol green or purple).<\/p><\/li>\n<li><p>Serum protein electrophoresis: monoclonal spike in the gamma region = myeloma (confirm with immunofixation); beta-gamma bridging = cirrhosis; flat alpha-1 band = alpha-1 antitrypsin deficiency.<\/p><\/li>\n<li><p>BUN/creatinine ratio above 20 suggests prerenal causes; normal is about 10-20.<\/p><\/li>\n<li><p>Creatinine by Jaffe (picric acid) is affected by glucose and ketones; enzymatic methods avoid this.<\/p><\/li>\n<li><p>Ammonia: collect on ice, test within 15-30 minutes; high in liver failure and Reye syndrome.<\/p><\/li>\n<li><p>Uric acid: gout; uricase method.<\/p><\/li>\n<\/ul>\n","min":3},{"id":"C4","sec":1,"title":"Cardiac markers and enzymes","html":"<figure class=\"fig\" id=\"F11\"><svg viewBox=\"0 0 760 340\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Cardiac markers\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"340\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Cardiac markers after MI (relative to upper reference limit)<\/text><line x1=\"80\" y1=\"270\" x2=\"720\" y2=\"270\" stroke=\"#444\" stroke-width=\"1.5\"/><line x1=\"80\" y1=\"270\" x2=\"80\" y2=\"60\" stroke=\"#444\" stroke-width=\"1.5\"/><text x=\"110.0\" y=\"286\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">0<\/text><line x1=\"110.0\" y1=\"270\" x2=\"110.0\" y2=\"274\" stroke=\"#444\" stroke-width=\"1\"/><text x=\"176.66666666666669\" y=\"286\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">3 h<\/text><line x1=\"176.66666666666669\" y1=\"270\" x2=\"176.66666666666669\" y2=\"274\" stroke=\"#444\" stroke-width=\"1\"/><text x=\"243.33333333333334\" y=\"286\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">6 h<\/text><line x1=\"243.33333333333334\" y1=\"270\" x2=\"243.33333333333334\" y2=\"274\" stroke=\"#444\" stroke-width=\"1\"/><text x=\"310.0\" y=\"286\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">12 h<\/text><line x1=\"310.0\" y1=\"270\" x2=\"310.0\" y2=\"274\" stroke=\"#444\" stroke-width=\"1\"/><text x=\"376.6666666666667\" y=\"286\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">24 h<\/text><line x1=\"376.6666666666667\" y1=\"270\" x2=\"376.6666666666667\" y2=\"274\" stroke=\"#444\" stroke-width=\"1\"/><text x=\"443.3333333333333\" y=\"286\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">48 h<\/text><line x1=\"443.3333333333333\" y1=\"270\" x2=\"443.3333333333333\" y2=\"274\" stroke=\"#444\" stroke-width=\"1\"/><text x=\"510.0\" y=\"286\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">72 h<\/text><line x1=\"510.0\" y1=\"270\" x2=\"510.0\" y2=\"274\" stroke=\"#444\" stroke-width=\"1\"/><text x=\"576.6666666666667\" y=\"286\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">5 d<\/text><line x1=\"576.6666666666667\" y1=\"270\" x2=\"576.6666666666667\" y2=\"274\" stroke=\"#444\" stroke-width=\"1\"/><text x=\"643.3333333333334\" y=\"286\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">7 d<\/text><line x1=\"643.3333333333334\" y1=\"270\" x2=\"643.3333333333334\" y2=\"274\" stroke=\"#444\" stroke-width=\"1\"/><text x=\"710.0\" y=\"286\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">14 d<\/text><line x1=\"710.0\" y1=\"270\" x2=\"710.0\" y2=\"274\" stroke=\"#444\" stroke-width=\"1\"/><line x1=\"80\" y1=\"240\" x2=\"720\" y2=\"240\" stroke=\"#aaa\" stroke-width=\"1\" stroke-dasharray=\"4,3\"/><text x=\"74\" y=\"244\" font-size=\"10\" text-anchor=\"end\" font-weight=\"normal\" fill=\"#666\">URL<\/text><path d=\"M110.0,240 C143.33333333333334,240 143.33333333333334,165.0 176.66666666666669,165.0 C210.0,165.0 210.0,105.0 243.33333333333334,105.0 C276.6666666666667,105.0 276.6666666666667,180.0 310.0,180.0 C343.33333333333337,180.0 343.33333333333337,222.0 376.6666666666667,222.0 C410.0,222.0 410.0,240 443.3333333333333,240\" fill=\"none\" stroke=\"#d98a00\" stroke-width=\"2.5\" /><path d=\"M110.0,240 C176.66666666666669,240 176.66666666666669,217.5 243.33333333333334,217.5 C276.6666666666667,217.5 276.6666666666667,165.0 310.0,165.0 C343.33333333333337,165.0 343.33333333333337,120.0 376.6666666666667,120.0 C410.0,120.0 410.0,195.0 443.3333333333333,195.0 C476.66666666666663,195.0 476.66666666666663,228.0 510.0,228.0 C543.3333333333334,228.0 543.3333333333334,240 576.6666666666667,240\" fill=\"none\" stroke=\"#1f4f99\" stroke-width=\"2.5\" /><path d=\"M110.0,240 C143.33333333333334,240 143.33333333333334,217.5 176.66666666666669,217.5 C210.0,217.5 210.0,180.0 243.33333333333334,180.0 C276.6666666666667,180.0 276.6666666666667,120.0 310.0,120.0 C343.33333333333337,120.0 343.33333333333337,75.0 376.6666666666667,75.0 C410.0,75.0 410.0,105.0 443.3333333333333,105.0 C476.66666666666663,105.0 476.66666666666663,135.0 510.0,135.0 C543.3333333333334,135.0 543.3333333333334,180.0 576.6666666666667,180.0 C610.0,180.0 610.0,202.5 643.3333333333334,202.5 C676.6666666666667,202.5 676.6666666666667,225.0 710.0,225.0\" fill=\"none\" stroke=\"#b42318\" stroke-width=\"3\" /><text x=\"267.33333333333337\" y=\"97.0\" font-size=\"11\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#9a5b00\">Myoglobin<\/text><text x=\"386.6666666666667\" y=\"110.0\" font-size=\"11\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#1f4f99\">CK-MB<\/text><text x=\"520.0\" y=\"123.0\" font-size=\"11\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#b42318\">Troponin I / T<\/text><text x=\"380\" y=\"310\" font-size=\"10\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">Myoglobin: earliest, not cardiac specific.   CK-MB: normal by 48-72 h (useful for re-infarction).   Troponin: preferred; elevated 7-14 days.<\/text><\/svg><figcaption>Cardiac marker timing after a myocardial infarction. Troponin stays up longest.<\/figcaption><\/figure><h3 id=\"cardiac-markers\">Cardiac markers<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 22%\" />\n<col style=\"width: 8%\" />\n<col style=\"width: 10%\" />\n<col style=\"width: 18%\" />\n<col style=\"width: 39%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Marker<\/th>\n<th>Rises<\/th>\n<th>Peaks<\/th>\n<th>Back to normal<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Myoglobin<\/td>\n<td>1-3 h<\/td>\n<td>6-9 h<\/td>\n<td>24 h<\/td>\n<td>Earliest but not specific<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>CK-MB<\/td>\n<td>3-6 h<\/td>\n<td>12-24 h<\/td>\n<td>2-3 days<\/td>\n<td>Good for spotting re-infarction<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Troponin I or T<\/td>\n<td>3-4 h<\/td>\n<td>12-24 h<\/td>\n<td>7-10 days or longer<\/td>\n<td>Most specific; the preferred marker<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>BNP / NT-proBNP<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td>Heart failure<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"enzymes-what-each-one-points-to\">Enzymes: what each one points to<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 31%\" />\n<col style=\"width: 68%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Enzyme<\/th>\n<th>Think<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>AST, ALT<\/td>\n<td>Liver cell damage; ALT is more liver-specific, AST also in heart and muscle<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ALP<\/td>\n<td>Bile duct blockage and bone disease; GGT or 5'-nucleotidase shows it is liver<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>GGT<\/td>\n<td>Biliary disease and alcohol<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Amylase and lipase<\/td>\n<td>Acute pancreatitis; lipase is more specific and lasts longer<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>CK<\/td>\n<td>Muscle injury; MM skeletal, MB heart, BB brain<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>LD<\/td>\n<td>Hemolysis, heart attack (LD1 higher than LD2 = flipped), cancers<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Acid phosphatase<\/td>\n<td>Prostate (PSA has largely replaced it)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Cholinesterase<\/td>\n<td>Low in organophosphate poisoning<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Enzyme rate assays that use NAD and NADH are read at 340 nm.<\/p>\n","min":3},{"id":"C5","sec":1,"title":"Electrolytes and acid-base","html":"<h3 id=\"electrolytes\">Electrolytes<\/h3>\n<ul>\n<li><p>Normal ranges (mmol/L): Na 135-145, K 3.5-5.1, Cl 98-107, HCO3 22-29.<\/p><\/li>\n<li><p>Falsely high K: hemolysis, delayed separation, fist clenching, very high platelets.<\/p><\/li>\n<li><p>Anion gap = Na - (Cl + HCO3). Raised in <strong>MUDPILES<\/strong>: methanol, uremia, DKA, paraldehyde, iron or isoniazid, lactic acidosis, ethylene glycol, salicylates.<\/p><\/li>\n<li><p>Osmolal gap = measured - calculated, where calculated = 2 x Na + glucose/18 + BUN/2.8. A gap above about 10 points to toxic alcohols.<\/p><\/li>\n<li><p>Calcium: the ionized fraction is the active one; PTH raises calcium. Low magnesium causes arrhythmias and low K and Ca.<\/p><\/li>\n<\/ul>\n<figure class=\"fig\" id=\"F12\"><svg viewBox=\"0 0 760 420\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Acid-base flowchart\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"420\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Acid-base: read pH first, then find the cause<\/text><rect x=\"290\" y=\"40\" width=\"180\" height=\"36\" rx=\"6\" fill=\"#fff3c4\" stroke=\"#a88a00\" stroke-width=\"1.3\" /><text x=\"380.0\" y=\"62.333333333333336\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">1. pH  (7.35 - 7.45)<\/text><rect x=\"40\" y=\"125\" width=\"200\" height=\"40\" rx=\"6\" fill=\"#fdeceb\" stroke=\"#b42318\" stroke-width=\"1.3\" /><text x=\"140.0\" y=\"142.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">pH &lt; 7.35<\/text><text x=\"140.0\" y=\"156.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">ACIDOSIS<\/text><rect x=\"280\" y=\"125\" width=\"200\" height=\"40\" rx=\"6\" fill=\"#e6f4ea\" stroke=\"#1a7f37\" stroke-width=\"1.3\" /><text x=\"380.0\" y=\"142.16666666666666\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">7.35 - 7.45<\/text><text x=\"380.0\" y=\"155.16666666666666\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">normal (or fully compensated)<\/text><rect x=\"520\" y=\"125\" width=\"200\" height=\"40\" rx=\"6\" fill=\"#e4eefb\" stroke=\"#1f4f99\" stroke-width=\"1.3\" /><text x=\"620.0\" y=\"142.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">pH &gt; 7.45<\/text><text x=\"620.0\" y=\"156.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">ALKALOSIS<\/text><line x1=\"330\" y1=\"76\" x2=\"140\" y2=\"125\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"380\" y1=\"76\" x2=\"380\" y2=\"125\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"430\" y1=\"76\" x2=\"620\" y2=\"125\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><text x=\"140\" y=\"196\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">2. Which value matches?<\/text><text x=\"620\" y=\"196\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">2. Which value matches?<\/text><rect x=\"30\" y=\"205\" width=\"100\" height=\"52\" rx=\"6\" fill=\"#fff\" stroke=\"#b42318\" stroke-width=\"1.3\" /><text x=\"80.0\" y=\"228.16666666666666\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">pCO₂ high<\/text><text x=\"80.0\" y=\"241.16666666666666\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">(&gt;45)<\/text><rect x=\"150\" y=\"205\" width=\"100\" height=\"52\" rx=\"6\" fill=\"#fff\" stroke=\"#b42318\" stroke-width=\"1.3\" /><text x=\"200.0\" y=\"228.16666666666666\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">HCO₃ low<\/text><text x=\"200.0\" y=\"241.16666666666666\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">(&lt;22)<\/text><line x1=\"100\" y1=\"165\" x2=\"80\" y2=\"205\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"180\" y1=\"165\" x2=\"200\" y2=\"205\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"30\" y=\"285\" width=\"100\" height=\"52\" rx=\"6\" fill=\"#fdeceb\" stroke=\"#b42318\" stroke-width=\"1.3\" /><text x=\"80.0\" y=\"308.1666666666667\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">RESPIRATORY<\/text><text x=\"80.0\" y=\"321.1666666666667\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">ACIDOSIS<\/text><rect x=\"150\" y=\"285\" width=\"100\" height=\"52\" rx=\"6\" fill=\"#fdeceb\" stroke=\"#b42318\" stroke-width=\"1.3\" /><text x=\"200.0\" y=\"308.1666666666667\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">METABOLIC<\/text><text x=\"200.0\" y=\"321.1666666666667\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">ACIDOSIS<\/text><line x1=\"80\" y1=\"257\" x2=\"80\" y2=\"285\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"200\" y1=\"257\" x2=\"200\" y2=\"285\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"510\" y=\"205\" width=\"100\" height=\"52\" rx=\"6\" fill=\"#fff\" stroke=\"#1f4f99\" stroke-width=\"1.3\" /><text x=\"560.0\" y=\"228.16666666666666\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">pCO₂ low<\/text><text x=\"560.0\" y=\"241.16666666666666\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">(&lt;35)<\/text><rect x=\"630\" y=\"205\" width=\"100\" height=\"52\" rx=\"6\" fill=\"#fff\" stroke=\"#1f4f99\" stroke-width=\"1.3\" /><text x=\"680.0\" y=\"228.16666666666666\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">HCO₃ high<\/text><text x=\"680.0\" y=\"241.16666666666666\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">(&gt;26)<\/text><line x1=\"580\" y1=\"165\" x2=\"560\" y2=\"205\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"660\" y1=\"165\" x2=\"680\" y2=\"205\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"510\" y=\"285\" width=\"100\" height=\"52\" rx=\"6\" fill=\"#e4eefb\" stroke=\"#1f4f99\" stroke-width=\"1.3\" /><text x=\"560.0\" y=\"308.1666666666667\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">RESPIRATORY<\/text><text x=\"560.0\" y=\"321.1666666666667\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">ALKALOSIS<\/text><rect x=\"630\" y=\"285\" width=\"100\" height=\"52\" rx=\"6\" fill=\"#e4eefb\" stroke=\"#1f4f99\" stroke-width=\"1.3\" /><text x=\"680.0\" y=\"308.1666666666667\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">METABOLIC<\/text><text x=\"680.0\" y=\"321.1666666666667\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">ALKALOSIS<\/text><line x1=\"560\" y1=\"257\" x2=\"560\" y2=\"285\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"680\" y1=\"257\" x2=\"680\" y2=\"285\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"280\" y=\"205\" width=\"200\" height=\"132\" rx=\"8\" fill=\"#f1efe6\" stroke=\"#ccc\" stroke-width=\"1\" /><text x=\"380\" y=\"224\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">3. Compensation<\/text><text x=\"380\" y=\"244.0\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">The other system moves the<\/text><text x=\"380\" y=\"256.5\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">same direction to bring pH<\/text><text x=\"380\" y=\"269.0\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#222\">back toward normal.<\/text><text x=\"380\" y=\"296.0\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#7a1f15\">Metabolic acidosis:<\/text><text x=\"380\" y=\"308.5\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#7a1f15\">calculate anion gap =<\/text><text x=\"380\" y=\"321.0\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#7a1f15\">Na − (Cl + HCO₃); high &gt;12<\/text><text x=\"380\" y=\"372\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Normals: pH 7.35-7.45 · pCO₂ 35-45 mmHg · HCO₃ 22-26 mmol/L<\/text><text x=\"380\" y=\"390.0\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">High anion gap causes (MUDPILES): methanol, uremia, DKA, paraldehyde, isoniazid, lactate, ethylene glycol, salicylates<\/text><\/svg><figcaption>Step-by-step acid-base interpretation.<\/figcaption><\/figure><h3 id=\"acid-base\">Acid-base<\/h3>\n<p>Normal blood gas: pH 7.35-7.45, pCO2 35-45 mmHg, HCO3 22-26 mmol/L. Henderson-Hasselbalch: pH = 6.1 + log (HCO3 / (0.03 x pCO2)).<\/p>\n<table>\n<colgroup>\n<col style=\"width: 32%\" />\n<col style=\"width: 9%\" />\n<col style=\"width: 24%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Disorder<\/th>\n<th>pH<\/th>\n<th>Primary change<\/th>\n<th>Body compensates by<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Respiratory acidosis<\/td>\n<td>Low<\/td>\n<td>High pCO2<\/td>\n<td>Kidneys raise HCO3<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Respiratory alkalosis<\/td>\n<td>High<\/td>\n<td>Low pCO2<\/td>\n<td>Kidneys lower HCO3<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Metabolic acidosis<\/td>\n<td>Low<\/td>\n<td>Low HCO3<\/td>\n<td>Lungs lower pCO2<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Metabolic alkalosis<\/td>\n<td>High<\/td>\n<td>High HCO3<\/td>\n<td>Lungs raise pCO2<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Trick: compensation always moves the other number in the same direction as the primary change.<\/p>\n<p>Blood gas specimens: heparin, no air bubbles, on ice if delayed. Air bubbles raise pO2 and lower pCO2.<\/p>\n","min":3},{"id":"C6","sec":1,"title":"Lipids, liver and heme","html":"<h3 id=\"lipids\">Lipids<\/h3>\n<ul>\n<li><p>Friedewald: LDL = total cholesterol - HDL - (triglycerides / 5). Not valid when triglycerides exceed 400 mg/dL; use a direct LDL.<\/p><\/li>\n<li><p>Fast 9-12 hours for triglycerides. A creamy top layer = chylomicrons; uniform cloudiness = VLDL.<\/p><\/li>\n<li><p>Desirable: total cholesterol below 200, LDL below 100, HDL above 40 (men) or 50 (women), triglycerides below 150.<\/p><\/li>\n<\/ul>\n<h3 id=\"lipoproteins\">Lipoproteins<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 18%\" />\n<col style=\"width: 53%\" />\n<col style=\"width: 27%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Particle<\/th>\n<th>Carries<\/th>\n<th>Main apolipoprotein<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Chylomicron<\/td>\n<td>Dietary triglyceride<\/td>\n<td>B-48, C-II<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>VLDL<\/td>\n<td>Liver-made triglyceride<\/td>\n<td>B-100<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>LDL<\/td>\n<td>Cholesterol to tissues<\/td>\n<td>B-100<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>HDL<\/td>\n<td>Cholesterol back to the liver (protective)<\/td>\n<td>A-I<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Lp(a)<\/td>\n<td>LDL-like, raises clot and heart risk<\/td>\n<td>Apo(a)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p>Familial hypercholesterolemia: high LDL (defective LDL receptor). Lipoprotein lipase or apo C-II deficiency: very high chylomicrons and triglycerides, with a milky plasma that forms a creamy top layer.<\/p><\/li>\n<li><p>Lipoprotein electrophoresis order from the origin: chylomicrons, LDL (beta), VLDL (pre-beta), HDL (alpha).<\/p><\/li>\n<\/ul>\n<figure class=\"fig\" id=\"F13\"><svg viewBox=\"0 0 760 390\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Bilirubin metabolism\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"390\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Bilirubin metabolism<\/text><rect x=\"20\" y=\"50\" width=\"120\" height=\"50\" rx=\"6\" fill=\"#fdeceb\" stroke=\"#b42318\" stroke-width=\"1.3\" /><text x=\"80.0\" y=\"72.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Old red cells<\/text><text x=\"80.0\" y=\"86.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">(spleen)<\/text><rect x=\"180\" y=\"50\" width=\"120\" height=\"50\" rx=\"6\" fill=\"#e6f4ea\" stroke=\"#1a7f37\" stroke-width=\"1.3\" /><text x=\"240.0\" y=\"72.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Heme →<\/text><text x=\"240.0\" y=\"86.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">biliverdin<\/text><rect x=\"340\" y=\"50\" width=\"160\" height=\"50\" rx=\"6\" fill=\"#fff3c4\" stroke=\"#a88a00\" stroke-width=\"1.3\" /><text x=\"420.0\" y=\"72.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Unconjugated (indirect)<\/text><text x=\"420.0\" y=\"86.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">bilirubin + albumin<\/text><line x1=\"140\" y1=\"75\" x2=\"180\" y2=\"75\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><line x1=\"300\" y1=\"75\" x2=\"340\" y2=\"75\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"540\" y=\"40\" width=\"200\" height=\"70\" rx=\"6\" fill=\"#e2f1ee\" stroke=\"#0b6b5d\" stroke-width=\"1.3\" /><text x=\"640.0\" y=\"65.66666666666667\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">LIVER<\/text><text x=\"640.0\" y=\"78.66666666666667\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">conjugation with glucuronic acid<\/text><text x=\"640.0\" y=\"91.66666666666667\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">(UDP-glucuronyl transferase)<\/text><line x1=\"500\" y1=\"75\" x2=\"540\" y2=\"75\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"540\" y=\"160\" width=\"200\" height=\"50\" rx=\"6\" fill=\"#fff3c4\" stroke=\"#a88a00\" stroke-width=\"1.3\" /><text x=\"640.0\" y=\"182.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Conjugated (direct)<\/text><text x=\"640.0\" y=\"196.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">bilirubin → bile<\/text><line x1=\"640\" y1=\"110\" x2=\"640\" y2=\"160\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"540\" y=\"255\" width=\"200\" height=\"50\" rx=\"6\" fill=\"#f4e6f6\" stroke=\"#9a6aa6\" stroke-width=\"1.3\" /><text x=\"640.0\" y=\"277.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Intestine: bacteria make<\/text><text x=\"640.0\" y=\"291.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">urobilinogen<\/text><line x1=\"640\" y1=\"210\" x2=\"640\" y2=\"255\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"300\" y=\"320\" width=\"200\" height=\"44\" rx=\"6\" fill=\"#e8dccb\" stroke=\"#8a6a4a\" stroke-width=\"1.3\" /><text x=\"400.0\" y=\"339.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Stool: stercobilin<\/text><text x=\"400.0\" y=\"353.0\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">(brown color)<\/text><line x1=\"560\" y1=\"305\" x2=\"500\" y2=\"330\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"40\" y=\"255\" width=\"220\" height=\"50\" rx=\"6\" fill=\"#e4eefb\" stroke=\"#1f4f99\" stroke-width=\"1.3\" /><text x=\"150.0\" y=\"277.1666666666667\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Reabsorbed → blood → kidney:<\/text><text x=\"150.0\" y=\"290.1666666666667\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">urine urobilinogen (normal, trace)<\/text><line x1=\"540\" y1=\"285\" x2=\"260\" y2=\"285\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><rect x=\"20\" y=\"120\" width=\"480\" height=\"120\" rx=\"8\" fill=\"#f1efe6\" stroke=\"#ccc\" stroke-width=\"1\" /><text x=\"36\" y=\"142\" font-size=\"11\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Hemolysis (pre-hepatic): indirect ↑, urine urobilinogen ↑, urine bilirubin absent<\/text><text x=\"36\" y=\"170\" font-size=\"11\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Hepatocellular disease: both ↑, urine bilirubin present, urobilinogen variable<\/text><text x=\"36\" y=\"198\" font-size=\"11\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Obstruction (post-hepatic): direct ↑, urine bilirubin present, urobilinogen ABSENT,<\/text><text x=\"36\" y=\"211\" font-size=\"11\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">pale stools, ALP and GGT ↑<\/text><text x=\"36\" y=\"228.0\" font-size=\"10.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#666\">Only conjugated bilirubin is water-soluble, so it is the only form found in urine.<\/text><\/svg><figcaption>Bilirubin metabolism and where each type of jaundice fits.<\/figcaption><\/figure><h3 id=\"liver-and-bilirubin\">Liver and bilirubin<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 22%\" />\n<col style=\"width: 19%\" />\n<col style=\"width: 18%\" />\n<col style=\"width: 16%\" />\n<col style=\"width: 23%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Type<\/th>\n<th>Bilirubin raised<\/th>\n<th>Urine bilirubin<\/th>\n<th>Urine urobilinogen<\/th>\n<th>Other<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Before the liver (hemolysis)<\/td>\n<td>Indirect<\/td>\n<td>Negative<\/td>\n<td>High<\/td>\n<td>Reticulocytes and LD high<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>In the liver (hepatitis)<\/td>\n<td>Both<\/td>\n<td>Positive<\/td>\n<td>Variable<\/td>\n<td>ALT and AST high<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>After the liver (blockage)<\/td>\n<td>Direct<\/td>\n<td>Positive<\/td>\n<td>Low or absent<\/td>\n<td>ALP and GGT high, pale stools<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p>Gilbert and Crigler-Najjar: indirect rise. Dubin-Johnson and Rotor: direct rise.<\/p><\/li>\n<li><p>Bilirubin breaks down in light; protect specimens.<\/p><\/li>\n<\/ul>\n<h3 id=\"heme-porphyrins-and-myoglobin\">Heme, porphyrins and myoglobin<\/h3>\n<ul>\n<li><p>Heme synthesis starts with ALA synthase (the rate-limiting step), then ALA, porphobilinogen (PBG), porphyrins, and finally iron is added by ferrochelatase.<\/p><\/li>\n<li><p><strong>Lead<\/strong> blocks ALA dehydratase and ferrochelatase: ALA and free erythrocyte protoporphyrin rise.<\/p><\/li>\n<\/ul>\n<table>\n<colgroup>\n<col style=\"width: 44%\" />\n<col style=\"width: 55%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Porphyria<\/th>\n<th>Defect and clues<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Acute intermittent porphyria<\/td>\n<td>PBG deaminase; abdominal pain and nerve symptoms, no skin disease; urine ALA and PBG high, urine darkens in light<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Porphyria cutanea tarda<\/td>\n<td>Uroporphyrinogen decarboxylase; blistering skin in sun; urine uroporphyrins<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Congenital erythropoietic porphyria<\/td>\n<td>Severe skin damage, red teeth<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p>PBG screening uses the Watson-Schwartz or Hoesch test (Ehrlich reagent).<\/p><\/li>\n<li><p><strong>Myoglobin<\/strong> is a muscle heme protein; it appears in urine after muscle injury (rhabdomyolysis), turning urine red-brown and risking kidney damage.<\/p><\/li>\n<\/ul>\n","min":4},{"id":"C7","sec":1,"title":"Endocrine, vitamins and trace elements","html":"<figure class=\"fig\" id=\"F14\"><svg viewBox=\"0 0 760 400\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Thyroid axis\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"400\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Thyroid axis and result patterns<\/text><rect x=\"30\" y=\"50\" width=\"150\" height=\"44\" rx=\"6\" fill=\"#fff3c4\" stroke=\"#a88a00\" stroke-width=\"1.3\" /><text x=\"105.0\" y=\"76.33333333333333\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Hypothalamus<\/text><rect x=\"260\" y=\"50\" width=\"150\" height=\"44\" rx=\"6\" fill=\"#e4eefb\" stroke=\"#1f4f99\" stroke-width=\"1.3\" /><text x=\"335.0\" y=\"76.33333333333333\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Pituitary<\/text><rect x=\"490\" y=\"50\" width=\"150\" height=\"44\" rx=\"6\" fill=\"#e2f1ee\" stroke=\"#0b6b5d\" stroke-width=\"1.3\" /><text x=\"565.0\" y=\"76.33333333333333\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Thyroid<\/text><line x1=\"180\" y1=\"72\" x2=\"260\" y2=\"72\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><text x=\"220\" y=\"64\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">TRH<\/text><line x1=\"410\" y1=\"72\" x2=\"490\" y2=\"72\" stroke=\"#444\" stroke-width=\"1.5\" marker-end=\"url(#ar)\"/><text x=\"450\" y=\"64\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">TSH<\/text><path d=\"M565,94 V128 H335 V94\" fill=\"none\" stroke=\"#b42318\" stroke-width=\"1.6\" stroke-dasharray=\"5,3\" marker-end=\"url(#ar)\"/><path d=\"M335,128 H105 V94\" fill=\"none\" stroke=\"#b42318\" stroke-width=\"1.6\" stroke-dasharray=\"5,3\" marker-end=\"url(#ar)\"/><text x=\"450\" y=\"142\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#b42318\">free T4 / T3 give negative feedback<\/text><rect x=\"30\" y=\"170\" width=\"700\" height=\"30\" rx=\"0\" fill=\"#e2f1ee\" stroke=\"#ccc\" stroke-width=\"1\" /><text x=\"36\" y=\"190.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Condition<\/text><text x=\"256\" y=\"190.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">TSH<\/text><text x=\"366\" y=\"190.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Free T4<\/text><text x=\"476\" y=\"190.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Typical cause<\/text><rect x=\"30\" y=\"202\" width=\"700\" height=\"30\" rx=\"0\" fill=\"#fff\" stroke=\"#ccc\" stroke-width=\"1\" /><text x=\"36\" y=\"222.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Primary hypothyroidism<\/text><text x=\"256\" y=\"222.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">↑<\/text><text x=\"366\" y=\"222.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">↓<\/text><text x=\"476\" y=\"222.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">Hashimoto (anti-TPO)<\/text><rect x=\"30\" y=\"234\" width=\"700\" height=\"30\" rx=\"0\" fill=\"#f7f6f2\" stroke=\"#ccc\" stroke-width=\"1\" /><text x=\"36\" y=\"254.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Primary hyperthyroidism<\/text><text x=\"256\" y=\"254.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">↓<\/text><text x=\"366\" y=\"254.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">↑<\/text><text x=\"476\" y=\"254.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">Graves (TSI), toxic nodule<\/text><rect x=\"30\" y=\"266\" width=\"700\" height=\"30\" rx=\"0\" fill=\"#fff\" stroke=\"#ccc\" stroke-width=\"1\" /><text x=\"36\" y=\"286.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Secondary hypothyroidism<\/text><text x=\"256\" y=\"286.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">↓ / low-normal<\/text><text x=\"366\" y=\"286.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">↓<\/text><text x=\"476\" y=\"286.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">pituitary disease<\/text><rect x=\"30\" y=\"298\" width=\"700\" height=\"30\" rx=\"0\" fill=\"#f7f6f2\" stroke=\"#ccc\" stroke-width=\"1\" /><text x=\"36\" y=\"318.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Subclinical hypothyroidism<\/text><text x=\"256\" y=\"318.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">↑<\/text><text x=\"366\" y=\"318.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">normal<\/text><text x=\"476\" y=\"318.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">early Hashimoto<\/text><rect x=\"30\" y=\"330\" width=\"700\" height=\"30\" rx=\"0\" fill=\"#fff\" stroke=\"#ccc\" stroke-width=\"1\" /><text x=\"36\" y=\"350.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">Subclinical hyperthyroidism<\/text><text x=\"256\" y=\"350.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">↓<\/text><text x=\"366\" y=\"350.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">normal<\/text><text x=\"476\" y=\"350.0\" font-size=\"11.5\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">early Graves, nodule<\/text><text x=\"380\" y=\"376.0\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">Order TSH first. If abnormal, add free T4 (and T3 for suspected hyperthyroidism).<\/text><\/svg><figcaption>The thyroid feedback loop and the test patterns that follow from it.<\/figcaption><\/figure><h3 id=\"endocrine\">Endocrine<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 47%\" />\n<col style=\"width: 52%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Finding<\/th>\n<th>Think<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>High TSH, low free T4<\/td>\n<td>Primary hypothyroidism (Hashimoto)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Low TSH, high free T4<\/td>\n<td>Hyperthyroidism (Graves)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Low TSH, low T4<\/td>\n<td>Pituitary (secondary)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>High cortisol, fails dexamethasone suppression<\/td>\n<td>Cushing<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Low cortisol, poor ACTH stimulation response<\/td>\n<td>Addison<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>High hCG<\/td>\n<td>Pregnancy or trophoblastic disease<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>High AFP<\/td>\n<td>Neural tube defect, liver tumor; low AFP in Down syndrome<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>High catecholamines, VMA<\/td>\n<td>Pheochromocytoma, neuroblastoma<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Tumor markers: PSA (prostate), CA-125 (ovary), CEA (colon), AFP (liver), CA 19-9 (pancreas).<\/p>\n<h3 id=\"hormones-in-more-detail\">Hormones in more detail<\/h3>\n<ul>\n<li><p><strong>Steroid hormones<\/strong> (cortisol, aldosterone, estrogen, testosterone) come from cholesterol and act inside cells. <strong>Peptide hormones<\/strong> (insulin, GH, ACTH, PTH) act on surface receptors. <strong>Catecholamines<\/strong> come from tyrosine; test urine metanephrines and VMA.<\/p><\/li>\n<li><p><strong>Rule for dynamic tests:<\/strong> suspected excess is tested with a suppression test; suspected deficiency is tested with a stimulation test.<\/p><\/li>\n<\/ul>\n<table>\n<colgroup>\n<col style=\"width: 41%\" />\n<col style=\"width: 58%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Condition<\/th>\n<th>Key findings<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Conn syndrome<\/td>\n<td>High aldosterone, low renin, low K<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Acromegaly<\/td>\n<td>High GH that fails to suppress with glucose; high IGF-1<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Prolactinoma<\/td>\n<td>High prolactin<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Congenital adrenal hyperplasia<\/td>\n<td>High 17-hydroxyprogesterone<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Carcinoid tumor<\/td>\n<td>High urine 5-HIAA<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Pheochromocytoma<\/td>\n<td>High metanephrines, catecholamines<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Hyperparathyroidism<\/td>\n<td>High PTH, high calcium<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"vitamins-and-trace-elements\">Vitamins and trace elements<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 49%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Vitamin<\/th>\n<th>Deficiency<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>A (fat-soluble)<\/td>\n<td>Night blindness<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>D (fat-soluble; measure 25-OH vitamin D)<\/td>\n<td>Rickets, osteomalacia<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>E (fat-soluble)<\/td>\n<td>Hemolysis, nerve damage<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>K (fat-soluble)<\/td>\n<td>Bleeding; long PT<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>B1 (thiamine)<\/td>\n<td>Beriberi, Wernicke encephalopathy<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>B3 (niacin)<\/td>\n<td>Pellagra<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>B6<\/td>\n<td>Neuropathy, anemia<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Folate<\/td>\n<td>Megaloblastic anemia, neural tube defects<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>B12<\/td>\n<td>Pernicious anemia, nerve damage<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>C<\/td>\n<td>Scurvy<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><p>Copper: Wilson disease has low ceruloplasmin and liver and brain damage. Zinc: poor wound healing. Iodine: goiter. Selenium and chromium: nutrition and glucose metabolism.<\/p><\/li>\n<li><p>Calcium and phosphorus move in opposite directions: hyperparathyroidism gives high calcium and low phosphorus; hypoparathyroidism gives low calcium and high phosphorus; cancer-related high calcium has low PTH.<\/p><\/li>\n<li><p>Enzyme to remember: <strong>ACE<\/strong> (angiotensin-converting enzyme) is raised in sarcoidosis.<\/p><\/li>\n<\/ul>\n","min":3},{"id":"C8","sec":1,"title":"Toxicology and drug monitoring","html":"<h3 id=\"toxicology-and-drug-monitoring\">Toxicology and drug monitoring<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 29%\" />\n<col style=\"width: 70%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Drug<\/th>\n<th>Key point<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Acetaminophen<\/td>\n<td>Use the Rumack-Matthew nomogram (from 4 hours); the antidote is N-acetylcysteine<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Salicylate<\/td>\n<td>Respiratory alkalosis first, then metabolic acidosis<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Carbon monoxide<\/td>\n<td>Carboxyhemoglobin by co-oximeter<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Lead<\/td>\n<td>Venous whole blood in a trace-metal-free tube, atomic absorption<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Digoxin<\/td>\n<td>Draw at least 6-8 hours after the dose; toxicity is worse with low K<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Aminoglycosides<\/td>\n<td>Peak after the dose, trough just before the next dose<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Ethanol<\/td>\n<td>Enzymatic (alcohol dehydrogenase) or gas chromatography<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Drug levels reach steady state after about 5 half-lives.<\/p>\n<h3 id=\"therapeutic-drug-monitoring-tdm\">Therapeutic drug monitoring (TDM)<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 31%\" />\n<col style=\"width: 28%\" />\n<col style=\"width: 39%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Drug class<\/th>\n<th>Examples<\/th>\n<th>Key points<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Aminoglycosides<\/td>\n<td>Gentamicin, tobramycin, amikacin<\/td>\n<td>Kidney and ear toxicity; peak and trough<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Glycopeptide<\/td>\n<td>Vancomycin<\/td>\n<td>Trough level<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Cardioactive<\/td>\n<td>Digoxin, procainamide, quinidine<\/td>\n<td>Digoxin toxic with low K; procainamide has an active metabolite (NAPA)<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Anticonvulsants<\/td>\n<td>Phenytoin, valproic acid, carbamazepine, phenobarbital<\/td>\n<td>Phenytoin is highly protein-bound; free level matters with low albumin<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Antidepressants and mood<\/td>\n<td>Tricyclics, lithium<\/td>\n<td>Lithium: draw 12 hours after the dose; do not use a lithium-heparin tube<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Immunosuppressants<\/td>\n<td>Cyclosporine, tacrolimus, mycophenolate<\/td>\n<td>Whole-blood EDTA trough<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Others<\/td>\n<td>Theophylline, methotrexate<\/td>\n<td>Narrow therapeutic ranges<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3 id=\"toxicology\">Toxicology<\/h3>\n<table>\n<colgroup>\n<col style=\"width: 38%\" />\n<col style=\"width: 61%\" />\n<\/colgroup>\n<thead>\n<tr class=\"header\">\n<th>Toxin<\/th>\n<th>Key points<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Methanol<\/td>\n<td>Formic acid; blindness; high anion gap and osmolal gap<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Ethylene glycol<\/td>\n<td>Oxalate crystals in urine; kidney failure; high osmolal gap<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Ethanol<\/td>\n<td>Enzymatic or GC; raises osmolality<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Lead<\/td>\n<td>Anemia, basophilic stippling, nerve damage<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Mercury, arsenic, cadmium<\/td>\n<td>Heavy metals; test by atomic absorption or ICP-MS<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Carbon monoxide<\/td>\n<td>Cherry-red look; carboxyhemoglobin<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Organophosphates<\/td>\n<td>Low cholinesterase<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Cyanide<\/td>\n<td>Blocks cytochrome oxidase; almond odor<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Drugs of abuse<\/td>\n<td>Immunoassay screen (can cross-react), then GC/MS or LC-MS confirmation<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n","min":3},{"id":"C9","sec":1,"title":"Chemistry exam traps","html":"<h3 id=\"exam-traps-1\">Exam traps<\/h3>\n<ul>\n<li><p>Pseudohyponatremia happens with indirect ISE, not direct ISE.<\/p><\/li>\n<li><p>The dipstick ketone test misses beta-hydroxybutyrate.<\/p><\/li>\n<li><p>Troponin is more specific than CK-MB; CK-MB normalizes sooner.<\/p><\/li>\n<li><p>ALP alone is not proof of liver disease; bone also raises it.<\/p><\/li>\n<\/ul>\n","min":3},{"id":"M1","sec":2,"title":"Start here: stains, media, basic tests","html":"<p><strong>If you only remember 8 things<\/strong><\/p>\n<ol type=\"1\">\n<li><p>Gram stain order: crystal violet, iodine, decolorizer, safranin. Over-decolorizing makes Gram-positives look negative.<\/p><\/li>\n<li><p>Catalase positive = Staphylococcus; catalase negative = Streptococcus. Coagulase positive = S. aureus.<\/p><\/li>\n<li><p>Strep ID: bacitracin-sensitive = group A; CAMP positive = group B; optochin-sensitive = S. pneumoniae; bile esculin positive = Enterococcus or group D.<\/p><\/li>\n<li><p>Oxidase negative = Enterobacterales. Oxidase positive = Pseudomonas, Neisseria, Vibrio, Campylobacter.<\/p><\/li>\n<li><p>On MacConkey agar, pink = lactose fermenter (E. coli, Klebsiella, Enterobacter). Colorless = non-fermenter (Salmonella, Shigella, Proteus).<\/p><\/li>\n<li><p>Haemophilus needs X and V factors and grows on chocolate agar.<\/p><\/li>\n<li><p>Malaria: the thick smear finds the parasite; the thin smear identifies the species.<\/p><\/li>\n<li><p>Never refrigerate CSF; Neisseria and Haemophilus die in the cold.<\/p><\/li>\n<\/ol>\n<figure class=\"fig\" id=\"F15\"><svg viewBox=\"0 0 760 490\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gram stain\" font-family=\"Arial,Helvetica,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#444\"/><\/marker><\/defs><rect width=\"760\" height=\"490\" rx=\"10\" fill=\"#fbfaf6\" stroke=\"#ddd8c8\"/><text x=\"380.0\" y=\"22\" font-size=\"15\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Gram stain: steps and morphology<\/text><rect x=\"20\" y=\"40\" width=\"172\" height=\"64\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><rect x=\"20\" y=\"40\" width=\"10\" height=\"64\" rx=\"3\" fill=\"#6a3fa0\" stroke=\"none\" stroke-width=\"0\" /><text x=\"40\" y=\"60\" font-size=\"11\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">1. Crystal violet<\/text><text x=\"40\" y=\"78\" font-size=\"10\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#666\">1 min<\/text><text x=\"40\" y=\"92\" font-size=\"9\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">→ all cells purple<\/text><rect x=\"202\" y=\"40\" width=\"172\" height=\"64\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><rect x=\"202\" y=\"40\" width=\"10\" height=\"64\" rx=\"3\" fill=\"#4a2f80\" stroke=\"none\" stroke-width=\"0\" /><text x=\"222\" y=\"60\" font-size=\"11\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">2. Iodine (mordant)<\/text><text x=\"222\" y=\"78\" font-size=\"10\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#666\">1 min<\/text><text x=\"222\" y=\"92\" font-size=\"9\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">→ crystal violet-iodine complex<\/text><rect x=\"384\" y=\"40\" width=\"172\" height=\"64\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><rect x=\"384\" y=\"40\" width=\"10\" height=\"64\" rx=\"3\" fill=\"#d9d9d9\" stroke=\"none\" stroke-width=\"0\" /><text x=\"404\" y=\"60\" font-size=\"11\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">3. Decolorize<\/text><text x=\"404\" y=\"78\" font-size=\"10\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#666\">alcohol/acetone ~10 s<\/text><text x=\"404\" y=\"92\" font-size=\"9\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">→ gram-negative cells lose color<\/text><rect x=\"566\" y=\"40\" width=\"172\" height=\"64\" rx=\"6\" fill=\"#fff\" stroke=\"#555\" stroke-width=\"1.3\" /><rect x=\"566\" y=\"40\" width=\"10\" height=\"64\" rx=\"3\" fill=\"#e0607e\" stroke=\"none\" stroke-width=\"0\" /><text x=\"586\" y=\"60\" font-size=\"11\" text-anchor=\"start\" font-weight=\"bold\" fill=\"#222\">4. Safranin<\/text><text x=\"586\" y=\"78\" font-size=\"10\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#666\">30-60 s<\/text><text x=\"586\" y=\"92\" font-size=\"9\" text-anchor=\"start\" font-weight=\"normal\" fill=\"#222\">→ gram-negative cells pink<\/text><rect x=\"8\" y=\"127\" width=\"136\" height=\"112\" rx=\"8\" fill=\"#fff\" stroke=\"#ddd\" stroke-width=\"1\" /><circle cx=\"64\" cy=\"157\" r=\"6\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" /><circle cx=\"76\" cy=\"155\" r=\"6\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" /><circle cx=\"88\" cy=\"159\" r=\"6\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" /><circle cx=\"70\" cy=\"167\" r=\"6\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" /><circle cx=\"82\" cy=\"167\" r=\"6\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" /><circle cx=\"62\" cy=\"175\" r=\"6\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" /><circle cx=\"76\" cy=\"177\" r=\"6\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" /><circle cx=\"88\" cy=\"175\" r=\"6\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" /><text x=\"76\" y=\"207\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\" fill=\"#222\">Clusters<\/text><text x=\"76\" y=\"222\" font-size=\"9\" text-anchor=\"middle\" font-weight=\"normal\" fill=\"#666\">Staphylococcus (+)<\/text><rect x=\"160\" y=\"127\" width=\"136\" height=\"112\" rx=\"8\" fill=\"#fff\" stroke=\"#ddd\" stroke-width=\"1\" /><circle cx=\"198\" cy=\"165\" r=\"6\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" /><circle cx=\"210\" cy=\"167\" r=\"6\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" /><circle cx=\"222\" cy=\"164\" r=\"6\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" /><circle cx=\"234\" cy=\"167\" r=\"6\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" /><circle cx=\"246\" cy=\"165\" r=\"6\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" /><circle cx=\"258\" cy=\"167\" r=\"6\" fill=\"#6a3fa0\" stroke=\"#222\" stroke-width=\"0.8\" /><text x=\"228\" y=\"207\" font-size=\"11\" text-anchor=\"middle\" font-we
